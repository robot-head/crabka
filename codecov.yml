codecov:
  notify:
    # Wait for all twelve coverage uploads (one per CI flag) before posting
    # status checks or PR comments. Otherwise the first upload triggers a
    # report against the partial coverage, which shows a misleading drop
    # until the rest of the matrix lands. The flags below must match the
    # `flags:` values in .github/workflows/ci.yml.
    after_n_builds: 12
    wait_for_ci: true

comment:
  after_n_builds: 12
  require_changes: false

coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        only_pulls: true
        # Patch (changed-line) coverage is ADVISORY, not a gate. It is not a
        # required check, and large feature branches legitimately add
        # integration-tested-not-unit-tested code (OTLP exporter wiring, K8s
        # reconcile IO, serve loops) whose patch % dips without indicating a
        # real gap. `informational: true` keeps the coverage delta visible in
        # the PR comment but never fails the check; the `project` gate above
        # still guards overall repo coverage.
        informational: true

# Auto-generated protocol codecs are machine-emitted (encode/decode/populate
# per record type) and exercised indirectly via the round-trip/integration
# suites; holding them to per-line patch coverage is noise, so exclude them
# from coverage entirely.
ignore:
  - "crates/protocol/generated/**"
  # Binary entrypoints are arg-parsing + client wiring + a serve loop — glue
  # with no unit-testable logic. The gateway's main() is covered end-to-end by
  # the (Docker-gated) jvm_differential test, not the integration suite, so
  # holding its 60+ wiring lines to patch coverage just blocks new-crate PRs.
  - "crates/grpc-gateway/src/bin/**"
  # Same rationale for the schema-registry binary: the unit-testable config
  # assembly (CLI flags -> SecurityConfig) lives in the `cli` lib module and is
  # covered there; what remains in main() is arg-parsing + the serve/election
  # loop, exercised end-to-end by the in-process ha.rs / security.rs tests.
  - "crates/schema-registry/src/bin/**"
  # The operator's run loop (kube client init, health server, controller spawns,
  # tokio::select supervision, shutdown) is the lib-side entrypoint glue —
  # arg-parsing's twin, 0% unit-coverable and exercised only by the kind e2e.
  # Same rationale as the binary entrypoints above; the controllers' own
  # reconcile logic stays measured (it's in controller/*.rs, not here).
  - "crates/operator/src/run.rs"
  # The observability demo app is a runnable producer/consumer demo — order
  # generation, produce/consume serve loops, and self-telemetry (traces/metrics)
  # emission. It exists to drive the `demo/observability` stack and is exercised
  # by running that stack end-to-end, not by the unit suite. Same "binary glue,
  # no unit-testable production logic" rationale as the entrypoints above.
  - "crates/observability-demo-app/**"

flags:
  unit:
    carryforward: true
  jvm-differential:
    carryforward: true
  client-core-integration:
    carryforward: true
  client-consumer-integration:
    carryforward: true
  log-integration:
    carryforward: true
  broker-jvm-acceptance:
    carryforward: true
  broker-integration:
    carryforward: true
  client-streams-integration:
    carryforward: true
  grpc-gateway-integration:
    carryforward: true
  schema-registry-integration:
    carryforward: true
  operator-integration:
    carryforward: true
  gres-integration:
    carryforward: true
