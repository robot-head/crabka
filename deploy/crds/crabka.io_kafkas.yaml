                type: object
              clientsCa:
                description: |-
                  Per-cluster CA used to sign `KafkaUser` TLS certs.
                  Absent → fully-defaulted `CertificateAuthority`.
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true` (default), the operator generates and renews this CA.
                      When `false`, the operator expects the CA `Secret` pair to be
                      pre-created by the cluster admin and refuses to overwrite them.
                      Renewal of BYO CAs is the admin's responsibility; the `CronJob`
                      skips them and emits an Event when they're nearing expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window before `notAfter` in which the renewal `CronJob` will
                      reissue leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              clusterCa:
                description: |-
                  Per-cluster CA used for inter-broker mTLS + broker certs.
                  Absent → fully-defaulted `CertificateAuthority` (operator-generated,
                  365/30 days).
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true` (default), the operator generates and renews this CA.
                      When `false`, the operator expects the CA `Secret` pair to be
                      pre-created by the cluster admin and refuses to overwrite them.
                      Renewal of BYO CAs is the admin's responsibility; the `CronJob`
                      skips them and emits an Event when they're nearing expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window before `notAfter` in which the renewal `CronJob` will
                      reissue leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              config:
                additionalProperties:
                  type: string
                description: |-
                  Opaque broker properties (`server.properties`-style key/value
                  pairs). These are passed through to the broker's
                  `[server_properties]` TOML table; the broker currently treats
                  them as inert. Changes propagate through the config
                  hash.
                nullable: true
                type: object
              delegationToken:
                description: |-
                  Delegation-token master HMAC key source. When `None`,
                  the broker rejects all KIP-48 delegation-token RPCs with err 61
                  `DELEGATION_TOKEN_AUTH_DISABLED`. When `Some`, the operator
                  injects `CRABKA_DELEGATION_TOKEN_SECRET_KEY` into each broker
                  pod via a `valueFrom.secretKeyRef`, baking the key into the
                  rendered `StatefulSet` so the SSA reconcile doesn't
                  race with out-of-band `kubectl set env` patches.
                nullable: true
                properties:
                  secretKeyRef:
                    description: |-
                      Reference to a Kubernetes `Secret` (same namespace as the
                      `Kafka` CR) whose `data.<key>` value is the broker's master HMAC
                      key for KIP-48 delegation tokens.
                    properties:
                      key:
                        description: Key within the Secret's `data`. Defaults to `secret-key`.
                        nullable: true
                        type: string
                      name:
                        description: Secret name in the same namespace as the `Kafka` CR.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
              interBrokerKerberos:
                description: |-
                  Inter-broker Kerberos initiate config. Required when
                  `interBrokerListenerName` resolves to a `type: gssapi` listener;
                  supplies the shared client principal + KDC. The keytab is reused
                  from that listener's `keytabSecretRef`.
                nullable: true
                properties:
                  clientPrincipal:
                    description: |-
                      Principal every broker authenticates as when dialing peers, e.g.
                      `kafka@EXAMPLE.COM`. Must exist in the shared keytab.
                    type: string
                  kdcUrl:
                    description: KDC endpoint, e.g. `tcp://kdc:88`.
                    type: string
                  serviceName:
                    description: Target SPN primary. Defaults to `kafka`.
                    nullable: true
                    type: string
                required:
                - clientPrincipal
                - kdcUrl
                type: object
              interBrokerListenerName:
                description: |-
                  Name of the listener used for inter-broker traffic.
                  When `None`, the operator picks the first `internal` listener;
                  when `listeners` is empty, the synthesized default `"PLAIN"`.
                nullable: true
                type: string
              kafkaVersion:
                description: |-
                  Crabka version label, propagated to all pool pods via the
                  `app.kubernetes.io/version` label.
                type: string
              krb5ConfSecretRef:
                description: |-
                  Optional process-wide `krb5.conf`. Mounted into broker pods and
                  pointed at via `KRB5_CONFIG`; serves both accept and initiate paths.
                nullable: true
                properties:
                  key:
                    description: Key within the Secret whose value is the krb5.conf contents.
                    type: string
                  secretName:
                    description: Name of the Secret holding the krb5.conf.
                    type: string
                required:
                - key
                - secretName
                type: object
              listeners:
                description: |-
                  Named listeners. Empty (or absent) synthesizes a
                  single internal `PLAIN` listener on port 9092.
                items:
                  properties:
                    authentication:
                      description: |-
                        Per-listener authentication mechanism. Absent means anonymous (no
                        client identity required). When set to `type: tls`, the listener
                        must also have `tls: true` — enforced at reconcile time.
                      nullable: true
                      properties:
                        accessTokenIsJwt:
                          type: boolean
                        clientId:
                          minLength: 1
                          type: string
                        clientSecret:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            secretName:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - secretName
                          type: object
                        customClaimCheck:
                          minLength: 1
                          type: string
                        enableOauthBearer:
                          type: boolean
                        fallbackUserNameClaim:
                          minLength: 1
                          type: string
                        fallbackUserNamePrefix:
                          minLength: 1
                          type: string
                        groupsClaim:
