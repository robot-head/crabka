apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkas.crabka.io
spec:
  group: crabka.io
  names:
    categories: []
    kind: Kafka
    plural: kafkas
    shortNames:
    - kk
    singular: kafka
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Crabka cluster spec. Slice 20: spec carries only the version label;
              broker pods are described by sibling `KafkaNodePool`s labeled
              `crabka.io/cluster=<this name>`.
            properties:
              config:
                additionalProperties:
                  type: string
                description: |-
                  Opaque broker properties (`server.properties`-style key/value
                  pairs). Serialized into the broker `ConfigMap`; changes propagate
                  through a content hash that triggers a rolling restart.
                nullable: true
                type: object
              kafkaVersion:
                description: |-
                  Crabka version label, propagated to all pool pods via the
                  `app.kubernetes.io/version` label.
                type: string
            required:
            - kafkaVersion
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Standard Kubernetes-style condition list.
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: '`True`, `False`, or `Unknown`.'
                      type: string
                    type:
                      description: e.g. `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              readyReplicas:
                description: Mirrors `StatefulSet.status.readyReplicas`.
                format: int32
                nullable: true
                type: integer
              replicas:
                description: Mirrors `StatefulSet.status.replicas`.
                format: int32
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: Kafka
        type: object
    served: true
    storage: true
    subresources:
      status: {}
