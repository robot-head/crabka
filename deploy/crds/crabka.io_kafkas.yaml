apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkas.crabka.io
spec:
  group: crabka.io
  names:
    categories: []
    kind: Kafka
    plural: kafkas
    shortNames:
    - kk
    singular: kafka
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Crabka cluster spec. Slice 20: spec carries only the version label;
              broker pods are described by sibling `KafkaNodePool`s labeled
              `crabka.io/cluster=<this name>`.
            properties:
              clientsCa:
                description: |-
                  Slice 30: per-cluster CA used to sign `KafkaUser` TLS certs (slice
                  37). Absent → fully-defaulted `CertificateAuthority`.
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true` (default), the operator generates and renews this CA.
                      When `false`, the operator expects the CA `Secret` pair to be
                      pre-created by the cluster admin and refuses to overwrite them.
                      Renewal of BYO CAs is the admin's responsibility; the `CronJob`
                      skips them and emits an Event when they're nearing expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window before `notAfter` in which the renewal `CronJob` will
                      reissue leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              clusterCa:
                description: |-
                  Slice 30: per-cluster CA used for inter-broker mTLS + broker certs.
                  Absent → fully-defaulted `CertificateAuthority` (operator-generated,
                  365/30 days).
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true` (default), the operator generates and renews this CA.
                      When `false`, the operator expects the CA `Secret` pair to be
                      pre-created by the cluster admin and refuses to overwrite them.
                      Renewal of BYO CAs is the admin's responsibility; the `CronJob`
                      skips them and emits an Event when they're nearing expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window before `notAfter` in which the renewal `CronJob` will
                      reissue leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              config:
                additionalProperties:
                  type: string
                description: |-
                  Opaque broker properties (`server.properties`-style key/value
                  pairs). Slice 25 passes these through to the broker's
                  `[server_properties]` TOML table; the broker currently treats
                  them as inert. Changes propagate through the slice-21 config
                  hash.
                nullable: true
                type: object
              interBrokerListenerName:
                description: |-
                  Slice 25: name of the listener used for inter-broker traffic.
                  When `None`, the operator picks the first `internal` listener;
                  when `listeners` is empty, the synthesized default `"PLAIN"`.
                nullable: true
                type: string
              kafkaVersion:
                description: |-
                  Crabka version label, propagated to all pool pods via the
                  `app.kubernetes.io/version` label.
                type: string
              listeners:
                description: |-
                  Slice 25: named listeners. Empty (or absent) synthesizes a
                  single internal `PLAIN` listener on port 9092 (slice 19/20
                  compatibility default).
                items:
                  properties:
                    authentication:
                      description: |-
                        Per-listener authentication mechanism. Absent means anonymous (no
                        client identity required). When set to `type: tls`, the listener
                        must also have `tls: true` — enforced at reconcile time.
                      nullable: true
                      properties:
                        type:
                          enum:
                          - tls
                          - scram-sha-512
                          - scram-sha-256
                          type: string
                      required:
                      - type
                      type: object
                    configuration:
                      description: Optional listener-type-specific configuration.
                      nullable: true
                      properties:
                        bootstrap:
                          nullable: true
                          properties:
                            annotations:
                              additionalProperties:
                                type: string
                              description: Annotations to add to the bootstrap Service.
                              type: object
                            host:
                              description: '`ingress` / `route` only (slice 27): bootstrap hostname.'
                              nullable: true
                              type: string
                            labels:
                              additionalProperties:
                                type: string
                              description: Labels to add to the bootstrap Service.
                              type: object
                            loadBalancerIP:
                              description: '`loadbalancer` only: pin the bootstrap LB IP.'
                              nullable: true
                              type: string
                            nodePort:
                              description: '`nodeport` only: pin the bootstrap `NodePort`.'
                              format: int32
                              nullable: true
                              type: integer
                          type: object
                        brokers:
                          items:
                            properties:
                              advertisedHost:
                                description: Override the computed advertised host.
                                nullable: true
                                type: string
                              advertisedPort:
                                description: Override the computed advertised port.
                                format: int32
                                nullable: true
                                type: integer
                              broker:
                                description: Broker id this override applies to (matches the node id).
                                format: int32
                                type: integer
                              host:
                                description: '`ingress` / `route` only (slice 27): per-broker hostname.'
                                nullable: true
                                type: string
                              loadBalancerIP:
                                description: '`loadbalancer` only: pin this broker''s `Service.spec.loadBalancerIP`.'
                                nullable: true
                                type: string
                              nodePort:
                                description: '`nodeport` only: pin this broker''s `Service.spec.ports[0].nodePort`.'
                                format: int32
                                nullable: true
                                type: integer
                            required:
                            - broker
                            type: object
                          type: array
                        class:
                          description: |-
                            `ingress` only (slice 27): the `spec.ingressClassName` set on every
                            generated `Ingress`. Strimzi-shaped `configuration.class`. Inert for
                            other listener types.
                          nullable: true
                          type: string
                      type: object
                    name:
                      description: |-
                        Unique within the cluster. Alphanumeric + `-`, ≤25 chars. Used
                        as the Kafka listener name; surfaces in `bootstrap.servers`-style
                        URLs.
                      type: string
                    networkPolicyPeers:
                      description: |-
                        Slice 23: per-listener peer allow-list. Tri-state:
                        - `None` → no per-listener restriction (allow-all on this port).
                        - `Some(vec![])` → deny-all on this listener port (no per-listener
                          rule emitted; default-deny applies).
                        - `Some(non_empty)` → only listed peers may reach this port.

                        Only consulted when `Kafka.spec.networkPolicy` is set; otherwise
                        inert. The operator auto-allow rule still fires on this port even
                        for deny-all listeners so the operator can manage the cluster.
                      items:
                        description: |-
                          Subset of `networking.k8s.io/v1.NetworkPolicyPeer`. `ipBlock` is
                          intentionally omitted; a future slice can add it if external CIDR
                          allow-lists become a real need.
                        properties:
                          namespaceSelector:
                            description: A label selector is a label query over a set of resources. The result of matchLabels and matchExpressions are ANDed. An empty label selector matches all objects. A null label selector matches no objects.
                            nullable: true
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                                items:
                                  description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector applies to.
                                      type: string
                                    operator:
                                      description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                          podSelector:
                            description: A label selector is a label query over a set of resources. The result of matchLabels and matchExpressions are ANDed. An empty label selector matches all objects. A null label selector matches no objects.
                            nullable: true
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                                items:
                                  description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector applies to.
                                      type: string
                                    operator:
                                      description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                        type: object
                      nullable: true
                      type: array
                    port:
                      description: Container port the broker binds. Unique within the cluster.
                      format: int32
                      type: integer
                    tls:
                      default: false
                      description: |-
                        Transport-level TLS. When `true`, the listener uses the per-broker
                        keystore signed by the cluster CA (slice 30) and clients must speak
                        TLS to connect. Independent of `authentication` — a `tls: true`
                        listener with no `authentication` is anonymous over TLS.
                      type: boolean
                    type:
                      description: |-
                        Listener type. `internal` is in-cluster; `nodeport` /
                        `loadbalancer` create external Services; `ingress` / `route` are
                        accepted by the schema but rejected at reconcile until slice 27.
                      enum:
                      - internal
                      - nodeport
                      - loadbalancer
                      - ingress
                      - route
                      type: string
                  required:
                  - name
                  - port
                  - type
                  type: object
                type: array
              metadataVersion:
                description: |-
                  `KRaft` metadata version (the runtime analog of
                  `inter.broker.protocol.version`). When unset, tracks
                  `kafkaVersion`'s `major.minor`; when set, pins the metadata version
                  for the safe two-step upgrade. Validated against `kafkaVersion` and
                  the finalized `status.metadataVersion` (slice 28) — an invalid value
                  surfaces `KafkaVersionValid=False` and blocks the roll.
                nullable: true
                type: string
              metricsConfig:
                description: |-
                  Slice 40: Prometheus scrape configuration. When `None`, brokers do
                  not bind `/metrics` and no `PodMonitor` / `ServiceMonitor` is
                  rendered. When `Some`, the broker `StatefulSet` gains a `metrics`
                  container port (TCP 9404) and the resources requested by
                  `pod_monitor` / `service_monitor` are SSA-applied.
                nullable: true
                properties:
                  podMonitor:
                    nullable: true
                    properties:
                      interval:
                        nullable: true
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                      scrapeTimeout:
                        nullable: true
                        type: string
                    type: object
                  serviceMonitor:
                    nullable: true
                    properties:
                      interval:
                        nullable: true
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                      scrapeTimeout:
                        nullable: true
                        type: string
                    type: object
                  type:
                    default: prometheus
                    enum:
                    - prometheus
                    type: string
                type: object
              networkPolicy:
                description: |-
                  Slice 23: opt-in `NetworkPolicy` generation. When `None`, no
                  `NetworkPolicy` is generated. When `Some` (even `{}`), the operator
                  renders a cluster-level `NetworkPolicy` gating ingress to broker /
                  controller pods.
                nullable: true
                type: object
            required:
            - kafkaVersion
            type: object
          status:
            nullable: true
            properties:
              clientsCa:
                description: |-
                  Status surface for a single CA. Populated by the reconciler from the
                  parsed CA cert + the CRD spec.
                nullable: true
                properties:
                  generated:
                    description: |-
                      `true` when the operator generated this CA (i.e.
                      `generateCertificateAuthority == true`); `false` for BYO.
                    type: boolean
                  notAfter:
                    description: RFC3339 `notAfter` of the current CA cert.
                    type: string
                required:
                - generated
                - notAfter
                type: object
              clusterCa:
                description: |-
                  Status surface for a single CA. Populated by the reconciler from the
                  parsed CA cert + the CRD spec.
                nullable: true
                properties:
                  generated:
                    description: |-
                      `true` when the operator generated this CA (i.e.
                      `generateCertificateAuthority == true`); `false` for BYO.
                    type: boolean
                  notAfter:
                    description: RFC3339 `notAfter` of the current CA cert.
                    type: string
                required:
                - generated
                - notAfter
                type: object
              conditions:
                default: []
                description: |-
                  Standard Kubernetes-style condition list. Surfaces
                  `Ready`, `ListenersValid`, `ListenersReady`.
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: '`True`, `False`, or `Unknown`.'
                      type: string
                    type:
                      description: e.g. `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kafkaVersion:
                description: 'Slice 28: echo of `spec.kafkaVersion`, for observability.'
                nullable: true
                type: string
              listeners:
                description: |-
                  Slice 25: per-listener resolved addresses. Populated once
                  `ListenersReady=True`.
                items:
                  properties:
                    addresses:
                      default: []
                      items:
                        properties:
                          host:
                            type: string
                          port:
                            format: int32
                            type: integer
                        required:
                        - host
                        - port
                        type: object
                      type: array
                    bootstrapServers:
                      description: '`host:port` clients should put in `bootstrap.servers`.'
                      type: string
                    name:
                      type: string
                    type:
                      enum:
                      - internal
                      - nodeport
                      - loadbalancer
                      - ingress
                      - route
                      type: string
                  required:
                  - bootstrapServers
                  - name
                  - type
                  type: object
                type: array
              metadataVersion:
                description: |-
                  Slice 28: the operator-finalized metadata version. Advances only
                  when version validation passes; drives the downgrade-window check on
                  the next reconcile.
                nullable: true
                type: string
              readyReplicas:
                description: Mirrors `StatefulSet.status.readyReplicas`.
                format: int32
                nullable: true
                type: integer
              replicas:
                description: Mirrors `StatefulSet.status.replicas`.
                format: int32
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: Kafka
        type: object
    served: true
    storage: true
    subresources:
      status: {}
