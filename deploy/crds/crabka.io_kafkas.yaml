              clientsCa:
                description: |-
                  Per-cluster CA that signs `KafkaUser` TLS certs. When absent, the
                  operator uses a fully-defaulted `CertificateAuthority`.
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true`, which is the default, the operator generates and
                      renews this CA. When `false`, the cluster admin must create the CA
                      `Secret` pair first, and the operator refuses to overwrite them.
                      The admin renews a BYO CA. The `CronJob` skips a BYO CA and emits
                      an Event when the CA comes near its expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window in days before `notAfter` in which the renewal `CronJob`
                      reissues the leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              clusterCa:
                description: |-
                  Per-cluster CA for inter-broker mTLS and broker certs. When absent,
                  the operator uses a fully-defaulted `CertificateAuthority`, which it
                  generates itself with 365/30 days.
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: |-
                      When `true`, which is the default, the operator generates and
                      renews this CA. When `false`, the cluster admin must create the CA
                      `Secret` pair first, and the operator refuses to overwrite them.
                      The admin renews a BYO CA. The `CronJob` skips a BYO CA and emits
                      an Event when the CA comes near its expiry.
                    type: boolean
                  renewalDays:
                    default: 30
                    description: |-
                      Window in days before `notAfter` in which the renewal `CronJob`
                      reissues the leaf certs. Default 30.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              config:
                additionalProperties:
                  type: string
                description: |-
                  Opaque broker properties, in `server.properties`-style key and value
                  pairs. The operator passes them through to the broker's
                  `[server_properties]` TOML table, and the broker treats them as inert
                  today. Changes propagate through the config hash.
                nullable: true
                type: object
              delegationToken:
                description: |-
                  Delegation-token master HMAC key source. When `None`, the broker
                  rejects all KIP-48 delegation-token RPCs with err 61
                  `DELEGATION_TOKEN_AUTH_DISABLED`. When `Some`, the operator injects
                  `CRABKA_DELEGATION_TOKEN_SECRET_KEY` into each broker pod through a
                  `valueFrom.secretKeyRef`. The key is then part of the rendered
                  `StatefulSet`, so the SSA reconcile does not race with out-of-band
                  `kubectl set env` patches.
                nullable: true
                properties:
                  secretKeyRef:
                    description: |-
                      Reference to a Kubernetes `Secret` in the same namespace as the
                      `Kafka` CR. Its `data.<key>` value is the broker's master HMAC key for
                      KIP-48 delegation tokens.
                    properties:
                      key:
                        description: Key within the Secret's `data`. Defaults to `secret-key`.
                        nullable: true
                        type: string
                      name:
                        description: Secret name in the same namespace as the `Kafka` CR.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
              gresRegistry:
                description: Shared creation and reader policy for the Gres tenant registry topic.
                nullable: true
                properties:
                  fetchMaxWait:
                    description: Maximum time a registry fetch waits for data.
                    nullable: true
                    type: string
                  fetchPartitionMax:
                    description: Maximum bytes fetched from the registry partition.
                    nullable: true
                    type: string
                  producerDnsTimeout:
                    description: DNS lookup deadline for the registry producer.
                    nullable: true
                    type: string
                  readerAdminDnsTimeout:
                    description: DNS lookup deadline for registry reader and admin paths.
                    nullable: true
                    type: string
                  readerFetchMin:
                    description: Minimum response size for registry reader fetches.
                    nullable: true
                    type: string
                  readerRetryBackoff:
                    description: Registry reader retry delay.
                    nullable: true
                    type: string
                  replicationFactor:
                    description: Registry topic replication factor.
                    format: int32
                    maximum: 32767.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  topicCreateTimeout:
                    description: Kafka topic creation timeout.
                    nullable: true
                    type: string
                type: object
              interBrokerKerberos:
                description: |-
                  Inter-broker Kerberos initiate config. It is required when
                  `interBrokerListenerName` resolves to a `type: gssapi` listener. It
                  supplies the shared client principal and the KDC. The keytab comes from
                  that listener's `keytabSecretRef`.
                nullable: true
                properties:
                  clientPrincipal:
                    description: |-
                      Principal that every broker authenticates as when it dials peers, for
                      example `kafka@EXAMPLE.COM`. It must exist in the shared keytab.
                    type: string
                  kdcUrl:
                    description: KDC endpoint, for example `tcp://kdc:88`.
                    type: string
                  serviceName:
                    description: Target SPN primary. Defaults to `kafka`.
                    nullable: true
                    type: string
                required:
                - clientPrincipal
                - kdcUrl
                type: object
              interBrokerListenerName:
                description: |-
                  Name of the listener for inter-broker traffic. When `None`, the
                  operator picks the first `internal` listener. When `listeners` is
                  empty, the operator picks the synthesized default `"PLAIN"`.
                nullable: true
                type: string
              kafkaVersion:
                description: |-
                  Crabka version label. The operator propagates it to all pool pods
                  through the `app.kubernetes.io/version` label.
                type: string
              krb5ConfSecretRef:
                description: |-
                  Optional process-wide `krb5.conf`. The operator mounts it into the
                  broker pods and points `KRB5_CONFIG` at it. It serves both the accept
                  path and the initiate path.
                nullable: true
                properties:
                  key:
                    description: Key within the Secret whose value is the krb5.conf contents.
                    type: string
                  secretName:
                    description: Name of the Secret holding the krb5.conf.
                    type: string
                required:
                - key
                - secretName
                type: object
              listeners:
                description: |-
                  Named listeners. An empty or absent list synthesizes one internal
                  `PLAIN` listener on port 9092.
                items:
                  properties:
                    authentication:
                      description: |-
                        Per-listener authentication mechanism. Absent means anonymous, and no
                        client identity is required. When the field is `type: tls`, the
                        listener must also have `tls: true`. The reconcile enforces this
                        rule.
                      nullable: true
                      properties:
                        accessTokenIsJwt:
                          type: boolean
                        clientId:
                          minLength: 1
                          type: string
                        clientSecret:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            secretName:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - secretName
                          type: object
                        customClaimCheck:
                          minLength: 1
                          type: string
                        enableOauthBearer:
                          type: boolean
                        fallbackUserNameClaim:
                          minLength: 1
                          type: string
                        fallbackUserNamePrefix:
                          minLength: 1
                          type: string
                        groupsClaim:
                          minLength: 1
                          type: string
                        groupsClaimDelimiter:
                          minLength: 1
                          type: string
                        introspectionEndpointUri:
                          minLength: 1
                          type: string
                        introspectionHttpTimeoutSeconds:
                          minimum: 1.0
                          type: integer
                        jwksEndpointUri:
                          minLength: 1
                          type: string
                        jwksExpirySeconds:
                          format: int32
                          minimum: 1.0
                          type: integer
                        jwksIgnoreKeyUse:
                          type: boolean
                        jwksMinRefreshPauseSeconds:
                          format: int32
                          minimum: 0.0
                          type: integer
                        jwksRefreshSeconds:
                          minimum: 0.0
                          type: integer
                        kdc:
                          minLength: 1
                          type: string
                        keytabSecretRef:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            secretName:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - secretName
                          type: object
                        maxClockSkewSeconds:
                          minimum: 0.0
                          type: integer
                        maxSecondsWithoutReauthentication:
                          format: int32
                          minimum: 1.0
                          type: integer
                        maxTimeSkew:
                          minLength: 1
                          type: string
                        principalToLocalRules:
                          items:
                            minLength: 1
                            type: string
                          type: array
                        realm:
                          minLength: 1
                          type: string
                        serviceName:
                          minLength: 1
                          type: string
                        tlsTrustedCertificates:
                          items:
                            properties:
                              certificate:
                                minLength: 1
                                type: string
                              secretName:
                                minLength: 1
                                type: string
                            required:
                            - certificate
                            - secretName
                            type: object
                          type: array
                        type:
                          enum:
                          - tls
                          - scram-sha-512
                          - scram-sha-256
                          - oauth
                          - gssapi
                          type: string
                        userInfoEndpointUri:
                          minLength: 1
                          type: string
                        userNameClaim:
                          type: string
                        validAudience:
                          type: string
                        validIssuerUri:
                          minLength: 1
                          type: string
                        validTokenType:
                          minLength: 1
                          type: string
                      required:
                      - type
                      type: object
                    configuration:
                      description: Optional listener-type-specific configuration.
                      nullable: true
                      properties:
                        bootstrap:
                          nullable: true
                          properties:
                            annotations:
                              additionalProperties:
                                type: string
                              description: Annotations to add to the bootstrap Service.
                              type: object
                            host:
                              description: '`ingress` / `route` only: bootstrap hostname.'
                              nullable: true
                              type: string
                            labels:
                              additionalProperties:
                                type: string
                              description: Labels to add to the bootstrap Service.
                              type: object
                            loadBalancerIP:
                              description: '`loadbalancer` only: pin the bootstrap LB IP.'
                              nullable: true
                              type: string
                            nodePort:
                              description: '`nodeport` only: pin the bootstrap `NodePort`.'
                              format: int32
                              nullable: true
                              type: integer
                          type: object
                        brokers:
                          items:
                            properties:
                              advertisedHost:
                                description: Override the computed advertised host.
                                nullable: true
                                type: string
                              advertisedPort:
                                description: Override the computed advertised port.
                                format: int32
                                nullable: true
                                type: integer
                              broker:
                                description: Broker id this override applies to (matches the node id).
                                format: int32
                                type: integer
                              host:
                                description: '`ingress` / `route` only: per-broker hostname.'
                                nullable: true
                                type: string
                              loadBalancerIP:
                                description: '`loadbalancer` only: pin this broker''s `Service.spec.loadBalancerIP`.'
                                nullable: true
                                type: string
                              nodePort:
                                description: '`nodeport` only: pin this broker''s `Service.spec.ports[0].nodePort`.'
                                format: int32
                                nullable: true
                                type: integer
                            required:
                            - broker
                            type: object
                          type: array
                        class:
                          description: |-
                            `ingress` only: the `spec.ingressClassName` that the operator sets on
                            every generated `Ingress`. This is the Strimzi-shaped
                            `configuration.class`. It is inert for other listener types.
                          nullable: true
                          type: string
                      type: object
                    name:
                      description: |-
                        Unique within the cluster. Alphanumeric characters and `-`, ≤25
                        chars. It is the Kafka listener name, and it appears in
                        `bootstrap.servers`-style URLs.
                      type: string
                    networkPolicyPeers:
                      description: |-
                        Per-listener peer allow-list. It is tri-state:
                        - `None` gives no per-listener restriction, that is, allow-all on this
                          port.
