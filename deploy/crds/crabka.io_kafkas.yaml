                        jwksRefreshSeconds:
                          minimum: 0.0
                          type: integer
                        kdc:
                          minLength: 1
                          type: string
                        keytabSecretRef:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            secretName:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - secretName
                          type: object
                        maxClockSkewSeconds:
                          minimum: 0.0
