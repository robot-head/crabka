apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkausers.crabka.io
spec:
  group: crabka.io
  names:
    kind: KafkaUser
    plural: kafkausers
    shortNames:
    - ku
    singular: kafkauser
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaUserSpec via `CustomResource`
        properties:
          spec:
            properties:
              authentication:
                description: |-
                  Tagged enum on `type`, mirroring Strimzi.

                  The wire shape is flat (Strimzi-compatible): `type` is the
                  discriminator and per-variant config fields are siblings of `type`.
                  The custom `schema_with` hand-rolls a structural schema because
                  kube-rs 3.x's `StructuralSchemaRewriter` panics when `oneOf`
                  branches share a `type` property with differing `enum` values (the
                  default schemars output for tagged-union enums). Same workaround as
                  `Storage` in `kafka_node_pool.rs`. Cross-variant constraints (e.g.
                  "`iterations` only valid when `type=scram-sha-512`") are enforced
                  by the operator at reconcile time, not by the apiserver.
                properties:
                  iterations:
                    maximum: 1000000.0
                    minimum: 4096.0
                    type: integer
                  maxLifetimeMs:
                    minimum: 1.0
                    type: integer
                  passwordLength:
                    maximum: 256.0
                    minimum: 16.0
                    type: integer
                  renewBeforeExpiryMs:
                    minimum: 60000.0
                    type: integer
                  renewalDays:
                    maximum: 3650.0
                    minimum: 1.0
                    type: integer
                  renewers:
                    items:
                      pattern: ^User:.+$
                      type: string
                    type: array
                  type:
                    enum:
                    - scram-sha-512
                    - scram-sha-256
                    - tls
                    - tls-external
                    - delegation-token
                    type: string
                  validityDays:
                    maximum: 36500.0
                    minimum: 1.0
                    type: integer
                required:
                - type
                type: object
              authorization:
                description: |-
                  Authorization is optional — a user with no ACLs can still
                  authenticate. When absent, ACL reconciliation is skipped.
                nullable: true
                oneOf:
                - required:
                  - type
                properties:
                  acls:
                    default: []
                    items:
                      description: |-
                        One rule from `spec.authorization.acls`. Expanded into one
                        `(resource, operation, host, type)` tuple per `operations` entry
                        at reconcile time.
                      properties:
                        host:
                          description: |-
                            Source-address pattern; `"*"` is the wildcard. Defaults to
                            `"*"` when omitted.
                          type: string
                        operations:
                          description: |-
                            Non-empty list — the reconciler refuses an empty `operations`
                            with `Ready=False reason=InvalidSpec`.
                          items:
                            description: |-
                              All 11 Kafka ACL operations. Matches the discriminants in
                              `org.apache.kafka.common.acl.AclOperation`.
                            enum:
                            - All
                            - Read
                            - Write
                            - Create
                            - Delete
                            - Alter
                            - Describe
                            - ClusterAction
                            - DescribeConfigs
                            - AlterConfigs
                            - IdempotentWrite
                            type: string
                          type: array
                        resource:
                          properties:
                            name:
                              type: string
                            patternType:
                              default: literal
                              description: |-
                                `literal` (exact match) or `prefixed` (resources whose name
                                starts with `name`). Defaults to `literal`.
                              enum:
                              - literal
                              - prefixed
                              type: string
                            type:
                              enum:
                              - topic
                              - group
                              - cluster
                              - transactional-id
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        type:
                          default: allow
                          description: '`allow` or `deny`; defaults to `allow`.'
                          enum:
                          - allow
                          - deny
                          type: string
                      required:
                      - operations
                      - resource
                      type: object
                    type: array
                  type:
                    enum:
                    - simple
                    type: string
                type: object
              quotas:
                description: |-
                  Optional per-user client quotas (KIP-13/124/257).
                  Maps onto Kafka's `(user)` quota entity via `AlterClientQuotas`
                  (`api_key` 49). Absent → operator does not touch the broker's
                  quota state; present → the operator drives the broker's quota
                  keys for `User:<name>` toward the spec (sets configured fields,
                  tombstones omitted ones).
                nullable: true
                properties:
                  consumerByteRate:
                    description: Maximum consume-side bytes/sec. Backed by `consumer_byte_rate`.
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  controllerMutationRate:
                    description: |-
                      KIP-599 controller-mutation rate (creates/deletes/sec).
                      Backed by `controller_mutation_rate`.
                    format: double
                    nullable: true
                    type: number
                  producerByteRate:
                    description: Maximum produce-side bytes/sec. Backed by `producer_byte_rate`.
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  requestPercentage:
                    description: |-
                      Maximum percentage of a request-handler thread's time the user
                      may consume (0..=100). Backed by `request_percentage`.
                    format: int32
                    maximum: 100.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
            required:
            - authentication
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: Standard Kubernetes-style condition list. Surfaces `Ready`.
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: '`True`, `False`, or `Unknown`.'
                      type: string
                    type:
                      description: e.g. `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              delegationTokenExpiryTimestampMs:
                description: |-
                  Current `expiry_timestamp_ms` of the operator-managed
                  delegation token (extended on each successful renew). Compared
                  against `now` to decide when to renew per
                  `spec.authentication.renewBeforeExpiryMs`.
                format: int64
                nullable: true
                type: integer
              delegationTokenId:
                description: |-
                  Persisted `token_id` (UUID) of the operator-managed
                  delegation token for this user. Used across reconciles to find
                  the same token via `DescribeDelegationToken`. Present once the
                  operator has successfully issued a token via
                  `CreateDelegationToken`.
                nullable: true
                type: string
              delegationTokenMaxTimestampMs:
                description: |-
                  Token's absolute upper bound (`max_timestamp_ms`).
                  Renew can never push `expiry_timestamp_ms` past this — the
                  operator stops renewing and surfaces `TokenExpiring` once
                  further extension is impossible.
                format: int64
                nullable: true
                type: integer
              external:
                default: false
                description: |-
                  `true` once a credential-less user
                  (`type: tls-external`) has been reconciled. Surfaces in
                  `kubectl describe ku` so operators can tell at a glance that
                  the operator does not own this user's credentials.
                type: boolean
              observedGeneration:
                description: '`metadata.generation` of the last successfully-reconciled spec.'
                format: int64
                nullable: true
                type: integer
              quotasInSync:
                default: false
                description: |-
                  True once the spec's `quotas` (if any) have been reflected in the
                  broker's `(user)` client-quota state. False when `spec.quotas`
                  is `None` (the operator does not touch broker quotas).
                type: boolean
              scramSha256:
                default: false
                description: True once SCRAM-SHA-256 credentials are provisioned.
                type: boolean
              scramSha512:
                default: false
                description: True once SCRAM-SHA-512 credentials are provisioned.
                type: boolean
              secret:
                description: Name of the Kubernetes Secret holding the user's password.
                nullable: true
                type: string
              tls:
                default: false
                description: |-
                  `true` once a TLS user has a current cert Secret. Mirrors
                  `scram_sha512`.
                type: boolean
              tlsCertNotAfter:
                description: |-
                  RFC3339 timestamp of the user cert's `notAfter`. Present when
                  `tls == true`.
                nullable: true
                type: string
              tlsPrincipal:
                description: |-
                  The principal string the operator pinned in ACLs (e.g.
                  `User:CN=alice` for TLS users, `User:alice` for SCRAM and
                  `tls-external` users). Always populated when the user is
                  provisioned. Load-bearing for debugging "why isn't my ACL
                  matching" issues.
                nullable: true
                type: string
              username:
                description: Effective Kafka principal name (matches `metadata.name`).
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KafkaUser
        type: object
    served: true
    storage: true
    subresources:
      status: {}
