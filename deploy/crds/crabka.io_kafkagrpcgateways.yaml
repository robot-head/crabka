                      format: uint32
                      minimum: 1.0
                      nullable: true
                      type: integer
                    maxBackoff:
                      description: Maximum backoff cap, as a unit-carrying duration. Default `30s`.
                      nullable: true
                      type: string
                    name:
                      description: |-
                        Unique name for this subscription. Used as the consumer group id
