                nullable: true
                properties:
                  clientAuth:
                    description: |-
                      How the gateway authenticates inbound clients.
                      One of `disabled`, `optional`, `required`. Default `required`.
                    nullable: true
                    type: string
                  reloadInterval:
                    description: Cert hot-reload poll interval, as a unit-carrying duration. Default `30s`.
                    nullable: true
                    type: string
                  validityDays:
                    description: Serving-cert lifetime in days. Default 365.
                    format: uint32
                    minimum: 1.0
                    nullable: true
                    type: integer
                type: object
              tuning:
