                      nullable: true
                      properties:
                        key:
                          description: Key within the Secret's `data` map.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    signatureEncoding:
                      description: Signature encoding. One of `hex` or `base64`. Default `hex`.
                      nullable: true
                      type: string
                    signatureHeader:
                      description: |-
                        HTTP header carrying the HMAC signature. E.g.
                        `X-Hub-Signature-256`.
                      nullable: true
                      type: string
                    signaturePrefix:
                      description: |-
                        Prefix to strip from the signature header value before
                        verifying. E.g. `sha256=`.
                      nullable: true
                      type: string
                    targetTopic:
                      description: Kafka topic that records are produced to.
                      type: string
                    timestampHeader:
                      description: |-
                        HTTP header carrying the request timestamp. Used with
                        `timestampTolerance` to reject replayed requests.
                      nullable: true
                      type: string
                    timestampTolerance:
                      description: |-
                        Maximum age of a request timestamp before it is rejected as a replay,
                        as a unit-carrying duration. Default `300s`.
                      nullable: true
                      type: string
                  required:
                  - name
                  - targetTopic
                  type: object
                type: array
