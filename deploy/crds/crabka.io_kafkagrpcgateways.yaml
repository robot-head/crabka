        description: Auto-generated derived type for KafkaGrpcGatewaySpec via `CustomResource`
        properties:
          spec:
            properties:
              allowedTargets:
                description: |-
                  Explicit SSRF allowlist for outbound HTTP targets. The controller
                  derives entries automatically from each subscription's
                  `targetUrl`; use this field to add extra allowed hosts.
                items:
                  description: |-
                    One entry in the gateway's SSRF allowlist. An outbound HTTP request
                    is allowed only when `scheme` and `host` match.
                  properties:
                    host:
                      description: Hostname (and optional port) of the allowed target.
                      type: string
                    scheme:
                      description: URL scheme. One of `http` or `https`.
                      type: string
                  required:
                  - host
                  - scheme
                  type: object
                type: array
              authz:
                description: |-
                  Authorization configuration. When absent, simple ACL-based authz
                  is used (mode = `simple`).
                nullable: true
                properties:
                  aclRefresh:
                    description: |-
                      How often the gateway refreshes its ACL cache from the broker,
                      as a unit-carrying duration. Default `60s`.
                    nullable: true
                    type: string
                  bearer:
                    description: |-
                      Bearer-token authentication configuration. When absent,
                      bearer auth is disabled.
                    nullable: true
                    properties:
                      allowableClockSkew:
                        description: |-
                          Allowable clock skew for bearer-token timestamps, as a unit-carrying
                          duration (`30s`, `500ms`).
                        nullable: true
                        type: string
                      mode:
                        description: Bearer auth mode. One of `off` or `unsecured`. Default `off`.
                        nullable: true
                        type: string
                      principalClaim:
                        description: JWT claim used as the Kafka principal. Default `sub`.
                        nullable: true
                        type: string
                    type: object
                  mode:
                    description: |-
                      Authorization mode. One of `off` or `simple`. Default `simple`
                      (ACL-based, reading `KafkaUser` ACLs from the broker).
                    nullable: true
                    type: string
                  superUsers:
                    description: Principal strings (e.g. `User:admin`) that bypass all ACL checks.
                    items:
                      type: string
                    type: array
                type: object
              dedup:
                description: |-
                  Configuration for the deduplication topic that backs idempotent
                  produce (exactly-once delivery). When absent, controller defaults apply.
                nullable: true
                properties:
                  ownershipGroup:
                    description: |-
                      Consumer group used to divide dedup ownership between replicas.
                      Defaults to a value derived from the gateway name.
                    nullable: true
                    type: string
                  partitions:
                    description: Number of partitions for the dedup topic. Default 8.
                    format: uint32
                    maximum: 2147483647.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  topic:
                    description: |-
                      Kafka topic used to store dedup state. Defaults to
                      `<gateway-name>-dedup` when absent.
                    nullable: true
                    type: string
                  txnIdPrefix:
                    description: |-
                      Prefix for transactional producer IDs. Defaults to the gateway
                      name. The full `transactional.id` is `<prefix>-<partition>`.
                    nullable: true
                    type: string
                  window:
                    description: |-
                      Dedup window, as a unit-carrying duration (`24h`, `30m`). Records with
                      the same idempotency key within this window are dropped. Default `24h`.
                    nullable: true
                    type: string
                type: object
              healthChecks:
                description: Kubernetes readiness and liveness probe timing.
                nullable: true
                properties:
                  livenessInitialDelaySeconds:
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  livenessPeriodSeconds:
                    format: int32
                    minimum: 1.0
                    nullable: true
                    type: integer
                  readinessInitialDelaySeconds:
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  readinessPeriodSeconds:
                    format: int32
                    minimum: 1.0
                    nullable: true
                    type: integer
                type: object
              image:
