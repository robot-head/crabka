                      nullable: true
                      type: string
                    keySource:
                      description: |-
                        How to derive the Kafka record key from the request. E.g.
                        `header:X-Record-Key` or `body_path:.id`.
                      nullable: true
                      type: string
                    maxBody:
                      description: Maximum accepted request body size in bytes. Default 1 MiB.
                      nullable: true
                      type: string
                    name:
                      description: Unique name for this webhook route. Used as the URL path segment.
                      type: string
                    principal:
                      description: |-
                        Kafka principal for ACL checks on produce to `targetTopic`.
