                      nullable: true
                      type: string
                    schemaFormat:
                      description: 'Structured payload format: `avro`, `json`, or `protobuf`.'
                      nullable: true
                      type: string
                    schemaSubject:
                      description: Optional Schema Registry subject for structured request bodies.
                      nullable: true
                      type: string
                    secretRef:
                      description: |-
                        Kubernetes Secret key reference for the HMAC signing secret.
