                    minimum: 1.0
                    nullable: true
                    type: integer
                  produceMaxBody:
                    nullable: true
                    type: string
                  readinessPollInterval:
                    nullable: true
                    type: string
                type: object
              webhooks:
                description: |-
                  Inbound HTTP-webhook endpoints. Each entry creates one
