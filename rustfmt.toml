format_code_in_doc_comments = true
# Import layout, previously kept as manual discipline, now enforced. Both options
# are still nightly-gated, which is fine: CI formats with `cargo +nightly fmt`
# (already required for `format_code_in_doc_comments` above). Plain stable
# `cargo fmt` silently skips them.
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
