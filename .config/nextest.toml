# Per-test wall-clock bound for CI.
#
# `period` only warns. nextest prints SLOW against the test name at each 60s
# tick, so a legitimately slow test stays green and stays visible.
# `terminate-after` is the kill. Ten periods give a hard bound of 600s, and
# nextest reports the killed test as TIMEOUT against its own name.
#
# 600s is 3.4x the slowest legitimate test measured across CI. A survey of
# 11,929 test executions in the heaviest jobs (`rust`, `gres-integration`,
# `broker-integration`, `broker-jvm-acceptance`, `workspace-integration-coverage`,
# `client-core-integration`, `grpc-gateway-integration`, and the conformance
# lanes) found a maximum of 176.6s, in
# `crabka-gres-ranges::tso_monotonicity_model`. No test was above 180s, so the
# bound has a wide margin over the whole distribution, not only over the mean.
#
# The bound catches a hang. It does not police slow tests. A stalled container
# image pull once held both `workspace-integration-coverage` shards until the
# job wall stopped them, and the log named no test as the cause.
#
# CI only. Local runs stay unbounded, so a wrong bound cannot block developers.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
broker-jvm-acceptance = { max-threads = 1 }
broker-share-state = { max-threads = 1 }
broker-transactions = { max-threads = 1 }
broker-tiered-storage-rlmm = { max-threads = 1 }
consumer-cooperative-rebalance = { max-threads = 1 }
# Chapter Gres FDW roundtrip tests: each boots an in-process broker + schema
# registry; cap concurrency to avoid broker saturation on constrained runners.
gres-fdw = { max-threads = 2 }
gres-ranges-process = { max-threads = 2 }
gres-substrate = { max-threads = 2 }
grafana-e2e = { max-threads = 1 }
schema-registry-fixed-port-captures = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(crabka-broker) & (binary(describe_groups_jvm) | binary(jvm_acceptance) | binary(jvm_consumer_group_next_gen) | binary(jvm_kip320_divergence))'
test-group = 'broker-jvm-acceptance'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(crabka-broker) & (binary(share_consume) | binary(share_admin_offsets))'
test-group = 'broker-share-state'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(crabka-broker) & binary(transactions)'
test-group = 'broker-transactions'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(crabka-broker) & binary(tiered_storage_topic_rlmm)'
test-group = 'broker-tiered-storage-rlmm'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(crabka-integration-tests) & binary(consumer_cooperative_rebalance)'
test-group = 'consumer-cooperative-rebalance'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(crabka-integration-tests) & binary(grafana_e2e)'
test-group = 'grafana-e2e'

[[profile.default.overrides]]
filter = 'package(crabka-schema-registry) & (binary(interop) | binary(capture_fixtures) | binary(capture_admin_fixtures) | binary(capture_auth_fixtures) | binary(capture_compat_fixtures) | binary(capture_election_fixtures) | binary(capture_json_fixtures) | binary(capture_protobuf_fixtures) | binary(capture_references_fixtures))'
test-group = 'schema-registry-fixed-port-captures'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
# crabka-gres-fdw's integration tests boot an in-process broker + registry.
filter = 'package(crabka-gres-fdw) & kind(test)'
test-group = 'gres-fdw'

[[profile.default.overrides]]
# Gres substrate integration tests boot one or three in-process brokers.
filter = 'package(crabka-gres-substrate) & kind(test)'
test-group = 'gres-substrate'

[[profile.default.overrides]]
# Gres range system suites boot an in-process broker plus real compute children.
filter = 'package(crabka-gres-ranges) & (binary(multiprocess) | binary(jepsen_bank) | binary(participant_kill_bank) | binary(range0_cascade_kill_bank) | binary(range0_leader_kill_drain) | binary(crossrange_2pc_nemesis) | binary(jepsen_elle))'
test-group = 'gres-ranges-process'

[[profile.ci.overrides]]
filter = 'package(crabka-broker) & (binary(describe_groups_jvm) | binary(jvm_acceptance) | binary(jvm_consumer_group_next_gen) | binary(jvm_kip320_divergence))'
test-group = 'broker-jvm-acceptance'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-broker) & (binary(share_consume) | binary(share_admin_offsets))'
test-group = 'broker-share-state'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-broker) & binary(transactions)'
test-group = 'broker-transactions'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-broker) & binary(tiered_storage_topic_rlmm)'
test-group = 'broker-tiered-storage-rlmm'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-integration-tests) & binary(consumer_cooperative_rebalance)'
test-group = 'consumer-cooperative-rebalance'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-integration-tests) & binary(grafana_e2e)'
test-group = 'grafana-e2e'

[[profile.ci.overrides]]
filter = 'package(crabka-schema-registry) & (binary(interop) | binary(capture_fixtures) | binary(capture_admin_fixtures) | binary(capture_auth_fixtures) | binary(capture_compat_fixtures) | binary(capture_election_fixtures) | binary(capture_json_fixtures) | binary(capture_protobuf_fixtures) | binary(capture_references_fixtures))'
test-group = 'schema-registry-fixed-port-captures'
threads-required = 'num-test-threads'

[[profile.ci.overrides]]
filter = 'package(crabka-gres-substrate) & kind(test)'
test-group = 'gres-substrate'

[[profile.ci.overrides]]
filter = 'package(crabka-gres-ranges) & (binary(multiprocess) | binary(jepsen_bank) | binary(participant_kill_bank) | binary(range0_cascade_kill_bank) | binary(range0_leader_kill_drain) | binary(crossrange_2pc_nemesis) | binary(jepsen_elle))'
test-group = 'gres-ranges-process'
