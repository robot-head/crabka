        annotations:
          summary: Logs query p99 > 5s
          description: "p99 of crabka_logs_query_duration_seconds exceeds 5s over 5m."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: crabka-prom
            model:
              datasource: { type: prometheus, uid: crabka-prom }
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(crabka_logs_query_duration_seconds_bucket[5m])))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
              refId: C

      - uid: crabka-profiles-query-latency
        title: Profiles query p99 latency high
        condition: C
