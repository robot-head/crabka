              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: crabka-traces-ingest-errors
        title: Traces ingest error ratio high
        condition: C
        for: 10m
        labels: { severity: warning, area: traces }
        annotations:
          summary: Traces ingest error ratio > 5%
          description: "More than 5% of trace push requests are failing over the last 5m."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: crabka-prom
            model:
              datasource: { type: prometheus, uid: crabka-prom }
              editorMode: code
              expr: sum(rate(crabka_traces_ingest_requests_total{status="error"}[5m])) / clamp_min(sum(rate(crabka_traces_ingest_requests_total[5m])), 1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: crabka-profiles-ingest-errors
        title: Profiles ingest error ratio high
        condition: C
        for: 10m
        labels: { severity: warning, area: profiles }
        annotations:
          summary: Profiles ingest error ratio > 5%
          description: "More than 5% of profile push requests are failing over the last 5m."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: crabka-prom
            model:
              datasource: { type: prometheus, uid: crabka-prom }
              editorMode: code
              expr: sum(rate(crabka_profiles_ingest_requests_total{status="error"}[5m])) / clamp_min(sum(rate(crabka_profiles_ingest_requests_total[5m])), 1)
              instant: true
