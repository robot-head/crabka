            datasourceUid: crabka-prom
            model:
              datasource: { type: prometheus, uid: crabka-prom }
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(crabka_profiles_query_duration_seconds_bucket[5m])))
              instant: true
