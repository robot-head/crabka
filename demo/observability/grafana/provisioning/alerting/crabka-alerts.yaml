        labels: { severity: warning, area: metrics }
        annotations:
          summary: Metrics query p99 > 5s
          description: "p99 of crabka_metrics_query_duration_seconds exceeds 5s over 5m."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: crabka-prom
            model:
              datasource: { type: prometheus, uid: crabka-prom }
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(crabka_metrics_query_duration_seconds_bucket[5m])))
              instant: true
              range: false
