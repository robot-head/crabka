name: crabka-observability-demo

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
  AWS_ENDPOINT_URL: http://rustfs:9000
  AWS_ALLOW_HTTP: "true"
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

x-otlp-env: &otlp-env
  RUST_LOG: "${CRABKA_RUST_LOG:-info,pprof::profiler=warn,object_store::client::retry=warn}"
  CRABKA_OTLP_ENDPOINT: http://alloy:4317
  # Head sampling ratio. Every Crabka service self-instruments at 100% by
  # default, and the traces pipeline (distributor/broker/block-builder) traces
  # its OWN span-ingest operations — those spans get exported back through Alloy
  # into the traces WAL, which traces THAT ingest, and so on. At ratio 1.0 the
  # loop diverges (observed: 62M+ spans, a 250MB+ trace index the querier cannot
  # serve). 0.05 keeps the per-generation amplification < 1 so the feedback
  # converges while still leaving plenty of demo traces to view.
  CRABKA_OTLP_SAMPLE_RATIO: "0.05"
  CRABKA_OTLP_HEARTBEAT_INTERVAL: "${CRABKA_OTLP_HEARTBEAT_INTERVAL:-15s}"
  CRABKA_ADMIN_LISTEN_ADDR: 0.0.0.0:9404
  # Enable jemalloc heap profiling support continuously so heap profiles include
  # long-lived allocations, but sample coarsely (~every 1 MiB) so small demo
  # services still produce useful heap profiles without tracing every
  # allocation. NOT
  # lg_prof_sample:0, which backtraces every allocation.
  # Short dirty/muzzy decay plus the jemalloc background thread keeps inactive
  # heap-profile and query allocations from sitting in RSS indefinitely.
  MALLOC_CONF: "prof:true,prof_active:true,lg_prof_sample:20,background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000"

# Every Crabka service runs the same all-in-one demo image. By default this
# PULLS the prebuilt image from GHCR (published by the publish-demo-image
# workflow) so `docker compose up` needs no local build. To run from source
# instead, build an apko image from the repo root and docker-load/tag it under
# the same name:
#   melange keygen melange.rsa
#   melange build packaging/melange/crabka-demo.yaml --source-dir . --signing-key melange.rsa --arch x86_64 --runner docker --cache-dir "$PWD/.melange-cache" --out-dir packages/
#   apko build packaging/apko/crabka-demo.yaml ghcr.io/robot-head/crabka-demo:latest crabka-demo.tar --arch x86_64 --repository-append "$PWD/packages" --keyring-append "$PWD/melange.rsa.pub"
#   docker load < crabka-demo.tar
# then `docker compose up -d` (Compose uses the local image when present).
x-crabka-image: &crabka-image
  image: ghcr.io/robot-head/crabka-demo:latest
  restart: unless-stopped

# ---------------------------------------------------------------------------
# Per-tier resource limits (hard caps; memswap_limit == mem_limit so a tier that
# exceeds its cap is OOM-killed + restarted rather than swap-thrashing). Defaults
# target a ~16 GB / 8-core dev machine (steady-state usage is ~8-9 GiB; a ~12 GiB
# host is the practical floor). Every value is overridable via .env, so the SAME
# compose scales from a laptop to a large server — see .env for the per-tier
# knobs, the small-host path (the distributors carry a fixed ~1.5-1.7 GiB
# heap-profiling RSS floor, so the real small-host lever is disabling prof, NOT
# shrinking their cap), and how the workload knob couples to the distributor /
# compactor caps. Caps may sum above host RAM (real usage is far lower); a `cpus`
# above the host core count is simply non-binding.
# ---------------------------------------------------------------------------
x-broker-res: &broker-res
  mem_limit: ${CRABKA_BROKER_MEM:-2g}
  memswap_limit: ${CRABKA_BROKER_MEM:-2g}
  cpus: ${CRABKA_BROKER_CPUS:-4}
x-distributor-res: &distributor-res
  mem_limit: ${CRABKA_DISTRIBUTOR_MEM:-3g}
  memswap_limit: ${CRABKA_DISTRIBUTOR_MEM:-3g}
  cpus: ${CRABKA_DISTRIBUTOR_CPUS:-2}
x-querier-res: &querier-res
  mem_limit: ${CRABKA_QUERIER_MEM:-2g}
  memswap_limit: ${CRABKA_QUERIER_MEM:-2g}
  cpus: ${CRABKA_QUERIER_CPUS:-2}
x-compactor-res: &compactor-res
  mem_limit: ${CRABKA_COMPACTOR_MEM:-1g}
  memswap_limit: ${CRABKA_COMPACTOR_MEM:-1g}
  cpus: ${CRABKA_COMPACTOR_CPUS:-2}
x-registry-res: &registry-res
  mem_limit: ${CRABKA_SCHEMA_REGISTRY_MEM:-768m}
  memswap_limit: ${CRABKA_SCHEMA_REGISTRY_MEM:-768m}
  cpus: ${CRABKA_SCHEMA_REGISTRY_CPUS:-1}
x-rustfs-res: &rustfs-res
  mem_limit: ${CRABKA_RUSTFS_MEM:-2g}
  memswap_limit: ${CRABKA_RUSTFS_MEM:-2g}
  cpus: ${CRABKA_RUSTFS_CPUS:-2}
x-alloy-res: &alloy-res
  mem_limit: ${CRABKA_ALLOY_MEM:-512m}
  memswap_limit: ${CRABKA_ALLOY_MEM:-512m}
  cpus: ${CRABKA_ALLOY_CPUS:-1}
x-cadvisor-res: &cadvisor-res
  mem_limit: ${CRABKA_CADVISOR_MEM:-512m}
  memswap_limit: ${CRABKA_CADVISOR_MEM:-512m}
  cpus: ${CRABKA_CADVISOR_CPUS:-1}
x-grafana-res: &grafana-res
  mem_limit: ${CRABKA_GRAFANA_MEM:-1g}
  memswap_limit: ${CRABKA_GRAFANA_MEM:-1g}
  cpus: ${CRABKA_GRAFANA_CPUS:-2}
x-demo-res: &demo-res
  mem_limit: ${CRABKA_DEMO_MEM:-1g}
  memswap_limit: ${CRABKA_DEMO_MEM:-1g}
  cpus: ${CRABKA_DEMO_CPUS:-1}
x-setup-res: &setup-res
  mem_limit: ${CRABKA_SETUP_MEM:-512m}
  memswap_limit: ${CRABKA_SETUP_MEM:-512m}
  cpus: ${CRABKA_SETUP_CPUS:-1}

services:
  # One-shot: format the broker's KRaft storage (writes meta.properties.json)
  # before the broker starts. Idempotent — skips if already formatted. The
  # controller listener is advertised-host:9093 (broker.rs derives it from
  # --advertised-listener with port 9093).
  # --feature streams.version=1 finalizes the KIP-1071 feature gate so that
  # demo-stream (Kafka Streams group coordinator) starts successfully. If you
  # already have a broker-data volume from before this flag was added, wipe it
  # with `docker compose down -v` and restart.
  broker-format:
    image: ghcr.io/robot-head/crabka-demo:latest
    <<: *setup-res
    restart: "no"
    entrypoint: ["sh", "-c", "test -f /data/meta.properties.json || crabka format --log-dir /data --standalone --node-id 1 --controller-listener broker:9093 --feature streams.version=1"]
    volumes: ["broker-data:/data"]

  broker:
    <<: [*crabka-image, *broker-res]
    command: ["crabka-broker", "--listen-addr=0.0.0.0:9092", "--advertised-listener=broker:9092", "--log-dir=/data", "--process-roles=controller,broker"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: broker
      CRABKA_METRICS_LISTEN_ADDR: 0.0.0.0:9404
    ports: ["9092:9092", "9404:9404"]
    volumes: ["broker-data:/data"]
    depends_on:
      broker-format:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9404/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs-permissions:
    image: mirror.gcr.io/library/busybox:1.38
    <<: *setup-res
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes: ["rustfs-data:/data"]

  rustfs:
    image: mirror.gcr.io/rustfs/rustfs:latest
    restart: unless-stopped
    # Resource caps (see x-rustfs-res / .env); the cap bounds object-store cache and query bursts.
    <<: *rustfs-res
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_OBS_ENDPOINT: http://alloy:4318
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "true"
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "true"
      # RustFS treats non-production environments as local development and
      # prints full tracing span lifecycle events to stdout. That makes traces
      # easy to spot, but overwhelms the demo logs/query path. Keep local stdout
      # quiet and export RustFS telemetry through OTLP instead.
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_SAMPLE_RATIO: "0.05"
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_METER_INTERVAL: "15"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "false"
      # This fixture stores many small parquet/json blocks and must stay inside
      # a laptop-friendly memory cap. Keep adaptive sizing enabled, but use the
      # small-object profile instead of GeneralPurpose's 1 MiB unknown-size
      # buffers.
      RUSTFS_BUFFER_PROFILE: WebWorkload
      RUSTFS_OBJECT_IO_STORAGE_MEDIA_OVERRIDE: hdd
      RUSTFS_ALLOCATOR_RECLAIM_ENABLED: "true"
      RUSTFS_ALLOCATOR_RECLAIM_INTERVAL_SECS: "15"
      RUSTFS_ALLOCATOR_RECLAIM_IDLE_INTERVALS: "1"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_READ_ENABLE: "true"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_WRITE_ENABLE: "true"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_THRESHOLD: "65536"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rustfs-data:/data"]
    depends_on:
      rustfs-permissions: { condition: service_completed_successfully }
      alloy: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs-setup:
    image: mirror.gcr.io/amazon/aws-cli:latest
    <<: *setup-res
    environment: { <<: *s3-env }
    depends_on:
      rustfs: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes: ["./rustfs/bootstrap.sh:/bootstrap.sh:ro"]

  # One-shot: pre-create the WAL topics (the broker does not auto-create on
  # produce — producing to a missing topic returns NOT_LEADER_OR_FOLLOWER) plus
  # the demo's order topics, so distributors can write and block-builders /
  # compactors can consume.
  topic-setup:
    image: mirror.gcr.io/apache/kafka:4.3.1
    <<: *setup-res
    restart: "no"
    depends_on:
      broker: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - >
        WAL_RETENTION_MS=${CRABKA_OBSERVABILITY_WAL_RETENTION_MS:-900000};
        WAL_SEGMENT_BYTES=${CRABKA_OBSERVABILITY_WAL_SEGMENT_BYTES:-67108864};
        for t in __crabka_metrics_wal __crabka_traces_wal __crabka_profiles_wal
        __crabka_observability_logs_wal orders order-counts; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:9092 --create
        --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
        --config retention.ms=$$WAL_RETENTION_MS
        --config segment.bytes=$$WAL_SEGMENT_BYTES || exit 1;
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server broker:9092 --alter
        --entity-type topics --entity-name "$$t"
        --add-config retention.ms=$$WAL_RETENTION_MS,segment.bytes=$$WAL_SEGMENT_BYTES || exit 1;
        done; echo "topics ready"

  schema-registry:
    <<: [*crabka-image, *registry-res]
    command: ["crabka-schema-registry", "--bootstrap-servers=broker:9092", "--listen-addr=0.0.0.0:8081", "--schemas-topic-rf=1"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: schema-registry
    depends_on:
      broker: { condition: service_healthy }
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # ---- METRICS (Prometheus/Mimir) ----
  metrics-distributor:
    # crabka-metrics uses --bootstrap (not --wal-bootstrap); the distributor
    # writes to the WAL (Kafka), not the object store, so no --object-store-url.
    <<: [*crabka-image, *distributor-res]
    command: ["crabka-metrics", "--target=distributor", "--listen=0.0.0.0:4041", "--bootstrap=broker:9092"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: metrics-distributor
    depends_on:
      broker: { condition: service_healthy }

  metrics-compactor:
    <<: [*crabka-image, *compactor-res]
    command: ["crabka-metrics", "--target=compactor", "--object-store-url=s3://crabka-metrics", "--bootstrap=broker:9092", "--compactor-retention=${CRABKA_METRICS_COMPACTOR_RETENTION:-1h}", "--compactor-retention-sweep-interval=${CRABKA_METRICS_COMPACTOR_RETENTION_SWEEP_INTERVAL:-30s}"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: metrics-compactor
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  metrics-querier:
    # crabka-metrics-service uses --wal-bootstrap (its own flag name).
    <<: [*crabka-image, *querier-res]
    command: ["crabka-metrics-service", "--target=querier", "--listen=0.0.0.0:9090", "--object-store-url=s3://crabka-metrics", "--manifest-prefix=metrics", "--wal-bootstrap=broker:9092", "--wal-head-retention=${CRABKA_METRICS_QUERIER_WAL_HEAD_RETENTION:-5m}"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: metrics-querier
    ports: ["9090:9090"]
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  # ---- TRACES (Tempo) ----
  traces-distributor:
    <<: [*crabka-image, *distributor-res]
    command: ["crabka-traces", "--target=distributor", "--bootstrap=broker:9092", "--listen=0.0.0.0:3200", "--grpc-listen=0.0.0.0:4317", "--otlp-http-listen=0.0.0.0:4318"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: traces-distributor
    depends_on:
      broker: { condition: service_healthy }

  traces-block-builder:
    <<: [*crabka-image, *compactor-res]
    mem_limit: ${CRABKA_TRACES_BLOCK_BUILDER_MEM:-4g}
    memswap_limit: ${CRABKA_TRACES_BLOCK_BUILDER_MEM:-4g}
    command: ["crabka-traces", "--target=block-builder", "--bootstrap=broker:9092", "--object-store-url=s3://crabka-traces", "--block-builder-flush-max-records=${CRABKA_TRACES_BLOCK_BUILDER_FLUSH_MAX_RECORDS:-50000}", "--block-builder-flush-max-age-ms=${CRABKA_TRACES_BLOCK_BUILDER_FLUSH_MAX_AGE_MS:-60000}"]
    environment:
      <<: [*s3-env, *otlp-env]
      CRABKA_TRACES_INDEX_SNAPSHOT_MAX: "${CRABKA_TRACES_INDEX_SNAPSHOT_MAX:-256MiB}"
      CRABKA_TRACES_INDEX_SNAPSHOT_RETAIN: "${CRABKA_TRACES_INDEX_SNAPSHOT_RETAIN:-8}"
      CRABKA_TRACES_WAL_FETCH_MAX: "${CRABKA_TRACES_WAL_FETCH_MAX:-2MiB}"
      CRABKA_TRACES_WAL_FETCH_PARTITION_MAX: "${CRABKA_TRACES_WAL_FETCH_PARTITION_MAX:-256KiB}"
      OTEL_SERVICE_NAME: traces-block-builder
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  traces-querier:
    <<: [*crabka-image, *querier-res]
    command: ["crabka-traces", "--target=querier", "--listen=0.0.0.0:3200", "--object-store-url=s3://crabka-traces"]
    environment:
      <<: [*s3-env, *otlp-env]
      CRABKA_TRACES_INDEX_SNAPSHOT_MAX: "${CRABKA_TRACES_INDEX_SNAPSHOT_MAX:-256MiB}"
      CRABKA_TRACES_BLOCK_READ_MAX: "${CRABKA_TRACES_BLOCK_READ_MAX:-1GiB}"
      CRABKA_TRACES_SCAN_CONCAT_MAX: "${CRABKA_TRACES_SCAN_CONCAT_MAX:-1.5GB}"
      OTEL_SERVICE_NAME: traces-querier
    ports: ["3200:3200"]
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }

  # ---- LOGS (Loki) — binary is `crabka-observability` (the logs service) ----
  logs-distributor:
    <<: [*crabka-image, *distributor-res]
    command: ["crabka-observability", "--target=distributor", "--listen-addr=0.0.0.0:3100", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://crabka-logs"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-distributor
    depends_on:
      broker: { condition: service_healthy }
      rustfs-setup: { condition: service_completed_successfully }

  logs-compactor:
    <<: [*crabka-image, *compactor-res]
    command: ["crabka-observability", "--target=compactor", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://crabka-logs", "--index-prefix=logs"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-compactor
    depends_on:
      broker: { condition: service_healthy }
      rustfs-setup: { condition: service_completed_successfully }

  logs-querier:
    # --wal-group-id MUST differ from the compactor's default
    # (`crabka-observability-compactor`): both subscribe() to the single-partition
    # logs WAL, so a shared group id makes them fight over the one partition and
    # the querier's consumer spins on REBALANCE_IN_PROGRESS(27). A distinct group
    # lets each independently tail the WAL.
    # --querier-index-source=tenant-object-store-shards reads the incremental
    # shard catalog the compactor writes to S3 (default `local-manifest` reads
    # the querier's empty local disk -> no labels/series). With no --tenant, the
    # tenant is resolved per-request from X-Scope-OrgID.
    <<: [*crabka-image, *querier-res]
    command: ["crabka-observability", "--target=querier", "--listen-addr=0.0.0.0:3100", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://crabka-logs", "--index-prefix=logs", "--querier-index-source=tenant-object-store-shards", "--wal-group-id=crabka-observability-querier"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-querier
    ports: ["3100:3100"]
    # The hot-tail WAL consumer (--wal-bootstrap-server) connects to the broker at
    # startup; without waiting for broker health it starts too early, the initial
    # consumer-group join fails, and the tail never recovers -> empty labels/streams
    # until the container is restarted. Wait for the broker like the compactor does.
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  # ---- PROFILES (Pyroscope) ----
  profiles-distributor:
    <<: [*crabka-image, *distributor-res]
    command: ["crabka-profiles", "--target=distributor", "--listen=0.0.0.0:4040", "--bootstrap=broker:9092"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: profiles-distributor
    depends_on:
      broker: { condition: service_healthy }

  profiles-block-builder:
    <<: [*crabka-image, *compactor-res]
    command: ["crabka-profiles", "--target=block-builder", "--bootstrap=broker:9092", "--object-store-url=s3://crabka-profiles", "--block-builder-flush-records=${CRABKA_PROFILES_BLOCK_BUILDER_FLUSH_RECORDS:-4096}", "--block-builder-flush-max-age-ms=${CRABKA_PROFILES_BLOCK_BUILDER_FLUSH_MAX_AGE_MS:-60000}"]
    environment:
      <<: [*s3-env, *otlp-env]
      CRABKA_PROFILES_INDEX_SNAPSHOT_MAX: "${CRABKA_PROFILES_INDEX_SNAPSHOT_MAX:-256MiB}"
      CRABKA_PROFILES_INDEX_SNAPSHOT_RETAIN: "${CRABKA_PROFILES_INDEX_SNAPSHOT_RETAIN:-8}"
      CRABKA_PROFILES_WAL_FETCH_MAX: "${CRABKA_PROFILES_WAL_FETCH_MAX:-2MiB}"
      CRABKA_PROFILES_WAL_FETCH_PARTITION_MAX: "${CRABKA_PROFILES_WAL_FETCH_PARTITION_MAX:-256KiB}"
      CRABKA_PROFILES_WAL_POLL_TIMEOUT: "${CRABKA_PROFILES_WAL_POLL_TIMEOUT:-500ms}"
      OTEL_SERVICE_NAME: profiles-block-builder
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  profiles-querier:
    # --bootstrap is REQUIRED: the querier's hot WAL-tail consumer reads recent
    # (not-yet-compacted) profiles straight from the WAL. Without it the tail
    # falls back to 127.0.0.1:9092, can't reach the broker, and dies -> the hot
    # store stays empty and the cold store only has whatever index existed at
    # startup, so the querier returns no profiles.
    <<: [*crabka-image, *querier-res]
    command: ["crabka-profiles", "--target=querier", "--listen=0.0.0.0:4040", "--object-store-url=s3://crabka-profiles", "--bootstrap=broker:9092"]
    environment:
      <<: [*s3-env, *otlp-env]
      CRABKA_PROFILES_INDEX_SNAPSHOT_MAX: "${CRABKA_PROFILES_INDEX_SNAPSHOT_MAX:-256MiB}"
      CRABKA_PROFILES_WAL_POLL_TIMEOUT: "${CRABKA_PROFILES_WAL_POLL_TIMEOUT:-500ms}"
      OTEL_SERVICE_NAME: profiles-querier
    ports: ["4040:4040"]
    # The hot WAL-tail consumer (--bootstrap) connects to the broker at startup;
    # without waiting for broker health it starts too early, the initial join fails,
    # and the hot store stays empty -> profiles (especially sparse ones like memory)
    # return nothing until the container is restarted. Wait for the broker.
    depends_on:
      rustfs-setup: { condition: service_completed_successfully }
      broker: { condition: service_healthy }

  # ---- COLLECTOR + GRAFANA ----
  alloy:
    image: mirror.gcr.io/grafana/alloy:v1.18.0
    <<: *alloy-res
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports: ["12345:12345"]
    depends_on:
      broker: { condition: service_healthy }

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    <<: *cadvisor-res
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=app,cpuLoad,disk,oom_event,percpu,perf_event,pressure"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  grafana:
    image: mirror.gcr.io/grafana/grafana:13.1
    <<: *grafana-res
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: "flameGraph traceqlEditor"
      GF_PLUGINS_PREINSTALL_SYNC: "grafana-lokiexplore-app@2.1.5,grafana-pyroscope-app@2.0.7,grafana-exploretraces-app@2.0.4,grafana-metricsdrilldown-app@2.1.0"
      GF_PLUGINS_DISABLE_PLUGINS: "elasticsearch"
    ports: ["3000:3000"]
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    depends_on:
      - metrics-querier
      - traces-querier
      - logs-querier
      - profiles-querier

  # ---- DEMO APP ----
  demo-produce:
    <<: [*crabka-image, *demo-res]
    command: ["observability-demo-app", "--role=produce"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: demo-produce
      CRABKA_DEMO_BOOTSTRAP: broker:9092
      CRABKA_DEMO_REGISTRY: http://schema-registry:8081
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
      CRABKA_DEMO_ORDERS_PER_SEC: "${CRABKA_DEMO_ORDERS_PER_SEC:-50}"
    depends_on:
      topic-setup: { condition: service_completed_successfully }
      schema-registry: { condition: service_healthy }

  demo-stream:
    <<: [*crabka-image, *demo-res]
    command: ["observability-demo-app", "--role=stream"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: demo-stream
      CRABKA_DEMO_STREAMS_BROKER_DNS_TIMEOUT: "${CRABKA_DEMO_STREAMS_BROKER_DNS_TIMEOUT:-10s}"
      CRABKA_DEMO_STREAMS_POLL_INTERVAL: "${CRABKA_DEMO_STREAMS_POLL_INTERVAL:-200ms}"
      CRABKA_DEMO_STREAMS_COMMIT_INTERVAL: "${CRABKA_DEMO_STREAMS_COMMIT_INTERVAL:-5s}"
      CRABKA_DEMO_STREAMS_REBALANCE_TIMEOUT: "${CRABKA_DEMO_STREAMS_REBALANCE_TIMEOUT:-30s}"
      CRABKA_DEMO_STREAMS_LEAVE_HEARTBEAT_TIMEOUT: "${CRABKA_DEMO_STREAMS_LEAVE_HEARTBEAT_TIMEOUT:-5s}"
      CRABKA_DEMO_STREAMS_JOIN_RETRY_BACKOFF: "${CRABKA_DEMO_STREAMS_JOIN_RETRY_BACKOFF:-200ms}"
      CRABKA_DEMO_STREAMS_INTERACTIVE_QUERY_QUEUE_CAPACITY: "${CRABKA_DEMO_STREAMS_INTERACTIVE_QUERY_QUEUE_CAPACITY:-64}"
      CRABKA_DEMO_STREAMS_STATE_STORE_CACHE_MAX: "${CRABKA_DEMO_STREAMS_STATE_STORE_CACHE_MAX:-10MiB}"
      CRABKA_DEMO_BOOTSTRAP: broker:9092
      CRABKA_DEMO_REGISTRY: http://schema-registry:8081
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
    depends_on:
      topic-setup: { condition: service_completed_successfully }
      schema-registry: { condition: service_healthy }

  demo-consume:
    <<: [*crabka-image, *demo-res]
    command: ["observability-demo-app", "--role=consume"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: demo-consume
      CRABKA_DEMO_BOOTSTRAP: broker:9092
      CRABKA_DEMO_REGISTRY: http://schema-registry:8081
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${CRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
      CRABKA_DEMO_CONSUMER_LEAVE_GROUP_TIMEOUT: "${CRABKA_DEMO_CONSUMER_LEAVE_GROUP_TIMEOUT:-5s}"
      CRABKA_DEMO_CONSUMER_SUBSCRIPTION_METADATA_REFRESH_INTERVAL: "${CRABKA_DEMO_CONSUMER_SUBSCRIPTION_METADATA_REFRESH_INTERVAL:-5s}"
      CRABKA_DEMO_CONSUMER_STARTUP_ATTEMPT_TIMEOUT: "${CRABKA_DEMO_CONSUMER_STARTUP_ATTEMPT_TIMEOUT:-90s}"
      CRABKA_DEMO_CONSUMER_STARTUP_DEADLINE: "${CRABKA_DEMO_CONSUMER_STARTUP_DEADLINE:-5m}"
      CRABKA_DEMO_CONSUMER_STARTUP_INITIAL_BACKOFF: "${CRABKA_DEMO_CONSUMER_STARTUP_INITIAL_BACKOFF:-500ms}"
      CRABKA_DEMO_CONSUMER_STARTUP_MAX_BACKOFF: "${CRABKA_DEMO_CONSUMER_STARTUP_MAX_BACKOFF:-5s}"
      CRABKA_DEMO_CONSUMER_COORDINATOR_RETRY_TIMEOUT: "${CRABKA_DEMO_CONSUMER_COORDINATOR_RETRY_TIMEOUT:-30s}"
      CRABKA_DEMO_CONSUMER_COORDINATOR_INITIAL_BACKOFF: "${CRABKA_DEMO_CONSUMER_COORDINATOR_INITIAL_BACKOFF:-100ms}"
      CRABKA_DEMO_CONSUMER_COORDINATOR_MAX_BACKOFF: "${CRABKA_DEMO_CONSUMER_COORDINATOR_MAX_BACKOFF:-1s}"
      CRABKA_DEMO_CONSUMER_FETCH_MIN: "${CRABKA_DEMO_CONSUMER_FETCH_MIN:-1B}"
      CRABKA_DEMO_CONSUMER_FETCH_MAX: "${CRABKA_DEMO_CONSUMER_FETCH_MAX:-50MiB}"
      CRABKA_DEMO_CONSUMER_FETCH_PARTITION_MAX: "${CRABKA_DEMO_CONSUMER_FETCH_PARTITION_MAX:-1MiB}"
      CRABKA_DEMO_CONSUMER_SESSION_TIMEOUT: "${CRABKA_DEMO_CONSUMER_SESSION_TIMEOUT:-45s}"
      CRABKA_DEMO_CONSUMER_REBALANCE_TIMEOUT: "${CRABKA_DEMO_CONSUMER_REBALANCE_TIMEOUT:-1m}"
      CRABKA_DEMO_CONSUMER_HEARTBEAT_INTERVAL: "${CRABKA_DEMO_CONSUMER_HEARTBEAT_INTERVAL:-3s}"
      CRABKA_DEMO_CONSUMER_REQUEST_TIMEOUT: "${CRABKA_DEMO_CONSUMER_REQUEST_TIMEOUT:-30s}"
      CRABKA_DEMO_CONSUMER_AUTO_OFFSET_RESET: "${CRABKA_DEMO_CONSUMER_AUTO_OFFSET_RESET:-latest}"
      CRABKA_DEMO_CONSUMER_ISOLATION_LEVEL: "${CRABKA_DEMO_CONSUMER_ISOLATION_LEVEL:-read-uncommitted}"
      CRABKA_DEMO_CONSUMER_ASSIGNOR: "${CRABKA_DEMO_CONSUMER_ASSIGNOR:-range}"
    depends_on:
      topic-setup: { condition: service_completed_successfully }
      # The traced consumer now deserialises Order via the registry (to enrich
      # its processing spans), so it must wait for schema-registry like the
      # producer/stream roles do.
      schema-registry: { condition: service_healthy }

volumes:
  broker-data:
  rustfs-data:
