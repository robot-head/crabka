# Same record shape as fixed-rate-latency, but ack mode is `all` across
# the producer fleet. Pair with separate scenario YAMLs at ack=none and
# ack=leader if you want a three-way fleet — the report aggregates by
# scenario name, so use distinct names.
name: mixed-acks-all
mode_tag: cluster
msg_size: 1KiB
partitions: 6
replication_factor: 1
producers: 2
consumers: 1
mode:
  kind: fixed_rate
  rate: 20000/s
acks: all
compression: none
linger: 5ms
batch_size: 16KiB
warmup: 15s
duration: 120s
