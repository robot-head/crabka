# Kill the first broker pod 60 s into the run. Driver records:
#   - kill_at_ms (wallclock of the kubectl-equivalent delete)
#   - recovery_at_ms (first successful Ok ack post-kill)
#   - dropped (records whose ack-receiver returned Err)
#   - latency_spike_max_ms (max latency sample during the disturbance)
# Auto-skipped at runtime if replication_factor < 3 or broker_count < 3.
name: failover
mode_tag: cluster
msg_size_bytes: 1024
partitions: 12
replication_factor: 3
producers: 2
consumers: 1
mode:
  kind: fixed_rate
  msgs_per_sec: 10000
acks: all
compression: none
linger_ms: 5
batch_size: 16384
warmup_s: 30
duration_s: 180
failover:
  kill_at_s: 60
  target: partition0_leader
