# Fixed-rate latency at 100 partitions, RF=3, acks=all. Pace producers
# below saturation so the percentiles aren't dominated by coordinated
# omission, then measure p99 producer-ack + consumer end-to-end latency
# while every record waits on replication across the 6-broker cluster.
name: high-partition-latency
mode_tag: cluster
msg_size: 1KiB
partitions: 100
replication_factor: 3
producers: 2
consumers: 2
mode:
  kind: fixed_rate
  rate: 20000/s
acks: all
compression: none
linger: 5ms
batch_size: 16KiB
warmup: 15s
duration: 120s
