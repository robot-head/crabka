# 30-minute soak at 80 % of small-msg-saturate's measured rate. Catches
# slow leaks (RSS growth, file-descriptor exhaustion, accumulator
# pathologies). Cluster mode only — too slow for CI.
name: endurance
mode_tag: cluster
msg_size_bytes: 1024
partitions: 24
replication_factor: 1
producers: 4
consumers: 4
mode:
  kind: fixed_rate
  msgs_per_sec: 400000
acks: leader
compression: lz4
linger_ms: 5
batch_size: 65536
warmup_s: 60
duration_s: 1800
