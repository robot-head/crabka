---
# JMX prometheus exporter rule set referenced by Kafka.spec.kafka.metricsConfig.
#
# Strimzi 0.46 bundles the *new* Prometheus Java client (1.x,
# `io.prometheus.metrics.*`) whose agent already registers built-in JVM
# collectors (`jvm_memory_used_bytes`, `jvm_threads_current`, `jvm_gc_*`, …).
# The previous hand-written rules re-declared `jvm_threads_current` (and a
# malformed `jvm_memory_bytes_$3`), which collided with the built-ins:
#
#   java.lang.IllegalStateException: jvm_threads_current: duplicate metric name
#
# That exception aborts the *entire* /metrics scrape (HTTP 500 → `up=0`), so
# Prometheus collected NO data for the Strimzi brokers at all. We therefore
# drop the custom JVM rules and let the built-in collectors provide the heap /
# non-heap breakdown (`jvm_memory_used_bytes{area="heap"|"nonheap"}`). Only a
# Kafka-specific MBean rule remains, kept as a cross-check on the driver's own
# byte counters — it cannot collide with a built-in name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: strimzi-kafka-jmx-exporter
  namespace: default
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec), topic=(.+)><>OneMinuteRate"
        name: kafka_server_brokertopicmetrics_$1_one_minute_rate
        type: GAUGE
        labels:
          topic: "$2"
