---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-driver
  namespace: default
---
# Only required for the `failover` scenario. CI scenarios run with a
# no-RBAC ServiceAccount so they can't accidentally delete pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bench-driver-failover
  namespace: default
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bench-driver-failover
  namespace: default
subjects:
  - kind: ServiceAccount
    name: bench-driver
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bench-driver-failover
