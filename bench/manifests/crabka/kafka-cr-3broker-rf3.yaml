---
apiVersion: crabka.io/v1alpha1
kind: Kafka
metadata:
  name: demo
  namespace: default
spec:
  kafkaVersion: "3.7.0"
  config:
    log.retention.hours: "24"
    default.replication.factor: "3"
    min.insync.replicas: "2"
  metricsConfig:
    podMonitor:
      interval: 15s
---
apiVersion: crabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: broker-0
  namespace: default
  labels:
    crabka.io/cluster: demo
spec:
  roles: [Controller, Broker]
  replicas: 1
  nodeIdStart: 0
  storage:
    type: PersistentClaim
    size: 20Gi
    deleteClaim: true
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "4"
      memory: 12Gi
  template:
    nodeSelector:
      cloud.google.com/gke-nodepool: beefy-pool
    metadata:
      labels:
        bench-pool: beefy
---
apiVersion: crabka.io/v1alpha1
