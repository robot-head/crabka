---
apiVersion: crabka.io/v1alpha1
kind: Kafka
metadata:
  name: demo
  namespace: default
spec:
  kafkaVersion: "3.7.0"
  config:
    log.retention.hours: "24"
    default.replication.factor: "3"
    min.insync.replicas: "2"
  metricsConfig:
    podMonitor:
      interval: 15s
---
apiVersion: crabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: broker-0
  namespace: default
  labels:
    crabka.io/cluster: demo
spec:
  roles: [Controller, Broker]
  replicas: 1
  nodeIdStart: 0
  storage:
    type: PersistentClaim
    class: premium-rwo
    size: 200Gi
    deleteClaim: true
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "4"
      memory: 12Gi
  template:
    nodeSelector:
      cloud.google.com/gke-nodepool: beefy-pool
    # Spread brokers across distinct nodes so replication + failover cross the
    # network and the brokers don't contend for one node's CPU/disk. 3 brokers
    # over the 3-node beefy-pool → exactly one per node.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: crabka-broker
              app.kubernetes.io/instance: demo
          topologyKey: kubernetes.io/hostname
    metadata:
      labels:
        bench-pool: beefy
