syntax = "proto3";
package crabka.gateway.v1;

service Gateway {
  rpc Send(SendRequest) returns (SendResponse);
  rpc SendStream(stream SendRequest) returns (stream SendAck);
  rpc Subscribe(stream SubscribeFrame) returns (stream Inbound);
}

enum Acks {
  ACKS_ALL = 0;
  ACKS_LEADER = 1;
  ACKS_NONE = 2;
}

message Record {
  string topic = 1;
  optional bytes key = 2;
  bytes value = 3;
  map<string, bytes> headers = 4;
  optional int32 partition = 5;
  optional int64 timestamp_ms = 6;
  optional string idempotency_key = 7;
}

message SendRequest {
  repeated Record records = 1;
  Acks acks = 2;
}

message ErrorInfo {
  int32 code = 1;
  string message = 2;
  bool retriable = 3;
}

message RecordResult {
  int32 partition = 1;
  int64 offset = 2;
  bool deduplicated = 3;
  optional ErrorInfo error = 4;
}

message SendResponse {
  repeated RecordResult results = 1;
}

message SendAck {
  repeated RecordResult results = 1;
}

message SubscribeStart {
  string group_id = 1;
  repeated string topics = 2;
  bool auto_commit = 3;
}

// An Ack triggers a commit of the consumer's current consumed positions. The
// topic/partition/offset fields are advisory in the current implementation
// (per-offset commit is a follow-up).
message SubscribeAck {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
}

message SubscribeFrame {
  oneof frame {
    SubscribeStart start = 1;
    SubscribeAck ack = 2;
  }
}

message Inbound {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  optional bytes key = 4;
  bytes value = 5;
  map<string, bytes> headers = 6;
  int64 timestamp_ms = 7;
}
