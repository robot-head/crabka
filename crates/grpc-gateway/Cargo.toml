[package]
name = "crabka-grpc-gateway"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "gRPC / Connect-RPC + HTTP gateway into Crabka (Kafka) topics"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-grpc-gateway"
readme = "README.md"
keywords = ["kafka", "grpc", "connectrpc", "gateway", "crabka"]
categories = ["web-programming::http-server", "network-programming"]

[lints]
workspace = true

[[bin]]
name = "crabka-grpc-gateway"
path = "src/bin/gateway.rs"

[dependencies]
assert2 = { workspace = true }
crabka-authz = { version = "0.4.0", path = "../authz" }
crabka-ids = { version = "0.4.1", path = "../ids" }
crabka-telemetry = { version = "0.4.0", path = "../telemetry" }
crabka-client-producer = { version = "0.4.1", path = "../client-producer" }
crabka-client-consumer = { version = "0.4.1", path = "../client-consumer" }
crabka-client-admin = { version = "0.4.1", path = "../client-admin" }
crabka-client-streams = { version = "0.4.1", path = "../client-streams", optional = true, features = ["arrow"] }
crabka-metadata = { version = "0.4.1", path = "../metadata" }
crabka-units = { workspace = true }
arc-swap = { workspace = true }
prometheus-client = { workspace = true }
connectrpc-axum.workspace = true
prost.workspace = true
pbjson.workspace = true
axum.workspace = true
bytes.workspace = true
dashmap.workspace = true
# `Display`/`From`/`Into` derives for the crate's record-coordinate newtypes
# (see `src/ids.rs`).
derive_more = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env", "derive"] }
anyhow.workspace = true
thiserror.workspace = true
async-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
crabka-security = { version = "0.4.1", path = "../security" }
crabka-client-core = { version = "0.4.1", path = "../client-core" }
refined_type.workspace = true
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { workspace = true, features = ["util"] }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
jsonpath-rust = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# Schema Registry codec deps
apache-avro = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
protox-parse = "0.9"
url = "2"
jsonschema = { version = "0.49", default-features = false }
arrow = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }

[features]
default = ["arrow"]
arrow = ["dep:arrow", "dep:crabka-client-streams", "dep:datafusion"]

[build-dependencies]
connectrpc-axum-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
crabka-broker = { version = "0.4.0", path = "../broker", features = ["test-helpers"] }
temp-env = "0.3"
# Raw Fetch + v2 RecordBatch decode in tests/outbound.rs to read the DLQ
# record's `x-crabka-dlq-source` header (the group Consumer drops headers).
crabka-client-core = { version = "0.4", path = "../client-core" }
crabka-protocol = { version = "0.4", path = "../protocol" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# `UnboundedReceiverStream` to drive the Subscribe control stream in tests/streaming.rs.
tokio-stream = { workspace = true }
# `ServiceExt::oneshot` to drive the health router in tests/wire.rs.
tower = { workspace = true, features = ["util"] }
# `CancellationToken` to drive run_ownership in tests/integration_dedup.rs.
tokio-util = { workspace = true }
