[package]
name = "crabka-grpc-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.95.0"
description = "gRPC / Connect-RPC + HTTP gateway into Crabka (Kafka) topics"

[lints]
workspace = true

[[bin]]
name = "crabka-grpc-gateway"
path = "src/bin/gateway.rs"

[dependencies]
crabka-authz = { version = "0.2", path = "../authz" }
crabka-client-producer = { version = "0.2", path = "../client-producer" }
crabka-client-consumer = { version = "0.2", path = "../client-consumer" }
crabka-client-admin = { version = "0.2", path = "../client-admin" }
crabka-metadata = { version = "0.2", path = "../metadata" }
arc-swap = { workspace = true }
connectrpc-axum.workspace = true
prost.workspace = true
pbjson.workspace = true
axum.workspace = true
bytes.workspace = true
dashmap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env", "derive"] }
anyhow.workspace = true
thiserror.workspace = true
async-stream = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
crabka-security = { version = "0.2", path = "../security" }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
jsonpath-rust = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[build-dependencies]
connectrpc-axum-build = { workspace = true, features = ["fetch-protoc"] }

[dev-dependencies]
assert2 = { workspace = true }
crabka-broker = { version = "0.2", path = "../broker", features = ["test-helpers"] }
# Raw Fetch + v2 RecordBatch decode in tests/outbound.rs to read the DLQ
# record's `x-crabka-dlq-source` header (the group Consumer drops headers).
crabka-client-core = { version = "0.2", path = "../client-core" }
crabka-protocol = { version = "0.2", path = "../protocol" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# `UnboundedReceiverStream` to drive the Subscribe control stream in tests/streaming.rs.
tokio-stream = { workspace = true }
# `ServiceExt::oneshot` to drive the health router in tests/wire.rs.
tower = { workspace = true, features = ["util"] }
# `CancellationToken` to drive run_ownership in tests/integration_dedup.rs.
tokio-util = { workspace = true }
