[package]
name = "crabka-metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.95.0"
description = "Versioned metadata record types + immutable image for Crabka"

[lints]
workspace = true

[dependencies]
wincode = { workspace = true }
serde-wincode = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
crabka-protocol = { version = "0.1", path = "../protocol", default-features = false }
thiserror = { workspace = true }
uuid = { workspace = true }
crabka-security = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { version = "4.6.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "image"
harness = false
