[package]
name = "crabka-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.95.0"
description = "Connection management and request dispatch for Apache Kafka in Rust"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-client-core"
readme = "../../README.md"
keywords = ["kafka", "client", "protocol", "crabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[features]
default = []
mock = []
sspi-keytab = ["crabka-security/sspi-keytab"]

[dependencies]
crabka-protocol = { version = "0.3", path = "../protocol", default-features = false }
crabka-security = { version = "0.3", path = "../security" }
bon = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
dashmap = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { workspace = true }

[[test]]
name = "unit"
required-features = ["mock"]

[[test]]
name = "integration"
