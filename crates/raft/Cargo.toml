[package]
name = "crabka-raft"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Metadata KRaft quorum (KIP-595 KraftController) for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-raft"
readme = "README.md"
keywords = ["kafka", "raft", "kraft", "consensus", "crabka"]
categories = ["algorithms", "database-implementations"]

[lints]
workspace = true

[features]
# Promotes the deterministic KRaft consensus simulator into the library with
# trace recording, so `crabka-docgen` can run it in-process and render failure
# scenarios. Off by default — it carries no production code path. Re-exported
# from the leaf core crate as `crabka_raft::scenarios`.
scenarios = ["crabka-kraft-core/sim"]

[dependencies]
assert2 = { workspace = true }
crabka-kraft-core = { version = "0.4.0", path = "../kraft-core" }
crabka-ids = { version = "0.4.1", path = "../ids" }
crabka-metadata = { version = "0.4.1", path = "../metadata" }
crabka-log = { version = "0.4.1", path = "../log" }
crabka-protocol = { version = "0.4.1", path = "../protocol", default-features = false }
crabka-verified = { version = "0.4.1", path = "../verified" }
crabka-client-core = { version = "0.4.1", path = "../client-core" }
crabka-units = { workspace = true }
refined_type = { workspace = true }
async-trait = { workspace = true }
wincode = { workspace = true }
serde-wincode = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
crabka-security = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
mutants = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
