[package]
name = "crabka-remote-storage-topic"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Topic-backed RemoteLogMetadataManager for Crabka tiered storage"

[lints]
workspace = true

[dependencies]
crabka-remote-storage = { version = "0.3", path = "../remote-storage" }
crabka-client-admin = { version = "0.3", path = "../client-admin" }
crabka-client-core = { version = "0.3", path = "../client-core" }
crabka-client-producer = { version = "0.3", path = "../client-producer" }
crabka-protocol = { version = "0.3", path = "../protocol" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-security = { version = "0.3", path = "../security" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
