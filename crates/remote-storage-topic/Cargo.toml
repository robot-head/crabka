[package]
name = "crabka-remote-storage-topic"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Topic-backed RemoteLogMetadataManager for Crabka tiered storage"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-remote-storage-topic"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "metadata", "crabka"]
categories = ["database-implementations", "encoding"]

[lints]
workspace = true

[dependencies]
crabka-remote-storage = { version = "0.3.8", path = "../remote-storage" }
crabka-client-admin = { version = "0.3.9", path = "../client-admin" }
crabka-client-core = { version = "0.3.9", path = "../client-core" }
crabka-client-producer = { version = "0.3.9", path = "../client-producer" }
crabka-protocol = { version = "0.3.9", path = "../protocol" }
crabka-ids = { version = "0.3.8", path = "../ids" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
assert2 = { workspace = true }
crabka-security = { version = "0.3", path = "../security" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
