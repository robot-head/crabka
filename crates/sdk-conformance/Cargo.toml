[package]
name = "crabka-sdk-conformance"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "JSON-stdio conformance harness for Crabka application SDKs"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-sdk-conformance"
readme = "README.md"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crabka-authz = { version = "0.3.8", path = "../authz" }
crabka-broker = { version = "0.3", path = "../broker", features = ["test-helpers"] }
crabka-client-admin = { version = "0.3", path = "../client-admin" }
crabka-grpc-gateway = { version = "0.3", path = "../grpc-gateway" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
