[package]
name = "crabka-page-store"
publish = false # Internal PG page-store scaffold; keep out of the publish allowlist.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Versioned PostgreSQL page layer-store scaffold for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-page-store"
keywords = ["postgres", "pages", "wal", "crabka"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
crabka-object-store = { path = "../object-store", version = "0.3.9" }
crabka-postgres-wal = { path = "../postgres-wal", version = "0.3.9" }
crc32c = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt"] }

[dev-dependencies]
assert2 = { workspace = true }
toml = { workspace = true }
