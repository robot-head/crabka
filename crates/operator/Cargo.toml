[package]
name = "crabka-operator"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Kubernetes operator for Crabka clusters"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-operator"
readme = "README.md"
keywords = ["kafka", "kubernetes", "operator", "crabka"]
categories = ["config", "network-programming"]

[[bin]]
name = "crabka-operator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["env"] }
crabka-client-admin = { version = "0.3.9", path = "../client-admin" }
crabka-client-core = { version = "0.3", path = "../client-core" }
crabka-client-producer = { version = "0.3.9", path = "../client-producer" }
crabka-broker = { version = "0.3", path = "../broker" }
crabka-compression = { version = "0.3.9", path = "../compression" }
crabka-gres-control = { version = "0.3.9", path = "../gres-control" }
crabka-gres-ranges = { version = "0.3.9", path = "../gres-ranges" }
crabka-gres-substrate = { version = "0.3.9", path = "../gres-substrate" }
crabka-kraft-core = { version = "0.3.8", path = "../kraft-core" }
crabka-logfmt = { version = "0.3.8", path = "../logfmt" }
crabka-metadata = { version = "0.3.8", path = "../metadata" }
crabka-object-store = { version = "0.3.8", path = "../object-store" }
crabka-schema-serde = { version = "0.3.9", path = "../schema-serde" }
crabka-security = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
futures = { workspace = true }
jsonpath-rust = { workspace = true }
ring = { workspace = true }
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true }
prometheus-client = { workspace = true }
object_store = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
refined_type = { workspace = true }
rustls = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
hex = { workspace = true }
strum = { workspace = true }
time = { version = "0.3", default-features = false, features = ["macros", "parsing", "formatting"] }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-postgres = { workspace = true }
native-tls = { workspace = true }
postgres-native-tls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
assert2 = { workspace = true }
# Path-only (no version): keeps this dev-dependency out of the published
# manifest so `cargo publish`/release-plz never resolve it against crates.io.
# crabka-rebalancer publishes a release behind the rest of the workspace, so a
# version pin here aborts the whole release run (see #455). Do not let
# `cargo set-version` re-add a version — dev-deps need none.
crabka-rebalancer = { path = "../rebalancer" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
tempfile = { workspace = true }
