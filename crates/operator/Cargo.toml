[package]
name = "crabka-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Kubernetes operator for Crabka clusters"

[[bin]]
name = "crabka-operator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["env"] }
crabka-client-admin = { version = "0.1", path = "../client-admin" }
crabka-security = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
ring = { workspace = true }
k8s-openapi = { workspace = true, features = ["schemars"] }
kube = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
strum = { workspace = true }
time = { version = "0.3", default-features = false, features = ["macros", "parsing", "formatting"] }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
crabka-broker = { version = "0.1", path = "../broker" }
crabka-client-core = { version = "0.1", path = "../client-core" }
crabka-rebalancer = { version = "0.1", path = "../rebalancer" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
tempfile = { workspace = true }
