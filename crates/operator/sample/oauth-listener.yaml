# Slice 50 sample — OAUTHBEARER listener + tls-external KafkaUser.
# Replace the keycloak.example URLs below with your IdP's real
# issuer + JWKS endpoint before applying.
---
apiVersion: crabka.io/v1alpha1
kind: Kafka
metadata:
  name: demo
  namespace: default
spec:
  kafkaVersion: "0.1.1"
  listeners:
    - name: PLAIN
      port: 9092
      type: internal
      tls: false
    - name: oauth
      port: 9096
      type: internal
      tls: true
      authentication:
        type: oauth
        validIssuerUri: https://keycloak.example/realms/kafka
        jwksEndpointUri: https://keycloak.example/realms/kafka/protocol/openid-connect/certs
        validAudience: kafka-broker
        userNameClaim: preferred_username
        # JsonPath (RFC 9535) evaluated by the broker on every token. The
        # token JSON is the document; the example below requires the
        # `scope` array to contain the string `kafka.write`.
        customClaimCheck: "$.scope[?@ == 'kafka.write']"
        # Optional: enforce the JWT `typ` header (slice 49g). JWT-mode
        # only; rejected on introspection-mode listeners.
        # validTokenType: JWT
        # Optional: cap SASL session lifetime tighter than the token's natural `exp`
        # (KIP-368 re-auth ceiling, slice 50d). Forces clients to refresh more
        # often than their token would otherwise require. Unset = session lasts
        # until token exp.
        # maxSecondsWithoutReauthentication: 300
        # Slice 49h: fallback principal claim — used when userNameClaim
        # is absent or empty on the token. Pair with fallbackUserNamePrefix
        # to namespace service-account principals so ACLs can distinguish
        # them (Strimzi convention).
        # fallbackUserNameClaim: client_id
        # fallbackUserNamePrefix: "service-account-"
        #
        # Slice 49h: groups extraction — JsonPath (RFC 9535) against the
        # token's claim set. Attached to the Kafka principal; no
        # broker-side authorizer reads this yet (slice 53/54 will).
        # groupsClaim: "$.realm_access.roles[*]"
        # groupsClaimDelimiter: ","
        tlsTrustedCertificates:
          # Replace `keycloak-ca` with a Secret in the same namespace as
          # the Kafka CR; `certificate` is the key within that Secret
          # whose value is a PEM bundle of CA certs.
          - secretName: keycloak-ca
            certificate: tls.crt
    # Alternative: introspection mode (slice 50c). REPLACES the JWT-mode
    # `oauth` listener above — do NOT uncomment alongside the JWT-mode
    # block, since two OAuth listeners with divergent
    # `accessTokenIsJwt`/`jwksEndpointUri`/`introspectionEndpointUri`
    # configurations are rejected as `ConflictingOAuthListenerConfig`.
    #
    # The broker calls Keycloak's introspection endpoint for each
    # token instead of validating a signed JWT against JWKS. Set
    # `accessTokenIsJwt: false` and provide an introspectionEndpointUri,
    # clientId, and clientSecret Secret reference.
    #
    # - name: oauth-introspection
    #   port: 9098
    #   type: internal
    #   tls: true
    #   authentication:
    #     type: oauth
    #     accessTokenIsJwt: false
    #     validIssuerUri: https://keycloak.example/realms/kafka
    #     introspectionEndpointUri: https://keycloak.example/realms/kafka/protocol/openid-connect/token/introspect
    #     userInfoEndpointUri: https://keycloak.example/realms/kafka/protocol/openid-connect/userinfo
    #     validAudience: kafka-broker
    #     userNameClaim: preferred_username
    #     customClaimCheck: "$.scope[?@ == 'kafka.write']"
    #     # validTokenType is JWT-mode only — leave it OUT here.
    #     clientId: kafka-broker
    #     clientSecret:
    #       secretName: keycloak-introspection-secret
    #       key: secret
  interBrokerListenerName: PLAIN
---
apiVersion: crabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: default
  labels:
    crabka.io/cluster: demo
spec:
  roles: [Controller, Broker]
  replicas: 1
  nodeIdStart: 0
  storage:
    type: PersistentClaim
    size: 1Gi
    deleteClaim: true
---
apiVersion: crabka.io/v1alpha1
kind: KafkaUser
metadata:
  name: alice
  namespace: default
  labels:
    crabka.io/cluster: demo
spec:
  authentication:
    type: tls-external
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: e2e
        operations: [Read, Describe, Write]
