[package]
name = "crabka-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
# Depends on the git-pinned `datafusion` (no crates.io release), so this crate
# cannot be published to crates.io; matches crabka-blockstore / crabka-profiles.
publish = false
description = "Role-selectable observability service for Crabka's Loki-compatible logs path"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-observability"
readme = "../../README.md"
keywords = ["observability", "loki", "logs", "crabka"]
categories = ["command-line-utilities"]

[features]
heap-profiling = ["crabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["http2", "json", "query", "ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
crabka-blockstore = { version = "0.4.0", path = "../blockstore" }
crabka-client-admin = { version = "0.4.1", path = "../client-admin" }
crabka-client-core = { version = "0.4.1", path = "../client-core" }
crabka-client-consumer = { version = "0.4.1", path = "../client-consumer" }
crabka-client-producer = { version = "0.4.1", path = "../client-producer" }
crabka-ids = { version = "0.4.1", path = "../ids" }
crabka-logql = { version = "0.4.0", path = "../logql" }
crabka-telemetry = { version = "0.4.0", path = "../telemetry" }
crabka-units = { workspace = true }
datafusion.workspace = true
flate2 = { workspace = true }
futures-util = { workspace = true }
object_store.workspace = true
num-traits = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "logs"] }
parquet.workspace = true
prometheus-client.workspace = true
prost.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tracing = { workspace = true }
snap.workspace = true
thiserror = { workspace = true }
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
tonic.workspace = true
url = "2"

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
assert2 = { workspace = true }
flate2 = { workspace = true }
mutants = { workspace = true }
temp-env = "0.3"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
