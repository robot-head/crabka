[package]
name = "crabka-verified"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# The Creusot proof toolchain (see .creusot-version) ships a rustc that trails
# the workspace pin, and `cargo creusot --replay` refuses to build a package
# whose `rust-version` is newer than it. This crate is verified there, so its
# MSRV is pinned to what that toolchain provides rather than inherited.
rust-version = "1.97.0"
description = "Formally verified pure kernels (Creusot) shared by Crabka's consensus and log crates"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-verified"
keywords = ["kafka", "verification", "creusot", "crabka"]
categories = ["algorithms"]

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
creusot-std = "0.12.0"

[dev-dependencies]
proptest = { workspace = true }
