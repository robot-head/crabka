[package]
name = "crabka-promql"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "PromQL engine for Crabka's Prometheus/Mimir-equivalent metrics backend"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-promql"
readme = "README.md"
keywords = ["observability", "prometheus", "promql", "datafusion", "crabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
default = []
experimental-functions = []

[dependencies]
crabka-blockstore = { path = "../blockstore", version = "0.3.7" }
crabka-metrics = { path = "../metrics", version = "0.3.7" }
arrow = { workspace = true }
datafusion = { workspace = true }
promql-parser = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
object_store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
url = { workspace = true }
prost = { workspace = true }
snap = { workspace = true }
time = { version = "0.3", default-features = false, features = ["parsing", "formatting"] }

[dev-dependencies]
assert2 = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
proptest = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
