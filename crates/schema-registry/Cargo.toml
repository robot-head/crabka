[package]
name = "crabka-schema-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Confluent Schema Registry-compatible REST service for Crabka (binary: crabka-schema-registry)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-schema-registry"
readme = "README.md"
keywords = ["kafka", "schema", "registry", "avro", "crabka"]
categories = ["web-programming::http-server", "encoding"]

[lints]
workspace = true

[[bin]]
name = "crabka-schema-registry"
path = "src/bin/schema-registry.rs"

[dependencies]
crabka-client-core = { version = "0.3.2", path = "../client-core" }
crabka-client-admin = { version = "0.3.2", path = "../client-admin" }
crabka-client-producer = { version = "0.3.2", path = "../client-producer" }
crabka-protocol = { version = "0.3.2", path = "../protocol", default-features = false }
crabka-security = { version = "0.3.2", path = "../security" }
crabka-authz = { version = "0.3.2", path = "../authz" }
crabka-metadata = { version = "0.3.2", path = "../metadata" }
arc-swap = { workspace = true }
base64 = { workspace = true }
bcrypt = "0.19"
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
bytes.workspace = true
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["env", "derive"] }
uuid = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = "2"
apache-avro = { workspace = true }
protox-parse = "0.9"
prost-reflect = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
assert2 = { workspace = true }
ring = { workspace = true }
crabka-broker = { version = "0.3.2", path = "../broker", features = ["test-helpers"] }
crabka-client-consumer = { version = "0.3.2", path = "../client-consumer" }
tempfile.workspace = true
testcontainers.workspace = true
testcontainers-modules = { workspace = true }

[[test]]
name = "integration"

[[test]]
name = "interop"

[[test]]
name = "capture_fixtures"

[[test]]
name = "schemas_record"

[[test]]
name = "capture_compat_fixtures"

[[test]]
name = "compat_conformance"

[[test]]
name = "capture_protobuf_fixtures"

[[test]]
name = "capture_json_fixtures"
