[libdefaults]
    default_realm = CRABKA.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    udp_preference_limit = 1
    # Enctypes the test realm hands out. AES256-SHA1 is the Kerberos default and
    # is what sspi-rs / picky-krb support, so we pin it to keep the keytab simple.
    default_tkt_enctypes = aes256-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96

[realms]
    CRABKA.TEST = {
        kdc = localhost:88
        admin_server = localhost:749
    }

[domain_realm]
    .crabka.test = CRABKA.TEST
    crabka.test = CRABKA.TEST
