[package]
name = "crabka-security"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# Slice: SASL/GSSAPI auth_to_local rules (Task 3) match principals with
# RE2-compatible regexes; declared here so the gssapi::name module compiles.
regex.workspace = true
strum.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
bytes.workspace = true
ring.workspace = true
rcgen.workspace = true
subtle.workspace = true
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
base64.workspace = true
tracing.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
arc-swap.workspace = true
async-trait = { workspace = true }
jsonpath-rust = { workspace = true }
# Validators carry an Option<tokio::sync::mpsc::Sender<()>> for
# fire-and-forget on-demand JWKS refresh signals. The "sync" feature is
# enough — no runtime / no I/O surface in this crate.
tokio = { workspace = true, features = ["sync"] }
# Slice: SASL/GSSAPI (Kerberos). Pure-Rust SSPI implementation. Provides the
# server-side accept_security_context path backed by a service keytab, plus the
# client initiate path used for inter-broker auth. `network_client` pulls in the
# reqwest-based KDC transport so the SSP can reach the KDC over the network; we
# pick `ring` over the default `aws-lc-rs` crypto provider to match the rest of
# the workspace (rustls/rcgen already ride on ring).
#
# NOTE (spike finding): sspi 0.21 -> picky-krb 0.12.3 hard-pins
# pbkdf2 =0.13.0-rc.10, which is why the workspace pbkdf2 pin was moved to that
# RC. The version below is satisfied by our sspi fork, wired in via
# `[patch.crates-io]` in the workspace Cargo.toml (Devolutions/sspi-rs#681).
sspi = { version = "0.21", default-features = false, features = ["network_client", "ring"] }

[dev-dependencies]
assert2 = { workspace = true }
hex.workspace = true
tempfile.workspace = true
criterion = { version = "4.6.0", package = "codspeed-criterion-compat" }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[[bench]]
name = "scram"
harness = false
