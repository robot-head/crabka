[package]
name = "crabka-gres-substrate"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Substrate-backed durability for Crabka Gres tenant computes: WAL journaling to a per-tenant topic, fencing, and replay"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-gres-substrate"
readme = "README.md"
keywords = ["postgres", "wal", "durability", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
# Compile-time-only deterministic crash hooks. This is deliberately absent from
# default builds and exists solely for the production-service crash matrix.
checkpoint-test-hooks = []

[[test]]
name = "checkpoint_crashes"
required-features = ["checkpoint-test-hooks"]

[dependencies]
crabka-pgexec = { version = "0.4.0", path = "../pgexec" }
crabka-pgkv = { version = "0.4.0", path = "../pgkv" }
crabka-pgmvcc = { version = "0.4.0", path = "../pgmvcc" }
crabka-client-core = { version = "0.4.0", path = "../client-core" }
crabka-client-producer = { version = "0.4.0", path = "../client-producer" }
crabka-client-admin = { version = "0.4.0", path = "../client-admin" }
crabka-protocol = { version = "0.4.0", path = "../protocol" }
crabka-security = { workspace = true }
crabka-gres-ranges = { version = "0.4.0", path = "../gres-ranges" }
crabka-object-store = { version = "0.4.0", path = "../object-store" }
# W3C trace-context propagation only. Deliberately *not* `crabka-telemetry`,
# which drags in axum/clap/pprof/tonic/opentelemetry-otlp.
crabka-trace-context = { version = "0.4.0", path = "../trace-context" }
crabka-units = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
crabka-pgcatalog = { version = "0.4.0", path = "../pgcatalog" }
assert2 = { workspace = true }
proptest = { workspace = true }
crabka-broker = { version = "0.4.0", path = "../broker", features = ["test-helpers"] }
crabka-raft = { version = "0.4.0", path = "../raft" }
crabka-pgtypes = { version = "0.4.0", path = "../pgtypes" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
stateright = { workspace = true }
tracing-opentelemetry = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rustix = { workspace = true, features = ["process"] }
