[package]
name = "crabka-protocol-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Code generator for crabka-protocol"
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# AST-based codegen: build a token stream with quote!, parse it with syn, then
# render stable Rust source with prettyplease.
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing"] }

[lib]
name = "crabka_protocol_codegen"
path = "src/lib.rs"

[[bin]]
name = "crabka-protocol-codegen"
path = "src/main.rs"

[dev-dependencies]
assert2 = { workspace = true }
