[package]
name = "crabka-protocol-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Code generator for crabka-protocol"
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# AST-based codegen: build a token stream with quote!, then format it by
# shelling out to rustfmt (see src/fmt.rs). proc-macro2/quote/syn are already
# in the workspace lockfile (pulled by strum/prost), so marginal build cost is
# near zero. syn is kept only for parse-validation in tests.
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "printing"] }
# Pretty-prints the syn AST. Unlike rustfmt — which gives up on lines it cannot
# fit in `max_width` (e.g. the long fully-qualified paths in `to_owned`) and
# leaves the raw `quote!` ` :: ` spacing verbatim — prettyplease always renders
# canonical, correctly-spaced source. See src/fmt.rs.
prettyplease = "0.3"

[lib]
name = "crabka_protocol_codegen"
path = "src/lib.rs"

[[bin]]
name = "crabka-protocol-codegen"
path = "src/main.rs"

[dev-dependencies]
assert2 = { workspace = true }
