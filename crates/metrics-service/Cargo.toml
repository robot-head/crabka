[package]
name = "crabka-metrics-service"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Role-selectable metrics service wiring for Crabka's Prometheus/Mimir-compatible backend"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-metrics-service"
keywords = ["observability", "prometheus", "mimir", "metrics", "crabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
heap-profiling = ["crabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
assert2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json"] }
bytes = { workspace = true }
clap = { workspace = true }
crabka-blockstore = { path = "../blockstore", version = "0.3.7" }
crabka-ids = { path = "../ids", version = "0.3.8" }
crabka-client-consumer = { path = "../client-consumer", version = "0.3.9" }
crabka-client-producer = { path = "../client-producer", version = "0.3.9" }
crabka-metrics = { path = "../metrics", version = "0.3.8" }
crabka-promql = { path = "../promql", version = "0.3.8" }
crabka-telemetry = { path = "../telemetry", version = "0.3.8" }
crabka-units = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", default-features = false, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
prost = { workspace = true }
snap = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
