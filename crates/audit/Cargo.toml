[package]
name = "crabka-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Audit event model, OCSF serialization, and write pipeline for Crabka (FedRAMP 20x MLA)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-audit"
keywords = ["kafka", "audit", "ocsf", "fedramp", "crabka"]
categories = ["development-tools::debugging"]

[lints]
workspace = true

[dependencies]
ring = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
assert2 = { workspace = true }
