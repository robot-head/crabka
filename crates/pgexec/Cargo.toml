[package]
name = "crabka-pgexec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SQL execution engine for Crabka Gres: turns parsed SQL into catalog and KV operations under MVCC and implements the pgwire Engine trait"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-pgexec"
readme = "README.md"
keywords = ["postgres", "sql", "executor", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
crabka-units = { workspace = true }
thiserror = { workspace = true }
crabka-pgtypes = { version = "0.4.0", path = "../pgtypes" }
crabka-pgkv = { version = "0.4.0", path = "../pgkv" }
crabka-pgmvcc = { version = "0.4.0", path = "../pgmvcc" }
crabka-pgcatalog = { version = "0.4.0", path = "../pgcatalog" }
crabka-pgparser = { version = "0.4.0", path = "../pgparser" }
crabka-pgwire = { version = "0.4.0", path = "../pgwire" }
# W3C trace-context parsing for the `crabka.traceparent` GUC ingress. A leaf
# crate by design: `crabka-telemetry` is `publish = false`, and this crate is
# published.
crabka-trace-context = { version = "0.4.0", path = "../trace-context" }
bytes = { workspace = true }
shlex = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
async-trait = { workspace = true }
zerocopy = { workspace = true }
bigdecimal = { workspace = true }
jiff = { workspace = true }
# The POSIX-ARE-compatible pattern engine behind `~`/`~*`/`!~`/`!~*` and the
# `regexp_*` functions.
regex = { workspace = true }
rust-stemmers = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
pglz = { workspace = true }
unicode-normalization = { workspace = true }
unicode-general-category = { workspace = true }
encoding_rs = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { workspace = true }
tempfile = { workspace = true }
# Span assertions run against exported `SpanData`, not live `Span` handles:
# `tracing-opentelemetry` resolves a re-parented span's trace id when the span
# closes, so a live handle reports the wrong one.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
