[package]
name = "crabka-log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Byte-compatible reader/writer for Apache Kafka's on-disk log format"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-log"
readme = "README.md"
keywords = ["kafka", "log", "storage", "records", "crabka"]
categories = ["database-implementations", "encoding"]

[lints]
workspace = true

[features]
default = []
# Exposes `Log::test_set_log_start_offset` (and other test-only mutators)
# to dependent crates' integration tests. Not enabled by default — the
# broker crate's `dev-dependencies` enables it for the replication
# tests.
test-helpers = []

[dependencies]
crabka-protocol = { version = "0.3.8", path = "../protocol", default-features = false }
crabka-compression = { version = "0.3.8", path = "../compression", default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
# Exhaustive enumeration of the leader-epoch truncation core
# (`epoch_and_offset_for_entries`) in `leader_epoch_model.rs`.
stateright = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { version = "4.6.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "log"
harness = false
