[package]
name = "crabka-throttle"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# The Creusot proof toolchain (see .creusot-version) ships a rustc that trails
# the workspace pin, and `cargo creusot --replay` refuses to build a package
# whose `rust-version` is newer than it. This crate is verified there, so its
# MSRV is pinned to what that toolchain provides rather than inherited.
rust-version = "1.97.0"
description = "Shared token-bucket throttling primitives for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-throttle"
keywords = ["throttle", "rate-limit", "crabka"]
categories = ["concurrency"]

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
crabka-units = { workspace = true }
creusot-std = "0.12.0"
derive_more = { workspace = true }
qubit-clock = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
stateright = { workspace = true }
