[package]
name = "crabka-pageserver"
publish = false # Internal PostgreSQL pageserver scaffold; keep out of the publish allowlist.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pure PostgreSQL page-service seam for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-pageserver"
keywords = ["postgres", "pages", "redo", "crabka"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["json", "tokio"] }
bytes = { workspace = true }
connectrpc-axum = { workspace = true }
crabka-object-store = { path = "../object-store", version = "0.3.9" }
crabka-page-store = { path = "../page-store", version = "0.3.9" }
crabka-postgres-redo = { path = "../postgres-redo", version = "0.3.9" }
crabka-postgres-wal = { path = "../postgres-wal", version = "0.3.9" }
object_store = { workspace = true }
prost = { workspace = true }
pbjson = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[build-dependencies]
connectrpc-axum-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
