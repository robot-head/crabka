[package]
name = "crabka-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Connector-framework SPI (Source/Sink + converters) for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-connect"
readme = "README.md"
keywords = ["kafka", "connect", "connector", "cdc", "crabka"]
categories = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[dependencies]
# The schema-registry serdes back the schema-aware converter. Only the
# format-agnostic `SchemaSerializer`/`SchemaDeserializer` traits are needed
# here, so no format feature (avro/protobuf/json) is enabled.
crabka-schema-serde = { version = "0.3.6", path = "../schema-serde" }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
