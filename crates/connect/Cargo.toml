[package]
name = "crabka-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Connector-framework SPI (Source/Sink + converters) for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-connect"
readme = "README.md"
keywords = ["kafka", "connect", "connector", "cdc", "crabka"]
categories = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[features]
default = ["derive"]
derive = ["dep:crabka-connect-derive"]

[dependencies]
assert2 = { workspace = true }
# The schema-registry serdes back the schema-aware converter. Only the
# format-agnostic `SchemaSerializer`/`SchemaDeserializer` traits are needed
# here, so no format feature (avro/protobuf/json) is enabled.
crabka-schema-serde = { version = "0.4.1", path = "../schema-serde" }
crabka-connect-derive = { version = "0.4.1", path = "../connect-derive", optional = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The embeddable connector runtime spawns its driver loop on Tokio, parks on a
# watch channel for pause/resume/shutdown, and times commit intervals.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
# The poll-backoff sleep goes through an injectable clock so the production loop
# sleeps on real time while tests drive a deterministic mock timeline.
qubit-clock = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
