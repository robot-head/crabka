[package]
name = "crabka-metrics"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Prometheus/Grafana-Mimir-equivalent metrics backend for Crabka (data layer)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-metrics"
readme = "README.md"
keywords = ["observability", "prometheus", "mimir", "metrics", "crabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
heap-profiling = ["crabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
num-traits = { workspace = true }
async-trait = { workspace = true }
arrow = { workspace = true }
axum = { workspace = true, features = ["json"] }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
crabka-blockstore = { path = "../blockstore", version = "0.3.7" }
crabka-client-consumer = { path = "../client-consumer", version = "0.3.9" }
crabka-client-core = { path = "../client-core", version = "0.3.9" }
crabka-client-producer = { path = "../client-producer", version = "0.3.9" }
crabka-ids = { version = "0.3.8", path = "../ids" }
crabka-telemetry = { path = "../telemetry", version = "0.3.8" }
crabka-throttle = { path = "../throttle", version = "0.3.8" }
dashmap = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
opentelemetry-proto = { workspace = true }
prometheus-client = { workspace = true }
prost = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wincode = { workspace = true }
serde_yaml = { workspace = true }
snap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
wincode = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-broker = { path = "../broker", version = "0.3.8" }
crabka-client-admin = { path = "../client-admin", version = "0.3.9" }
mutants = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
temp-env = "0.3"
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
