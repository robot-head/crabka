[package]
name = "crabka-remote-storage"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "KIP-405 tiered-storage SPI (RemoteStorageManager / RemoteLogMetadataManager) and reference implementations for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-remote-storage"
readme = "README.md"
keywords = ["kafka", "tiered-storage", "object-store", "crabka"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
crabka-ids = { version = "0.3.8", path = "../ids" }
object_store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
