[package]
name = "crabka-client-producer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Idempotent producer client for Apache Kafka in Rust"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-client-producer"
readme = "README.md"
keywords = ["kafka", "producer", "client", "streaming", "crabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[features]
default = []

[dependencies]
crabka-protocol = { version = "0.3.2", path = "../protocol", default-features = false }
crabka-client-core = { version = "0.3.2", path = "../client-core" }
crabka-client-consumer = { version = "0.3.2", path = "../client-consumer" }
crabka-compression = { version = "0.3.2", path = "../compression" }
bon = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-security = { version = "0.3.2", path = "../security" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
