[package]
name = "crabka-client-producer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Idempotent producer client for Apache Kafka in Rust"

[lints]
workspace = true

[features]
default = []

[dependencies]
crabka-protocol = { version = "0.3", path = "../protocol", default-features = false }
crabka-client-core = { version = "0.3", path = "../client-core" }
crabka-client-consumer = { version = "0.3", path = "../client-consumer" }
crabka-compression = { version = "0.3", path = "../compression" }
bon = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-security = { version = "0.3", path = "../security" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
