[package]
name = "crabka-connect-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Derive macros for crabka-connect connector configuration"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-connect-derive"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# The renamed key verifies that the proc macro resolves Cargo dependency
# aliases. Keep the crates.io requirement so this crate remains publishable
# before crabka-connect at the same workspace version.
renamed-connect = { package = "crabka-connect", version = "0.3", path = "../connect", default-features = false }
