[package]
name = "crabka-connect-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Derive macros for crabka-connect connector configuration"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-connect-derive"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
# Dev-only path dependency. Keep the crates.io requirement on the released
# minor line so `cargo publish` can package this crate before crabka-connect is
# published at the same workspace version.
crabka-connect = { version = "0.3", path = "../connect", default-features = false }
datatest-stable = { workspace = true }
trybuild = { workspace = true }

[[test]]
name = "derive"
harness = false
