name: node-crash
description: >-
  SIGKILLs node 2 mid-run and restarts it 10 seconds later. Measures blast
  radius (only the ranges hosted on node 2 should degrade), WAL
  fence-and-replay recovery time, and post-restart throughput recovery.
topology:
  nodes: 3
  ranges: 4
workload:
  connections: 24
  rate: saturate
  warmup: 10s
  duration: 60s
  mix:
    single_shard_insert: 70
    read_only: 30
faults:
  - at: 20s
    kill_node: { node: 2, restart_after: 10s }
