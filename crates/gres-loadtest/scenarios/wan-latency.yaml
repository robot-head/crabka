name: wan-latency
description: >-
  Adds 50ms +/- 10ms of one-way delay to every inter-node range link for
  the whole measured window, simulating a geo-distributed deployment.
  Timestamp grants, 2PC rounds, and cross-range scans all pay the WAN
  round trip; the mode comparison shows which coordination steps a
  node-local clock removes from the critical path.
topology:
  nodes: 3
  ranges: 4
workload:
  connections: 32
  rate: saturate
  warmup: 10s
  duration: 60s
  mix:
    single_shard_insert: 50
    cross_shard_txn: 25
    read_only: 25
faults:
  - at: 0s
    latency: { target: all-ranges, delay: 50ms, jitter: 10ms, duration: 60s }
