name: flappy-network
description: >-
  Flaps the link to range 1 (down 3s, up 3s) for 30 seconds, plus a
  bandwidth-throttled window on range 2. Exercises reconnect storms,
  endpoint re-resolution, and retry behavior under an unreliable rather
  than cleanly-partitioned network.
topology:
  nodes: 3
  ranges: 4
workload:
  connections: 24
  rate: saturate
  warmup: 10s
  duration: 75s
  mix:
    single_shard_insert: 60
    cross_shard_txn: 20
    read_only: 20
faults:
  - at: 15s
    flap: { target: "range:1", period: 3s, duration: 30s }
  - at: 50s
    throttle: { target: "range:2", rate: 128KiB/s, duration: 15s }
