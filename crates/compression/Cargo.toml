[package]
name = "crabka-compression"
version.workspace = true
edition.workspace = true
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
description = "Kafka wire-protocol compression codecs for Rust"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-compression"
readme = "README.md"
keywords = ["kafka", "compression", "wire-protocol", "snappy", "zstd"]
categories = ["compression", "encoding"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["gzip", "snappy", "lz4", "zstd"]
gzip   = ["dep:flate2"]
snappy = ["dep:snap"]
lz4    = ["dep:lz4_flex"]
zstd   = ["dep:zstd"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
flate2   = { workspace = true, optional = true }
snap     = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
zstd     = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
criterion = { version = "4.6.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "codec"
harness = false
