[package]
name = "crabka-logfmt"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Structured-JSON (Cloud Logging-friendly) tracing log formatter shared across Crabka services"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-logfmt"
readme = "README.md"
keywords = ["kafka", "logging", "tracing", "json", "crabka"]
