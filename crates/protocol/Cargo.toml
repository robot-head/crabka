[package]
name = "crabka-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors = ["The Crabka Authors"]
description = "Apache Kafka wire-protocol codec (4.3.0), with typed RecordBatch and zero-copy borrowed decode"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-protocol"
readme = "README.md"
keywords = ["kafka", "wire-protocol", "codec", "serialization", "decoder"]
categories = ["encoding", "parser-implementations"]
include = [
    "src/**/*",
    "generated/**/*",
    "schemas/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]
build = "build.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["arbitrary", "gzip", "snappy", "lz4", "zstd"]
arbitrary = ["dep:arbitrary"]
gzip   = ["crabka-compression/gzip"]
snappy = ["crabka-compression/snappy"]
lz4    = ["crabka-compression/lz4"]
zstd   = ["crabka-compression/zstd"]

[dependencies]
assert2 = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
arbitrary = { workspace = true, optional = true }
zerocopy = { workspace = true }
crc32c = { workspace = true }
crabka-compression = { version = "0.3.9", path = "../compression", default-features = false }
crabka-units = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }

[build-dependencies]
assert2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
arbitrary = { workspace = true }
datatest-stable = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
criterion = { version = "5.0.1", package = "codspeed-criterion-compat" }
crabka-kafka-tap = { path = "../kafka-tap" }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "records"
harness = false

[[test]]
name = "corpus_replay"
harness = false

[[test]]
name = "kraft_metadata_roundtrip"
harness = false

[[test]]
name = "kraft_rpc_roundtrip"
harness = false
