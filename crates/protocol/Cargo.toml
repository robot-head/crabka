[package]
name = "crabka-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kafka wire protocol codec for Rust"
build = "build.rs"

[lints]
workspace = true

[features]
default = ["arbitrary", "gzip", "snappy", "lz4", "zstd"]
arbitrary = ["dep:arbitrary"]
gzip   = ["crabka-compression/gzip"]
snappy = ["crabka-compression/snappy"]
lz4    = ["crabka-compression/lz4"]
zstd   = ["crabka-compression/zstd"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
arbitrary = { workspace = true, optional = true }
zerocopy = { workspace = true }
crc32c = { workspace = true }
crabka-compression = { path = "../compression", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
arbitrary = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
criterion = { version = "4.6.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "records"
harness = false
