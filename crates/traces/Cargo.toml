[package]
name = "crabka-traces"
# Not published: depends on a git pin of datafusion, which crates.io disallows.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Tempo-compatible traces service for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-traces"
readme = "README.md"
keywords = ["observability", "tempo", "traceql", "traces", "crabka"]
categories = ["database-implementations"]
build = "build.rs"

[lints]
workspace = true

[features]
heap-profiling = ["crabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
assert2 = { workspace = true }
arc-swap = { workspace = true }
crabka-blockstore = { path = "../blockstore", version = "0.3.7" }
crabka-broker = { path = "../broker", version = "0.3.8" }
crabka-telemetry = { path = "../telemetry", version = "0.3.8" }
crabka-client-consumer = { path = "../client-consumer", version = "0.3.9" }
crabka-client-producer = { path = "../client-producer", version = "0.3.9" }
crabka-traceql = { path = "../traceql", version = "0.3.7" }
crabka-units = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json"] }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
datafusion = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
num-traits = { workspace = true }
opentelemetry-proto = { workspace = true }
prometheus-client = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde-wincode = { workspace = true }
snap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wincode = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
crabka-client-core = { path = "../client-core", version = "0.3.9" }
crabka-protocol = { path = "../protocol", version = "0.3.9" }
datatest-stable = { workspace = true }
http-body-util = "0.1"
# OTel stack for the `set_remote_parent_from_records` re-parenting test — mirrors
# the export-less tracer subscriber used in `crabka-telemetry`'s propagation
# tests. Test-only, hence dev-dependencies.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
parquet = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[[test]]
name = "traceql_conformance"
harness = false
