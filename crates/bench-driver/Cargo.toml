[package]
name = "crabka-bench-driver"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Load driver + report aggregator for the Crabka vs Strimzi benchmark harness"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-bench-driver"
readme = "README.md"
keywords = ["kafka", "benchmark", "load-test", "crabka"]
categories = ["development-tools::profiling"]

[[bin]]
name = "crabka-bench-driver"
path = "src/main.rs"

[[bin]]
name = "crabka-bench-report"
path = "src/report_main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["env"] }
crabka-client-admin = { version = "0.3.9", path = "../client-admin" }
crabka-client-consumer = { version = "0.3.9", path = "../client-consumer" }
crabka-client-core = { version = "0.3.9", path = "../client-core" }
crabka-client-producer = { version = "0.3.9", path = "../client-producer" }
crabka-protocol = { version = "0.3.9", path = "../protocol" }
crabka-security = { version = "0.3.9", path = "../security" }
derive_more = { workspace = true }
exponential-backoff = "2.1.0"
futures = { workspace = true }
hdrhistogram = { version = "7.5", default-features = false }
k8s-openapi = { workspace = true }
kube = { workspace = true }
# HTML/Plotly.js graph rendering for the benchmark report. Default features
# only (no kaleido / static-export — those pull a native browser binary we
# don't need; the report emits self-contained HTML that loads Plotly from CDN).
plotly = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
