[package]
name = "crabka-client-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Operator-side admin client for Crabka clusters"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-client-admin"
readme = "README.md"
keywords = ["kafka", "admin", "client", "crabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[dependencies]
crabka-client-core = { version = "0.3.8", path = "../client-core" }
crabka-metadata    = { version = "0.3.8", path = "../metadata" }
crabka-protocol    = { version = "0.3.8", path = "../protocol", default-features = false }
crabka-security    = { version = "0.3.8", path = "../security" }
async-trait        = { workspace = true }
bytes              = { workspace = true }
ring               = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["sync", "time", "net"] }
tracing            = { workspace = true }
uuid               = { workspace = true }

[dev-dependencies]
assert2            = { workspace = true }
crabka-broker      = { version = "0.3", path = "../broker" }
crabka-client-consumer = { version = "0.3", path = "../client-consumer" }
crabka-client-producer = { version = "0.3", path = "../client-producer" }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
