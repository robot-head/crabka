[package]
name = "crabka-client-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Operator-side admin client for Crabka clusters"

[lints]
workspace = true

[dependencies]
crabka-client-core = { version = "0.2", path = "../client-core" }
crabka-metadata    = { version = "0.2", path = "../metadata" }
crabka-protocol    = { version = "0.2", path = "../protocol", default-features = false }
crabka-security    = { version = "0.2", path = "../security" }
async-trait        = { workspace = true }
bytes              = { workspace = true }
ring               = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["sync", "time", "net"] }
tracing            = { workspace = true }
uuid               = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-broker = { version = "0.2", path = "../broker", features = ["test-helpers"] }
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
