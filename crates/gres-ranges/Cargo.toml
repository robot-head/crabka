[package]
name = "crabka-gres-ranges"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Typed range maps and deterministic routing primitives for Crabka Gres multi-range tenants"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-gres-ranges"
readme = "README.md"
keywords = ["postgres", "ranges", "routing", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
arc-swap = { workspace = true }
crabka-gres-control = { version = "0.4.0", path = "../gres-control" }
crabka-security = { path = "../security" }
crabka-pgcatalog = { version = "0.4.0", path = "../pgcatalog" }
crabka-pgexec = { version = "0.4.0", path = "../pgexec" }
crabka-pgkv = { version = "0.4.0", path = "../pgkv" }
crabka-pgmvcc = { version = "0.4.0", path = "../pgmvcc" }
crabka-pgparser = { version = "0.4.0", path = "../pgparser" }
crabka-pgtypes = { version = "0.4.0", path = "../pgtypes" }
crabka-pgwire = { version = "0.4.0", path = "../pgwire" }
# W3C trace-context propagation across the range RPC hop. Deliberately *not*
# `crabka-telemetry`, which pulls in axum, tonic and the OTLP exporter that a
# transport crate has no business linking.
crabka-trace-context = { version = "0.4.0", path = "../trace-context" }
crabka-units = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "into", "from_str"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true }
refined_type = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "macros", "process", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-broker = { path = "../broker" }
crabka-client-admin = { path = "../client-admin" }
# Tracing assertions run against exported `SpanData`, not live `Span` handles:
# `tracing-opentelemetry` resolves a span's parent and trace id at close, so a
# live handle reports the wrong tree.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
proptest = { workspace = true }
stateright = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
