[package]
name = "crabka-admin-ui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Standalone Dioxus broker administration UI for Crabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-admin-ui"
keywords = ["kafka", "admin", "ui", "dioxus", "crabka"]
categories = ["web-programming::http-server"]

[lints]
workspace = true

[[bin]]
name = "crabka-admin-ui"
path = "src/main.rs"

[features]
default = []
e2e = ["dep:playwright-rs"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json", "query"] }
clap = { workspace = true, features = ["derive", "env"] }
crabka-client-admin = { version = "0.3.9", path = "../client-admin" }
crabka-client-core = { version = "0.3.9", path = "../client-core" }
crabka-security = { version = "0.3.9", path = "../security" }
dioxus = { version = "=0.7.9", default-features = false, features = ["fullstack", "html", "macro", "router", "server", "signals"] }
dioxus-ssr = "=0.7.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
parking_lot.workspace = true
refined_type.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
playwright-rs = { version = "0.14.1", optional = true }

[dev-dependencies]
assert2.workspace = true
mutants.workspace = true
tempfile.workspace = true
