[package]
name = "crabka-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.95.0"
description = "Single-node Apache Kafka-compatible broker (MVP)"

[lints]
workspace = true

[features]
default = []
# Exposes test-only `BrokerHandle::test_truncate_local_log` /
# `test_advance_log_start` for slice-8 replication integration tests.
# Pulls in `crabka-log/test-helpers` to reach `Log::test_set_log_start_offset`.
test-helpers = ["crabka-log/test-helpers"]

[[bin]]
name = "crabka-broker"
path = "src/bin/broker.rs"

[dependencies]
crabka-protocol = { version = "0.1", path = "../protocol", default-features = false }
crabka-log = { version = "0.1", path = "../log" }
crabka-compression = { version = "0.1", path = "../compression", default-features = false }
crabka-raft = { version = "0.1", path = "../raft" }
crabka-metadata = { version = "0.1", path = "../metadata" }
crabka-client-core = { version = "0.1", path = "../client-core" }
crabka-security.workspace = true
async-trait.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wincode = { workspace = true }
wincode = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tokio-metrics = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
futures-util = { workspace = true }
prometheus-client.workspace = true
axum.workspace = true
# Slice 49b: fetch the OAUTHBEARER JWKS over HTTP(S). The `rustls` feature
# reuses the rustls + aws-lc-rs crypto stack already in the workspace dep graph.
# Slice 49d: `json` (Response::json) + `form` (RequestBuilder::form) for the
# RFC 7662 introspection POST; direct `serde_json` dep for the response value.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde_json = { workspace = true }
# Slice 49g: compile customClaimCheck JsonPath expressions at config-load
# and inject into the OAUTHBEARER validators.
jsonpath-rust = { workspace = true }
# Slice 51 (KIP-48): wall-clock millis for delegation-token issue/expiry
# timestamps. `chrono::Utc::now()` avoids the verbose `SystemTime::now()`
# → `UNIX_EPOCH` → `as_millis()` → `i64::try_from` boilerplate.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
crabka-broker = { version = "0.1", path = ".", features = ["test-helpers"] }
crabka-client-consumer = { version = "0.1", path = "../client-consumer" }
crabka-client-producer = { version = "0.1", path = "../client-producer" }
rustls.workspace = true
rustls-pki-types.workspace = true
tempfile = { workspace = true }
base64.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-rustls.workspace = true
# Slice 12 T15 tests: client-side PBKDF2 of the SCRAM password to build
# `AlterUserScramCredentials` upsertions.
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
# Slice 39 metrics tests: exercise the axum Router::oneshot helper.
tower.workspace = true
# Slice 49b: mint ES256 tokens + build the matching JWK for the signed
# OAUTHBEARER wire test.
ring.workspace = true
# Slice 49c T3: generate a self-signed cert with 127.0.0.1 SAN on the
# fly for the HTTPS JWKS-refresher integration tests.
rcgen.workspace = true
# Slice 51 T4: scoped env-var mutation in tests for the delegation-token
# secret-key env-wins-over-TOML check. The workspace forbids `unsafe_code`,
# so direct `std::env::set_var` (unsafe under edition 2024) isn't available.
temp-env = "0.3"
