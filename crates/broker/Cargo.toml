[package]
name = "crabka-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.95.0"
description = "Single-node Apache Kafka-compatible broker (MVP)"

[lints]
workspace = true

[features]
default = []
# Exposes test-only `BrokerHandle::test_truncate_local_log` /
# `test_advance_log_start` for the replication integration tests.
# Pulls in `crabka-log/test-helpers` to reach `Log::test_set_log_start_offset`.
test-helpers = ["crabka-log/test-helpers"]
sspi-keytab = ["crabka-security/sspi-keytab", "crabka-client-core/sspi-keytab"]


[[bin]]
name = "crabka-broker"
path = "src/bin/broker.rs"

[dependencies]
crabka-protocol = { version = "0.2", path = "../protocol", default-features = false }
crabka-telemetry = { version = "0.2", path = "../telemetry" }
crabka-records-legacy = { version = "0.2", path = "../records-legacy" }
crabka-log = { version = "0.2", path = "../log" }
crabka-compression = { version = "0.2", path = "../compression", default-features = false }
crabka-raft = { version = "0.2", path = "../raft" }
crabka-metadata = { version = "0.2", path = "../metadata" }
crabka-authz = { version = "0.2", path = "../authz" }
crabka-remote-storage = { version = "0.2", path = "../remote-storage" }
crabka-remote-storage-topic = { version = "0.2", path = "../remote-storage-topic" }
crabka-client-core = { version = "0.2", path = "../client-core" }
crabka-security.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wincode = { workspace = true }
wincode = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tokio-metrics = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
rustix = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry-proto = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
futures-util = { workspace = true }
prometheus-client.workspace = true
axum.workspace = true
# Fetch the OAUTHBEARER JWKS over HTTP(S). The `rustls` feature reuses the
# rustls + aws-lc-rs crypto stack already in the workspace dep graph.
# `json` (Response::json) + `form` (RequestBuilder::form) are for the
# RFC 7662 introspection POST; direct `serde_json` dep for the response value.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde_json = { workspace = true }
# Compile customClaimCheck JsonPath expressions at config-load
# and inject into the OAUTHBEARER validators.
jsonpath-rust = { workspace = true }
# KIP-48: base64-encode delegation-token HMAC bytes when
# synthesizing a SCRAM credential for token authentication
# (`network::auth::synthesize_token_scram_credential`).
base64.workspace = true
# Bounded decision cache for the OPA authorizer.
lru.workspace = true
# Zero-copy: cast remote-tier OffsetIndex/TimeIndex byte buffers
# to typed entry slices instead of per-entry from_be_bytes() in a hot path.
zerocopy.workspace = true
# JSON Schema generation for FileConfig — consumed by crabka-docgen.
schemars = { workspace = true }
# KIP-714: stable subscription-id via CRC32C over sorted metric-prefix set.
crc32c = { workspace = true }
# KIP-714: decode OTLP MetricsData protobuf payloads in PushTelemetry handler.
prost = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
crabka-broker = { version = "0.2", path = ".", features = ["test-helpers"] }
crabka-client-consumer = { version = "0.2", path = "../client-consumer" }
crabka-client-producer = { version = "0.2", path = "../client-producer" }
# Host-side raw `Client::send(DescribeGroupsRequest)` against the
# real-Kafka Docker capture (`describe_groups_jvm.rs`).
crabka-client-core = { version = "0.2", path = "../client-core" }
crabka-records-legacy = { version = "0.2", path = "../records-legacy" }
crabka-protocol = { version = "0.2", path = "../protocol", default-features = false }
# Serialize the captured real-Kafka DescribeGroups fixture as JSON.
serde_json = { workspace = true }
bytes = { workspace = true }
rustls.workspace = true
rustls-pki-types.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-rustls.workspace = true
# Client-side PBKDF2 of the SCRAM password to build
# `AlterUserScramCredentials` upsertions in tests.
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
# Metrics tests: exercise the axum Router::oneshot helper.
tower.workspace = true
# Mint ES256 tokens + build the matching JWK for the signed
# OAUTHBEARER wire test.
ring.workspace = true
# Generate a self-signed cert with 127.0.0.1 SAN on the
# fly for the HTTPS JWKS-refresher integration tests.
rcgen.workspace = true
# Scoped env-var mutation in tests for the delegation-token
# secret-key env-wins-over-TOML check. The workspace forbids `unsafe_code`,
# so direct `std::env::set_var` (unsafe under edition 2024) isn't available.
temp-env = "0.3"
# Mock OPA server for OpaAuthorizer unit tests — wiremock
# answers HTTP on a random local port and lets us assert call counts.
wiremock = "0.6"
