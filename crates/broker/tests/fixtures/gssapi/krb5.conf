# krb5.conf used INSIDE the cp-kafka client container for the GSSAPI e2e test.
#
# The KDC fixture maps 88/tcp+udp to the host, and the container is launched
# with --add-host=host.docker.internal:host-gateway, so the KDC is reachable at
# host.docker.internal:88. The broker advertises host.docker.internal:9092, so
# the stock Kafka GSSAPI client derives the server principal
# kafka/host.docker.internal@CRABKA.TEST — keep dns_canonicalize_hostname/rdns
# off so the literal advertised name is used verbatim (it has no real DNS A
# record, and a matching service key is provisioned in the broker keytab).
[libdefaults]
    default_realm = CRABKA.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1
    default_tkt_enctypes = aes256-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96

[realms]
    CRABKA.TEST = {
        kdc = host.docker.internal:88
        admin_server = host.docker.internal:749
    }

[domain_realm]
    .crabka.test = CRABKA.TEST
    crabka.test = CRABKA.TEST
