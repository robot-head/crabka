// JAAS login config for the cp-kafka GSSAPI client (kafka-console-producer /
// kafka-console-consumer). Authenticates as alice@CRABKA.TEST using the keytab
// exported by the KDC fixture. The keytab is bind-mounted into the container at
// /fixtures/alice.keytab (see gssapi_e2e.rs).
KafkaClient {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    keyTab="/fixtures/alice.keytab"
    principal="alice@CRABKA.TEST"
    useTicketCache=false;
};
