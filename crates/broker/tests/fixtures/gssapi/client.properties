# Client config for the cp-kafka GSSAPI tools in the e2e test. SASL_PLAINTEXT
# (auth-only QOP, matching Crabka's offer); GSSAPI mechanism; the service name
# must match the broker keytab's SPN component (kafka/<host>).
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka
