[package]
name = "crabka-client-streams"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "KIP-1071 Kafka Streams rebalance-protocol client for Apache Kafka in Rust"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-client-streams"
readme = "README.md"
keywords = ["kafka", "streams", "client", "crabka"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

# Schema-serde examples need the optional dep + generated protobuf types.
[[example]]
name = "avro_pipeline"
required-features = ["schema-serde"]

[[example]]
name = "protobuf_pipeline"
required-features = ["schema-serde"]

[[example]]
name = "json_pipeline"
required-features = ["schema-serde"]

[features]
default = []
schema-serde = ["dep:crabka-schema-serde", "crabka-schema-serde/avro", "crabka-schema-serde/protobuf", "crabka-schema-serde/json", "dep:protox", "dep:prost-build"]

[dependencies]
crabka-protocol = { version = "0.3.2", path = "../protocol", default-features = false }
crabka-schema-serde = { version = "0.3.2", path = "../schema-serde", optional = true }
crabka-client-core = { version = "0.3.2", path = "../client-core" }
crabka-client-consumer = { version = "0.3.2", path = "../client-consumer" }
crabka-client-producer = { version = "0.3.2", path = "../client-producer" }
async-trait = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
turso = "0.6"
pollster = "0.4"

[build-dependencies]
# Only compiled under the `schema-serde` feature; compiles the protobuf
# example's .proto via protox (pure Rust, no protoc) into prost structs that
# derive prost_reflect::ReflectMessage. See build.rs.
protox = { version = "0.9", optional = true }
prost-build = { version = "0.14", optional = true }

[dev-dependencies]
assert2 = { workspace = true }
apache-avro = { workspace = true, features = ["derive"] }
crabka-broker = { version = "0.3.2", path = "../broker", features = ["test-helpers"] }
crabka-schema-serde = { version = "0.3.2", path = "../schema-serde", features = ["avro", "protobuf", "json"] }
hex = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
