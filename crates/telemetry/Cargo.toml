[package]
name = "crabka-telemetry"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Generic OTLP distributed-tracing pipeline for Crabka services"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-telemetry"
readme = "README.md"
keywords = ["kafka", "otlp", "tracing", "telemetry", "crabka"]
categories = ["development-tools::debugging"]

[lints]
workspace = true

[features]
# Heap profiling endpoint via jemalloc. Only fully active on Unix where
# tikv-jemalloc can be built; on non-Unix the feature flag is accepted but
# the heap route and jemalloc dep are omitted.
heap-profiling = ["dep:jemalloc_pprof"]

[dependencies]
assert2 = { workspace = true }
crabka-logfmt = { version = "0.3.8", path = "../logfmt" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
opentelemetry-otlp = { workspace = true, features = ["trace", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
axum = { workspace = true, features = ["query", "tokio", "http1"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net", "rt", "time", "macros"] }

# CPU profiling via POSIX signals, and optional heap profiling via jemalloc —
# both only compile on Unix.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false, features = ["prost-codec"] }
# The standard pprof wire format is a gzipped `Profile` protobuf (this is what
# Go's net/http/pprof serves and what Pyroscope's push API expects in
# `raw_profile`). We gzip the encoded profile before returning it.
flate2 = { workspace = true }
# heap-profiling only: jemalloc_pprof provides PROF_CTL; the global allocator
# is supplied by each binary binary, not this lib.
jemalloc_pprof = { version = "0.9", optional = true }

[dev-dependencies]
mutants = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time", "macros", "rt-multi-thread"] }
axum = { workspace = true, features = ["query", "tokio", "http1"] }
