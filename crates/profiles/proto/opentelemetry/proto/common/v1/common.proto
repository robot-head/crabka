syntax = "proto3";
package opentelemetry.proto.common.v1;
// Minimal vendored subset needed by profiles/v1development, from
// open-telemetry/opentelemetry-proto @ 023f8cd36cc946617caa9a9e2e9868186f6d22dd.

message InstrumentationScope {
  string name = 1;
  string version = 2;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message AnyValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
  }
}
