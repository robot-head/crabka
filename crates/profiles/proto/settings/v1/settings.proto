syntax = "proto3";

// Pyroscope `settings.v1.SettingsService`. The Grafana Profiles Drilldown app
// (`grafana-pyroscope-app`) calls `Get` during initialisation to load per-tenant
// UI settings (flame-graph max nodes, collapsed flame graphs, etc.). A 404 here
// aborts the app's init chain, so it never issues the per-panel `SelectSeries`
// queries and the landing grid renders empty. Crabka does not persist user
// settings, so `Get` returns an empty set — the app then falls back to its
// built-in defaults, exactly as it does against a fresh Pyroscope tenant — and
// `Set` echoes the value back so an optimistic UI update succeeds.
package settings.v1;

service SettingsService {
  rpc Get(GetSettingsRequest) returns (GetSettingsResponse);
  rpc Set(SetSettingsRequest) returns (SetSettingsResponse);
}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated Setting settings = 1;
}

message SetSettingsRequest {
  Setting setting = 1;
}

message SetSettingsResponse {
  Setting setting = 1;
}

message Setting {
  string name = 1;
  string value = 2;
  int64 modified_at = 3;
}
