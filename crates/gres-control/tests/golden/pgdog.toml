[general]
listen_port = 6432
pooler_mode = "transaction"
passthrough_auth = "enabled"
connect_timeout = 10
connect_attempts = 3
checkout_timeout = 30
idle_timeout = 45
server_lifetime = 240
tls_cert_path = "/etc/pgdog/tls/tls.crt"
tls_key_path = "/etc/pgdog/tls/tls.key"
admin_password_secret_ref = "pgdog-admin"

[[databases]]
name = "blue"
host = "blue-0.gres.svc"
port = 5432
pooler_mode = "transaction"

[[databases]]
name = "green"
host = "green-0.gres.svc"
port = 5432
pooler_mode = "transaction"
