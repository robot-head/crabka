[package]
name = "crabka-gres-control"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Control-plane tenant registry for Crabka Gres"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-gres-control"
readme = "README.md"
keywords = ["postgres", "control-plane", "kafka", "crabka", "gres"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
crabka-client-admin = { version = "0.4.1", path = "../client-admin" }
crabka-client-core = { version = "0.4.1", path = "../client-core" }
crabka-client-producer = { version = "0.4.1", path = "../client-producer" }
crabka-protocol = { version = "0.4.1", path = "../protocol", default-features = false }
crabka-units = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
static_assertions = "1"
assert2 = { workspace = true }
crabka-broker = { version = "0.4.0", path = "../broker", features = ["test-helpers"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
