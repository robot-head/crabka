[package]
name = "crabka-blockstore"
# Not published: depends on a git pin of datafusion, which crates.io disallows.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Signal-agnostic columnar block store for Crabka observability"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-blockstore"
readme = "README.md"
keywords = ["observability", "datafusion", "parquet", "object-store", "crabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
datafusion = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
