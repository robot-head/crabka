name: Set up Bazel and Aspect
description: Install Bazel/Aspect and restore the shared Bazel caches.
inputs:
  aspect-api-token:
    description: Aspect API token.
    required: true
  cache-save:
    description: Save Bazel caches when this job is the designated writer.
    required: false
    default: "true"
  cache-snapshot:
    description: Salt the disk-cache key so jobs in this run share the writer's exact snapshot.
    required: false
    default: "true"
  disk-cache:
    description: Name of the shared Bazel disk-cache namespace, or false to disable it.
    required: false
    default: affected
  external-cache:
    description: Generated external-repository cache namespace; defaults to disk-cache.
    required: false
    default: ""
  repository-cache:
    description: setup-bazel repository-cache configuration, or false to disable it.
    required: false
    default: |
      - .github/actions/setup-bazel/action.yml
      - .bazelrc
      - .bazelversion
      - MODULE.bazel
      - MODULE.bazel.lock
      - Cargo.lock
  disk-cache-artifact-restore:
    description: Restore mode for the scoped artifact; require-current, if-no-snapshot, or false.
    required: false
    default: require-current
outputs:
  disk-cache-complete:
    description: Whether the disk cache contains a completed warmer snapshot.
    value: ${{ steps.disk-cache-final.outputs.complete }}
runs:
  using: composite
  steps:
    - name: Key this run's Bazel cache snapshot
      if: ${{ inputs.cache-snapshot == 'true' }}
      shell: bash
      run: |
        mkdir -p bazel/affected-cache-key
        printf '# cache snapshot %s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          > bazel/affected-cache-key/BUILD.bazel
    - name: Remove an act cache snapshot before graph hashing
      if: ${{ inputs.cache-snapshot != 'true' }}
      shell: bash
      run: |
        rm -f -- bazel/affected-cache-key/BUILD.bazel
        rmdir --ignore-fail-on-non-empty bazel/affected-cache-key 2>/dev/null || true
    - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ inputs.disk-cache }}
        # Only dependency-resolution inputs belong in the default above. Local
        # Starlark changes alter Bazel action keys, not downloaded content.
        repository-cache: ${{ inputs.repository-cache }}
        # Keep manifests stable within an execution namespace so one workflow
        # cannot freeze another workflow's partial external-repository list.
        external-cache: |
          name: crabka-v3-${{ inputs.external-cache || inputs.disk-cache }}
          manifest:
            # The crate-universe hub itself is keyed by the Cargo lock; its
            # generated per-crate repositories retain setup-bazel's defaults.
            "rules_rs++crate+crates":
              - Cargo.lock
              - MODULE.bazel.lock
        cache-save: ${{ inputs.cache-save }}
    - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      with:
        aspect-api-token: ${{ inputs.aspect-api-token }}
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false
    - name: Inspect the primary disk-cache snapshot
      id: disk-cache-state
      if: ${{ inputs.disk-cache != 'false' }}
      shell: bash
      run: |
        marker="$HOME/.cache/bazel-disk/.crabka-snapshot-v1"
        exact_hit=false
        complete=false
        if [[ -f "$marker" ]]; then
          complete=true
          IFS= read -r snapshot < "$marker"
          if [[ "$snapshot" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
            exact_hit=true
          fi
        fi
        {
          echo "complete=$complete"
          echo "exact-hit=$exact_hit"
        } >> "$GITHUB_OUTPUT"
    - name: Find the completed cache for this affected scope
      id: disk-cache-artifact
      if: >-
        ${{ inputs.disk-cache == 'affected' &&
            env.AFFECTED_ARTIFACT_SCOPE != '' &&
            ((inputs.disk-cache-artifact-restore == 'require-current' &&
              steps.disk-cache-state.outputs.exact-hit != 'true') ||
             (inputs.disk-cache-artifact-restore == 'if-no-snapshot' &&
              steps.disk-cache-state.outputs.complete != 'true')) }}
      continue-on-error: true
      uses: ./.github/actions/restore-run-artifact
      with:
        artifact-name: affected-bazel-disk-v1-${{ env.AFFECTED_ARTIFACT_SCOPE }}.tar.zst
        download-path: ${{ runner.temp }}
        expected-file: affected-bazel-disk-v1-${{ env.AFFECTED_ARTIFACT_SCOPE }}.tar.zst
        producer-branch: ${{ env.AFFECTED_ARTIFACT_BRANCH }}
        producer-repository-id: ${{ env.AFFECTED_ARTIFACT_REPOSITORY_ID }}
        skip-decompress: true
    - name: Restore the completed cache for this affected scope
      if: ${{ steps.disk-cache-artifact.outputs.restored == 'true' }}
      shell: bash
      run: >-
        aspect affected-cache --mode restore
        --archive "$RUNNER_TEMP/affected-bazel-disk-v1-${AFFECTED_ARTIFACT_SCOPE}.tar.zst"
        --cache-dir "$HOME/.cache/bazel-disk"
    - name: Inspect the final disk cache
      id: disk-cache-final
      if: ${{ inputs.disk-cache != 'false' }}
      shell: bash
      run: |
        complete=false
        if [[ -f "$HOME/.cache/bazel-disk/.crabka-snapshot-v1" ]]; then
          complete=true
        fi
        echo "complete=$complete" >> "$GITHUB_OUTPUT"
