name: Set up Bazel and Aspect
description: Install Bazel/Aspect and restore the shared Bazel caches.
inputs:
  aspect-api-token:
    description: Aspect API token.
    required: true
  bazelrc:
    description: Additional Bazel configuration for this job.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0
    - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: |
          - MODULE.bazel
          - MODULE.bazel.lock
          - Cargo.lock
        external-cache: true
        cache-save: true
    - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      with:
        aspect-api-token: ${{ inputs.aspect-api-token }}
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false
        bazelrc: ${{ inputs.bazelrc }}
