name: recapture-corpus
on:
  workflow_dispatch:

permissions:
  contents: read

# Fetch git dependencies with the system `git` client, not the libgit2 client
# cargo links in. See the long note on this setting in `ci.yml`: libgit2 failed
# twice in 24 days inside the `datafusion` git pin's test-data submodules, with
# "the SSL certificate is invalid; class=Ssl (16)", and cargo's own diagnostic
# recommends this switch. The cargo jobs below all resolve the workspace, so
# any of them can hit that clone.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Check-only mode replays the committed corpus against freshly-captured
      # bytes; it skips the synthesis pass, so no JVM oracle (and no Java) is
      # needed here — only Docker + the broker image.
      - name: Pull broker image
        run: docker pull mirror.gcr.io/apache/kafka:4.3.0
      - name: Capture-and-compare (fails on drift)
        env:
          CORPUS_CHECK_ONLY: "1"
        run: cargo test -p crabka-protocol --test capture_corpus -- --ignored --nocapture
      - name: Confirm committed corpus still passes the replay gate
        run: cargo test -p crabka-protocol --test corpus_replay
