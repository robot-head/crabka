name: recapture-corpus
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      # Check-only mode replays the committed corpus against freshly-captured
      # bytes; it skips the synthesis pass, so no JVM oracle (and no Java) is
      # needed here — only Docker + the broker image.
      - name: Pull broker image
        run: docker pull mirror.gcr.io/apache/kafka:4.3.0
      - name: Capture-and-compare (fails on drift)
        env:
          CORPUS_CHECK_ONLY: "1"
        run: aspect test //crates/protocol:capture_corpus --bazel-flag=--config=ci --bazel-flag=--test_arg=--ignored --bazel-flag=--test_arg=--nocapture
      - name: Confirm committed corpus still passes the replay gate
        run: aspect test //crates/protocol:corpus_replay --bazel-flag=--config=ci
