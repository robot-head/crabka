name: publish-demo-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: publish-demo-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Bazel OCI index
        run: |
          tags=(--tag "${{ inputs.tag }}")
          if [[ "${{ inputs.tag }}" != latest ]]; then
            tags+=(--tag latest)
          fi
          aspect run //packaging:demo_image_push --bazel-flag=--config=ci -- \
            --repository "ghcr.io/${{ github.repository_owner }}/crabka-demo" "${tags[@]}"

      - name: Capture published digest
        id: publish
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/crabka-demo:${{ inputs.tag }}" \
            --format '{{.Manifest.Digest}}')"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/crabka-demo@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/crabka-demo
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/crabka-demo
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
