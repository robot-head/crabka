name: publish-demo-image

# Manually publishes the all-in-one demo image for the full-signal
# observability demo (demo/observability/). Unlike the per-service apko images
# in publish-images.yml, this is a single convenience bundle of every Crabka
# binary the demo needs — built `--features heap-profiling` with debug symbols
# for readable CPU/heap flamegraphs — via demo/observability/Dockerfile. It
# exists so people can `docker compose up` the demo without a lengthy local
# build.
#
# Trigger from the Actions tab ("Run workflow") and pass the image tag.
#
# NOTE: GHCR packages are private by default. After the FIRST publish, make the
# package public so people can pull it without auth:
#   GitHub -> Packages -> crabka-demo -> Package settings -> Change visibility -> Public

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 0.3.8)"
        required: true
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: publish-demo-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The Dockerfile compiles every demo binary in release with debug symbols;
    # a cold cargo build of the workspace is slow, so allow plenty of headroom.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the image to GHCR via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demo/observability/Dockerfile
          push: true
          # Publish the requested tag AND move `latest`: the demo compose
          # (demo/observability/docker-compose.yml) pulls `:latest`, so every
          # versioned publish updates it to keep `docker compose up` working
          # out of the box while the version tag stays an immutable pin. The
          # second line is empty when `tag` is already `latest`, so it is never
          # listed twice (build-push-action ignores blank tag lines).
          tags: |
            ghcr.io/${{ github.repository_owner }}/crabka-demo:${{ inputs.tag }}
            ${{ inputs.tag != 'latest' && format('ghcr.io/{0}/crabka-demo:latest', github.repository_owner) || '' }}
          # Cache the Docker layers across runs (the cargo build dominates, but
          # the apt/base layers and any unchanged stages still benefit).
          cache-from: type=gha
          cache-to: type=gha,mode=max
