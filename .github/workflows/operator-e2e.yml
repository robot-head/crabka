name: operator-e2e
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: operator-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether the PR touches operator-relevant code. Used to gate
  # the kind-* jobs below — a docs-only or client-only PR skips the
  # entire e2e suite. On push to main, every job runs unconditionally
  # (their `if:` short-circuits on `github.event_name == 'push'`).
  #
  # Single `operator` filter covers all kind-* jobs. Per-job filters
  # would be over-engineering: operator code is monolithic, a
  # KafkaTopic-only change can still break the generic kind smoke test,
  # and the per-job runtime savings don't justify the maintenance
  # surface.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            operator:
              - 'crates/operator/**'
              - 'crates/broker/**'
              - 'deploy/**'
              - 'helm/**'
              - 'packaging/melange/**'
              - 'packaging/apko/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/operator-e2e.yml'

  # Build the operator + broker OCI images once and share them with every
  # kind job below via an artifact. melange/apko compile the Rust binaries
  # inside a docker build container (`--runner docker`), so the host Rust
  # toolchain and a host-side build cache would not be exercised here —
  # deduplicating the build across the four e2e jobs is the real win.
  build-images:
    needs: changes
    # Run on every push to main, on PRs that touch operator-relevant
    # code, and on PRs labeled for an OAuth e2e run (even if the PR
    # itself doesn't touch operator code — e.g. a workflow-only tweak).
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.operator == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-oauth') ||
      contains(github.event.pull_request.labels.*.name, 'e2e-oauth-introspection')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install melange and apko
        run: |
          go install chainguard.dev/melange@latest
          go install chainguard.dev/apko@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Verify melange + apko on PATH
        run: |
          melange version
          apko version
      - name: Build crabka-operator + crabka-broker apk + OCI images
        run: |
          mkdir -p packages
          melange keygen
          for recipe in crabka-operator crabka-broker; do
            melange build "packaging/melange/${recipe}.yaml" \
              --source-dir . \
              --signing-key melange.rsa \
              --arch x86_64 \
              --runner docker \
              --out-dir packages/
            apko build "packaging/apko/${recipe}.yaml" \
              "${recipe}:e2e" \
              "${recipe}.tar" \
              --arch x86_64 \
              --repository-append "$PWD/packages" \
              --keyring-append "$PWD/melange.rsa.pub"
          done
      - name: Upload image tarballs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: |
            crabka-operator.tar
            crabka-broker.tar
          retention-days: 1
          if-no-files-found: error

  kind:
    needs: [build-images, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.operator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Install MetalLB (so LoadBalancer Services get an IP in kind)
        run: |
          set -e
          kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.7/config/manifests/metallb-native.yaml
          # Wait for the speaker DaemonSet + controller Deployment to roll out.
          kubectl rollout status -n metallb-system deploy/controller --timeout=180s
          kubectl rollout status -n metallb-system daemonset/speaker --timeout=180s

          # Pick an IP range inside the docker bridge that kind sits on.
          # On the GitHub Actions runners this is reliably 172.18.0.0/16
          # under the default `kind` docker network; carve out the high
          # end of the .255 octet so we don't clash with any future kind
          # nodes.
          subnet=$(docker network inspect kind --format '{{(index .IPAM.Config 0).Subnet}}')
          echo "kind subnet: $subnet"
          # IPAddressPool + L2Advertisement.
          cat <<EOF | kubectl apply -f -
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: kind-pool
            namespace: metallb-system
          spec:
            addresses:
              - 172.18.255.200-172.18.255.250
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: kind-l2
            namespace: metallb-system
          EOF

      - name: Load operator image into kind (via docker)
        run: |
          # apko writes an OCI archive tagged with an arch suffix
          # (`crabka-operator:e2e-amd64`). docker load picks that up; we
          # capture the actual loaded reference and retag to the chart's
          # expected `crabka-operator:e2e` before pushing into kind.
          docker load -i crabka-operator.tar 2>&1 | tee /tmp/load.log
          loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
          if [ -z "$loaded" ]; then
            echo "::error::docker load did not report a loaded image"
            exit 1
          fi
          echo "Resolved loaded image reference: $loaded"
          echo "--- docker images after load ---"
          docker images
          if [ "$loaded" != "crabka-operator:e2e" ]; then
            docker tag "$loaded" crabka-operator:e2e
          fi
          kind load docker-image crabka-operator:e2e --name crabka-e2e
          echo "--- crictl images on kind node ---"
          docker exec crabka-e2e-control-plane crictl images

      - name: Load broker image into kind (via docker)
        run: |
          docker load -i crabka-broker.tar 2>&1 | tee /tmp/load-broker.log
          loaded=$(sed -n 's/^Loaded image: //p' /tmp/load-broker.log | head -1)
          if [ -z "$loaded" ]; then
            echo "::error::docker load did not report a loaded image"
            exit 1
          fi
          if [ "$loaded" != "crabka-broker:e2e" ]; then
            docker tag "$loaded" crabka-broker:e2e
          fi
          kind load docker-image crabka-broker:e2e --name crabka-e2e

      - name: Install prometheus-operator CRDs (PodMonitor + ServiceMonitor)
        run: |
          # Renovate: datasource=github-tags depName=prometheus-operator/prometheus-operator
          PROM_OP_TAG=v0.79.2
          kubectl apply -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OP_TAG}/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OP_TAG}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"

      - name: Install CRDs
        run: |
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml

      - name: Install chart
        run: |
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator \
            --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker \
            --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent

      - name: Wait for operator rollout
        run: |
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      - name: Apply Kafka + KafkaNodePool
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            config:
              log.retention.hours: "24"
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
            template:
              metadata:
                labels:
                  team: platform
                annotations:
                  crabka.io/test-anno: "yes"
              tolerations:
                - key: dedicated
                  operator: Exists
                  effect: NoSchedule
              nodeSelector:
                kubernetes.io/os: linux
          EOF

      - name: Wait for Ready=True
        run: |
          for i in $(seq 1 60); do
            status=$(kubectl get kafka demo -n default -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            ready=$(kubectl get kafka demo -n default -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            echo "attempt $i: status=$status readyReplicas=$ready"
            if [ "$status" = "True" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Kafka 'demo' did not become Ready in 5 minutes"
          kubectl describe kafka demo -n default
          kubectl describe kafkanodepool brokers -n default
          kubectl describe sts demo-brokers -n default
          kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Assert CA + broker keystore Secrets exist
        run: |
          kubectl get secret demo-cluster-ca-cert demo-clients-ca-cert demo-kafka-brokers -n default
          kubectl exec -n default demo-brokers-0 -c broker -- ls /etc/crabka/cluster-ca /etc/crabka/clients-ca /etc/crabka/broker-tls

      - name: Smoke — broker binary launched in pod
        run: |
          kubectl exec -n default demo-brokers-0 -c broker -- /usr/bin/crabka-broker --version
          kubectl logs -n default demo-brokers-0 -c broker | grep -q 'crabka-broker listening'

      - name: Smoke — pod template values applied
        run: |
          set -e
          team=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.labels.team}')
          [ "$team" = "platform" ] || { echo "::error::team label missing, got '$team'"; exit 1; }

          anno=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.annotations.crabka\.io/test-anno}')
          [ "$anno" = "yes" ] || { echo "::error::annotation missing, got '$anno'"; exit 1; }

          ns=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.nodeSelector.kubernetes\.io/os}')
          [ "$ns" = "linux" ] || { echo "::error::nodeSelector missing, got '$ns'"; exit 1; }

          tol_key=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.tolerations[?(@.key=="dedicated")].key}')
          [ "$tol_key" = "dedicated" ] || { echo "::error::toleration missing"; exit 1; }

      - name: Smoke — broker bound a PersistentVolumeClaim
        run: |
          set -e
          # PVC name pattern: <volumeClaimTemplate.name>-<sts>-<ordinal>
          phase=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.status.phase}')
          [ "$phase" = "Bound" ] || { echo "::error::PVC not Bound: $phase"; kubectl describe pvc data-demo-brokers-0 -n default; exit 1; }
          cap=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.status.capacity.storage}')
          echo "PVC bound, capacity=$cap"
          instance_label=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.metadata.labels.app\.kubernetes\.io/instance}')
          [ "$instance_label" = "demo" ] || { echo "::error::PVC missing instance label: '$instance_label'"; exit 1; }

      - name: Smoke — JBOD multi-disk pool (slice 46)
        run: |
          set -e
          # Isolated cluster in its own namespace so it doesn't perturb the
          # `demo` flow or the GC probe. The operator is cluster-scoped, so it
          # reconciles `jbod` too. Two 1Gi disks -> two PVCs per pod.
          kubectl create namespace jbod
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: jdemo
            namespace: jbod
          spec:
            kafkaVersion: "0.1.1"
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: jbod
            labels:
              crabka.io/cluster: jdemo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: Jbod
              deleteClaim: true
              volumes:
                - id: 0
                  size: 1Gi
                - id: 1
                  size: 1Gi
          EOF

          for i in $(seq 1 60); do
            status=$(kubectl get kafka jdemo -n jbod -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: jbod status=$status"
            [ "$status" = "True" ] && break
            sleep 5
          done
          if [ "$status" != "True" ]; then
            echo "::error::JBOD Kafka 'jdemo' did not become Ready"
            kubectl describe kafka jdemo -n jbod || true
            kubectl describe kafkanodepool brokers -n jbod || true
            kubectl describe sts jdemo-brokers -n jbod || true
            kubectl logs -n jbod jdemo-brokers-0 -c broker --tail=200 || true
            exit 1
          fi

          # Both PVCs bind. Pattern: <vct-name>-<sts>-<ordinal>.
          for pvc in data-jdemo-brokers-0 data-1-jdemo-brokers-0; do
            phase=$(kubectl get pvc "$pvc" -n jbod -o jsonpath='{.status.phase}')
            [ "$phase" = "Bound" ] || { echo "::error::PVC $pvc not Bound: $phase"; kubectl get pvc -n jbod; exit 1; }
            echo "PVC $pvc Bound"
          done

          # Both disks are mounted in the broker container, and the broker is
          # told about the extra disk via CRABKA_EXTRA_LOG_DIRS.
          kubectl exec -n jbod jdemo-brokers-0 -c broker -- ls -d /var/lib/crabka/data /var/lib/crabka/data-1
          envval=$(kubectl get pod jdemo-brokers-0 -n jbod -o jsonpath='{.spec.containers[?(@.name=="broker")].env[?(@.name=="CRABKA_EXTRA_LOG_DIRS")].value}')
          [ "$envval" = "/var/lib/crabka/data-1" ] || { echo "::error::CRABKA_EXTRA_LOG_DIRS='$envval' (want /var/lib/crabka/data-1)"; exit 1; }
          echo "JBOD wiring verified: extra log dir = $envval"

          # Tear down so the second broker pod frees resources before the rest
          # of the job (the kind cluster is shared across steps).
          kubectl delete namespace jbod --wait=false || true

      - name: Smoke — config change rolls broker pod
        run: |
          set -e
          initial_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          initial_rev=$(kubectl get sts demo-brokers -n default -o jsonpath='{.status.currentRevision}')
          echo "before: uid=$initial_uid rev=$initial_rev"

          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"config":{"log.retention.hours":"48"}}}'

          # Wait up to 90s for the pod's UID to change (replacement).
          for i in $(seq 1 45); do
            current_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            echo "attempt $i: uid=$current_uid"
            if [ -n "$current_uid" ] && [ "$current_uid" != "$initial_uid" ]; then
              break
            fi
            sleep 2
          done

          if [ "$current_uid" = "$initial_uid" ]; then
            echo "::error::pod UID didn't change within 90s (initial=$initial_uid)"
            kubectl describe pod demo-brokers-0 -n default || true
            kubectl describe sts demo-brokers -n default || true
            exit 1
          fi

          # Wait for the new pod to reach Ready.
          if ! kubectl wait --for=condition=Ready -n default pod/demo-brokers-0 --timeout=120s; then
            echo "::error::rolled pod did not become Ready within 120s"
            kubectl describe pod demo-brokers-0 -n default || true
            kubectl logs -n default demo-brokers-0 -c format --tail=200 || true
            kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
            kubectl logs -n default demo-brokers-0 -c broker --previous --tail=200 || true
            kubectl get configmap demo-broker-config -n default -o yaml || true
            exit 1
          fi

          final_rev=$(kubectl get sts demo-brokers -n default -o jsonpath='{.status.currentRevision}')
          [ "$final_rev" != "$initial_rev" ] || { echo "::error::sts revision didn't change ($initial_rev -> $final_rev)"; exit 1; }
          echo "rolled: $initial_rev -> $final_rev"

      - name: Smoke — metadata.version rendered + invalid pin rejected
        run: |
          set -e
          # kafkaVersion 0.1.1 default-tracks metadata.version 0.1; the
          # operator injects it into the broker config.
          cm=$(kubectl get configmap demo-broker-config -n default -o jsonpath='{.data.broker-0\.toml}')
          # render_broker_toml emits server_properties with quoted keys:
          #   "metadata.version" = "0.1"
          echo "$cm" | grep -F '"metadata.version" = "0.1"' \
            || { echo "::error::broker config missing metadata.version=0.1"; echo "$cm"; exit 1; }

          # An invalid (too-high) metadata version must be rejected: the
          # operator surfaces KafkaVersionValid=False and does NOT roll.
          pre_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"metadataVersion":"99.0"}}'

          ok=""
          for i in $(seq 1 30); do
            reason=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="KafkaVersionValid")].reason}' 2>/dev/null || true)
            status=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="KafkaVersionValid")].status}' 2>/dev/null || true)
            echo "attempt $i: KafkaVersionValid status=$status reason=$reason"
            if [ "$status" = "False" ] && [ "$reason" = "MetadataVersionTooHigh" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::KafkaVersionValid did not become False/MetadataVersionTooHigh"; kubectl get kafka demo -n default -o yaml; exit 1; }

          # The rejected version must not be written to the broker config and
          # must not roll the pod.
          cm=$(kubectl get configmap demo-broker-config -n default -o jsonpath='{.data.broker-0\.toml}')
          echo "$cm" | grep -F '"metadata.version" = "99.0"' \
            && { echo "::error::rejected metadata.version was written to broker config"; exit 1; } || true
          post_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          [ "$pre_uid" = "$post_uid" ] || { echo "::error::invalid metadata pin rolled the pod ($pre_uid -> $post_uid)"; exit 1; }
          echo "invalid metadata.version rejected without rolling"

          # Reset to a valid pin so later steps run against a clean spec.
          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"metadataVersion":null}}'

      - name: Smoke — spec.logging renders RUST_LOG into broker config + pod env
        run: |
          set -e
          # Inline logging composes a sorted RUST_LOG env-filter from the
          # loggers map: root=info -> bare `info`, crabka_broker=debug ->
          # `crabka_broker=debug`, sorted => "crabka_broker=debug,info".
          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"logging":{"type":"inline","loggers":{"root":"info","crabka_broker":"debug"}}}}'

          ok=""
          for i in $(seq 1 30); do
            rl=$(kubectl get configmap demo-broker-config -n default \
              -o jsonpath='{.data.rust\.log}' 2>/dev/null || true)
            status=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="LoggingReady")].status}' 2>/dev/null || true)
            echo "attempt $i: rust.log='$rl' LoggingReady=$status"
            if [ "$rl" = "crabka_broker=debug,info" ] && [ "$status" = "True" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "::error::rust.log not rendered or LoggingReady!=True"; kubectl get configmap demo-broker-config -n default -o yaml; kubectl get kafka demo -n default -o yaml; exit 1; }

          # The broker pod template references rust.log via configMapKeyRef so
          # a config-hash roll re-reads the value at restart.
          cmref=$(kubectl get sts demo-brokers -n default \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="broker")].env[?(@.name=="RUST_LOG")].valueFrom.configMapKeyRef.name}')
          cmkey=$(kubectl get sts demo-brokers -n default \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="broker")].env[?(@.name=="RUST_LOG")].valueFrom.configMapKeyRef.key}')
          [ "$cmref" = "demo-broker-config" ] || { echo "::error::RUST_LOG env not wired to configMapKeyRef (name='$cmref')"; exit 1; }
          [ "$cmkey" = "rust.log" ] || { echo "::error::RUST_LOG configMapKeyRef key wrong: '$cmkey'"; exit 1; }
          echo "logging wired: RUST_LOG -> $cmref/$cmkey"

          # Reset so later steps run against a clean spec (no RUST_LOG env).
          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"logging":null}}'

      - name: Smoke — NodePort listener exposes per-broker + bootstrap Services
        run: |
          set -e
          # Apply a Kafka with internal + NodePort listeners alongside the
          # existing `demo` cluster. Uses a separate pool so we can keep
          # the GC test on `demo` working independently.
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: ext
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: external
                port: 9094
                type: nodeport
                tls: false
                configuration:
                  bootstrap:
                    nodePort: 32099
                  brokers:
                    - broker: 10
                      nodePort: 32100
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: ext-broker
            namespace: default
            labels:
              crabka.io/cluster: ext
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 10
          EOF

          # Wait for ListenersReady=True (covers Service creation + status
          # readback through the apiserver).
          for i in $(seq 1 60); do
            valid=$(kubectl get kafka ext -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersValid")].status}' 2>/dev/null || true)
            ready=$(kubectl get kafka ext -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersReady")].status}' 2>/dev/null || true)
            echo "attempt $i: ListenersValid=$valid ListenersReady=$ready"
            if [ "$valid" = "True" ] && [ "$ready" = "True" ]; then break; fi
            sleep 5
          done
          if [ "$valid" != "True" ] || [ "$ready" != "True" ]; then
            echo "::error::ListenersValid/ListenersReady never reached True"
            kubectl describe kafka ext -n default
            kubectl get svc -n default -l app.kubernetes.io/instance=ext
            exit 1
          fi

          # Per-broker NodePort Service has the user-supplied nodePort.
          np=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.ports[0].nodePort}')
          [ "$np" = "32100" ] || { echo "::error::per-broker nodePort got $np, want 32100"; exit 1; }
          stype=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.type}')
          [ "$stype" = "NodePort" ] || { echo "::error::per-broker Service type got $stype, want NodePort"; exit 1; }

          # Bootstrap NodePort Service has the configured bootstrap nodePort.
          bnp=$(kubectl get svc ext-external-bootstrap -n default -o jsonpath='{.spec.ports[0].nodePort}')
          [ "$bnp" = "32099" ] || { echo "::error::bootstrap nodePort got $bnp, want 32099"; exit 1; }

          # Per-broker Service pins selector to the StatefulSet's pod-name label.
          sel=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.selector.statefulset\.kubernetes\.io/pod-name}')
          [ "$sel" = "ext-ext-broker-0" ] || { echo "::error::per-broker selector got $sel, want ext-ext-broker-0"; exit 1; }

          # status.listeners[name=external] surfaces the bootstrap address.
          bs=$(kubectl get kafka ext -n default -o jsonpath='{.status.listeners[?(@.name=="external")].bootstrapServers}')
          [ -n "$bs" ] || { echo "::error::status.listeners[external].bootstrapServers empty"; exit 1; }
          echo "status.listeners[external].bootstrapServers=$bs"

          # Owned-by-Kafka cleanup: deleting the Kafka should cascade to
          # the external Services via owner-ref.
          kubectl delete kafka ext -n default --wait=false
          for i in $(seq 1 30); do
            svcs=$(kubectl get svc -n default -l app.kubernetes.io/instance=ext -o name 2>/dev/null | wc -l)
            echo "attempt $i: ext svcs=$svcs"
            if [ "$svcs" = "0" ]; then break; fi
            sleep 2
          done
          [ "$svcs" = "0" ] || { echo "::error::external Services not GC'd after Kafka delete"; kubectl get svc -n default -l app.kubernetes.io/instance=ext; exit 1; }
          kubectl delete knp ext-broker -n default --ignore-not-found

      - name: Smoke — LoadBalancer listener pulls an IP from MetalLB
        run: |
          set -e
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: lb
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: cloud
                port: 9095
                type: loadbalancer
                tls: false
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: lb-broker
            namespace: default
            labels:
              crabka.io/cluster: lb
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 20
          EOF

          # MetalLB may take a few seconds to allocate. Wait for ListenersReady=True.
          for i in $(seq 1 60); do
            ready=$(kubectl get kafka lb -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersReady")].status}' 2>/dev/null || true)
            echo "attempt $i: ListenersReady=$ready"
            if [ "$ready" = "True" ]; then break; fi
            sleep 5
          done
          if [ "$ready" != "True" ]; then
            echo "::error::ListenersReady never reached True for LoadBalancer listener"
            kubectl describe kafka lb -n default
            kubectl get svc -n default -l app.kubernetes.io/instance=lb
            kubectl describe svc lb-cloud-bootstrap -n default || true
            kubectl logs -n metallb-system deploy/controller --tail=200 || true
            exit 1
          fi

          # The per-broker Service has type=LoadBalancer and MetalLB
          # populated `status.loadBalancer.ingress[0].ip`.
          stype=$(kubectl get svc lb-cloud-20 -n default -o jsonpath='{.spec.type}')
          [ "$stype" = "LoadBalancer" ] || { echo "::error::per-broker type=$stype, want LoadBalancer"; exit 1; }
          ip=$(kubectl get svc lb-cloud-20 -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$ip" ] || { echo "::error::per-broker LB IP empty"; kubectl describe svc lb-cloud-20 -n default; exit 1; }
          echo "per-broker LB IP: $ip"

          # Bootstrap Service also has an IP.
          bip=$(kubectl get svc lb-cloud-bootstrap -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$bip" ] || { echo "::error::bootstrap LB IP empty"; exit 1; }
          echo "bootstrap LB IP: $bip"

          # status.listeners reflects the bootstrap IP + the listener port.
          bs=$(kubectl get kafka lb -n default -o jsonpath='{.status.listeners[?(@.name=="cloud")].bootstrapServers}')
          [ "$bs" = "${bip}:9095" ] || { echo "::error::status.listeners[cloud].bootstrapServers got '$bs', want '${bip}:9095'"; exit 1; }

          # Cascade-delete via owner-ref.
          kubectl delete kafka lb -n default --wait=false
          for i in $(seq 1 30); do
            svcs=$(kubectl get svc -n default -l app.kubernetes.io/instance=lb -o name 2>/dev/null | wc -l)
            echo "attempt $i: lb svcs=$svcs"
            if [ "$svcs" = "0" ]; then break; fi
            sleep 2
          done
          [ "$svcs" = "0" ] || { echo "::error::LB Services not GC'd"; exit 1; }
          kubectl delete knp lb-broker -n default --ignore-not-found

      - name: Enable PodMonitor via Kafka.spec.metricsConfig
        run: |
          set -e
          initial_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          echo "before metricsConfig patch: uid=$initial_uid"

          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"metricsConfig":{"podMonitor":{"interval":"15s"}}}}'

          # MetricsReady=True lands as soon as the operator applies the
          # PodMonitor — which happens before the pod itself rolls. Wait
          # for it as a first gate.
          kubectl wait kafka/demo -n default \
            --for=condition=MetricsReady=True --timeout=120s

          # Enabling metricsConfig changes the broker pod template (adds
          # the metrics container port + --metrics-listen-addr flag) so
          # the StatefulSet controller rolls the pod. Wait for the pod's
          # UID to change so the subsequent smoke checks observe the new
          # pod, not the stale one.
          for i in $(seq 1 60); do
            current_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            echo "attempt $i: uid=$current_uid"
            if [ -n "$current_uid" ] && [ "$current_uid" != "$initial_uid" ]; then
              break
            fi
            sleep 2
          done
          if [ "$current_uid" = "$initial_uid" ]; then
            echo "::error::metricsConfig patch did not roll the broker pod within 120s (uid still=$initial_uid)"
            kubectl describe kafka demo -n default || true
            kubectl describe sts demo-brokers -n default || true
            kubectl get configmap demo-broker-config -n default -o yaml || true
            exit 1
          fi

          kubectl wait --for=condition=Ready -n default pod/demo-brokers-0 --timeout=180s

      - name: Smoke — PodMonitor rendered
        run: |
          set -e
          port=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].port}')
          [ "$port" = "metrics" ] || { echo "::error::PodMonitor port wrong: '$port'"; exit 1; }
          interval=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].interval}')
          [ "$interval" = "15s" ] || { echo "::error::interval wrong: '$interval'"; exit 1; }
          path=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].path}')
          [ "$path" = "/metrics" ] || { echo "::error::path wrong: '$path'"; exit 1; }

      - name: Smoke — broker pod exposes metrics container port
        run: |
          set -e
          port=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.containers[?(@.name=="broker")].ports[?(@.name=="metrics")].containerPort}')
          [ "$port" = "9404" ] || { echo "::error::metrics port wrong: '$port'"; exit 1; }

      - name: Smoke — /metrics endpoint exposes crabka_broker_ metrics
        run: |
          set -e
          # Use a one-shot curl pod inside the cluster to scrape the broker's
          # /metrics endpoint via its pod DNS name.
          kubectl run curl-metrics -n default --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --quiet -- \
            -sf "http://demo-brokers-0.demo-broker-headless.default.svc.cluster.local:9404/metrics" \
            > /tmp/metrics.out
          grep -q '^# TYPE crabka_broker' /tmp/metrics.out || {
            echo "::error::crabka_broker_* metrics not exposed; first 20 lines of output:"
            head -20 /tmp/metrics.out
            exit 1
          }

      - name: Garbage-collection on Kafka delete
        run: |
          kubectl delete kafka demo -n default --wait=false
          for i in $(seq 1 30); do
            knp=$(kubectl get knp -n default -o name 2>/dev/null | wc -l)
            owned=$(kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo -o name 2>/dev/null | wc -l)
            pvcs=$(kubectl get pvc -n default -l app.kubernetes.io/instance=demo -o name 2>/dev/null | wc -l)
            echo "attempt $i: knp=$knp owned=$owned pvcs=$pvcs"
            if [ "$knp" = "0" ] && [ "$owned" = "0" ] && [ "$pvcs" = "0" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::owned objects not GC'd within 60s"
          kubectl get knp -n default
          kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo
          kubectl get pvc -n default
          exit 1

      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/operator-e2e-diag
          DIAG=/tmp/operator-e2e-diag/diagnostics.md
          {
            echo "## operator-e2e diagnostics (run \`${GITHUB_RUN_ID}\`)"
            echo
            echo "### Critical findings"
            pod_phase=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
            pod_reason=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' 2>/dev/null)
            pod_msg=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.message}' 2>/dev/null)
            pod_image=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null)
            last_term=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated}' 2>/dev/null)
            echo "- pod phase: \`${pod_phase:-unknown}\`"
            echo "- container image (spec): \`${pod_image:-(none)}\`"
            echo "- waiting reason: \`${pod_reason:-(none)}\`"
            echo "- waiting message: \`${pod_msg:-(none)}\`"
            echo "- last terminated: \`${last_term:-(none)}\`"
            echo "::error::operator pod phase=${pod_phase:-unknown} reason=${pod_reason:-none} image=${pod_image:-none}"
            echo
            for section in \
              "pods|kubectl get pods -A -o wide" \
              "events|kubectl get events -A --sort-by=.lastTimestamp" \
              "describe deploy|kubectl describe deploy/operator-crabka-operator -n crabka-operator" \
              "describe pods|kubectl describe pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator" \
              "operator logs|kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500" \
              "operator logs (previous)|kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500 --previous" \
              "kafka CR|kubectl get kafka demo -n default -o yaml" \
              "kafkanodepool|kubectl get knp -A -o yaml" \
              "broker sts|kubectl get sts demo-brokers -n default -o yaml" \
              "broker pod logs|kubectl logs -n default demo-brokers-0 -c broker --tail=500 || true" \
              "broker init logs|kubectl logs -n default demo-brokers-0 -c format --tail=500 || true" \
              "owned objects|kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo -o yaml" \
              "pvcs|kubectl get pvc -n default -o yaml" \
              "kind node images|docker exec crabka-e2e-control-plane crictl images" \
              "host images|docker images"
            do
              title=${section%%|*}
              cmd=${section#*|}
              echo "### ${title}"
              echo '```'
              eval "$cmd" 2>&1
              echo '```'
              echo
            done
          } > "$DIAG"
          # Surface a short summary in the job log so the failure cause is
          # visible without downloading the artifact.
          echo "::group::diagnostics summary"
          head -40 "$DIAG"
          echo "..."
          echo "(full diagnostics uploaded as artifact 'operator-e2e-diagnostics')"
          echo "::endgroup::"

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-diagnostics
          path: /tmp/operator-e2e-diag/
          retention-days: 14
          if-no-files-found: ignore

  kind-network-policy:
    needs: [build-images, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.operator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster (Calico, no default CNI)
        run: |
          cat <<EOF > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: crabka-np-e2e
          networking:
            disableDefaultCNI: true
            podSubnet: "192.168.0.0/16"
          nodes:
          - role: control-plane
          EOF
          kind create cluster --config /tmp/kind-config.yaml \
            --image kindest/node:v1.30.0 \
            --wait 60s || true

      - name: Install Calico
        run: |
          set -e
          # Pinned to a known-good release; renovate can keep this fresh.
          # Renovate: datasource=github-tags depName=projectcalico/calico
          CALICO_TAG=v3.28.2
          kubectl apply --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_TAG}/manifests/tigera-operator.yaml"
          # Wait for the tigera-operator deployment to come up so the
          # `Installation` CRD is admitted.
          kubectl rollout status -n tigera-operator deploy/tigera-operator --timeout=180s

          cat <<EOF | kubectl apply -f -
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: 192.168.0.0/16
                encapsulation: VXLANCrossSubnet
          EOF

          # Wait for calico-node DaemonSet to be ready on every node.
          for i in $(seq 1 60); do
            ready=$(kubectl get ds -n calico-system calico-node \
              -o jsonpath='{.status.numberReady}' 2>/dev/null || echo 0)
            desired=$(kubectl get ds -n calico-system calico-node \
              -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null || echo 1)
            echo "calico-node ready=$ready desired=$desired"
            if [ "$ready" != "0" ] && [ "$ready" = "$desired" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::calico-node never became Ready"
          kubectl get pods -n calico-system
          exit 1

      - name: Load operator + broker images into kind
        run: |
          set -e
          for tar in crabka-operator.tar crabka-broker.tar; do
            docker load -i "$tar" 2>&1 | tee /tmp/load.log
            loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
            want=$(basename "$tar" .tar):e2e
            if [ "$loaded" != "$want" ]; then docker tag "$loaded" "$want"; fi
            kind load docker-image "$want" --name crabka-np-e2e
          done

      - name: Install CRDs + chart
        run: |
          set -e
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      - name: Create labeled and unlabeled client namespaces
        run: |
          set -e
          kubectl create namespace clients
          kubectl label namespace clients role=clients
          # `default` is already present and unlabeled.

      - name: Apply Kafka with networkPolicy + peer-restricted listener
        run: |
          set -e
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata: { name: demo, namespace: default }
          spec:
            kafkaVersion: "0.1.1"
            listeners:
            - name: PLAIN
              port: 9092
              type: internal
              tls: false
              networkPolicyPeers:
              - namespaceSelector:
                  matchLabels:
                    role: clients
            interBrokerListenerName: PLAIN
            networkPolicy: {}
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels: { crabka.io/cluster: demo }
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
          EOF

      - name: Wait NetworkPolicyReady=True
        run: |
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="NetworkPolicyReady")].status}' 2>/dev/null || true)
            echo "attempt $i: NetworkPolicyReady=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::NetworkPolicyReady never True"
          kubectl describe kafka demo -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      - name: Verify the NetworkPolicy is present
        run: |
          set -e
          kubectl get networkpolicy demo-broker-policy -n default
          kubectl get networkpolicy demo-broker-policy -n default -o yaml

      - name: Wait for broker Ready
        run: |
          for i in $(seq 1 60); do
            phase=$(kubectl get pod demo-brokers-0 -n default \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            cond=$(kubectl get pod demo-brokers-0 -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: phase=$phase ready=$cond"
            if [ "$cond" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::broker pod never became Ready"
          kubectl describe pod demo-brokers-0 -n default
          exit 1

      - name: Probe from a LABELED namespace (must succeed)
        run: |
          set -e
          kubectl run nc-allowed -n clients --image=alpine:3 --restart=Never -- \
            sh -c 'apk add --no-cache busybox-extras > /dev/null && \
                   nc -zv -w 5 demo-broker-headless.default.svc.cluster.local 9092'
          # Wait for completion; expect exit 0.
          for i in $(seq 1 30); do
            status=$(kubectl get pod nc-allowed -n clients -o jsonpath='{.status.phase}')
            echo "nc-allowed status=$status"
            if [ "$status" = "Succeeded" ]; then exit 0; fi
            if [ "$status" = "Failed" ]; then
              kubectl logs -n clients nc-allowed
              echo "::error::labeled-ns client should have reached broker"
              exit 1
            fi
            sleep 3
          done
          echo "::error::nc-allowed never completed"
          kubectl logs -n clients nc-allowed
          exit 1

      - name: Probe from an UNLABELED namespace (must fail)
        run: |
          set -e
          # Run with a short connect timeout so the probe terminates cleanly.
          kubectl run nc-denied -n default --image=alpine:3 --restart=Never -- \
            sh -c 'apk add --no-cache busybox-extras > /dev/null && \
                   nc -zv -w 5 demo-broker-headless.default.svc.cluster.local 9092; echo exit=$?'
          for i in $(seq 1 30); do
            status=$(kubectl get pod nc-denied -n default -o jsonpath='{.status.phase}')
            echo "nc-denied status=$status"
            if [ "$status" = "Succeeded" ] || [ "$status" = "Failed" ]; then break; fi
            sleep 3
          done
          logs=$(kubectl logs -n default nc-denied)
          echo "$logs"
          # Calico drops the SYN: nc reports "Connection timed out" and the
          # `exit=` line is non-zero (commonly 1).
          if echo "$logs" | grep -q 'exit=0'; then
            echo "::error::unlabeled-ns client unexpectedly connected"
            exit 1
          fi

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/np-diag
          {
            echo "## kind-network-policy diagnostics"
            kubectl get pods -A -o wide
            echo "### operator logs"
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500
            echo "### kafka CR"
            kubectl get kafka demo -n default -o yaml
            echo "### NetworkPolicy"
            kubectl get networkpolicy demo-broker-policy -n default -o yaml
            echo "### broker logs"
            kubectl logs -n default demo-brokers-0 --tail=200 --all-containers
            echo "### nc-allowed logs"
            kubectl logs -n clients nc-allowed
            echo "### nc-denied logs"
            kubectl logs -n default nc-denied
          } > /tmp/np-diag/diagnostics.md

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-network-policy-diagnostics
          path: /tmp/np-diag/
          retention-days: 14
          if-no-files-found: ignore

  kind-kafkatopic:
    needs: [build-images, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.operator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-kt-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Load images into kind
        run: |
          set -e
          for tar in crabka-operator.tar crabka-broker.tar; do
            docker load -i "$tar" 2>&1 | tee /tmp/load.log
            loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
            want=$(basename "$tar" .tar):e2e
            if [ "$loaded" != "$want" ]; then docker tag "$loaded" "$want"; fi
            kind load docker-image "$want" --name crabka-kt-e2e
          done

      - name: Install CRDs + chart
        run: |
          set -e
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkatopics.yaml
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      - name: Apply Kafka cluster + wait Ready
        run: |
          set -e
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata: { name: demo, namespace: default }
          spec:
            kafkaVersion: "0.1.1"
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels: { crabka.io/cluster: demo }
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
          EOF
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: Ready=$s"
            if [ "$s" = "True" ]; then break; fi
            sleep 5
          done
          [ "$s" = "True" ] || { echo "::error::Kafka not Ready"; exit 1; }

      - name: Apply KafkaTopic
        run: |
          set -e
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: KafkaTopic
          metadata:
            name: demo-topic
            namespace: default
            labels: { crabka.io/cluster: demo }
          spec:
            partitions: 3
            replicas: 1
            config:
              retention.ms: "60000"
          EOF

      - name: Wait KafkaTopic Ready
        run: |
          for i in $(seq 1 30); do
            s=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            r=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].reason}' 2>/dev/null || true)
            echo "attempt $i: status=$s reason=$r"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::KafkaTopic never Ready"
          kubectl describe kafkatopic demo-topic -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      - name: Assert partition count + config via JVM kafka-topics
        run: |
          set -e
          bootstrap="demo-broker-headless.default.svc.cluster.local:9092"
          kubectl run kt-describe -n default --rm -i --restart=Never \
            --image=apache/kafka:3.8.0 --command -- \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" \
              --describe --topic demo-topic > /tmp/describe.txt
          cat /tmp/describe.txt
          grep -q "PartitionCount: 3" /tmp/describe.txt
          grep -q "ReplicationFactor: 1" /tmp/describe.txt
          kubectl run kt-configs -n default --rm -i --restart=Never \
            --image=apache/kafka:3.8.0 --command -- \
            /opt/kafka/bin/kafka-configs.sh --bootstrap-server "$bootstrap" \
              --describe --entity-type topics --entity-name demo-topic > /tmp/configs.txt
          cat /tmp/configs.txt
          grep -q "retention.ms=60000" /tmp/configs.txt

      - name: Patch to 5 partitions + wait Ready
        run: |
          set -e
          kubectl patch kafkatopic demo-topic -n default --type=merge \
            -p '{"spec":{"partitions":5}}'
          for i in $(seq 1 30); do
            s=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            g=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.observedGeneration}')
            gen=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.metadata.generation}')
            echo "attempt $i: status=$s observed=$g generation=$gen"
            if [ "$s" = "True" ] && [ "$g" = "$gen" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::partition increase never settled"
          exit 1

      - name: Assert 5 partitions visible to JVM tools
        run: |
          set -e
          bootstrap="demo-broker-headless.default.svc.cluster.local:9092"
          kubectl run kt-describe2 -n default --rm -i --restart=Never \
            --image=apache/kafka:3.8.0 --command -- \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" \
              --describe --topic demo-topic > /tmp/describe2.txt
          grep -q "PartitionCount: 5" /tmp/describe2.txt

      - name: Patch to 2 partitions, expect ImmutableFieldChanged
        run: |
          set -e
          kubectl patch kafkatopic demo-topic -n default --type=merge \
            -p '{"spec":{"partitions":2}}'
          for i in $(seq 1 20); do
            r=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].reason}' 2>/dev/null || true)
            echo "attempt $i: reason=$r"
            if [ "$r" = "ImmutableFieldChanged" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::partition decrease did not surface ImmutableFieldChanged"
          kubectl describe kafkatopic demo-topic -n default
          exit 1

      - name: Restore partitions and delete CRD
        run: |
          set -e
          kubectl patch kafkatopic demo-topic -n default --type=merge \
            -p '{"spec":{"partitions":5}}'
          # Wait for Ready=True after restore.
          for i in $(seq 1 20); do
            s=$(kubectl get kafkatopic demo-topic -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$s" = "True" ]; then break; fi
            sleep 3
          done
          kubectl delete kafkatopic demo-topic -n default
          # Wait for topic to actually disappear from Kafka.
          bootstrap="demo-broker-headless.default.svc.cluster.local:9092"
          for i in $(seq 1 20); do
            kubectl run kt-list-$i -n default --rm -i --restart=Never \
              --image=apache/kafka:3.8.0 --command -- \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" \
                --list > /tmp/list.txt
            if ! grep -q "demo-topic" /tmp/list.txt; then exit 0; fi
            sleep 3
          done
          echo "::error::topic still present after CRD delete"
          cat /tmp/list.txt
          exit 1

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/kt-diag
          {
            echo "## kind-kafkatopic diagnostics"
            kubectl get pods -A -o wide
            echo "### operator logs"
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500
            echo "### kafka"
            kubectl get kafka demo -n default -o yaml
            echo "### kafkatopic"
            kubectl get kafkatopic demo-topic -n default -o yaml || true
            echo "### broker logs"
            kubectl logs -n default demo-brokers-0 --tail=200 --all-containers || true
          } > /tmp/kt-diag/diagnostics.md

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-kafkatopic-diagnostics
          path: /tmp/kt-diag/
          retention-days: 14
          if-no-files-found: ignore

  kind-listener-auth:
    needs: [build-images, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.operator == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-auth-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Load images into kind
        run: |
          set -e
          for tar in crabka-operator.tar crabka-broker.tar; do
            docker load -i "$tar" 2>&1 | tee /tmp/load.log
            loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
            want=$(basename "$tar" .tar):e2e
            if [ "$loaded" != "$want" ]; then docker tag "$loaded" "$want"; fi
            kind load docker-image "$want" --name crabka-auth-e2e
          done

      - name: Install CRDs + chart
        run: |
          set -e
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkausers.yaml
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      # ─────────────────────────────────────────────────────────────────────
      # Scenario 1: SCRAM-SHA-512 over TLS, internal listener
      #
      # Cluster `demo` exposes two internal listeners:
      #   PLAIN:9092  — unauthenticated, used for inter-broker KRaft traffic
      #   scram:9094  — SCRAM-SHA-512 + TLS, tested here
      #
      # A KafkaUser `alice` is created with scram-sha-512 auth. The operator
      # provisions a Secret `alice` with keys `password` and `sasl.jaas.config`.
      # We verify that:
      #   • A producer using the correct JAAS creds can publish a record.
      #   • A producer with no credentials (SSL only, no SASL) is rejected.
      # ─────────────────────────────────────────────────────────────────────

      - name: Apply Kafka cluster with SCRAM-SHA-512 listener
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: scram
                port: 9094
                type: internal
                tls: true
                authentication:
                  type: scram-sha-512
            interBrokerListenerName: PLAIN
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
          EOF

      - name: Wait for Kafka demo Ready
        run: |
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Kafka demo did not become Ready in 5 minutes"
          kubectl describe kafka demo -n default
          kubectl describe kafkanodepool brokers -n default
          kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Apply KafkaUser alice (SCRAM-SHA-512)
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: KafkaUser
          metadata:
            name: alice
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            authentication:
              type: scram-sha-512
          EOF
          for i in $(seq 1 30); do
            s=$(kubectl get kafkauser alice -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: KafkaUser Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::KafkaUser alice did not become Ready in 90s"
          kubectl describe kafkauser alice -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      - name: Verify SCRAM-SHA-512 produce succeeds with correct credentials
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: scram-producer-ok
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        # Build a JKS truststore from the cluster CA certificate.
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        # Write client properties using the SCRAM password from the Secret.
                        PASSWORD=$(cat /etc/crabka/alice/password)
                        cat > /tmp/client.props <<INNER
                        security.protocol=SASL_SSL
                        sasl.mechanism=SCRAM-SHA-512
                        sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="alice" password="$PASSWORD";
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "scram-test-record" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9094 \
                            --topic scram-test \
                            --producer.config /tmp/client.props
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: alice-secret
                        mountPath: /etc/crabka/alice
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
                  - name: alice-secret
                    secret:
                      secretName: alice
          EOF
          kubectl wait job/scram-producer-ok -n default \
            --for=condition=complete --timeout=120s || {
            echo "::error::SCRAM producer job did not complete successfully"
            kubectl logs -n default -l job-name=scram-producer-ok --tail=100 || true
            exit 1
          }

      - name: Verify anonymous produce is rejected on SCRAM listener
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: scram-producer-anon
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        # SSL-only config — no SASL credentials at all.
                        cat > /tmp/client.props <<INNER
                        security.protocol=SSL
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        # The broker must reject this; we expect a non-zero exit.
                        echo "should-be-rejected" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9094 \
                            --topic scram-test \
                            --producer.config /tmp/client.props \
                            --request-timeout-ms 15000
                        echo "::error::anonymous produce unexpectedly succeeded"
                        exit 1
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
          EOF
          # Wait for the job to finish (either Succeeded or Failed).
          for i in $(seq 1 40); do
            complete=$(kubectl get job scram-producer-anon -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get job scram-producer-anon -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            echo "attempt $i: complete=$complete failed=$failed"
            if [ "$failed" = "True" ]; then
              echo "Anonymous produce was correctly rejected by the broker."
              exit 0
            fi
            if [ "$complete" = "True" ]; then
              echo "::error::anonymous produce job completed successfully — broker did not enforce SCRAM auth"
              kubectl logs -n default -l job-name=scram-producer-anon --tail=100 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::anonymous produce job did not terminate within 200s"
          kubectl describe job scram-producer-anon -n default || true
          kubectl logs -n default -l job-name=scram-producer-anon --tail=100 || true
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # Slice 34: cluster-CA key-rotation orchestration
      #
      # The `demo` cluster brought up above is TLS-enabled, so it already has
      # the cluster CA Secrets — reuse it rather than spinning up another. Its
      # SCRAM scenario is finished by this point, so rolling the broker here is
      # safe (the mTLS scenario below uses the independent `demo-mtls` cluster).
      #
      # Annotating the Kafka CR with `crabka.io/force-replace-ca-key` triggers a
      # staged, zero-downtime key replacement: the `demo-cluster-ca-cert` trust
      # bundle (key `ca.crt`) transits 1 cert -> 2 certs (distributing-trust) ->
      # 1 cert, the `demo-cluster-ca` key Secret's `crabka.io/ca-key-generation`
      # annotation increments by one, the broker StatefulSet rolls, and the
      # cluster returns to Ready=True with CaRotation back at status=False/Idle.
      # The operator reconciles on a 30s requeue and advances one roll per
      # phase, so the whole rotation takes a few minutes.
      # ─────────────────────────────────────────────────────────────────────

      - name: CA key rotation — assert initial single-cert trust bundle
        run: |
          set -e
          # Count BEGIN CERTIFICATE blocks in the base64-decoded ca.crt bundle.
          init_certs=$(kubectl get secret demo-cluster-ca-cert -n default \
            -o jsonpath='{.data.ca\.crt}' | base64 -d | grep -c 'BEGIN CERTIFICATE')
          echo "initial trust-bundle cert count: $init_certs"
          [ "$init_certs" = "1" ] || {
            echo "::error::expected exactly 1 CA cert in demo-cluster-ca-cert before rotation, got $init_certs"
            exit 1
          }

          # Record the starting key generation from the key Secret's annotation.
          init_gen=$(kubectl get secret demo-cluster-ca -n default \
            -o jsonpath='{.metadata.annotations.crabka\.io/ca-key-generation}' 2>/dev/null || true)
          echo "initial ca-key-generation: '$init_gen'"
          [ -n "$init_gen" ] || {
            echo "::error::demo-cluster-ca Secret missing crabka.io/ca-key-generation annotation"
            kubectl get secret demo-cluster-ca -n default -o yaml || true
            exit 1
          }
          # Persist for the assertion step.
          echo "INIT_CA_KEY_GEN=$init_gen" >> "$GITHUB_ENV"

      - name: CA key rotation — trigger force-replace-ca-key
        run: |
          set -e
          kubectl annotate kafka demo -n default \
            crabka.io/force-replace-ca-key=true --overwrite

      - name: CA key rotation — wait for staged rotation to settle
        run: |
          set -e
          # Best-effort: observe the trust bundle widen to 2 certs during the
          # distributing-trust phase. The intermediate window can be missed if a
          # reconcile lands between polls, so this is informational only — the
          # end-state assertions below are authoritative.
          saw_two=0
          # End-state: key generation incremented AND bundle back to 1 cert AND
          # CaRotation status=False/reason=Idle AND Ready=True. Generous timeout
          # (~8 min) to cover the multi-phase, one-roll-per-reconcile rollout.
          settled=0
          for i in $(seq 1 96); do
            certs=$(kubectl get secret demo-cluster-ca-cert -n default \
              -o jsonpath='{.data.ca\.crt}' 2>/dev/null | base64 -d 2>/dev/null | grep -c 'BEGIN CERTIFICATE' || echo 0)
            gen=$(kubectl get secret demo-cluster-ca -n default \
              -o jsonpath='{.metadata.annotations.crabka\.io/ca-key-generation}' 2>/dev/null || true)
            phase=$(kubectl get secret demo-cluster-ca-cert -n default \
              -o jsonpath='{.metadata.annotations.crabka\.io/ca-rotation-phase}' 2>/dev/null || true)
            rot=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="CaRotation")].status}' 2>/dev/null || true)
            rot_reason=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="CaRotation")].reason}' 2>/dev/null || true)
            ready=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: certs=$certs gen=$gen (init=$INIT_CA_KEY_GEN) phase='$phase' CaRotation=$rot/$rot_reason Ready=$ready"
            if [ "$certs" = "2" ]; then saw_two=1; fi
            if [ -n "$gen" ] && [ "$gen" != "$INIT_CA_KEY_GEN" ] \
              && [ "$certs" = "1" ] \
              && [ "$rot" = "False" ] && [ "$rot_reason" = "Idle" ] \
              && [ "$ready" = "True" ]; then
              settled=1
              break
            fi
            sleep 5
          done

          if [ "$saw_two" = "1" ]; then
            echo "observed distributing-trust phase (trust bundle reached 2 certs)"
          else
            echo "note: did not catch the 2-cert window (intermediate phase may have elapsed between polls)"
          fi

          if [ "$settled" != "1" ]; then
            echo "::error::CA key rotation did not settle within ~8 minutes"
            kubectl describe kafka demo -n default || true
            kubectl get secret demo-cluster-ca demo-cluster-ca-cert -n default -o yaml || true
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
            exit 1
          fi
          echo "CA key rotation settled: gen $INIT_CA_KEY_GEN -> $gen, bundle back to 1 cert, CaRotation=False/Idle, Ready=True"

      # ─────────────────────────────────────────────────────────────────────
      # Scenario 2: mTLS internal listener
      #
      # A second cluster `demo-mtls` is used so its clients CA is independent.
      # Listeners:
      #   PLAIN:9092  — unauthenticated, inter-broker only
      #   mtls:9095   — TLS mutual-auth (authentication: {type: tls})
      #
      # A KafkaUser `bob` with tls auth is created. The operator issues a cert
      # signed by the cluster's clients CA and writes a Secret `bob` containing
      # `user.crt`, `user.key`, and `ca.crt` (the clients CA certificate).
      # We verify that:
      #   • A producer presenting bob's cert (via PKCS12 keystore) can publish.
      #   • A producer with no client cert (SSL, trust-only) is rejected.
      # ─────────────────────────────────────────────────────────────────────

      - name: Apply Kafka cluster with mTLS listener
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo-mtls
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: mtls
                port: 9095
                type: internal
                tls: true
                authentication:
                  type: tls
            interBrokerListenerName: PLAIN
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: mtls-brokers
            namespace: default
            labels:
              crabka.io/cluster: demo-mtls
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 100
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
          EOF

      - name: Wait for Kafka demo-mtls Ready
        run: |
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo-mtls -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Kafka demo-mtls did not become Ready in 5 minutes"
          kubectl describe kafka demo-mtls -n default
          kubectl describe kafkanodepool mtls-brokers -n default
          kubectl logs -n default demo-mtls-mtls-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Apply KafkaUser bob (TLS)
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: KafkaUser
          metadata:
            name: bob
            namespace: default
            labels:
              crabka.io/cluster: demo-mtls
          spec:
            authentication:
              type: tls
          EOF
          for i in $(seq 1 30); do
            s=$(kubectl get kafkauser bob -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: KafkaUser bob Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::KafkaUser bob did not become Ready in 90s"
          kubectl describe kafkauser bob -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      - name: Verify mTLS produce succeeds with valid user certificate
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: mtls-producer-ok
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: pem-to-pkcs12
                    image: alpine:3.20
                    command:
                      - sh
                      - -c
                      - |
                        set -ex
                        apk add --no-cache openssl
                        openssl pkcs12 -export \
                          -in /etc/crabka/bob/user.crt \
                          -inkey /etc/crabka/bob/user.key \
                          -name bob \
                          -out /shared/keystore.p12 \
                          -passout pass:changeit
                        chmod 0644 /shared/keystore.p12
                    volumeMounts:
                      - name: bob-secret
                        mountPath: /etc/crabka/bob
                        readOnly: true
                      - name: shared
                        mountPath: /shared
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        cat > /tmp/client.props <<INNER
                        security.protocol=SSL
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        ssl.keystore.type=PKCS12
                        ssl.keystore.location=/shared/keystore.p12
                        ssl.keystore.password=changeit
                        INNER
                        echo "mtls-test-record" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-mtls-broker-headless.default.svc.cluster.local:9095 \
                            --topic mtls-test \
                            --producer.config /tmp/client.props
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: shared
                        mountPath: /shared
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-mtls-cluster-ca-cert
                  - name: bob-secret
                    secret:
                      secretName: bob
                  - name: shared
                    emptyDir: {}
          EOF
          kubectl wait job/mtls-producer-ok -n default \
            --for=condition=complete --timeout=120s || {
            echo "::error::mTLS producer job did not complete successfully"
            kubectl logs -n default -l job-name=mtls-producer-ok --all-containers --tail=100 || true
            exit 1
          }

      - name: Verify cert-less produce is rejected on mTLS listener
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: mtls-producer-nocert
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        # Trust-only: no keystore / no client cert.
                        cat > /tmp/client.props <<INNER
                        security.protocol=SSL
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "should-be-rejected" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-mtls-broker-headless.default.svc.cluster.local:9095 \
                            --topic mtls-test \
                            --producer.config /tmp/client.props \
                            --request-timeout-ms 15000
                        echo "::error::cert-less produce unexpectedly succeeded"
                        exit 1
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-mtls-cluster-ca-cert
          EOF
          for i in $(seq 1 40); do
            complete=$(kubectl get job mtls-producer-nocert -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get job mtls-producer-nocert -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            echo "attempt $i: complete=$complete failed=$failed"
            if [ "$failed" = "True" ]; then
              echo "Cert-less produce was correctly rejected by the mTLS listener."
              exit 0
            fi
            if [ "$complete" = "True" ]; then
              echo "::error::cert-less produce job completed successfully — broker did not enforce mTLS"
              kubectl logs -n default -l job-name=mtls-producer-nocert --tail=100 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::cert-less produce job did not terminate within 200s"
          kubectl describe job mtls-producer-nocert -n default || true
          kubectl logs -n default -l job-name=mtls-producer-nocert --tail=100 || true
          exit 1

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/auth-diag
          {
            echo "## kind-listener-auth diagnostics"
            kubectl get pods -A -o wide
            echo "### operator logs"
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500
            echo "### kafka demo"
            kubectl get kafka demo -n default -o yaml || true
            echo "### kafka demo-mtls"
            kubectl get kafka demo-mtls -n default -o yaml || true
            echo "### kafkausers"
            kubectl get kafkauser -n default -o yaml || true
            echo "### secrets (names only)"
            kubectl get secret -n default || true
            echo "### broker logs (demo)"
            kubectl logs -n default demo-brokers-0 --tail=200 --all-containers || true
            echo "### broker logs (demo-mtls)"
            kubectl logs -n default demo-mtls-mtls-brokers-0 --tail=200 --all-containers || true
            echo "### job logs (scram-producer-ok)"
            kubectl logs -n default -l job-name=scram-producer-ok --tail=100 || true
            echo "### job logs (scram-producer-anon)"
            kubectl logs -n default -l job-name=scram-producer-anon --tail=100 || true
            echo "### job logs (mtls-producer-ok)"
            kubectl logs -n default -l job-name=mtls-producer-ok --tail=100 || true
            echo "### job logs (mtls-producer-nocert)"
            kubectl logs -n default -l job-name=mtls-producer-nocert --tail=100 || true
          } > /tmp/auth-diag/diagnostics.md

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-listener-auth-diagnostics
          path: /tmp/auth-diag/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Slice 50: OAUTHBEARER listener + tls-external KafkaUser
  #
  # Stands up Bitnami Keycloak in-cluster (HTTP only — broker → IdP HTTPS
  # with a custom trust store is a 49c/50b problem), bootstraps a `kafka`
  # realm with a confidential client-credentials client (`kafka-client`,
  # granted scope `kafka.write`) and a second client without that scope
  # (`kafka-client-noscope`). Applies a `Kafka` CR with an OAuth listener
  # pointed at the in-cluster Keycloak Service, a `KafkaUser` named
  # `kafka-client` with `authentication.type: tls-external` (the operator
  # provisions ACLs only — no credentials), and a `KafkaTopic` `e2e`.
  #
  # Two Apache Kafka JVM `kafka-console-producer.sh` Jobs verify:
  #   • `kafka-client` (token carries `aud=kafka-broker` + `scope=kafka.write`)
  #     produces successfully to topic `e2e`.
  #   • `kafka-client-noscope` (token lacks `kafka.write`) is rejected with
  #     a SaslAuthenticationException at SASL-handshake time.
  #
  # Also asserts NO `WeakAuth` Warning Event was emitted on the `Kafka`
  # resource — all OAuth URLs are now `https://` (slice 50b).
  #
  # Gated to `push: main` + PRs labeled `e2e-oauth` so PRs that don't touch
  # OAuth code don't pay the multi-minute Keycloak rollout cost.
  # ─────────────────────────────────────────────────────────────────────────
  kind-oauth:
    needs: build-images
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e-oauth') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-oauth-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Load images into kind
        run: |
          set -e
          for tar in crabka-operator.tar crabka-broker.tar; do
            docker load -i "$tar" 2>&1 | tee /tmp/load.log
            loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
            want=$(basename "$tar" .tar):e2e
            if [ "$loaded" != "$want" ]; then docker tag "$loaded" "$want"; fi
            kind load docker-image "$want" --name crabka-oauth-e2e
          done

      - name: Install CRDs + chart
        run: |
          set -e
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkausers.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkatopics.yaml
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      # ─────────────────────────────────────────────────────────────────────
      # Install Bitnami Keycloak chart with TLS enabled.
      #
      # Pinned to chart `25.2.0` (Keycloak app version `26.3.3`), the latest
      # stable Bitnami release on the day this slice shipped (2026-05-23).
      # Bump the pin in a follow-up if/when the chart's defaults change
      # incompatibly with the kcadm bootstrap script below.
      #
      # `tls.enabled=true tls.autoGenerated=true` — the chart provisions a
      # self-signed CA + leaf cert in a `kc-keycloak-crt` Secret in the
      # keycloak ns. We copy that into the default ns as `keycloak-ca` and
      # reference it from the Kafka CR's `tlsTrustedCertificates` (slice 50b
      # operator surface + slice 49c broker trust knob). Broker now talks
      # HTTPS to the JWKS endpoint, so no `WeakAuth` Event fires.
      # ─────────────────────────────────────────────────────────────────────
      - name: Install Bitnami Keycloak chart
        run: |
          set -e
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update bitnami
          helm install kc bitnami/keycloak \
            --namespace keycloak --create-namespace \
            --version 25.2.0 \
            --set auth.adminUser=admin \
            --set auth.adminPassword=admin \
            --set service.type=ClusterIP \
            --set tls.enabled=true \
            --set tls.autoGenerated=true \
            --set production=false \
            --set proxy=edge \
            --wait --timeout=600s
          kubectl rollout status -n keycloak statefulset/kc-keycloak --timeout=600s

      # ─────────────────────────────────────────────────────────────────────
      # Copy the chart's auto-generated TLS Secret into the default ns so
      # the Kafka CR's `tlsTrustedCertificates` can reference it. The chart
      # creates this Secret with default `kc-keycloak-crt` naming (Bitnami
      # 25.x); if a future chart version renames it, the diagnostic dump
      # below + the `kubectl get secret -n keycloak` here surface the actual
      # name to update.
      # ─────────────────────────────────────────────────────────────────────
      - name: Identify and copy Keycloak CA to default namespace
        run: |
          set -e
          echo "--- secrets in keycloak ns (looking for the auto-generated TLS Secret) ---"
          kubectl get secret -n keycloak
          # Bitnami chart 25.x typically names this `kc-keycloak-crt`. If the chart
          # version changes the name, this is the first place to update.
          SECRET_NAME=kc-keycloak-crt
          if ! kubectl get secret $SECRET_NAME -n keycloak >/dev/null 2>&1; then
            echo "::error::expected Bitnami auto-generated TLS Secret '$SECRET_NAME' in keycloak ns; grep above for the actual name"
            exit 1
          fi
          kubectl get secret $SECRET_NAME -n keycloak -o json \
            | jq '.metadata = {"name":"keycloak-ca","namespace":"default"} | del(.metadata.ownerReferences) | del(.metadata.resourceVersion) | del(.metadata.uid) | del(.metadata.creationTimestamp)' \
            | kubectl apply -f -
          kubectl get secret keycloak-ca -n default

      # ─────────────────────────────────────────────────────────────────────
      # Bootstrap the `kafka` realm via kcadm.sh.
      #
      # The script is rendered to /tmp on the runner, then `kubectl cp`'d
      # into the keycloak pod and exec'd — a single `kubectl exec -- bash
      # -c '…'` invocation with a multi-hundred-line script is fragile
      # (quoting around inner $VAR references in particular).
      #
      # Token claims:
      #   • aud:   set to "kafka-broker" via an audience protocol-mapper on
      #            the `kafka.write` client-scope (broker's
      #            `validAudience` = "kafka-broker").
      #   • scope: includes "kafka.write" because the scope is assigned as
      #            a default-scope to the kafka-client (and absent from
      #            kafka-client-noscope, used by the negative-test job).
      #   • client_id: emitted automatically by Keycloak on client-credentials
      #                grants — the broker's `userNameClaim: client_id`
      #                maps this to the principal `User:kafka-client`.
      # ─────────────────────────────────────────────────────────────────────
      - name: Bootstrap Keycloak realm + clients
        run: |
          set -e
          cat > /tmp/realm-bootstrap.sh <<'BOOTSTRAP'
          #!/bin/bash
          set -ex
          KCADM=/opt/bitnami/keycloak/bin/kcadm.sh
          # --insecure: loopback connection inside the Keycloak pod; not on the wire
          $KCADM config credentials \
            --server https://localhost:8443/ --insecure \
            --realm master --user admin --password admin

          # Realm
          $KCADM create realms -s realm=kafka -s enabled=true

          # Audience client — broker is its own "kafka-broker" client; not
          # used for issuing tokens, only as the audience value in `aud`.
          $KCADM create clients -r kafka \
            -s clientId=kafka-broker \
            -s publicClient=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false

          # Client scope `kafka.write` with an audience mapper that adds
          # "kafka-broker" to the `aud` claim of any access token whose
          # client has this scope assigned.
          $KCADM create client-scopes -r kafka \
            -s name=kafka.write \
            -s protocol=openid-connect \
            -s 'attributes."include.in.token.scope"=true'
          SCOPE_ID=$($KCADM get client-scopes -r kafka -q name=kafka.write \
            --fields id --format csv --noquotes | tail -1)
          $KCADM create "client-scopes/$SCOPE_ID/protocol-mappers/models" -r kafka \
            -s name=aud-kafka-broker \
            -s protocol=openid-connect \
            -s protocolMapper=oidc-audience-mapper \
            -s 'config."included.client.audience"=kafka-broker' \
            -s 'config."id.token.claim"=false' \
            -s 'config."access.token.claim"=true'

          # Token-issuing client #1 — service-account / client-credentials,
          # holds the `kafka.write` scope. Principal: kafka-client.
          $KCADM create clients -r kafka \
            -s clientId=kafka-client \
            -s publicClient=false \
            -s serviceAccountsEnabled=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false \
            -s 'attributes."client_credentials.use_refresh_token"=false'
          CID=$($KCADM get clients -r kafka -q clientId=kafka-client \
            --fields id --format csv --noquotes | tail -1)
          $KCADM update "clients/$CID/default-client-scopes/$SCOPE_ID" -r kafka
          SECRET=$($KCADM get "clients/$CID/client-secret" -r kafka \
            --fields value --format csv --noquotes | tail -1)

          # Slice 49h: create a realm role + assign to the kafka-client
          # service account so realm_access.roles is populated on access
          # tokens. The broker's groupsClaim = "$.realm_access.roles[*]"
          # extracts this into Principal.groups. Keycloak's service-account
          # user convention is `service-account-<clientId>`.
          $KCADM create roles -r kafka -s name=kafka-cluster-admin
          $KCADM add-roles -r kafka --uusername service-account-kafka-client --rolename kafka-cluster-admin

          # Token-issuing client #2 — same shape, but NO `kafka.write` scope.
          # Used by the negative-test producer; broker rejects at scope-check
          # time before principal authorization is even consulted.
          $KCADM create clients -r kafka \
            -s clientId=kafka-client-noscope \
            -s publicClient=false \
            -s serviceAccountsEnabled=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false \
            -s 'attributes."client_credentials.use_refresh_token"=false'
          CID2=$($KCADM get clients -r kafka -q clientId=kafka-client-noscope \
            --fields id --format csv --noquotes | tail -1)
          SECRET2=$($KCADM get "clients/$CID2/client-secret" -r kafka \
            --fields value --format csv --noquotes | tail -1)

          # Stash both secrets where they're readable by the script that
          # creates the Kubernetes Secret (next step on the runner).
          mkdir -p /tmp/kc-out
          echo -n "$SECRET"  > /tmp/kc-out/kafka-client-secret
          echo -n "$SECRET2" > /tmp/kc-out/kafka-client-noscope-secret
          BOOTSTRAP
          chmod +x /tmp/realm-bootstrap.sh

          kubectl cp /tmp/realm-bootstrap.sh keycloak/kc-keycloak-0:/tmp/realm-bootstrap.sh -c keycloak
          kubectl exec -n keycloak kc-keycloak-0 -c keycloak -- bash /tmp/realm-bootstrap.sh

          mkdir -p /tmp/kc-out
          kubectl cp keycloak/kc-keycloak-0:/tmp/kc-out/kafka-client-secret /tmp/kc-out/kafka-client-secret -c keycloak
          kubectl cp keycloak/kc-keycloak-0:/tmp/kc-out/kafka-client-noscope-secret /tmp/kc-out/kafka-client-noscope-secret -c keycloak

          # Materialize the secrets into a Kubernetes Secret in `default`
          # so the producer Jobs can mount them.
          kubectl create secret generic keycloak-test-creds -n default \
            --from-file=kafka-client-secret=/tmp/kc-out/kafka-client-secret \
            --from-file=kafka-client-noscope-secret=/tmp/kc-out/kafka-client-noscope-secret

      # ─────────────────────────────────────────────────────────────────────
      # Apply the Kafka cluster + OAuth listener + KafkaUser + KafkaTopic.
      #
      # Listener config mirrors crates/operator/sample/oauth-listener.yaml
      # but URIs point at the in-cluster Keycloak Service. `userNameClaim:
      # client_id` means the broker derives the principal from the OAuth
      # `client_id` claim — emitted automatically by Keycloak on
      # client-credentials grants — so the KafkaUser's `metadata.name` must
      # match the OAuth `clientId` (here, `kafka-client`).
      # ─────────────────────────────────────────────────────────────────────
      - name: Apply Kafka cluster with OAUTHBEARER listener
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: oauth
                port: 9096
                type: internal
                tls: true
                authentication:
                  type: oauth
                  validIssuerUri: https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka
                  jwksEndpointUri: https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/certs
                  validAudience: kafka-broker
                  userNameClaim: client_id
                  customClaimCheck: "$.scope[?@ == 'kafka.write']"
                  validTokenType: JWT
                  groupsClaim: "$.realm_access.roles[*]"
                  maxSecondsWithoutReauthentication: 300
                  tlsTrustedCertificates:
                    - secretName: keycloak-ca
                      certificate: tls.crt
            interBrokerListenerName: PLAIN
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
          EOF

      - name: Wait for Kafka demo Ready
        run: |
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Kafka demo did not become Ready in 5 minutes"
          kubectl describe kafka demo -n default
          kubectl describe kafkanodepool brokers -n default
          kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Apply KafkaUser kafka-client (tls-external) + KafkaTopic e2e
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: KafkaUser
          metadata:
            name: kafka-client
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            authentication:
              type: tls-external
            authorization:
              type: simple
              acls:
                - resource:
                    type: topic
                    name: e2e
                  operations: [Read, Describe, Write]
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaTopic
          metadata:
            name: e2e
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            partitions: 1
            replicas: 1
          EOF
          for i in $(seq 1 30); do
            us=$(kubectl get kafkauser kafka-client -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            ts=$(kubectl get kafkatopic e2e -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: KafkaUser=$us KafkaTopic=$ts"
            if [ "$us" = "True" ] && [ "$ts" = "True" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::KafkaUser kafka-client or KafkaTopic e2e did not become Ready in 90s"
          kubectl describe kafkauser kafka-client -n default
          kubectl describe kafkatopic e2e -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # Assert NO WeakAuth Event fires on the all-HTTPS OAuth listener.
      #
      # The operator's listener-reconciler fires `WeakAuth` whenever an
      # OAuth listener's `jwksEndpointUri` (or issuer) starts with `http://`
      # (see crates/operator/src/controller/listeners.rs::weak_auth_warnings).
      # All URLs above are https:// now (50b operator + 49c broker trust),
      # so the Event MUST NOT be present.
      # ─────────────────────────────────────────────────────────────────────
      - name: Assert NO WeakAuth Event on all-HTTPS OAuth listener
        run: |
          set -e
          # Confirm NO WeakAuth events fire on the now-all-HTTPS OAuth listener.
          events=$(kubectl get events -n default --field-selector reason=WeakAuth -o json | jq '.items | length')
          if [ "$events" -ne 0 ]; then
            echo "::error::expected 0 WeakAuth events on HTTPS-only OAuth listener, got $events"
            kubectl get events -n default --field-selector reason=WeakAuth -o yaml
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Producer-OK: kafka-client holds the kafka.write scope, so its token
      # carries `aud=kafka-broker` and `scope=kafka.write`; the broker
      # accepts the SASL handshake and routes the produce.
      #
      # Apache Kafka 3.8.0's `OAuthBearerLoginCallbackHandler` (KIP-768,
      # released in 3.1) handles the client-credentials OAuth2 flow purely
      # from JAAS config — given `sasl.oauthbearer.token.endpoint.url`
      # plus `clientId="…" clientSecret="…" scope="…"` on the
      # OAuthBearerLoginModule, it POSTs to Keycloak's token endpoint and
      # passes the resulting JWT to the broker. No callback-handler code
      # of our own required.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify OAUTHBEARER produce succeeds with valid token
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: oauth-producer-ok
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        # Build a JKS truststore from the cluster CA cert
                        # (broker server cert) AND the Keycloak CA (so the
                        # JVM trusts the HTTPS token-endpoint call).
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        keytool -importcert -noprompt \
                          -alias keycloak-ca \
                          -file /etc/crabka/keycloak-ca/tls.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        SECRET=$(cat /etc/crabka/kc/kafka-client-secret)
                        cat > /tmp/client.props <<INNER
                        security.protocol=SASL_SSL
                        sasl.mechanism=OAUTHBEARER
                        sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
                        sasl.oauthbearer.token.endpoint.url=https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/token
                        sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="kafka-client" clientSecret="$SECRET" scope="kafka.write";
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "oauth-test-record" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9096 \
                            --topic e2e \
                            --producer.config /tmp/client.props
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: keycloak-ca
                        mountPath: /etc/crabka/keycloak-ca
                        readOnly: true
                      - name: kc-creds
                        mountPath: /etc/crabka/kc
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
                  - name: keycloak-ca
                    secret:
                      secretName: keycloak-ca
                  - name: kc-creds
                    secret:
                      secretName: keycloak-test-creds
          EOF
          kubectl wait job/oauth-producer-ok -n default \
            --for=condition=complete --timeout=180s || {
            echo "::error::OAUTHBEARER producer job did not complete successfully"
            kubectl logs -n default -l job-name=oauth-producer-ok --tail=200 || true
            kubectl describe job oauth-producer-ok -n default || true
            exit 1
          }

      # ─────────────────────────────────────────────────────────────────────
      # Producer-Reject: kafka-client-noscope is a valid OAuth client and
      # gets a signed JWT from Keycloak, but the JWT lacks `kafka.write` in
      # its `scope` claim. The broker's `customClaimCheck { scope: kafka.write }`
      # rejects it at SASL-handshake time, surfacing as a
      # SaslAuthenticationException on the JVM client → non-zero exit on
      # the producer process → Job Failed condition.
      #
      # Polling pattern mirrors `mtls-producer-nocert` in kind-listener-auth.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify OAUTHBEARER produce is rejected without kafka.write scope
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: oauth-producer-noscope
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        keytool -importcert -noprompt \
                          -alias keycloak-ca \
                          -file /etc/crabka/keycloak-ca/tls.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        SECRET=$(cat /etc/crabka/kc/kafka-client-noscope-secret)
                        # No `scope=` requested → token's scope claim won't
                        # include kafka.write → broker's customClaimCheck
                        # rejects → SASL handshake fails.
                        cat > /tmp/client.props <<INNER
                        security.protocol=SASL_SSL
                        sasl.mechanism=OAUTHBEARER
                        sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
                        sasl.oauthbearer.token.endpoint.url=https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/token
                        sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="kafka-client-noscope" clientSecret="$SECRET";
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "should-be-rejected" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9096 \
                            --topic e2e \
                            --producer.config /tmp/client.props \
                            --request-timeout-ms 15000
                        echo "::error::OAUTHBEARER produce unexpectedly succeeded without kafka.write scope"
                        exit 1
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: keycloak-ca
                        mountPath: /etc/crabka/keycloak-ca
                        readOnly: true
                      - name: kc-creds
                        mountPath: /etc/crabka/kc
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
                  - name: keycloak-ca
                    secret:
                      secretName: keycloak-ca
                  - name: kc-creds
                    secret:
                      secretName: keycloak-test-creds
          EOF
          for i in $(seq 1 48); do
            complete=$(kubectl get job oauth-producer-noscope -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get job oauth-producer-noscope -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            echo "attempt $i: complete=$complete failed=$failed"
            if [ "$failed" = "True" ]; then
              echo "Produce without kafka.write scope was correctly rejected."
              # Sanity-check the rejection was authentication-related, not
              # e.g. a network error masquerading as failure.
              kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 | \
                grep -E 'SaslAuthenticationException|sasl|authentication failed' -i || {
                echo "::warning::producer logs don't mention SASL/authentication failure — rejection cause unclear"
              }
              exit 0
            fi
            if [ "$complete" = "True" ]; then
              echo "::error::no-scope produce job completed successfully — broker did not enforce customClaimCheck"
              kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::no-scope produce job did not terminate within 240s"
          kubectl describe job oauth-producer-noscope -n default || true
          kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
          exit 1

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/oauth-diag
          {
            echo "## kind-oauth diagnostics"
            kubectl get pods -A -o wide
            echo "### operator logs"
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500
            echo "### kafka demo"
            kubectl get kafka demo -n default -o yaml || true
            echo "### kafkauser kafka-client"
            kubectl get kafkauser kafka-client -n default -o yaml || true
            echo "### kafkatopic e2e"
            kubectl get kafkatopic e2e -n default -o yaml || true
            echo "### events (default ns)"
            kubectl get events -n default --sort-by=.lastTimestamp || true
            echo "### keycloak pod logs"
            kubectl logs -n keycloak kc-keycloak-0 -c keycloak --tail=300 || true
            echo "### keycloak postgresql logs"
            kubectl logs -n keycloak -l app.kubernetes.io/name=postgresql --tail=100 || true
            echo "### keycloak auto-generated TLS Secret (keycloak ns)"
            kubectl get secret kc-keycloak-crt -n keycloak -o yaml 2>&1 | head -50 || true
            echo "### keycloak CA copy (default ns)"
            kubectl get secret keycloak-ca -n default -o yaml 2>&1 | head -50 || true
            echo "### broker logs (demo)"
            kubectl logs -n default demo-brokers-0 --tail=300 --all-containers || true
            echo "### job logs (oauth-producer-ok)"
            kubectl logs -n default -l job-name=oauth-producer-ok --tail=200 || true
            echo "### job logs (oauth-producer-noscope)"
            kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
          } > /tmp/oauth-diag/diagnostics.md

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-oauth-diagnostics
          path: /tmp/oauth-diag/
          retention-days: 14
          if-no-files-found: ignore

  kind-oauth-introspection:
    needs: build-images
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e-oauth-introspection') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-oauth-introspection-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Load images into kind
        run: |
          set -e
          for tar in crabka-operator.tar crabka-broker.tar; do
            docker load -i "$tar" 2>&1 | tee /tmp/load.log
            loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
            want=$(basename "$tar" .tar):e2e
            if [ "$loaded" != "$want" ]; then docker tag "$loaded" "$want"; fi
            kind load docker-image "$want" --name crabka-oauth-introspection-e2e
          done

      - name: Install CRDs + chart
        run: |
          set -e
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkausers.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkatopics.yaml
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      # ─────────────────────────────────────────────────────────────────────
      # Install Bitnami Keycloak chart with TLS enabled.
      #
      # Same pin/config as kind-oauth — see that job's comment for context.
      # Introspection-mode validation still requires HTTPS to the
      # introspection + userinfo endpoints, so the CA bundle is still wired
      # via `tlsTrustedCertificates`.
      # ─────────────────────────────────────────────────────────────────────
      - name: Install Bitnami Keycloak chart
        run: |
          set -e
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update bitnami
          helm install kc bitnami/keycloak \
            --namespace keycloak --create-namespace \
            --version 25.2.0 \
            --set auth.adminUser=admin \
            --set auth.adminPassword=admin \
            --set service.type=ClusterIP \
            --set tls.enabled=true \
            --set tls.autoGenerated=true \
            --set production=false \
            --set proxy=edge \
            --wait --timeout=600s
          kubectl rollout status -n keycloak statefulset/kc-keycloak --timeout=600s

      - name: Identify and copy Keycloak CA to default namespace
        run: |
          set -e
          echo "--- secrets in keycloak ns (looking for the auto-generated TLS Secret) ---"
          kubectl get secret -n keycloak
          SECRET_NAME=kc-keycloak-crt
          if ! kubectl get secret $SECRET_NAME -n keycloak >/dev/null 2>&1; then
            echo "::error::expected Bitnami auto-generated TLS Secret '$SECRET_NAME' in keycloak ns; grep above for the actual name"
            exit 1
          fi
          kubectl get secret $SECRET_NAME -n keycloak -o json \
            | jq '.metadata = {"name":"keycloak-ca","namespace":"default"} | del(.metadata.ownerReferences) | del(.metadata.resourceVersion) | del(.metadata.uid) | del(.metadata.creationTimestamp)' \
            | kubectl apply -f -
          kubectl get secret keycloak-ca -n default

      # ─────────────────────────────────────────────────────────────────────
      # Bootstrap the `kafka` realm via kcadm.sh — same shape as kind-oauth,
      # but with one key difference: `kafka-broker` is a CONFIDENTIAL client
      # with `serviceAccountsEnabled=true`. Introspection mode requires the
      # broker to authenticate its `POST …/introspect` calls with its own
      # `clientId` + `clientSecret`. The audience-mapper purpose (matching
      # `aud=kafka-broker`) is satisfied regardless of `publicClient` —
      # only the string match against the client_id matters there.
      # ─────────────────────────────────────────────────────────────────────
      - name: Bootstrap Keycloak realm + clients
        run: |
          set -e
          cat > /tmp/realm-bootstrap.sh <<'BOOTSTRAP'
          #!/bin/bash
          set -ex
          KCADM=/opt/bitnami/keycloak/bin/kcadm.sh
          # --insecure: loopback connection inside the Keycloak pod; not on the wire
          $KCADM config credentials \
            --server https://localhost:8443/ --insecure \
            --realm master --user admin --password admin

          # Realm
          $KCADM create realms -s realm=kafka -s enabled=true

          # Broker-side OAuth client (introspection caller). Confidential +
          # serviceAccountsEnabled so the broker can fetch its own tokens for
          # the `Authorization: Basic` auth on the introspection endpoint.
          # Also acts as the `aud=kafka-broker` audience string target.
          $KCADM create clients -r kafka \
            -s clientId=kafka-broker \
            -s publicClient=false \
            -s serviceAccountsEnabled=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false
          BROKER_CID=$($KCADM get clients -r kafka -q clientId=kafka-broker \
            --fields id --format csv --noquotes | tail -1)
          BROKER_SECRET=$($KCADM get "clients/$BROKER_CID/client-secret" -r kafka \
            --fields value --format csv --noquotes | tail -1)

          # Client scope `kafka.write` with audience mapper → `aud=kafka-broker`.
          $KCADM create client-scopes -r kafka \
            -s name=kafka.write \
            -s protocol=openid-connect \
            -s 'attributes."include.in.token.scope"=true'
          SCOPE_ID=$($KCADM get client-scopes -r kafka -q name=kafka.write \
            --fields id --format csv --noquotes | tail -1)
          $KCADM create "client-scopes/$SCOPE_ID/protocol-mappers/models" -r kafka \
            -s name=aud-kafka-broker \
            -s protocol=openid-connect \
            -s protocolMapper=oidc-audience-mapper \
            -s 'config."included.client.audience"=kafka-broker' \
            -s 'config."id.token.claim"=false' \
            -s 'config."access.token.claim"=true'

          # Producer client #1 — kafka-client, holds the kafka.write scope.
          $KCADM create clients -r kafka \
            -s clientId=kafka-client \
            -s publicClient=false \
            -s serviceAccountsEnabled=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false \
            -s 'attributes."client_credentials.use_refresh_token"=false'
          CID=$($KCADM get clients -r kafka -q clientId=kafka-client \
            --fields id --format csv --noquotes | tail -1)
          $KCADM update "clients/$CID/default-client-scopes/$SCOPE_ID" -r kafka
          SECRET=$($KCADM get "clients/$CID/client-secret" -r kafka \
            --fields value --format csv --noquotes | tail -1)

          # Slice 49h: create a realm role + assign to the kafka-client
          # service account so realm_access.roles is populated on access
          # tokens. The broker's groupsClaim = "$.realm_access.roles[*]"
          # extracts this into Principal.groups. Keycloak's service-account
          # user convention is `service-account-<clientId>`.
          $KCADM create roles -r kafka -s name=kafka-cluster-admin
          $KCADM add-roles -r kafka --uusername service-account-kafka-client --rolename kafka-cluster-admin

          # Producer client #2 — same shape, NO kafka.write scope. Negative test.
          $KCADM create clients -r kafka \
            -s clientId=kafka-client-noscope \
            -s publicClient=false \
            -s serviceAccountsEnabled=true \
            -s standardFlowEnabled=false \
            -s directAccessGrantsEnabled=false \
            -s 'attributes."client_credentials.use_refresh_token"=false'
          CID2=$($KCADM get clients -r kafka -q clientId=kafka-client-noscope \
            --fields id --format csv --noquotes | tail -1)
          SECRET2=$($KCADM get "clients/$CID2/client-secret" -r kafka \
            --fields value --format csv --noquotes | tail -1)

          mkdir -p /tmp/kc-out
          echo -n "$BROKER_SECRET" > /tmp/kc-out/broker-client-secret
          echo -n "$SECRET"        > /tmp/kc-out/kafka-client-secret
          echo -n "$SECRET2"       > /tmp/kc-out/kafka-client-noscope-secret
          BOOTSTRAP
          chmod +x /tmp/realm-bootstrap.sh

          kubectl cp /tmp/realm-bootstrap.sh keycloak/kc-keycloak-0:/tmp/realm-bootstrap.sh -c keycloak
          kubectl exec -n keycloak kc-keycloak-0 -c keycloak -- bash /tmp/realm-bootstrap.sh

          mkdir -p /tmp/kc-out
          kubectl cp keycloak/kc-keycloak-0:/tmp/kc-out/broker-client-secret /tmp/kc-out/broker-client-secret -c keycloak
          kubectl cp keycloak/kc-keycloak-0:/tmp/kc-out/kafka-client-secret /tmp/kc-out/kafka-client-secret -c keycloak
          kubectl cp keycloak/kc-keycloak-0:/tmp/kc-out/kafka-client-noscope-secret /tmp/kc-out/kafka-client-noscope-secret -c keycloak

          # Producer-side creds (Job mounts these).
          kubectl create secret generic keycloak-test-creds -n default \
            --from-file=kafka-client-secret=/tmp/kc-out/kafka-client-secret \
            --from-file=kafka-client-noscope-secret=/tmp/kc-out/kafka-client-noscope-secret

          # Broker-side intro­spection creds (Kafka CR's
          # `authentication.clientSecret.secretName` refs this).
          kubectl create secret generic keycloak-introspection-secret \
            --namespace=default \
            --from-file=secret=/tmp/kc-out/broker-client-secret

      # ─────────────────────────────────────────────────────────────────────
      # Apply the Kafka cluster with the OAuth listener in INTROSPECTION mode.
      #
      # Diffs vs. kind-oauth's JWT-mode listener:
      #   • accessTokenIsJwt: false        — broker validates by calling
      #     Keycloak's `/introspect` endpoint, not by JWKS signature check.
      #   • introspectionEndpointUri       — required (replaces jwksEndpointUri).
      #   • userInfoEndpointUri            — used to fetch claims (incl. the
      #     principal claim) since the access token is opaque.
      #   • userNameClaim: preferred_username — the userinfo response shape,
      #     not the JWT claim set; service-account tokens surface their
      #     principal as `service-account-<clientId>` on this claim.
      #   • clientId + clientSecret        — broker's own creds for
      #     authenticating its introspection POST.
      #
      # validIssuerUri + tlsTrustedCertificates stay (HTTPS to Keycloak).
      # ─────────────────────────────────────────────────────────────────────
      - name: Apply Kafka cluster with OAUTHBEARER listener (introspection mode)
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: oauth
                port: 9096
                type: internal
                tls: true
                authentication:
                  type: oauth
                  accessTokenIsJwt: false
                  validIssuerUri: https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka
                  introspectionEndpointUri: https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/token/introspect
                  userInfoEndpointUri: https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/userinfo
                  validAudience: kafka-broker
                  userNameClaim: preferred_username
                  customClaimCheck: "$.scope[?@ == 'kafka.write']"
                  groupsClaim: "$.realm_access.roles[*]"
                  clientId: kafka-broker
                  clientSecret:
                    secretName: keycloak-introspection-secret
                    key: secret
                  tlsTrustedCertificates:
                    - secretName: keycloak-ca
                      certificate: tls.crt
            interBrokerListenerName: PLAIN
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
          EOF

      - name: Wait for Kafka demo Ready
        run: |
          for i in $(seq 1 60); do
            s=$(kubectl get kafka demo -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: Ready=$s"
            if [ "$s" = "True" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Kafka demo did not become Ready in 5 minutes"
          kubectl describe kafka demo -n default
          kubectl describe kafkanodepool brokers -n default
          kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Apply KafkaUser kafka-client (tls-external) + KafkaTopic e2e
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: KafkaUser
          metadata:
            name: kafka-client
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            authentication:
              type: tls-external
            authorization:
              type: simple
              acls:
                - resource:
                    type: topic
                    name: e2e
                  operations: [Read, Describe, Write]
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaTopic
          metadata:
            name: e2e
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            partitions: 1
            replicas: 1
          EOF
          for i in $(seq 1 30); do
            us=$(kubectl get kafkauser kafka-client -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            ts=$(kubectl get kafkatopic e2e -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            echo "attempt $i: KafkaUser=$us KafkaTopic=$ts"
            if [ "$us" = "True" ] && [ "$ts" = "True" ]; then exit 0; fi
            sleep 3
          done
          echo "::error::KafkaUser kafka-client or KafkaTopic e2e did not become Ready in 90s"
          kubectl describe kafkauser kafka-client -n default
          kubectl describe kafkatopic e2e -n default
          kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=200 || true
          exit 1

      # ─────────────────────────────────────────────────────────────────────
      # Same NO-WeakAuth assertion as kind-oauth — introspection mode also
      # uses all-HTTPS URLs, so the operator's WeakAuth event must not fire.
      # ─────────────────────────────────────────────────────────────────────
      - name: Assert NO WeakAuth Event on all-HTTPS OAuth listener
        run: |
          set -e
          events=$(kubectl get events -n default --field-selector reason=WeakAuth -o json | jq '.items | length')
          if [ "$events" -ne 0 ]; then
            echo "::error::expected 0 WeakAuth events on HTTPS-only OAuth listener, got $events"
            kubectl get events -n default --field-selector reason=WeakAuth -o yaml
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Producer-OK: the producer's JAAS is unchanged from kind-oauth — it
      # talks to Keycloak's TOKEN endpoint to fetch a JWT, then SASL-passes
      # that JWT to the broker. The broker treats the JWT as opaque, POSTs
      # it to `/introspect`, and Keycloak validates the signature itself.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify OAUTHBEARER produce succeeds with valid token
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: oauth-producer-ok
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        keytool -importcert -noprompt \
                          -alias keycloak-ca \
                          -file /etc/crabka/keycloak-ca/tls.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        SECRET=$(cat /etc/crabka/kc/kafka-client-secret)
                        cat > /tmp/client.props <<INNER
                        security.protocol=SASL_SSL
                        sasl.mechanism=OAUTHBEARER
                        sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
                        sasl.oauthbearer.token.endpoint.url=https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/token
                        sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="kafka-client" clientSecret="$SECRET" scope="kafka.write";
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "oauth-test-record" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9096 \
                            --topic e2e \
                            --producer.config /tmp/client.props
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: keycloak-ca
                        mountPath: /etc/crabka/keycloak-ca
                        readOnly: true
                      - name: kc-creds
                        mountPath: /etc/crabka/kc
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
                  - name: keycloak-ca
                    secret:
                      secretName: keycloak-ca
                  - name: kc-creds
                    secret:
                      secretName: keycloak-test-creds
          EOF
          kubectl wait job/oauth-producer-ok -n default \
            --for=condition=complete --timeout=180s || {
            echo "::error::OAUTHBEARER producer job did not complete successfully"
            kubectl logs -n default -l job-name=oauth-producer-ok --tail=200 || true
            kubectl describe job oauth-producer-ok -n default || true
            exit 1
          }

      # ─────────────────────────────────────────────────────────────────────
      # Producer-Reject: same negative-test shape as kind-oauth. The token
      # is valid (introspection returns active=true) but its `scope` claim
      # lacks `kafka.write`, so the broker's customClaimCheck rejects.
      # ─────────────────────────────────────────────────────────────────────
      - name: Verify OAUTHBEARER produce is rejected without kafka.write scope
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: oauth-producer-noscope
            namespace: default
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: producer
                    image: apache/kafka:3.8.0
                    command:
                      - bash
                      - -c
                      - |
                        set -ex
                        keytool -import -trustcacerts -noprompt \
                          -alias clusterca \
                          -file /etc/crabka/cluster-ca/ca.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        keytool -importcert -noprompt \
                          -alias keycloak-ca \
                          -file /etc/crabka/keycloak-ca/tls.crt \
                          -keystore /tmp/trust.jks \
                          -storepass changeit
                        SECRET=$(cat /etc/crabka/kc/kafka-client-noscope-secret)
                        cat > /tmp/client.props <<INNER
                        security.protocol=SASL_SSL
                        sasl.mechanism=OAUTHBEARER
                        sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
                        sasl.oauthbearer.token.endpoint.url=https://kc-keycloak.keycloak.svc.cluster.local/realms/kafka/protocol/openid-connect/token
                        sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="kafka-client-noscope" clientSecret="$SECRET";
                        ssl.truststore.location=/tmp/trust.jks
                        ssl.truststore.password=changeit
                        INNER
                        echo "should-be-rejected" | \
                          /opt/kafka/bin/kafka-console-producer.sh \
                            --bootstrap-server demo-broker-headless.default.svc.cluster.local:9096 \
                            --topic e2e \
                            --producer.config /tmp/client.props \
                            --request-timeout-ms 15000
                        echo "::error::OAUTHBEARER produce unexpectedly succeeded without kafka.write scope"
                        exit 1
                    volumeMounts:
                      - name: cluster-ca
                        mountPath: /etc/crabka/cluster-ca
                        readOnly: true
                      - name: keycloak-ca
                        mountPath: /etc/crabka/keycloak-ca
                        readOnly: true
                      - name: kc-creds
                        mountPath: /etc/crabka/kc
                        readOnly: true
                volumes:
                  - name: cluster-ca
                    secret:
                      secretName: demo-cluster-ca-cert
                  - name: keycloak-ca
                    secret:
                      secretName: keycloak-ca
                  - name: kc-creds
                    secret:
                      secretName: keycloak-test-creds
          EOF
          for i in $(seq 1 48); do
            complete=$(kubectl get job oauth-producer-noscope -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get job oauth-producer-noscope -n default \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            echo "attempt $i: complete=$complete failed=$failed"
            if [ "$failed" = "True" ]; then
              echo "Produce without kafka.write scope was correctly rejected."
              kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 | \
                grep -E 'SaslAuthenticationException|sasl|authentication failed' -i || {
                echo "::warning::producer logs don't mention SASL/authentication failure — rejection cause unclear"
              }
              exit 0
            fi
            if [ "$complete" = "True" ]; then
              echo "::error::no-scope produce job completed successfully — broker did not enforce customClaimCheck"
              kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::no-scope produce job did not terminate within 240s"
          kubectl describe job oauth-producer-noscope -n default || true
          kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
          exit 1

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/oauth-diag
          {
            echo "## kind-oauth-introspection diagnostics"
            kubectl get pods -A -o wide
            echo "### operator logs"
            kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500
            echo "### kafka demo"
            kubectl get kafka demo -n default -o yaml || true
            echo "### kafkauser kafka-client"
            kubectl get kafkauser kafka-client -n default -o yaml || true
            echo "### kafkatopic e2e"
            kubectl get kafkatopic e2e -n default -o yaml || true
            echo "### events (default ns)"
            kubectl get events -n default --sort-by=.lastTimestamp || true
            echo "### keycloak pod logs"
            kubectl logs -n keycloak kc-keycloak-0 -c keycloak --tail=300 || true
            echo "### keycloak postgresql logs"
            kubectl logs -n keycloak -l app.kubernetes.io/name=postgresql --tail=100 || true
            echo "### keycloak auto-generated TLS Secret (keycloak ns)"
            kubectl get secret kc-keycloak-crt -n keycloak -o yaml 2>&1 | head -50 || true
            echo "### keycloak CA copy (default ns)"
            kubectl get secret keycloak-ca -n default -o yaml 2>&1 | head -50 || true
            echo "### introspection secret (default ns)"
            kubectl get secret keycloak-introspection-secret -n default -o yaml || true
            echo "### broker logs (demo)"
            kubectl logs -n default demo-brokers-0 --tail=300 --all-containers || true
            echo "### job logs (oauth-producer-ok)"
            kubectl logs -n default -l job-name=oauth-producer-ok --tail=200 || true
            echo "### job logs (oauth-producer-noscope)"
            kubectl logs -n default -l job-name=oauth-producer-noscope --tail=200 || true
          } > /tmp/oauth-diag/diagnostics.md

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-oauth-introspection-diagnostics
          path: /tmp/oauth-diag/
          retention-days: 14
          if-no-files-found: ignore
