name: operator-e2e
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install melange and apko
        run: |
          go install chainguard.dev/melange@latest
          go install chainguard.dev/apko@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify melange + apko on PATH
        run: |
          melange version
          apko version

      - name: Build crabka-operator apk + OCI image
        run: |
          mkdir -p packages
          melange keygen
          melange build packaging/melange/crabka-operator.yaml \
            --source-dir . \
            --signing-key melange.rsa \
            --arch x86_64 \
            --runner docker \
            --out-dir packages/
          apko build packaging/apko/crabka-operator.yaml \
            crabka-operator:e2e \
            crabka-operator.tar \
            --arch x86_64 \
            --repository-append "$PWD/packages" \
            --keyring-append "$PWD/melange.rsa.pub"

      - name: Build crabka-broker apk + OCI image
        run: |
          melange build packaging/melange/crabka-broker.yaml \
            --source-dir . \
            --signing-key melange.rsa \
            --arch x86_64 \
            --runner docker \
            --out-dir packages/
          apko build packaging/apko/crabka-broker.yaml \
            crabka-broker:e2e \
            crabka-broker.tar \
            --arch x86_64 \
            --repository-append "$PWD/packages" \
            --keyring-append "$PWD/melange.rsa.pub"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: crabka-e2e
          version: v0.24.0
          node_image: kindest/node:v1.30.0

      - name: Install MetalLB (so LoadBalancer Services get an IP in kind)
        run: |
          set -e
          kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.7/config/manifests/metallb-native.yaml
          # Wait for the speaker DaemonSet + controller Deployment to roll out.
          kubectl rollout status -n metallb-system deploy/controller --timeout=180s
          kubectl rollout status -n metallb-system daemonset/speaker --timeout=180s

          # Pick an IP range inside the docker bridge that kind sits on.
          # On the GitHub Actions runners this is reliably 172.18.0.0/16
          # under the default `kind` docker network; carve out the high
          # end of the .255 octet so we don't clash with any future kind
          # nodes.
          subnet=$(docker network inspect kind --format '{{(index .IPAM.Config 0).Subnet}}')
          echo "kind subnet: $subnet"
          # IPAddressPool + L2Advertisement.
          cat <<EOF | kubectl apply -f -
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: kind-pool
            namespace: metallb-system
          spec:
            addresses:
              - 172.18.255.200-172.18.255.250
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: kind-l2
            namespace: metallb-system
          EOF

      - name: Load operator image into kind (via docker)
        run: |
          # apko writes an OCI archive tagged with an arch suffix
          # (`crabka-operator:e2e-amd64`). docker load picks that up; we
          # capture the actual loaded reference and retag to the chart's
          # expected `crabka-operator:e2e` before pushing into kind.
          docker load -i crabka-operator.tar 2>&1 | tee /tmp/load.log
          loaded=$(sed -n 's/^Loaded image: //p' /tmp/load.log | head -1)
          if [ -z "$loaded" ]; then
            echo "::error::docker load did not report a loaded image"
            exit 1
          fi
          echo "Resolved loaded image reference: $loaded"
          echo "--- docker images after load ---"
          docker images
          if [ "$loaded" != "crabka-operator:e2e" ]; then
            docker tag "$loaded" crabka-operator:e2e
          fi
          kind load docker-image crabka-operator:e2e --name crabka-e2e
          echo "--- crictl images on kind node ---"
          docker exec crabka-e2e-control-plane crictl images

      - name: Load broker image into kind (via docker)
        run: |
          docker load -i crabka-broker.tar 2>&1 | tee /tmp/load-broker.log
          loaded=$(sed -n 's/^Loaded image: //p' /tmp/load-broker.log | head -1)
          if [ -z "$loaded" ]; then
            echo "::error::docker load did not report a loaded image"
            exit 1
          fi
          if [ "$loaded" != "crabka-broker:e2e" ]; then
            docker tag "$loaded" crabka-broker:e2e
          fi
          kind load docker-image crabka-broker:e2e --name crabka-e2e

      - name: Install prometheus-operator CRDs (PodMonitor + ServiceMonitor)
        run: |
          # Renovate: datasource=github-tags depName=prometheus-operator/prometheus-operator
          PROM_OP_TAG=v0.79.2
          kubectl apply -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OP_TAG}/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OP_TAG}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"

      - name: Install CRDs
        run: |
          kubectl apply -f deploy/crds/crabka.io_kafkas.yaml
          kubectl apply -f deploy/crds/crabka.io_kafkanodepools.yaml

      - name: Install chart
        run: |
          kubectl create namespace crabka-operator
          helm install operator charts/crabka-operator \
            --namespace crabka-operator \
            --set image.repository=crabka-operator \
            --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set brokerImage.repository=crabka-broker \
            --set brokerImage.tag=e2e \
            --set brokerImage.pullPolicy=IfNotPresent

      - name: Wait for operator rollout
        run: |
          kubectl rollout status -n crabka-operator deploy/operator-crabka-operator --timeout=240s

      - name: Apply Kafka + KafkaNodePool
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: demo
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            config:
              log.retention.hours: "24"
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: brokers
            namespace: default
            labels:
              crabka.io/cluster: demo
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 0
            storage:
              type: PersistentClaim
              size: 1Gi
              deleteClaim: true
            template:
              metadata:
                labels:
                  team: platform
                annotations:
                  crabka.io/test-anno: "yes"
              tolerations:
                - key: dedicated
                  operator: Exists
                  effect: NoSchedule
              nodeSelector:
                kubernetes.io/os: linux
          EOF

      - name: Wait for Ready=True
        run: |
          for i in $(seq 1 60); do
            status=$(kubectl get kafka demo -n default -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            ready=$(kubectl get kafka demo -n default -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
            echo "attempt $i: status=$status readyReplicas=$ready"
            if [ "$status" = "True" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Kafka 'demo' did not become Ready in 5 minutes"
          kubectl describe kafka demo -n default
          kubectl describe kafkanodepool brokers -n default
          kubectl describe sts demo-brokers -n default
          kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
          exit 1

      - name: Smoke — broker binary launched in pod
        run: |
          kubectl exec -n default demo-brokers-0 -c broker -- /usr/bin/crabka-broker --version
          kubectl logs -n default demo-brokers-0 -c broker | grep -q 'crabka-broker listening'

      - name: Smoke — pod template values applied
        run: |
          set -e
          team=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.labels.team}')
          [ "$team" = "platform" ] || { echo "::error::team label missing, got '$team'"; exit 1; }

          anno=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.annotations.crabka\.io/test-anno}')
          [ "$anno" = "yes" ] || { echo "::error::annotation missing, got '$anno'"; exit 1; }

          ns=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.nodeSelector.kubernetes\.io/os}')
          [ "$ns" = "linux" ] || { echo "::error::nodeSelector missing, got '$ns'"; exit 1; }

          tol_key=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.tolerations[?(@.key=="dedicated")].key}')
          [ "$tol_key" = "dedicated" ] || { echo "::error::toleration missing"; exit 1; }

      - name: Smoke — broker bound a PersistentVolumeClaim
        run: |
          set -e
          # PVC name pattern: <volumeClaimTemplate.name>-<sts>-<ordinal>
          phase=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.status.phase}')
          [ "$phase" = "Bound" ] || { echo "::error::PVC not Bound: $phase"; kubectl describe pvc data-demo-brokers-0 -n default; exit 1; }
          cap=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.status.capacity.storage}')
          echo "PVC bound, capacity=$cap"
          instance_label=$(kubectl get pvc data-demo-brokers-0 -n default -o jsonpath='{.metadata.labels.app\.kubernetes\.io/instance}')
          [ "$instance_label" = "demo" ] || { echo "::error::PVC missing instance label: '$instance_label'"; exit 1; }

      - name: Smoke — config change rolls broker pod
        run: |
          set -e
          initial_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          initial_rev=$(kubectl get sts demo-brokers -n default -o jsonpath='{.status.currentRevision}')
          echo "before: uid=$initial_uid rev=$initial_rev"

          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"config":{"log.retention.hours":"48"}}}'

          # Wait up to 90s for the pod's UID to change (replacement).
          for i in $(seq 1 45); do
            current_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            echo "attempt $i: uid=$current_uid"
            if [ -n "$current_uid" ] && [ "$current_uid" != "$initial_uid" ]; then
              break
            fi
            sleep 2
          done

          if [ "$current_uid" = "$initial_uid" ]; then
            echo "::error::pod UID didn't change within 90s (initial=$initial_uid)"
            kubectl describe pod demo-brokers-0 -n default || true
            kubectl describe sts demo-brokers -n default || true
            exit 1
          fi

          # Wait for the new pod to reach Ready.
          if ! kubectl wait --for=condition=Ready -n default pod/demo-brokers-0 --timeout=120s; then
            echo "::error::rolled pod did not become Ready within 120s"
            kubectl describe pod demo-brokers-0 -n default || true
            kubectl logs -n default demo-brokers-0 -c format --tail=200 || true
            kubectl logs -n default demo-brokers-0 -c broker --tail=200 || true
            kubectl logs -n default demo-brokers-0 -c broker --previous --tail=200 || true
            kubectl get configmap demo-broker-config -n default -o yaml || true
            exit 1
          fi

          final_rev=$(kubectl get sts demo-brokers -n default -o jsonpath='{.status.currentRevision}')
          [ "$final_rev" != "$initial_rev" ] || { echo "::error::sts revision didn't change ($initial_rev -> $final_rev)"; exit 1; }
          echo "rolled: $initial_rev -> $final_rev"

      - name: Smoke — NodePort listener exposes per-broker + bootstrap Services
        run: |
          set -e
          # Apply a Kafka with internal + NodePort listeners alongside the
          # existing `demo` cluster. Uses a separate pool so we can keep
          # the GC test on `demo` working independently.
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: ext
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: external
                port: 9094
                type: nodeport
                tls: false
                configuration:
                  bootstrap:
                    nodePort: 32099
                  brokers:
                    - broker: 10
                      nodePort: 32100
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: ext-broker
            namespace: default
            labels:
              crabka.io/cluster: ext
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 10
          EOF

          # Wait for ListenersReady=True (covers Service creation + status
          # readback through the apiserver).
          for i in $(seq 1 60); do
            valid=$(kubectl get kafka ext -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersValid")].status}' 2>/dev/null || true)
            ready=$(kubectl get kafka ext -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersReady")].status}' 2>/dev/null || true)
            echo "attempt $i: ListenersValid=$valid ListenersReady=$ready"
            if [ "$valid" = "True" ] && [ "$ready" = "True" ]; then break; fi
            sleep 5
          done
          if [ "$valid" != "True" ] || [ "$ready" != "True" ]; then
            echo "::error::ListenersValid/ListenersReady never reached True"
            kubectl describe kafka ext -n default
            kubectl get svc -n default -l app.kubernetes.io/instance=ext
            exit 1
          fi

          # Per-broker NodePort Service has the user-supplied nodePort.
          np=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.ports[0].nodePort}')
          [ "$np" = "32100" ] || { echo "::error::per-broker nodePort got $np, want 32100"; exit 1; }
          stype=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.type}')
          [ "$stype" = "NodePort" ] || { echo "::error::per-broker Service type got $stype, want NodePort"; exit 1; }

          # Bootstrap NodePort Service has the configured bootstrap nodePort.
          bnp=$(kubectl get svc ext-external-bootstrap -n default -o jsonpath='{.spec.ports[0].nodePort}')
          [ "$bnp" = "32099" ] || { echo "::error::bootstrap nodePort got $bnp, want 32099"; exit 1; }

          # Per-broker Service pins selector to the StatefulSet's pod-name label.
          sel=$(kubectl get svc ext-external-10 -n default -o jsonpath='{.spec.selector.statefulset\.kubernetes\.io/pod-name}')
          [ "$sel" = "ext-ext-broker-0" ] || { echo "::error::per-broker selector got $sel, want ext-ext-broker-0"; exit 1; }

          # status.listeners[name=external] surfaces the bootstrap address.
          bs=$(kubectl get kafka ext -n default -o jsonpath='{.status.listeners[?(@.name=="external")].bootstrapServers}')
          [ -n "$bs" ] || { echo "::error::status.listeners[external].bootstrapServers empty"; exit 1; }
          echo "status.listeners[external].bootstrapServers=$bs"

          # Owned-by-Kafka cleanup: deleting the Kafka should cascade to
          # the external Services via owner-ref.
          kubectl delete kafka ext -n default --wait=false
          for i in $(seq 1 30); do
            svcs=$(kubectl get svc -n default -l app.kubernetes.io/instance=ext -o name 2>/dev/null | wc -l)
            echo "attempt $i: ext svcs=$svcs"
            if [ "$svcs" = "0" ]; then break; fi
            sleep 2
          done
          [ "$svcs" = "0" ] || { echo "::error::external Services not GC'd after Kafka delete"; kubectl get svc -n default -l app.kubernetes.io/instance=ext; exit 1; }
          kubectl delete knp ext-broker -n default --ignore-not-found

      - name: Smoke — LoadBalancer listener pulls an IP from MetalLB
        run: |
          set -e
          cat <<EOF | kubectl apply -f -
          apiVersion: crabka.io/v1alpha1
          kind: Kafka
          metadata:
            name: lb
            namespace: default
          spec:
            kafkaVersion: "0.1.1"
            listeners:
              - name: PLAIN
                port: 9092
                type: internal
                tls: false
              - name: cloud
                port: 9095
                type: loadbalancer
                tls: false
          ---
          apiVersion: crabka.io/v1alpha1
          kind: KafkaNodePool
          metadata:
            name: lb-broker
            namespace: default
            labels:
              crabka.io/cluster: lb
          spec:
            roles: [Controller, Broker]
            replicas: 1
            nodeIdStart: 20
          EOF

          # MetalLB may take a few seconds to allocate. Wait for ListenersReady=True.
          for i in $(seq 1 60); do
            ready=$(kubectl get kafka lb -n default -o jsonpath='{.status.conditions[?(@.type=="ListenersReady")].status}' 2>/dev/null || true)
            echo "attempt $i: ListenersReady=$ready"
            if [ "$ready" = "True" ]; then break; fi
            sleep 5
          done
          if [ "$ready" != "True" ]; then
            echo "::error::ListenersReady never reached True for LoadBalancer listener"
            kubectl describe kafka lb -n default
            kubectl get svc -n default -l app.kubernetes.io/instance=lb
            kubectl describe svc lb-cloud-bootstrap -n default || true
            kubectl logs -n metallb-system deploy/controller --tail=200 || true
            exit 1
          fi

          # The per-broker Service has type=LoadBalancer and MetalLB
          # populated `status.loadBalancer.ingress[0].ip`.
          stype=$(kubectl get svc lb-cloud-20 -n default -o jsonpath='{.spec.type}')
          [ "$stype" = "LoadBalancer" ] || { echo "::error::per-broker type=$stype, want LoadBalancer"; exit 1; }
          ip=$(kubectl get svc lb-cloud-20 -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$ip" ] || { echo "::error::per-broker LB IP empty"; kubectl describe svc lb-cloud-20 -n default; exit 1; }
          echo "per-broker LB IP: $ip"

          # Bootstrap Service also has an IP.
          bip=$(kubectl get svc lb-cloud-bootstrap -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$bip" ] || { echo "::error::bootstrap LB IP empty"; exit 1; }
          echo "bootstrap LB IP: $bip"

          # status.listeners reflects the bootstrap IP + the listener port.
          bs=$(kubectl get kafka lb -n default -o jsonpath='{.status.listeners[?(@.name=="cloud")].bootstrapServers}')
          [ "$bs" = "${bip}:9095" ] || { echo "::error::status.listeners[cloud].bootstrapServers got '$bs', want '${bip}:9095'"; exit 1; }

          # Cascade-delete via owner-ref.
          kubectl delete kafka lb -n default --wait=false
          for i in $(seq 1 30); do
            svcs=$(kubectl get svc -n default -l app.kubernetes.io/instance=lb -o name 2>/dev/null | wc -l)
            echo "attempt $i: lb svcs=$svcs"
            if [ "$svcs" = "0" ]; then break; fi
            sleep 2
          done
          [ "$svcs" = "0" ] || { echo "::error::LB Services not GC'd"; exit 1; }
          kubectl delete knp lb-broker -n default --ignore-not-found

      - name: Enable PodMonitor via Kafka.spec.metricsConfig
        run: |
          set -e
          initial_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}')
          echo "before metricsConfig patch: uid=$initial_uid"

          kubectl patch kafka demo -n default --type=merge \
            -p '{"spec":{"metricsConfig":{"podMonitor":{"interval":"15s"}}}}'

          # MetricsReady=True lands as soon as the operator applies the
          # PodMonitor — which happens before the pod itself rolls. Wait
          # for it as a first gate.
          kubectl wait kafka/demo -n default \
            --for=condition=MetricsReady=True --timeout=120s

          # Enabling metricsConfig changes the broker pod template (adds
          # the metrics container port + --metrics-listen-addr flag) so
          # the StatefulSet controller rolls the pod. Wait for the pod's
          # UID to change so the subsequent smoke checks observe the new
          # pod, not the stale one.
          for i in $(seq 1 60); do
            current_uid=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            echo "attempt $i: uid=$current_uid"
            if [ -n "$current_uid" ] && [ "$current_uid" != "$initial_uid" ]; then
              break
            fi
            sleep 2
          done
          if [ "$current_uid" = "$initial_uid" ]; then
            echo "::error::metricsConfig patch did not roll the broker pod within 120s (uid still=$initial_uid)"
            kubectl describe kafka demo -n default || true
            kubectl describe sts demo-brokers -n default || true
            kubectl get configmap demo-broker-config -n default -o yaml || true
            exit 1
          fi

          kubectl wait --for=condition=Ready -n default pod/demo-brokers-0 --timeout=180s

      - name: Smoke — PodMonitor rendered
        run: |
          set -e
          port=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].port}')
          [ "$port" = "metrics" ] || { echo "::error::PodMonitor port wrong: '$port'"; exit 1; }
          interval=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].interval}')
          [ "$interval" = "15s" ] || { echo "::error::interval wrong: '$interval'"; exit 1; }
          path=$(kubectl get podmonitor demo-broker -n default -o jsonpath='{.spec.podMetricsEndpoints[0].path}')
          [ "$path" = "/metrics" ] || { echo "::error::path wrong: '$path'"; exit 1; }

      - name: Smoke — broker pod exposes metrics container port
        run: |
          set -e
          port=$(kubectl get pod demo-brokers-0 -n default -o jsonpath='{.spec.containers[?(@.name=="broker")].ports[?(@.name=="metrics")].containerPort}')
          [ "$port" = "9404" ] || { echo "::error::metrics port wrong: '$port'"; exit 1; }

      - name: Smoke — /metrics endpoint exposes crabka_broker_ metrics
        run: |
          set -e
          # Use a one-shot curl pod inside the cluster to scrape the broker's
          # /metrics endpoint via its pod DNS name.
          kubectl run curl-metrics -n default --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 --quiet -- \
            -sf "http://demo-brokers-0.demo-broker-headless.default.svc.cluster.local:9404/metrics" \
            > /tmp/metrics.out
          grep -q '^# TYPE crabka_broker' /tmp/metrics.out || {
            echo "::error::crabka_broker_* metrics not exposed; first 20 lines of output:"
            head -20 /tmp/metrics.out
            exit 1
          }

      - name: Garbage-collection on Kafka delete
        run: |
          kubectl delete kafka demo -n default --wait=false
          for i in $(seq 1 30); do
            knp=$(kubectl get knp -n default -o name 2>/dev/null | wc -l)
            owned=$(kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo -o name 2>/dev/null | wc -l)
            pvcs=$(kubectl get pvc -n default -l app.kubernetes.io/instance=demo -o name 2>/dev/null | wc -l)
            echo "attempt $i: knp=$knp owned=$owned pvcs=$pvcs"
            if [ "$knp" = "0" ] && [ "$owned" = "0" ] && [ "$pvcs" = "0" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::owned objects not GC'd within 60s"
          kubectl get knp -n default
          kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo
          kubectl get pvc -n default
          exit 1

      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/operator-e2e-diag
          DIAG=/tmp/operator-e2e-diag/diagnostics.md
          {
            echo "## operator-e2e diagnostics (run \`${GITHUB_RUN_ID}\`)"
            echo
            echo "### Critical findings"
            pod_phase=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.phase}' 2>/dev/null)
            pod_reason=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' 2>/dev/null)
            pod_msg=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.message}' 2>/dev/null)
            pod_image=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null)
            last_term=$(kubectl get pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated}' 2>/dev/null)
            echo "- pod phase: \`${pod_phase:-unknown}\`"
            echo "- container image (spec): \`${pod_image:-(none)}\`"
            echo "- waiting reason: \`${pod_reason:-(none)}\`"
            echo "- waiting message: \`${pod_msg:-(none)}\`"
            echo "- last terminated: \`${last_term:-(none)}\`"
            echo "::error::operator pod phase=${pod_phase:-unknown} reason=${pod_reason:-none} image=${pod_image:-none}"
            echo
            for section in \
              "pods|kubectl get pods -A -o wide" \
              "events|kubectl get events -A --sort-by=.lastTimestamp" \
              "describe deploy|kubectl describe deploy/operator-crabka-operator -n crabka-operator" \
              "describe pods|kubectl describe pods -n crabka-operator -l app.kubernetes.io/name=crabka-operator" \
              "operator logs|kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500" \
              "operator logs (previous)|kubectl logs -n crabka-operator deploy/operator-crabka-operator --tail=500 --previous" \
              "kafka CR|kubectl get kafka demo -n default -o yaml" \
              "kafkanodepool|kubectl get knp -A -o yaml" \
              "broker sts|kubectl get sts demo-brokers -n default -o yaml" \
              "broker pod logs|kubectl logs -n default demo-brokers-0 -c broker --tail=500 || true" \
              "broker init logs|kubectl logs -n default demo-brokers-0 -c format --tail=500 || true" \
              "owned objects|kubectl get sts,svc,cm,secret -n default -l app.kubernetes.io/instance=demo -o yaml" \
              "pvcs|kubectl get pvc -n default -o yaml" \
              "kind node images|docker exec crabka-e2e-control-plane crictl images" \
              "host images|docker images"
            do
              title=${section%%|*}
              cmd=${section#*|}
              echo "### ${title}"
              echo '```'
              eval "$cmd" 2>&1
              echo '```'
              echo
            done
          } > "$DIAG"
          # Surface a short summary in the job log so the failure cause is
          # visible without downloading the artifact.
          echo "::group::diagnostics summary"
          head -40 "$DIAG"
          echo "..."
          echo "(full diagnostics uploaded as artifact 'operator-e2e-diagnostics')"
          echo "::endgroup::"

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-diagnostics
          path: /tmp/operator-e2e-diag/
          retention-days: 14
          if-no-files-found: ignore
