              - '.github/workflows/ci.yml'
            broker_integration:
              - 'crates/authz/**'
              - 'crates/blockstore/**'
              - 'crates/broker/**'
              - 'crates/client-admin/**'
              - 'crates/client-consumer/**'
              - 'crates/client-core/**'
              - 'crates/client-producer/**'
              - 'crates/compression/**'
              - 'crates/integration-tests/**'
              - 'crates/log/**'
              - 'crates/metadata/**'
              - 'crates/protocol/**'
              - 'crates/raft/**'
              - 'crates/records-legacy/**'
              - 'crates/remote-storage/**'
              - 'crates/security/**'
              - 'crates/units/**'
