name: ci
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.95.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-rust
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        if: matrix.os != 'ubuntu-latest'
      - name: Unit test coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib --bins --lcov --output-path coverage/unit.lcov
      - uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit.lcov
          disable_search: true
          flags: unit
          fail_ci_if_error: true

  jvm-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: jvm-differential
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: (cd tools/oracle && ./gradlew installDist --no-daemon)
      # `--exclude crabka-client-core` skips the testcontainers-based integration
      # tests (which need Docker). client-core's unit tests run under the
      # `rust` matrix job; its docker-gated tests run under
      # `client-core-integration`. We only want JVM oracle tests here.
      # `--exclude crabka-log` skips its testcontainers-based integration
      # test (Docker-only); it runs under the `log-integration` job below.
      # `--exclude crabka-broker` skips the testcontainers-based JVM
      # acceptance tests (Docker-only); they run under the
      # `broker-jvm-acceptance` job below.
      - name: JVM differential coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --exclude crabka-client-core --exclude crabka-log --exclude crabka-broker --lcov --output-path coverage/jvm-differential.lcov -- --include-ignored
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/jvm-differential.lcov
          disable_search: true
          flags: jvm-differential
          fail_ci_if_error: true

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - run: helm lint charts/crabka-operator
      - run: helm template demo charts/crabka-operator > /tmp/rendered.yaml
      - run: |
          # Basic shape check: at least one Deployment, Service, and ClusterRole.
          grep -q "kind: Deployment" /tmp/rendered.yaml
          grep -q "kind: Service" /tmp/rendered.yaml
          grep -q "kind: ClusterRole" /tmp/rendered.yaml
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.0
      - name: helm lint rebalancer chart
        run: helm lint charts/crabka-rebalancer --set bootstrapServers=test:9092
      - name: helm template rebalancer chart (sanity)
        run: |
          helm template demo charts/crabka-rebalancer --set bootstrapServers=test:9092 > /tmp/rebalancer.yaml
          grep -q "kind: Deployment" /tmp/rebalancer.yaml
          grep -q "kind: Service" /tmp/rebalancer.yaml
          grep -q "kind: ServiceAccount" /tmp/rebalancer.yaml
          grep -q "kind: PersistentVolumeClaim" /tmp/rebalancer.yaml
      - name: helm unittest rebalancer chart
        run: helm unittest charts/crabka-rebalancer

  # cargo-semver-checks is intentionally disabled until Crabka publishes its
  # first crate to crates.io (tracked under the slice 1e publishing workflow).
  # Until then, the tool has no baseline to compare against and errors out with
  # "crate not found in registry". Re-enable once at least one crate is on
  # crates.io.

  # Real-broker integration smoke test against testcontainers-spawned Kafka.
  client-core-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-core-integration
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Client core integration coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p crabka-client-core --test integration --lcov --output-path coverage/client-core-integration.lcov -- --ignored --nocapture
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/client-core-integration.lcov
          disable_search: true
          flags: client-core-integration
          fail_ci_if_error: true

  # crabka-log integration: docker cp a JVM-produced partition dir out of
  # a Kafka container and re-read it with crabka-log.
  log-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: log-integration
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Log integration coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p crabka-log --test integration --lcov --output-path coverage/log-integration.lcov -- --ignored --nocapture
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/log-integration.lcov
          disable_search: true
          flags: log-integration
          fail_ci_if_error: true

  # JVM kafka-console-{producer,consumer,topics} driving a Rust crabka-broker.
  # The broker binds 0.0.0.0:9092 on the runner; the in-container JVM tools
  # reach back via the Docker bridge gateway (typically 172.17.0.1). See
  # crates/broker/tests/KNOWN_ISSUES.md.
  #
  # 30-minute job timeout: each acceptance test is 1-2 min of docker-driven
  # broker boot + kafka-console-* round trip, and we currently run ~10 of
  # them serially (--test-threads=1). The default 360-minute GitHub timeout
  # made a hung test waste >1.5h before surfacing. If a single test stalls
  # for more than half an hour something is wedged — fail fast and re-run.
  broker-jvm-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: broker-jvm-acceptance
      # The Rust producer in `rust_producer_to_console_consumer` runs on
      # the host (not inside a container) and dials `host.docker.internal`
      # because that's the broker's advertised listener (cp-kafka tools
      # inside containers resolve the same name via `--add-host`). The
      # host itself has no such resolution on Linux runners, so add it.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Preload Docker images
        run: |
          docker pull confluentinc/cp-kafka:7.4.0
          docker pull apache/kafka:4.0.0
      # --test-threads=1: tests bind the Rust broker to a fixed host port
      # (so the `docker run --add-host` Kafka tools have a known bootstrap
      # target). Parallel execution would hit `AddrInUse`.
      - name: Broker JVM acceptance coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p crabka-broker \
            --test jvm_acceptance \
            --lcov --output-path coverage/broker-jvm-acceptance.lcov \
            -- --ignored --nocapture --test-threads=1
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/broker-jvm-acceptance.lcov
          disable_search: true
          flags: broker-jvm-acceptance
          fail_ci_if_error: true

  # Non-ignored broker + client-admin integration tests (the
  # in-process Broker-driven suites under `crates/broker/tests/*.rs`
  # and `crates/client-admin/tests/*.rs`). These don't show up in the
  # `unit` flag — that flag's `cargo llvm-cov --lib --bins` only walks
  # in-`src/` tests — so before this job KIP-113 handler + dispatch
  # branches that are only exercised end-to-end appeared as uncovered
  # in the patch view. Two `--no-report` runs share a profraw set,
  # then a single `report` produces the lcov.
  broker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: broker-integration
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Broker + client-admin integration coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p crabka-broker --tests
          cargo llvm-cov --no-report -p crabka-client-admin --tests
          cargo llvm-cov report --lcov --output-path coverage/broker-integration.lcov
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/broker-integration.lcov
          disable_search: true
          flags: broker-integration
          fail_ci_if_error: true
