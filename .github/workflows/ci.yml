              - 'crates/client-producer/**'
              - 'crates/client-consumer/**'
              - 'crates/broker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # 90, not 60. Runner speed varies by about 2x for identical work: commit
    # 13a30156c finished this job in 36 minutes on one run and was killed at
    # the 60-minute wall on another, and 5699969f5 took 40, 48 and 53 minutes
    # on three runs of the same tree. With the limit inside that spread the
    # job failed at random, which reads as a regression in whatever happened
    # to be pushed. The instrumented coverage build is the slow part.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.97.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
        if: matrix.os == 'ubuntu-latest'
      # Fail fast if any crate's html_root_url drifted from the workspace version
      # (run: tools/html-root-url.sh --fix). No toolchain needed.
      - name: html_root_url in sync
        if: matrix.os == 'ubuntu-latest'
        run: ./tools/html-root-url.sh
      - uses: ./.github/actions/free-disk-space
        if: matrix.os == 'ubuntu-latest'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Published crate allowlist
        if: matrix.os == 'ubuntu-latest'
        run: ./tools/check-publish-allowlist.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-rust
      # cargo-llvm-cov and cargo-nextest are pinned here and below, not left
      # on `@latest`.
      #
      # The `taiki-e/install-action@cargo-llvm-cov` tag is a moving tag. It
      # installs whatever version the action calls latest on the day the job
      # runs. Coverage is a gate in this workflow (a codecov flag per job), so
      # a silent cargo-llvm-cov upgrade can move the numbers with no commit to
      # point at. These pins name the versions CI already installed on
      # 2026-08-12. Renovate bumps them like any other dependency.
      #
      # The pin does NOT protect against a GitHub CDN outage, and it is not
      # meant to. install-action downloads the release tarball either way, and
      # it already retries hard: an outer 10-attempt loop around `curl
      # --retry 10`. In job 94246482239 on 2026-08-12 that spent 66 s on 503
      # answers before it gave up with curl exit 56. The action's default
      # `fallback: cargo-binstall` did not help, because the fallback only
      # runs when the tool or the version is absent from the action's
      # manifest, never on a download failure. An actions/cache layer was
      # measured and left out: that download failed once in 27,606 ci jobs
      # over 24 days, and the install itself takes 211 ms, so a cache would
      # add a round trip and save nothing.
      - uses: taiki-e/install-action@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: cargo-llvm-cov@0.8.7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # rustfmt runs on nightly so `format_code_in_doc_comments` (unstable, set in
      # rustfmt.toml) formats the code inside rustdoc examples too. Run this once
      # on Linux: `cargo fmt --all` can exceed Windows' process command-line limit
      # in this workspace. clippy/tests stay on the matrix toolchain.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
        if: matrix.os == 'ubuntu-latest'
      - run: cargo +nightly fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Run WHOLE crates here, never one `--test` target. The raft line used to
      # read `--test kraft_model`, which is 4 of the crate's 200 tests and one
      # of the seven files in `crates/raft/tests/`. The other 196 were
      # invisible to the only job that exists to cover the consensus engine, so
      # `kraft_engine_sim::repeated_leader_restart_reelects` merged red and
      # stayed red across several commits. All 200 take about 11 seconds, so a
      # filter buys no time and hides every file added later.
      - name: Diskless WAL shipping gates
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo nextest run -p crabka-raft --profile ci
          cargo nextest run -p crabka-broker --profile ci --lib diskless
          cargo nextest run -p crabka-verified --profile ci
      # nextest cannot run doctests, so run them explicitly (once, on Linux).
      - name: Doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc
      # The cross-platform matrix runs UNIT tests (--lib --bins) for portability;
      # the heavy `tests/*.rs` integration tests (in-process broker + streams,
      # testcontainers) run only in the dedicated Linux integration jobs, where
      # they aren't slow/flaky. Running them on the slow macOS runner timed out
      # (e.g. dsl_count_restart_restore_emit_on_update's 30s output wait).
      - name: Run tests
        if: matrix.os == 'macos-latest'
        run: cargo nextest run --workspace --profile ci --lib --bins
      - name: Run tests
        if: matrix.os == 'windows-latest'
        run: cargo nextest run --workspace --profile ci --lib --bins
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os != 'ubuntu-latest' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          flags: rust-${{ matrix.os }}
          fail_ci_if_error: false
      - name: Unit test coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest --workspace --profile ci --lib --bins --lcov --output-path coverage/unit.lcov
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit.lcov
          disable_search: true
          flags: unit
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: false

  jvm-differential:
    needs: changes
    if: ${{ needs.changes.outputs.jvm_differential == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: jvm-differential
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.143
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # `cache: gradle` keys a cache of ~/.gradle on tools/oracle's build
          # scripts and wrapper properties, so a warm run downloads neither the
          # Gradle distribution nor the oracle's Maven dependencies. Without
          # it, every run of this job re-downloads both, and that download is
          # the same single point of failure the pinned tool installs above
          # describe: on 2026-08-12 it died twice with "curl: (56) Connection
          # died, tried 5 times before giving up" (jobs 94269069069 and
          # 94273891809), before a line of Rust or Java was compiled.
          # `.github/workflows/sdk-java.yml` already caches this way.
          # `cache-dependency-path` scopes the key to tools/oracle, so an
          # unrelated Renovate bump under `sdks/java` no longer rotates it.
          cache: gradle
          cache-dependency-path: |
            tools/oracle/**/*.gradle*
            tools/oracle/gradle/wrapper/gradle-wrapper.properties
      - name: Build JVM oracle
        # Maven Central rate-limits cold resolves (HTTP 429). Retry with
        # backoff; Gradle keeps what it already downloaded.
        run: |
          for attempt in 1 2 3; do
            if (cd tools/oracle && ./gradlew installDist --no-daemon); then exit 0; fi
            if [ "$attempt" = 3 ]; then echo "::error::gradle installDist failed after 3 attempts"; exit 1; fi
            echo "gradle attempt $attempt failed; backing off"; sleep $((attempt * 45))
          done
      # Select the JVM-oracle targets explicitly. A workspace-wide
      # `--include-ignored` sweep also runs thousands of ordinary tests and
      # Docker- or PostgreSQL-gated suites that belong to dedicated jobs.
      - name: JVM differential coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --locked \
            -p crabka-compression \
            -p crabka-protocol \
            --profile ci \
            --test differential \
            --test differential_all \
            --test differential_api_versions \
            --test differential_describe_groups \
            --test differential_metadata \
            --test differential_offset_commit \
            --test differential_produce \
            --test differential_records \
            --test oracle_smoke \
            --lcov --output-path coverage/jvm-differential.lcov \
            -- --include-ignored
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/jvm-differential.lcov
          disable_search: true
          flags: jvm-differential
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          flags: jvm-differential
          fail_ci_if_error: false

  cargo-deny:
    needs: changes
    if: ${{ needs.changes.outputs.cargo_deny == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  creusot-verify:
    needs: changes
    if: ${{ needs.changes.outputs.creusot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Replay Creusot proof sessions
        run: |
          set -euo pipefail
          PIN="$(cat .creusot-version)"
          if [[ -z "${PIN}" ]]; then
            echo "::error::.creusot-version is empty" >&2
            exit 1
          fi

          IMAGE="ghcr.io/robot-head/crabka-creusot:${PIN}"
          docker pull "${IMAGE}"

          # Replay only: this must fail if checked-in proof sessions do not replay.
          # Keep build artifacts inside the container instead of the host checkout.
          docker run --rm \
            -e CARGO_TARGET_DIR=/tmp/creusot-target \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            "cargo creusot --replay -p crabka-verified && cargo creusot --replay -p crabka-throttle"

  gres-range-scaling:
    needs: changes
    if: ${{ needs.changes.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: gres-range-scaling
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify Gres scaling CI contract
        run: bash scripts/tests/gres-range-scaling-ci.sh
      - name: Measure live Gres range scaling
        run: |
          CRABKA_GRES_RANGE_SCALING_MODE=fast \
          CRABKA_GRES_RANGE_SCALING_FLOOR=2.1 \
          CRABKA_GRES_SHARDED_SCALING_FLOOR=2.1 \
          CRABKA_GRES_DECISION_CEILING_MIN_RATIO=0.5 \
          CRABKA_GRES_RANGE_SCALING_KEEP_ARTIFACTS=1 \
          ./scripts/gres-range-scaling.sh
      - name: Verify live scaling gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/gres-range-scaling-artifacts/range-scaling.json").read_text())
          assert artifact["mode"] == "live", artifact["mode"]
          thresholds = artifact["thresholds"]
          assert {
              key: thresholds[key]
              for key in (
                  "range4_vs_range1_min",
                  "sharded_range4_vs_range1_min",
                  "decision_ceiling_range4_min_ratio",
              )
          } == {
              "range4_vs_range1_min": 2.1,
              "sharded_range4_vs_range1_min": 2.1,
              "decision_ceiling_range4_min_ratio": 0.5,
          }
          assert artifact["passed"]["range_local"] is True
          assert artifact["passed"]["sharded_ingest"] is True
          assert artifact["passed"]["decision_ceiling"] is True
          assert artifact["passed"]["overall"] is True
          assert artifact["sharded_table"]["timestamp_transactions"]["commit_rate_curve"]
          assert artifact["sharded_table"]["decision_ceiling"]["g8_decision_ceiling_curve"]
          PY
      - name: Upload Gres range-scaling artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-range-scaling-artifacts
          path: target/gres-range-scaling-artifacts
          if-no-files-found: error
          retention-days: 30

  gres-topology-process-nemesis:
    needs: changes
    if: ${{ needs.changes.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: gres-topology-process-nemesis
      - name: Exercise a live Move through CLI, operator, and Gres
        run: bash scripts/tests/gres-topology-process-nemesis-ci.sh
      - name: Upload topology process evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-topology-process-nemesis
          path: target/g8-topology-process-nemesis
          if-no-files-found: error
          retention-days: 30

  gres-sharded-conformance:
