            helm_lint:
              - 'charts/**'
              - 'deploy/**'
              - 'crates/operator/**'
              - 'crates/rebalancer/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            client_core:
