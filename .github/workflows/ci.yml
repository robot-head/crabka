name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; let pushes to main run to completion.
#
# The flag must stay conditional. `cancel-in-progress: true` cancels main too,
# because the group key only separates main from the PR refs -- it does not
# exempt it. Measured on 2026-08-13 over the last 500 ci runs (2026-08-02 to
# 2026-08-13): 67 of them were pushes to main, and 28 of those 67 were
# cancelled. Every cancelled main run is a commit with no coverage report,
# because `codecov.yml` waits for all 18 uploads. `codecov/project` then has no
# base to compare a later PR against, and fails that PR for a reason that has
# nothing to do with its code.
#
# `github.ref != 'refs/heads/main'` is the whole predicate, because this
# workflow has exactly two triggers: `pull_request` (ref `refs/pull/N/merge`)
# and `push` to main. No tag and no release branch runs it -- confirmed over
# the same 500 runs, where every push event was on main. Widen this expression
# if a trigger is ever added.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Coverage builds with full DWARF debuginfo (debug=2) produce enormous
# `-C instrument-coverage` test binaries that exhaust the runner's disk ("No
# space left on device", which then crashes the linker / runner). LLVM
# source-based coverage maps regions via the embedded `__llvm_covmap` sections,
# NOT DWARF, so dropping to line tables roughly halves the binaries without
# changing coverage results. (`line-tables-only` keeps file:line in backtraces.)
#
# These two stay environment variables on purpose. They fix a CI-only disk
# problem. The same `[profile]` keys in `/.cargo/config.toml` would change
# every local `cargo build` as well, which is not wanted. The git-fetch
# setting is the other way round, so it lives in that file and not here. The
# note there records the two libgit2 TLS failures behind it, and why a config
# file costs less than a `CARGO_*` variable that `Swatinem/rust-cache` hashes
# into its cache key.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      jvm_differential: ${{ steps.filter.outputs.jvm_differential }}
      cargo_deny: ${{ steps.filter.outputs.cargo_deny }}
      creusot: ${{ steps.filter.outputs.creusot }}
      helm_lint: ${{ steps.filter.outputs.helm_lint }}
      client_core: ${{ steps.filter.outputs.client_core }}
      log: ${{ steps.filter.outputs.log }}
      client_consumer: ${{ steps.filter.outputs.client_consumer }}
      client_streams: ${{ steps.filter.outputs.client_streams }}
      grpc_gateway: ${{ steps.filter.outputs.grpc_gateway }}
      schema_registry: ${{ steps.filter.outputs.schema_registry }}
      broker_jvm: ${{ steps.filter.outputs.broker_jvm }}
      broker_integration: ${{ steps.filter.outputs.broker_integration }}
      doc_examples: ${{ steps.filter.outputs.doc_examples }}
      traces: ${{ steps.filter.outputs.traces }}
      metrics: ${{ steps.filter.outputs.metrics }}
      gres: ${{ steps.filter.outputs.gres }}
      connect: ${{ steps.filter.outputs.connect }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'release-plz.toml'
              - 'rust-toolchain.toml'
              - 'tools/check-publish-allowlist.sh'
              - '.config/nextest.toml'
              - '.cargo/mutants.toml'
              - '.github/workflows/ci.yml'
            jvm_differential:
              - 'crates/protocol/**'
              - 'crates/protocol-codegen/**'
              - 'crates/records-legacy/**'
              - 'crates/metadata/**'
              - 'crates/broker/**'
              - 'tools/oracle/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            cargo_deny:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - '.github/workflows/ci.yml'
            creusot:
              - 'crates/verified/**'
              - 'crates/throttle/**'
              - 'packaging/melange/creusot-toolchain.yaml'
              - 'packaging/apko/creusot-toolchain.yaml'
