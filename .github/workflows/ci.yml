name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage builds with full DWARF debuginfo (debug=2) produce enormous
# `-C instrument-coverage` test binaries that exhaust the runner's disk ("No
# space left on device", which then crashes the linker / runner). LLVM
# source-based coverage maps regions via the embedded `__llvm_covmap` sections,
# NOT DWARF, so dropping to line tables roughly halves the binaries without
# changing coverage results. (`line-tables-only` keeps file:line in backtraces.)
env:
  # Bump when bazel-diff, its flags, or the global seed algorithm changes.
  AFFECTED_HASH_SCHEMA: v1-bazel-diff-27.0.0-seed1
  # Durable artifacts are isolated by PR and producer repository. Only a
  # protected-main artifact is eligible as a cross-run fallback.
  AFFECTED_ARTIFACT_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  AFFECTED_ARTIFACT_BRANCH: ${{ github.head_ref || github.ref_name }}
  AFFECTED_ARTIFACT_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  AFFECTED_TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # actions/checkout initializes an empty repository before fetching.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # download-artifact v8 still bundles a legacy Buffer() call under Node 24.
  # Suppress only that upstream deprecation code, not Node warnings generally.
  NODE_OPTIONS: --disable-warning=DEP0005

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      jvm_differential: ${{ steps.filter.outputs.jvm_differential }}
      cargo_deny: ${{ steps.filter.outputs.cargo_deny }}
      helm_lint: ${{ steps.filter.outputs.helm_lint }}
      client_core: ${{ steps.filter.outputs.client_core }}
      log: ${{ steps.filter.outputs.log }}
      client_consumer: ${{ steps.filter.outputs.client_consumer }}
      client_streams: ${{ steps.filter.outputs.client_streams }}
      grpc_gateway: ${{ steps.filter.outputs.grpc_gateway }}
      schema_registry: ${{ steps.filter.outputs.schema_registry }}
      broker_jvm: ${{ steps.filter.outputs.broker_jvm }}
      broker_integration: ${{ steps.filter.outputs.broker_integration }}
      doc_examples: ${{ steps.filter.outputs.doc_examples }}
      traces: ${{ steps.filter.outputs.traces }}
      metrics: ${{ steps.filter.outputs.metrics }}
      gres: ${{ steps.filter.outputs.gres }}
      docs: ${{ steps.filter.outputs.docs }}
      codegen: ${{ steps.filter.outputs.codegen }}
      codspeed: ${{ steps.filter.outputs.codspeed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - '**/BUILD.bazel'
              - '**/*.bzl'
              - '.aspect/**'
              - '.bazelignore'
              - '.bazelrc'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'release-plz.toml'
              - 'rust-toolchain.toml'
              - 'tools/check-publish-allowlist.sh'
              - '.config/nextest.toml'
              - '.cargo/mutants.toml'
              - '.github/workflows/ci.yml'
            jvm_differential:
              - 'crates/protocol/**'
              - 'crates/protocol-codegen/**'
              - 'crates/records-legacy/**'
              - 'crates/metadata/**'
              - 'crates/broker/**'
              - 'tools/oracle/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            cargo_deny:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - '.github/workflows/ci.yml'
            helm_lint:
              - 'charts/**'
              - 'deploy/**'
              - 'crates/operator/**'
              - 'crates/rebalancer/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/operator-e2e.yml'
            client_core:
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            log:
              - 'crates/log/**'
              - 'crates/compression/**'
              - 'crates/records-legacy/**'
              - 'crates/remote-storage/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            client_consumer:
              - 'crates/client-consumer/**'
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'crates/metadata/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'crates/broker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            client_streams:
              - 'crates/client-streams/**'
              - 'crates/schema-serde/**'
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'crates/metadata/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'crates/broker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            grpc_gateway:
              - 'crates/grpc-gateway/**'
              - 'crates/client-consumer/**'
              - 'crates/client-producer/**'
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'crates/metadata/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'crates/broker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            schema_registry:
              - 'crates/schema-registry/**'
              - 'crates/client-admin/**'
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'crates/metadata/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'crates/broker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            broker_jvm:
              - 'crates/authz/**'
              - 'crates/broker/**'
              - 'crates/compression/**'
              - 'crates/log/**'
              - 'crates/metadata/**'
              - 'crates/protocol/**'
              - 'crates/raft/**'
              - 'crates/records-legacy/**'
              - 'crates/remote-storage/**'
              - 'crates/security/**'
              - 'tools/oracle/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            broker_integration:
              - 'crates/authz/**'
              - 'crates/broker/**'
              - 'crates/client-admin/**'
              - 'crates/compression/**'
              - 'crates/log/**'
              - 'crates/metadata/**'
              - 'crates/protocol/**'
              - 'crates/raft/**'
              - 'crates/records-legacy/**'
              - 'crates/remote-storage/**'
              - 'crates/security/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            traces:
              - 'crates/traces/**'
              - 'crates/traceql/**'
              - 'crates/blockstore/**'
              - 'crates/broker/**'
              - 'crates/client-consumer/**'
              - 'crates/client-producer/**'
              - 'crates/client-core/**'
              - 'crates/protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            doc_examples:
              - 'crates/client-streams/**'
              - 'crates/schema-serde/**'
              - 'crates/schema-registry/**'
              - 'crates/client-core/**'
              - 'crates/client-admin/**'
              - 'crates/client-producer/**'
              - 'crates/client-consumer/**'
              - 'crates/broker/**'
              - 'crates/docgen/**'
              - 'website/content/**'
              - '.aspect/tasks.axl'
              - 'crates/client-streams/BUILD.bazel'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            metrics:
              - 'crates/metrics/**'
              - 'crates/metrics-service/**'
              - 'crates/promql/**'
              - 'crates/blockstore/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            docs:
              - 'website/**'
              - 'crates/docgen/**'
              - 'crates/raft/**'
              - 'crates/kraft-core/**'
              - 'crates/voters/**'
              - 'crates/playground/**'
              - 'charts/**'
              - 'README.md'
              - '**/README.md'
              - 'lychee.toml'
              - '.github/workflows/docs.yml'
              - '.github/workflows/ci.yml'
            codegen:
              - 'crates/protocol/**'
              - 'crates/protocol-codegen/**'
              - 'deploy/crds/**'
              - 'tools/regenerate.sh'
              - 'tools/regen-crds.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/codegen-check.yml'
              - '.github/workflows/ci.yml'
            codspeed:
              - 'crates/protocol/**'
              - 'crates/log/**'
              - 'crates/compression/**'
              - 'crates/security/**'
              - 'crates/metadata/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/codspeed.yml'
              - '.github/workflows/ci.yml'
            gres:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - 'docs/PG_COMPAT_MATRIX.md'
              - 'tools/check-pg-compat-matrix.sh'
              - 'tools/check-pg-compat-matrix.py'
              - 'tools/gres-adopt-regress.sh'
              - 'tools/capture-gres-driver-goldens.py'
              - 'tools/gres-wire-recorder.py'
              - 'tools/tests/test_gres_wire_recorder.py'
              - 'tools/tests/test_capture_gres_driver_goldens.py'
              - 'NOTICE'
              - 'crates/gres-control/**'
              - 'crates/broker/**'
              - 'crates/client-admin/**'
              - 'crates/client-core/**'
              - 'crates/client-producer/**'
              - 'crates/client-consumer/**'
              - 'crates/protocol/**'
              - 'crates/operator/src/controller/gres.rs'
              - 'crates/operator/src/controller/gres_tenant.rs'
              - 'crates/operator/src/crd/gres.rs'
              - 'crates/operator/tests/reconcile_gres*.rs'
              - 'crates/operator/tests/shared/**'
              - 'crates/pgtypes/**'
              - 'crates/pgparser/**'
              - 'crates/pgwire/**'
              - 'crates/security/**'
              - 'crates/cli/**'
              - 'crates/pgkv/**'
              - 'crates/pgmvcc/**'
              - 'crates/pgcatalog/**'
              - 'crates/pgexec/**'
              - 'crates/gres/**'
              - 'crates/gres-activator/**'
              - 'crates/gres-ranges/**'
              - 'crates/gres-substrate/**'
              - 'crates/gres-fdw/**'
              - 'crates/gres-conformance/**'
              - 'scripts/gres-psql-smoke.sh'
              - 'scripts/gres-psql-introspection-smoke.sh'
              - 'scripts/fixtures/gres-psql-introspection.txt'
              - 'scripts/gres-durable-restart-smoke.sh'
              - 'scripts/gres-substrate-smoke.sh'
              - 'scripts/gres-e2e.sh'
              - 'scripts/gres-driver-goldens-gate.sh'
              - 'scripts/tests/gres_f0_runtime_gates.py'
              - 'scripts/gres-coldstart.sh'
              - 'scripts/gres-kind-lifecycle.sh'
              - 'scripts/tests/gres-kind-lifecycle-structure.sh'
              - 'packaging/BUILD.bazel'
              - 'packaging/image.bzl'
              - 'packaging/docker/Dockerfile.local-binary'
              - 'charts/crabka-operator/**'
              - 'scripts/gres-range-scaling.sh'
              - 'scripts/tests/gres-range-scaling-ci.sh'
              - 'scripts/gres-sharded-conformance.sh'
              - 'scripts/tests/gres_sharded_conformance_ci.py'

  affected-plan:
    needs: changes
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      affected_work: ${{ steps.suites.outputs.affected_work }}
      admin_ui: ${{ steps.suites.outputs.admin_ui }}
      broker_integration: ${{ steps.suites.outputs.broker_integration }}
      broker_jvm: ${{ steps.suites.outputs.broker_jvm }}
      client_consumer: ${{ steps.suites.outputs.client_consumer }}
      client_core: ${{ steps.suites.outputs.client_core }}
      client_streams: ${{ steps.suites.outputs.client_streams }}
      creusot: ${{ steps.suites.outputs.creusot }}
      gres: ${{ steps.suites.outputs.gres }}
      grpc_gateway: ${{ steps.suites.outputs.grpc_gateway }}
      grpc_gateway_jvm: ${{ steps.suites.outputs.grpc_gateway_jvm }}
      jvm_differential: ${{ steps.suites.outputs.jvm_differential }}
      jvm_oracle: ${{ steps.suites.outputs.jvm_oracle }}
      log: ${{ steps.suites.outputs.log }}
      metrics_conformance: ${{ steps.suites.outputs.metrics_conformance }}
      metrics_differential: ${{ steps.suites.outputs.metrics_differential }}
      operator: ${{ steps.suites.outputs.operator }}
      schema_registry: ${{ steps.suites.outputs.schema_registry }}
      has_tests: ${{ steps.suites.outputs.has_tests }}
      test_shards: ${{ steps.suites.outputs.test_shards }}
      traces: ${{ steps.suites.outputs.traces }}
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: base-hash-cache
        uses: actions/cache/restore@v5
        with:
          path: .aspect/affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json
          key: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ github.event.pull_request.base.sha || github.event.before }}
      - id: base-hash-current-artifact
        if: ${{ steps.base-hash-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/restore-run-artifact
        with:
          artifact-name: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ env.AFFECTED_ARTIFACT_SCOPE }}-${{ github.event.pull_request.base.sha || github.event.before }}.json
          download-path: .aspect
          expected-file: affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json
          producer-branch: ${{ env.AFFECTED_ARTIFACT_BRANCH }}
          producer-repository-id: ${{ env.AFFECTED_ARTIFACT_REPOSITORY_ID }}
      - id: base-hash-trusted-artifact
        if: >-
          ${{ steps.base-hash-cache.outputs.cache-hit != 'true' &&
              steps.base-hash-current-artifact.outputs.restored != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/restore-run-artifact
        with:
          artifact-name: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-main-${{ github.event.pull_request.base.sha || github.event.before }}.json
          download-path: .aspect
          expected-file: affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json
          producer-branch: ${{ env.AFFECTED_TRUSTED_BRANCH }}
          producer-repository-id: ${{ github.repository_id }}
      - uses: actions/checkout@v7
        if: >-
          ${{ steps.base-hash-cache.outputs.cache-hit != 'true' &&
              steps.base-hash-current-artifact.outputs.restored != 'true' &&
              steps.base-hash-trusted-artifact.outputs.restored != 'true' }}
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .aspect/base-workspace
      - id: head-hash-cache
        uses: actions/cache/restore@v5
        with:
          path: .aspect/affected-hashes-${{ github.sha }}.json
          key: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ github.sha }}
      - id: head-hash-current-artifact
        if: ${{ steps.head-hash-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/restore-run-artifact
        with:
          artifact-name: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ env.AFFECTED_ARTIFACT_SCOPE }}-${{ github.sha }}.json
          download-path: .aspect
          expected-file: affected-hashes-${{ github.sha }}.json
          producer-branch: ${{ env.AFFECTED_ARTIFACT_BRANCH }}
          producer-repository-id: ${{ env.AFFECTED_ARTIFACT_REPOSITORY_ID }}
      - uses: actions/cache@v5
        with:
          path: .aspect/cache/bazel-diff-v27.0.0.jar
          key: bazel-diff-v27.0.0-69ab1fd00f0ba0f15bb36ded659a58040b41957f712461aa46d98b7e58869aa3
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          # Graph hashing runs the cached bazel-diff release JAR and Bazel
          # queries only. Skip the action cache, but write the repository and
          # generated-external caches that make the next graph scan cheaper.
          cache-save: true
          cache-snapshot: false
          disk-cache: false
          external-cache: planner
      - name: Hash base build graph
        if: >-
          ${{ steps.base-hash-cache.outputs.cache-hit != 'true' &&
              steps.base-hash-current-artifact.outputs.restored != 'true' &&
              steps.base-hash-trusted-artifact.outputs.restored != 'true' }}
        run: >-
          aspect affected --mode hash
          --workspace "${{ github.workspace }}/.aspect/base-workspace"
          --hash-file ".aspect/affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json"
      - uses: actions/cache/save@v5
        if: ${{ steps.base-hash-cache.outputs.cache-hit != 'true' }}
        with:
          path: .aspect/affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json
          key: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: >-
          ${{ steps.base-hash-cache.outputs.cache-hit != 'true' &&
              steps.base-hash-current-artifact.outputs.restored != 'true' &&
              steps.base-hash-trusted-artifact.outputs.restored != 'true' }}
        continue-on-error: true
        with:
          name: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ env.AFFECTED_ARTIFACT_SCOPE }}-${{ github.event.pull_request.base.sha || github.event.before }}.json
          path: .aspect/affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: Hash head build graph
        if: >-
          ${{ steps.head-hash-cache.outputs.cache-hit != 'true' &&
              steps.head-hash-current-artifact.outputs.restored != 'true' }}
        run: >-
          aspect affected --mode hash
          --workspace "${{ github.workspace }}"
          --hash-file ".aspect/affected-hashes-${{ github.sha }}.json"
      - uses: actions/cache/save@v5
        if: ${{ steps.head-hash-cache.outputs.cache-hit != 'true' }}
        with:
          path: .aspect/affected-hashes-${{ github.sha }}.json
          key: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: >-
          ${{ steps.head-hash-cache.outputs.cache-hit != 'true' &&
              steps.head-hash-current-artifact.outputs.restored != 'true' }}
        continue-on-error: true
        with:
          name: affected-hashes-${{ env.AFFECTED_HASH_SCHEMA }}-${{ env.AFFECTED_ARTIFACT_SCOPE }}-${{ github.sha }}.json
          path: .aspect/affected-hashes-${{ github.sha }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: Plan affected targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          aspect affected --mode plan
          --starting-hashes ".aspect/affected-hashes-${{ github.event.pull_request.base.sha || github.event.before }}.json"
          --final-hashes ".aspect/affected-hashes-${{ github.sha }}.json"
      - name: Export affected suites
        id: suites
        run: |
          cat .aspect/affected-plan/suites.txt >> "$GITHUB_OUTPUT"
          build_count=$(grep -c . .aspect/affected-plan/builds.txt || true)
          test_count=$(grep -c . .aspect/affected-plan/tests.txt || true)
          warm_count=$(grep -c . .aspect/affected-plan/warm-tests.txt || true)
          if ((build_count > 0 || warm_count > 0)); then
            echo 'affected_work=true' >> "$GITHUB_OUTPUT"
          else
            echo 'affected_work=false' >> "$GITHUB_OUTPUT"
          fi
          if ((test_count > 0)); then
            echo 'has_tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_tests=false' >> "$GITHUB_OUTPUT"
          fi
          shard_count=$test_count
          if ((shard_count > 4)); then shard_count=4; fi
          case "$shard_count" in
            0|1) echo 'test_shards=[0]' >> "$GITHUB_OUTPUT" ;;
            2) echo 'test_shards=[0,1]' >> "$GITHUB_OUTPUT" ;;
            3) echo 'test_shards=[0,1,2]' >> "$GITHUB_OUTPUT" ;;
            4) echo 'test_shards=[0,1,2,3]' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: affected-plan
          path: .aspect/affected-plan
          retention-days: 1

  affected-build:
    needs: [changes, affected-plan]
    if: >-
      ${{ needs.affected-plan.outputs.affected_work == 'true' ||
          needs.changes.outputs.gres == 'true' }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: affected-plan
          path: .aspect/affected-plan
      - uses: ./.github/actions/free-disk-space
        if: ${{ needs.affected-plan.outputs.affected_work == 'true' }}
      - id: bazel
        if: ${{ needs.affected-plan.outputs.affected_work == 'true' }}
        uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          # The warmer is the sole writer for this run's immutable `affected`
          # disk-cache snapshot. Its consumers only restore that snapshot.
          cache-save: true
          disk-cache: affected
          disk-cache-artifact-restore: if-no-snapshot
      - id: trusted-disk-cache
        if: >-
          ${{ needs.affected-plan.outputs.affected_work == 'true' &&
              steps.bazel.outputs.disk-cache-complete != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/restore-run-artifact
        with:
          artifact-name: affected-bazel-disk-v1-main.tar.zst
          download-path: ${{ runner.temp }}
          expected-file: affected-bazel-disk-v1-main.tar.zst
          producer-branch: ${{ env.AFFECTED_TRUSTED_BRANCH }}
          producer-repository-id: ${{ github.repository_id }}
          skip-decompress: true
      - name: Restore the trusted main disk-cache fallback
        if: >-
          ${{ needs.affected-plan.outputs.affected_work == 'true' &&
              steps.trusted-disk-cache.outputs.restored == 'true' }}
        run: >-
          aspect affected-cache --mode restore
          --archive "$RUNNER_TEMP/affected-bazel-disk-v1-main.tar.zst"
          --cache-dir "$HOME/.cache/bazel-disk"
      - name: Build affected dependencies
        if: ${{ needs.affected-plan.outputs.affected_work == 'true' }}
        run: aspect affected --mode warm
      - name: Pack the completed affected cache
        id: pack-disk-cache
        if: ${{ needs.affected-plan.outputs.affected_work == 'true' }}
        continue-on-error: true
        env:
          CACHE_ARTIFACT: affected-bazel-disk-v1-${{ env.AFFECTED_ARTIFACT_SCOPE }}.tar.zst
        run: >-
          aspect affected-cache --mode pack
          --archive "$RUNNER_TEMP/$CACHE_ARTIFACT"
          --cache-dir "$HOME/.cache/bazel-disk"
          --snapshot "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: >-
          ${{ needs.affected-plan.outputs.affected_work == 'true' &&
              steps.pack-disk-cache.outcome == 'success' }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/affected-bazel-disk-v1-${{ env.AFFECTED_ARTIFACT_SCOPE }}.tar.zst
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  affected-test:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.has_tests == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected-plan.outputs.test_shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: affected-plan
          path: .aspect/affected-plan
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
          disk-cache: affected
      - name: Test affected targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: aspect affected --mode test --shard "${{ matrix.shard }}" --shards "${{ strategy.job-total }}"

  docs:
    needs: [changes, affected-plan, affected-build]
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.changes.outputs.docs == 'true' &&
          needs.changes.result == 'success' &&
          needs.affected-plan.result == 'success' &&
          (needs.affected-build.result == 'success' || needs.affected-build.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  codegen-check:
    needs: [changes, affected-plan, affected-build]
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.changes.outputs.codegen == 'true' &&
          needs.changes.result == 'success' &&
          needs.affected-plan.result == 'success' &&
          (needs.affected-build.result == 'success' || needs.affected-build.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/codegen-check.yml
    secrets: inherit

  codspeed:
    needs: [changes, affected-plan, affected-build]
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.changes.outputs.codspeed == 'true' &&
          needs.changes.result == 'success' &&
          needs.affected-plan.result == 'success' &&
          (needs.affected-build.result == 'success' || needs.affected-build.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/codspeed.yml
    secrets: inherit

  operator-e2e:
    needs: [changes, affected-plan, affected-build]
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          needs.changes.result == 'success' &&
          needs.affected-plan.result == 'success' &&
          (needs.affected-build.result == 'success' || needs.affected-build.result == 'skipped') &&
          (needs.changes.outputs.helm_lint == 'true' ||
           needs.affected-plan.outputs.operator == 'true' ||
           contains(github.event.pull_request.labels.*.name, 'e2e-oauth') ||
           contains(github.event.pull_request.labels.*.name, 'e2e-oauth-introspection')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/operator-e2e.yml
    with:
      affected: ${{ needs.affected-plan.outputs.operator == 'true' }}
    secrets: inherit

  gatekeeper-operator:
    needs: operator-e2e
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check operator e2e result
        if: ${{ needs.operator-e2e.result == 'failure' || needs.operator-e2e.result == 'cancelled' }}
        run: exit 1

  jvm-differential:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.jvm_differential == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Preload gRPC gateway JVM image
        if: ${{ needs.affected-plan.outputs.grpc_gateway_jvm == 'true' }}
        run: docker pull mirror.gcr.io/confluentinc/cp-kafka:7.5.0
      # Select the JVM-oracle targets explicitly. A workspace-wide
      # `--include-ignored` sweep also runs thousands of ordinary tests and
      # Docker- or PostgreSQL-gated suites that belong to dedicated jobs.
      - name: Protocol JVM differential coverage
        if: ${{ needs.affected-plan.outputs.jvm_oracle == 'true' }}
        run: |
          mkdir -p coverage
          aspect test \
            //crates/compression:differential \
            //crates/protocol:differential_all \
            //crates/protocol:differential_api_versions \
            //crates/protocol:differential_describe_groups \
            //crates/protocol:differential_metadata \
            //crates/protocol:differential_offset_commit \
            //crates/protocol:differential_produce \
            //crates/protocol:differential_records \
            --coverage \
            --bazel-flag=--config=ci --bazel-flag=--test_arg=--include-ignored
          aspect coverage-report --output coverage/jvm-oracle-differential.lcov
      - uses: codecov/codecov-action@v7
        if: ${{ needs.affected-plan.outputs.jvm_oracle == 'true' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/jvm-oracle-differential.lcov
          disable_search: true
          flags: jvm-oracle-differential
          fail_ci_if_error: false
      - name: gRPC gateway JVM differential coverage
        if: ${{ needs.affected-plan.outputs.grpc_gateway_jvm == 'true' }}
        run: |
          mkdir -p coverage
          aspect test //crates/grpc-gateway:jvm_differential \
            --coverage \
            --bazel-flag=--config=ci --bazel-flag=--test_arg=--include-ignored
          aspect coverage-report --output coverage/grpc-gateway-jvm-differential.lcov
      - uses: codecov/codecov-action@v7
        if: ${{ needs.affected-plan.outputs.grpc_gateway_jvm == 'true' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/grpc-gateway-jvm-differential.lcov
          disable_search: true
          flags: grpc-gateway-jvm-differential
          fail_ci_if_error: false

  cargo-deny:
    needs: changes
    if: ${{ needs.changes.outputs.cargo_deny == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          command: check advisories bans sources licenses
          command-arguments: --hide-inclusion-graph

  creusot-verify:
    needs: affected-plan
    if: ${{ needs.affected-plan.outputs.creusot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
          cache-snapshot: false
          disk-cache: false
          external-cache: planner
      - name: Replay Creusot proof sessions
        run: >-
          aspect test //verif:creusot_replay
          --bazel-flag=--config=ci
          --bazel-flag=--nocache_test_results
          --bazel-flag=--test_env=CRABKA_SOURCE_ROOT="$GITHUB_WORKSPACE"

  gres-range-scaling:
    needs: [changes, affected-plan, affected-build]
    if: ${{ needs.changes.outputs.gres == 'true' || needs.affected-plan.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify Gres scaling CI contract
        run: aspect gres --task:name=gres-range-scaling-contract --suite range-scaling-ci
      - name: Measure live Gres range scaling
        run: |
          # The optimized Bazel binaries saturate the four-core hosted runner
          # near 2x on the sharded path; keep a separate floor from the
          # range-local curve rather than retaining the old Cargo-debug value.
          CRABKA_GRES_RANGE_SCALING_MODE=fast \
          CRABKA_GRES_RANGE_SCALING_FLOOR=2.1 \
          CRABKA_GRES_SHARDED_SCALING_FLOOR=1.9 \
          CRABKA_GRES_DECISION_CEILING_MIN_RATIO=0.45 \
          CRABKA_GRES_RANGE_SCALING_KEEP_ARTIFACTS=1 \
          aspect gres --task:name=gres-range-scaling --suite range-scaling
      - name: Verify live scaling gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("target/gres-range-scaling-artifacts/range-scaling.json").read_text())
          assert artifact["mode"] == "live", artifact["mode"]
          thresholds = artifact["thresholds"]
          assert {
              key: thresholds[key]
              for key in (
                  "range4_vs_range1_min",
                  "sharded_range4_vs_range1_min",
                  "decision_ceiling_range4_min_ratio",
              )
          } == {
              "range4_vs_range1_min": 2.1,
              "sharded_range4_vs_range1_min": 1.9,
              "decision_ceiling_range4_min_ratio": 0.45,
          }
          assert artifact["passed"]["range_local"] is True
          assert artifact["passed"]["sharded_ingest"] is True
          assert artifact["passed"]["decision_ceiling"] is True
          assert artifact["passed"]["overall"] is True
          assert artifact["sharded_table"]["timestamp_transactions"]["commit_rate_curve"]
          assert artifact["sharded_table"]["decision_ceiling"]["g8_decision_ceiling_curve"]
          PY
      - name: Upload Gres range-scaling artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-range-scaling-artifacts
          path: target/gres-range-scaling-artifacts
          if-no-files-found: error
          retention-days: 30

  gres-topology-process-nemesis:
    needs: [changes, affected-plan, affected-build]
    if: ${{ needs.changes.outputs.gres == 'true' || needs.affected-plan.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: gres-topology-process-nemesis
      - name: Exercise a live Move through CLI, operator, and Gres
        run: aspect gres --task:name=gres-topology-process-nemesis --suite topology-process-nemesis
      - name: Upload topology process evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-topology-process-nemesis
          path: target/g8-topology-process-nemesis
          if-no-files-found: error
          retention-days: 30

  gres-sharded-conformance:
    needs: [changes, affected-plan, affected-build]
    if: ${{ needs.changes.outputs.gres == 'true' || needs.affected-plan.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRABKA_GRES_SHARDED_CONFORMANCE_MODE: live
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: gres-sharded-conformance
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate live G-8 gate structure
        run: python3 scripts/tests/gres_sharded_conformance_ci.py
      - name: G-8 sharded conformance gate
        run: aspect gres --task:name=gres-sharded-conformance --suite sharded-conformance
      - name: Upload G-8 sharded conformance artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-sharded-conformance-artifacts
          path: target/gres-sharded-conformance-artifacts
          if-no-files-found: error
          retention-days: 30

  helm-lint:
    needs: changes
    if: ${{ needs.changes.outputs.helm_lint == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - run: helm lint charts/crabka-operator
      - run: helm template demo charts/crabka-operator > /tmp/rendered.yaml
      - run: |
          # Basic shape check: at least one Deployment, Service, and ClusterRole.
          grep -q "kind: Deployment" /tmp/rendered.yaml
          grep -q "kind: Service" /tmp/rendered.yaml
          grep -q "kind: ClusterRole" /tmp/rendered.yaml
      - name: Install helm-unittest plugin
        run: |
          set -euo pipefail
          HELM_UNITTEST_VERSION=1.1.2
          HELM_UNITTEST_FINGERPRINT=853008CD0B0A5A2DA04FF8A5616AD47F65B54AC7
          helm_unittest_gnupg="$(mktemp -d)"
          trap 'rm -rf -- "$helm_unittest_gnupg"' EXIT
          export GNUPGHOME="$helm_unittest_gnupg"

          curl --fail --location --retry 3 --silent --show-error \
            --output "$GNUPGHOME/public-key.asc" \
            "https://raw.githubusercontent.com/helm-unittest/helm-unittest/v${HELM_UNITTEST_VERSION}/public-key.asc"
          actual_fingerprint="$(gpg --batch --show-keys --with-colons "$GNUPGHOME/public-key.asc" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ "$actual_fingerprint" != "$HELM_UNITTEST_FINGERPRINT" ]]; then
            echo "unexpected helm-unittest signing key: $actual_fingerprint" >&2
            exit 1
          fi

          gpg --batch --import "$GNUPGHOME/public-key.asc"
          gpg --batch --export "$HELM_UNITTEST_FINGERPRINT" > "$GNUPGHOME/pubring.gpg"
          helm plugin install \
            "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/unittest-${HELM_UNITTEST_VERSION}.tgz" \
            --keyring "$GNUPGHOME/pubring.gpg"
      - name: helm lint rebalancer chart
        run: helm lint charts/crabka-rebalancer --set bootstrapServers=test:9092
      - name: helm template rebalancer chart (sanity)
        run: |
          helm template demo charts/crabka-rebalancer --set bootstrapServers=test:9092 > /tmp/rebalancer.yaml
          grep -q "kind: Deployment" /tmp/rebalancer.yaml
          grep -q "kind: Service" /tmp/rebalancer.yaml
          grep -q "kind: ServiceAccount" /tmp/rebalancer.yaml
          grep -q "kind: PersistentVolumeClaim" /tmp/rebalancer.yaml
      - name: helm unittest rebalancer chart
        run: helm unittest charts/crabka-rebalancer

  # cargo-semver-checks is intentionally disabled until Crabka publishes its
  # first crate to crates.io (tracked under the slice 1e publishing workflow).
  # Until then, the tool has no baseline to compare against and errors out with
  # "crate not found in registry". Re-enable once at least one crate is on
  # crates.io.

  # Real-broker integration smoke test against testcontainers-spawned Kafka.
  client-core-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.client_core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Client core integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/client-core:integration --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--ignored --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/client-core-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/client-core-integration.lcov
          disable_search: true
          flags: client-core-integration
          fail_ci_if_error: false

  # crabka-log integration: docker cp a JVM-produced partition dir out of
  # a Kafka container and re-read it with crabka-log.
  log-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Log integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/log:integration --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--ignored --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/log-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/log-integration.lcov
          disable_search: true
          flags: log-integration
          fail_ci_if_error: false

  # crabka-client-consumer integration: cooperative-rebalance + poll/commit
  # against an in-process Rust broker (no Docker). The `unit` flag's
  # `--lib --bins` walk never descends into these `tests/` binaries, so the
  # consumer's close()/coordinator-lifecycle code is only exercised here.
  client-consumer-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.client_consumer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Client consumer integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/client-consumer:all --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/client-consumer-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/client-consumer-integration.lcov
          disable_search: true
          flags: client-consumer-integration
          fail_ci_if_error: false

  # crabka-client-streams integration: KIP-1071 streams-group membership
  # (join / heartbeat / assignment / leave) against an in-process Rust broker
  # (no Docker). Like the consumer job, the `unit` flag's `--lib --bins` walk
  # never descends into these `tests/` binaries, so StreamsMembership::start and
  # the heartbeat-coordinator lifecycle are only exercised here.
  client-streams-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.client_streams == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Client streams integration coverage
        run: |
          mkdir -p coverage
          # Includes the Avro/Protobuf/JSON bridge tests + byte-exact Confluent
          # golden tests (schema serdes are always-on; goldens use checked-in
          # bytes, no broker/registry needed).
          aspect test //crates/client-streams:all --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/client-streams-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/client-streams-integration.lcov
          disable_search: true
          flags: client-streams-integration
          fail_ci_if_error: false
      - name: Schema-serde unit coverage
        run: |
          aspect test //crates/schema-serde:schema-serde_lib_test --coverage --bazel-flag=--config=ci
          aspect coverage-report --output coverage/schema-serde-unit.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/schema-serde-unit.lcov
          disable_search: true
          flags: schema-serde
          fail_ci_if_error: false

  # Build & run every documented client-streams example, then verify the
  # website snippets are in sync with their source (doc-drift guard). See
  # the Aspect docs task.
  doc-examples:
    needs: [changes, affected-plan, affected-build]
    if: >-
      ${{ always() && needs.changes.outputs.doc_examples == 'true' &&
          needs.changes.result == 'success' &&
          needs.affected-plan.result == 'success' &&
          (needs.affected-build.result == 'success' || needs.affected-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: true
          disk-cache: doc-examples
      - name: Build & run documented examples + snippet drift guard
        run: aspect docs --task:name=doc-examples

  # crabka-grpc-gateway integration: unary Send produce, group consume+commit,
  # and single-owner exactly-once dedup against an in-process Rust broker (no
  # Docker). The gateway's logic lives in `src/` but is exercised only by these
  # `tests/` binaries, so the `unit` flag's `--lib --bins` walk never covers it.
  # (The Docker-only `jvm_differential` test is `#[ignore]` and skipped here.)
  grpc-gateway-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.grpc_gateway == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: gRPC gateway integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/grpc-gateway:all --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/grpc-gateway-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/grpc-gateway-integration.lcov
          disable_search: true
          flags: grpc-gateway-integration
          fail_ci_if_error: false

  # crabka-schema-registry integration: schema validation, REST conformance, and
  # record-schema round-trips against an in-process broker (no Docker). The
  # Docker binaries (`interop`, `capture_fixtures`) are #[ignore]'d and are
  # excluded here — only the three non-Docker binaries run. The `unit` flag's
  # `--lib --bins` walk never descends into `tests/` binaries, so this job
  # provides the only line-level coverage for those paths.
  schema-registry-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.schema_registry == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Schema registry integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/schema-registry:integration //crates/schema-registry:rest_conformance //crates/schema-registry:schemas_record //crates/schema-registry:compat_conformance //crates/schema-registry:ha //crates/schema-registry:security --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/schema-registry-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/schema-registry-integration.lcov
          disable_search: true
          flags: schema-registry-integration
          fail_ci_if_error: false

  # crabka-traces TraceQL conformance gate: replays the curated TraceQL golden
  # corpus through the crabka-traceql harness and fails on any unexpected
  # regression. Docker-free (the differential-vs-Tempo + Grafana suites are
  # `#[ignore]`'d and run only in the scheduled/labeled `traces-differential`
  # job, never in the default `cargo test --workspace`). The `unit` flag's
  # `--lib --bins` walk never descends into this `tests/` binary, so this job is
  # the only PR-time coverage for the conformance harness.
  traces-conformance:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.traces == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: TraceQL conformance gate coverage
        run: |
          mkdir -p coverage
          aspect test //crates/traces:all //crates/traceql:all --coverage --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/traces-conformance.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/traces-conformance.lcov
          disable_search: true
          flags: traces-conformance
          fail_ci_if_error: false

  # Crabka Gres conformance gate: build the vendored Postgres-compatible engine,
  # run psql smoke coverage, then diff against a postgres:18 oracle with the
  # checked-in parity baseline. The parity reports are uploaded for triage.
  gres-conformance:
    needs: [changes, affected-plan, affected-build]
    if: ${{ needs.changes.outputs.gres == 'true' || needs.affected-plan.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      oracle:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: gres-conformance
      - name: F-0 runtime wiring contract
        run: python3 scripts/tests/gres_f0_runtime_gates.py
      - name: Driver capture safety contract
        run: python3 -m unittest tools/tests/test_gres_wire_recorder.py tools/tests/test_capture_gres_driver_goldens.py
      - name: PostgreSQL compatibility matrix anti-rot check
        run: |
          aspect gres --task:name=pg-compat-self-test --suite check-pg-compat -- --self-test
          aspect gres --task:name=pg-compat --suite check-pg-compat
      - name: Install psql 18 (pgdg)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
      - name: Install pinned Python PostgreSQL driver
        run: python3 -m pip install --require-hashes --no-deps -r crates/gres-conformance/requirements-driver-smoke.txt
      - name: Captured driver startup replay
        run: CRABKA_GRES_SKIP_BUILD=1 timeout 30s aspect gres --task:name=gres-driver-goldens --suite driver-goldens
      - run: aspect gres --task:name=gres-psql --suite psql
      - name: psql introspection transcript
        run: CRABKA_GRES_SKIP_BUILD=1 aspect gres --task:name=gres-psql-introspection --suite psql-introspection
      - name: Durable restart smoke
        run: aspect gres --task:name=gres-durable-restart --suite durable-restart
      - name: Substrate WAL smoke
        run: CRABKA_GRES_SKIP_BUILD=1 aspect gres --task:name=gres-substrate --suite substrate
      - name: Front-door PgDog e2e gate
        run: CRABKA_GRES_SKIP_BUILD=1 CRABKA_GRES_E2E_KEEP_ARTIFACTS=1 aspect gres --task:name=gres-e2e --suite e2e
      - name: Cold-start SLO gate
        # This harness builds release images and asserts lifecycle ordering.
        # Coverage instrumentation slows the in-cluster compute enough to
        # perturb the held-session/PgDog rollout race it is measuring. Keep
        # this timing gate on normal release binaries; the surrounding smoke,
        # front-door, and parity executions remain instrumented.
        env:
          BASH_ENV: ""
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          CRABKA_GRES_KIND_ARTIFACT_DIR=target/gres-coldstart-artifacts \
            aspect gres --task:name=gres-coldstart --suite coldstart
      - name: Conformance harness against the parity baseline
        run: |
          ./target/debug/crabka-gres --listen 127.0.0.1:54333 &
          for _ in $(seq 30); do
            if psql "host=127.0.0.1 port=54333 user=crab dbname=crab sslmode=prefer" -tAc 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 0.3
          done
          ./target/debug/crabka-gres-conformance \
            --oracle-url "host=127.0.0.1 port=54320 user=postgres dbname=postgres" \
            --subject-url "host=127.0.0.1 port=54333 user=crab dbname=crab" \
            --corpus crates/gres-conformance/corpus \
            --baseline crates/gres-conformance/baseline.json \
            --corpus-regress crates/gres-conformance/corpus-regress \
            --regress-baseline crates/gres-conformance/corpus-regress/baseline.json \
            --extended-corpus crates/gres-conformance/corpus-extended \
            --extended-baseline crates/gres-conformance/corpus-extended/baseline.json \
            --extended-out extended-parity-standalone.json \
            --extended-summary extended-parity-standalone.md \
            --regress-out regress-parity.json \
            --regress-summary regress-parity.md \
            --out parity.json --summary parity.md
      - name: Create a fresh oracle database for the substrate leg
        run: psql "host=127.0.0.1 port=54320 user=postgres dbname=postgres" -c "CREATE DATABASE oracle2"
      - name: Conformance against the substrate-backed engine
        run: |
          export CRABKA_CLUSTER_ID=00000000-0000-0000-0000-000000000001
          BROKER_PID=""
          GRES_PID=""
          cleanup() {
            kill "${GRES_PID:-}" "${BROKER_PID:-}" 2>/dev/null || true
            wait "${GRES_PID:-}" "${BROKER_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ./target/debug/crabka format \
            --log-dir /tmp/gres-substrate-ci-data \
            --cluster-id "$CRABKA_CLUSTER_ID" \
            --standalone \
            --node-id 1 \
            --controller-listener 127.0.0.1:9093
          ./target/debug/crabka-broker \
            --log-dir /tmp/gres-substrate-ci-data \
            --cluster-id "$CRABKA_CLUSTER_ID" \
            --broker-id 1 \
            --listen-addr 127.0.0.1:9092 &
          BROKER_PID=$!
          for _ in $(seq 80); do
            if python3 -c 'import socket; socket.create_connection(("127.0.0.1", 9092), timeout=0.2).close()' >/dev/null 2>&1
            then
              break
            fi
            sleep 0.25
          done
          python3 -c 'import socket; socket.create_connection(("127.0.0.1", 9092), timeout=0.2).close()'

          printf '%s\n' crab | ./target/debug/crabka gres create-tenant \
            --bootstrap 127.0.0.1:9092 \
            --name conformance \
            --user crab \
            --password-stdin
          ./target/debug/crabka-gres \
            --listen 127.0.0.1:54334 \
            --substrate-bootstrap 127.0.0.1:9092 \
            --tenant conformance \
            --auth trust &
          GRES_PID=$!
          for _ in $(seq 80); do
            if psql "host=127.0.0.1 port=54334 user=crab dbname=crab sslmode=prefer" -tAc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          psql "host=127.0.0.1 port=54334 user=crab dbname=crab sslmode=prefer" -tAc 'SELECT 1'
          ./target/debug/crabka-gres-conformance \
            --oracle-url "host=127.0.0.1 port=54320 user=postgres dbname=oracle2" \
            --subject-url "host=127.0.0.1 port=54334 user=crab dbname=crab" \
            --corpus crates/gres-conformance/corpus \
            --baseline crates/gres-conformance/substrate-baseline.json \
            --extended-corpus crates/gres-conformance/corpus-extended \
            --extended-baseline crates/gres-conformance/corpus-extended/baseline.json \
            --extended-out extended-parity-substrate.json \
            --extended-summary extended-parity-substrate.md \
            --out parity-substrate.json --summary parity-substrate.md
      - name: Publish parity summary
        run: cat parity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish pg_regress adoption summary
        run: cat regress-parity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish substrate parity summary
        run: cat parity-substrate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish extended parity summaries
        run: cat extended-parity-standalone.md extended-parity-substrate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate Gres end-to-end coverage
        run: |
          mkdir -p coverage
          test_status=0
          aspect test //crates/gres-conformance:all --coverage --bazel-flag=--config=ci || test_status=$?
          aspect coverage-report --output coverage/gres-conformance.lcov
          exit "$test_status"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/gres-conformance.lcov
          disable_search: true
          flags: gres-conformance
          fail_ci_if_error: false
      - name: Upload parity report
        if: ${{ !cancelled() && hashFiles('parity.json', 'regress-parity.json', 'parity-substrate.json', 'extended-parity-standalone.json', 'extended-parity-substrate.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-parity-report
          path: |
            parity.json
            parity.md
            regress-parity.json
            regress-parity.md
            parity-substrate.json
            parity-substrate.md
            extended-parity-standalone.json
            extended-parity-standalone.md
            extended-parity-substrate.json
            extended-parity-substrate.md
          if-no-files-found: error
      - name: Upload Gres front-door e2e artifacts
        if: ${{ !cancelled() && hashFiles('target/gres-e2e-artifacts/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-front-door-e2e-artifacts
          path: |
            target/gres-e2e-artifacts
            target/gres-e2e-artifacts/extended-parity-pgdog.json
            target/gres-e2e-artifacts/extended-parity-pgdog.md
          if-no-files-found: error
      - name: Upload Gres cold-start artifacts
        if: ${{ !cancelled() && hashFiles('target/gres-coldstart-artifacts/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gres-coldstart-artifacts
          path: target/gres-coldstart-artifacts
          if-no-files-found: error

  # Gres integration coverage: the engine, range/control plane, lifecycle
  # services, and CLI have most behavior behind tests/ targets rather than
  # unit tests.
  gres-integration:
    needs: [changes, affected-plan, affected-build]
    if: ${{ needs.changes.outputs.gres == 'true' || needs.affected-plan.outputs.gres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Gres engine integration coverage
        run: |
          aspect test \
            //crates/pgwire:all //crates/pgexec:all //crates/gres-fdw:all \
            //crates/gres-substrate:all //crates/gres:all //crates/gres-ranges:all \
            //crates/gres-control:all //crates/gres-conformance:all //crates/cli:all \
            //crates/gres-activator:all //crates/gres-balancer:all \
            --coverage --bazel-flag=--config=ci
          aspect coverage-report --output lcov.info
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          flags: gres-integration
          fail_ci_if_error: false

  # Admin UI's Dioxus dependency graph pushes the already-large workspace
  # LLVM build past the hosted runner's disk limit. Keep its non-ignored
  # integration suite on a dedicated runner; the Playwright E2E remains
  # ignored unless explicitly requested with its feature and environment.
  admin-ui-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.admin_ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Admin UI integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/admin-ui:all --coverage --bazel-flag=--config=ci
          aspect coverage-report --output coverage/admin-ui-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/admin-ui-integration.lcov
          disable_search: true
          flags: admin-ui-integration
          fail_ci_if_error: false

  # JVM kafka-console-{producer,consumer,topics} driving a Rust crabka-broker.
  # The broker binds 0.0.0.0:9092 on the runner; the in-container JVM tools
  # reach back via the Docker bridge gateway (typically 172.17.0.1). See
  # crates/broker/tests/KNOWN_ISSUES.md.
  #
  # 30-minute job timeout: each acceptance test is 1-2 min of docker-driven
  # broker boot + kafka-console-* round trip, and we currently run ~10 of
  # them serially through a nextest test group. The default 360-minute GitHub timeout
  # made a hung test waste >1.5h before surfacing. If a single test stalls
  # for more than half an hour something is wedged — fail fast and re-run.
  broker-jvm-acceptance:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.broker_jvm == 'true' }}
    runs-on: ubuntu-latest
    # 45-minute budget: the suite grew (next-gen consumer-group + KIP-595
    # multi-voter cases) and runs serially via a nextest test group under `llvm-cov`
    # (~2x slowdown), so the ~25 docker-driven acceptance tests no longer fit
    # the old 30-minute wall. A genuinely wedged test still surfaces well
    # inside the CI cap. (Per-test stalls are caught by the in-test timeouts.)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # llvm-cov profraw + two preloaded Kafka images + the cargo target dir
      # exhaust the ~14 GB free on the default runner; reclaim ~25-30 GB of
      # unused preinstalled SDKs (the shared action leaves the JDK + Docker
      # images intact for the testcontainers acceptance suite).
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      # The Rust producer in `rust_producer_to_console_consumer` runs on
      # the host (not inside a container) and dials `host.docker.internal`
      # because that's the broker's advertised listener (cp-kafka tools
      # inside containers resolve the same name via `--add-host`). The
      # host itself has no such resolution on Linux runners, so add it.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Preload Docker images
        run: |
          docker pull mirror.gcr.io/confluentinc/cp-kafka:7.4.0
          docker pull mirror.gcr.io/apache/kafka:4.0.0
      # These tests bind the Rust broker to a fixed host port so the Dockerized
      # Kafka tools have a known bootstrap target. Serialize both Bazel targets
      # and their libtest cases to avoid `AddrInUse`.
      - name: Broker JVM acceptance coverage
        run: |
          mkdir -p coverage
          aspect test //crates/broker:jvm_acceptance //crates/broker:jvm_consumer_group_next_gen \
            --coverage \
            --bazel-flag=--config=ci --bazel-flag=--local_test_jobs=1 \
            --bazel-flag=--test_arg=--ignored --bazel-flag=--test_arg=--test-threads=1
          aspect coverage-report --output coverage/broker-jvm-acceptance.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/broker-jvm-acceptance.lcov
          disable_search: true
          flags: broker-jvm-acceptance
          fail_ci_if_error: false

  # Non-ignored broker + client-admin integration tests (the
  # in-process Broker-driven suites under `crates/broker/tests/*.rs`
  # and `crates/client-admin/tests/*.rs`). These don't show up in the
  # `unit` flag — that flag's `cargo llvm-cov nextest --lib --bins` only walks
  # in-`src/` tests — so before this job KIP-113 handler + dispatch
  # branches that are only exercised end-to-end appeared as uncovered
  # in the patch view. Two `--no-report` runs share a profraw set,
  # then a single `report` produces the lcov.
  broker-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.broker_integration == 'true' }}
    runs-on: ubuntu-latest
    # 30-minute budget: this runs the whole non-ignored broker suite (plus
    # client-admin) twice under llvm-cov instrumentation (~2-3x slowdown), and
    # the suite has grown substantially (share groups, client metrics, etc.).
    # The work progresses steadily; it just no longer fits the old 15-minute
    # wall. (A genuinely hung test still surfaces well inside half an hour.)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # `llvm-cov clean` + two instrumented `--no-report` runs generate a large
      # profraw set on top of the cargo target dir, which exhausted the runner's
      # ~14 GB free disk ("No space left on device", then a SIGBUS in the
      # linker). The shared action reclaims ~25-30 GB of unused preinstalled SDKs.
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Broker + client-admin integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/broker:all //crates/client-admin:all \
            --coverage \
            --bazel-flag=--config=ci
          aspect coverage-report --output coverage/broker-integration.lcov
          aspect build //crates/integration-tests:diskless_jepsen --bazel-flag=--config=ci
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/broker-integration.lcov
          disable_search: true
          flags: broker-integration
          fail_ci_if_error: false

  # Operator mock-harness reconcile tests (no Docker, no real K8s cluster).
  # Each tests/<name>.rs file must be listed with `--test <name>` so that
  # the codecov/patch check sees coverage for newly added test files.
  operator-integration:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.operator == 'true' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Operator reconcile integration coverage
        run: |
          mkdir -p coverage
          aspect test //crates/operator:all \
            --coverage \
            --bazel-flag=--config=ci --bazel-flag=--test_arg=--nocapture
          aspect coverage-report --output coverage/operator-integration.lcov
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/operator-integration.lcov
          disable_search: true
          flags: operator-integration
          fail_ci_if_error: false

  # PromQL `.test` conformance gate (no Docker): runs the vendored Prometheus
  # `.test` corpus through the engine.
  # Runs on every PR as a gate (a regression flips a `.test` file to failing).
  metrics-conformance:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.metrics_conformance == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: PromQL conformance gate
        run: aspect test //crates/promql:conformance --bazel-flag=--config=ci

  # Real-Prometheus byte/semantic differential gate (Docker). The PromQL/metrics
  # wire-format compat constraint (Prometheus/Mimir exactness, incl. NaN/±Inf and
  # staleness) is load-bearing, so a regression must NOT merge green. The full
  # Prometheus + Mimir + Grafana matrix runs nightly in `metrics-differential.yml`
  # (heavy: three pulled images); here we gate every metrics-touching PR on the
  # lightest of the three — the real-Prometheus differential corpus (one pulled
  # image, no `host.docker.internal` datasource dance). All tests in the suite are
  # `#[ignore = "requires Docker"]`, so `--ignored` opts them in (the default
  # `cargo test` never touches Docker). Mirrors the metrics-differential nightly
  # job's runner/setup/caching.
  metrics-differential-prometheus:
    needs: [affected-plan, affected-build]
    if: ${{ needs.affected-plan.outputs.metrics_differential == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The pulled Prometheus image plus the cargo target dir pressure the
      # ~14 GB free on the default runner; reclaim the unused preinstalled SDKs
      # like the other Docker-heavy jobs do (leaves Docker images intact for
      # testcontainers).
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: false
      - name: Preload Docker image
        run: docker pull mirror.gcr.io/prom/prometheus:v3.8.0
      # The target contains one host-only endpoint test and one Docker-gated
      # differential. Own both here so the generic shards do not run it again.
      - name: Prometheus differential suite (host and Docker)
        run: aspect test //crates/metrics-service:diff_prometheus --bazel-flag=--config=ci --bazel-flag=--test_arg=--include-ignored --bazel-flag=--test_arg=--nocapture

  gatekeeper-ci:
    needs:
      - changes
      - affected-plan
      - affected-build
      - affected-test
      - docs
      - codegen-check
      - codspeed
      - operator-e2e
      - jvm-differential
      - cargo-deny
      - creusot-verify
      - helm-lint
      - client-core-integration
      - log-integration
      - client-consumer-integration
      - client-streams-integration
      - doc-examples
      - grpc-gateway-integration
      - schema-registry-integration
      - traces-conformance
      - gres-range-scaling
      - gres-topology-process-nemesis
      - gres-sharded-conformance
      - gres-conformance
      - gres-integration
      - admin-ui-integration
      - broker-jvm-acceptance
      - broker-integration
      - operator-integration
      - metrics-conformance
      - metrics-differential-prometheus
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check dynamic CI job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
