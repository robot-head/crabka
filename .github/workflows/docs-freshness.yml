name: docs-freshness

# Weekly "robot review" that re-derives the documentation from the *current*
# code and fails (opening a tracking issue) if anything no longer holds. The
# main `docs` workflow only runs when a change touches the docs path filters;
# this catches drift from changes that bypass those filters — e.g. a new
# protocol API key that should appear in the reference, a config field that
# vanished, a KIP link that rotted, or a consensus change that breaks one of the
# generated failure-scenario invariants (the diagrams are produced by running
# the real simulator, so a regression there is a real bug, not stale prose).

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open/update a tracking issue when docs drift is detected
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      # Re-derive the whole reference tree from current code. A failure here
      # means doc generation itself broke against the live APIs.
      - name: Regenerate reference markdown
        run: aspect run //crates/docgen:crabka-docgen__bin --bazel-flag=--config=ci -- all --out website/content/docs/reference

      # The doc generators carry assertions about their own output (sectioned
      # config table, protocol spec links, etc.).
      - name: Test doc generators
        run: aspect test //crates/docgen:all --bazel-flag=--config=ci

      # The failure-scenario slideshow is generated by running the deterministic
      # consensus simulator; these tests assert the invariants the diagrams
      # claim (e.g. the split-brain trace ends with exactly one leader). If the
      # consensus code drifts, this fails and the published diagrams would be
      # wrong — exactly what this weekly check exists to catch.
      - name: Test generated consensus scenarios
        run: aspect test //crates/raft:all --bazel-flag=--config=ci

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - name: Build site
        run: zola build
        working-directory: website

      # On any failure above, open a fresh tracking issue (or comment on the
      # existing open one) so the drift is visible rather than silent.
      - name: Report drift
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'docs-freshness';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly **docs-freshness** check failed — the documentation no longer',
              'regenerates cleanly from the current code (doc generation, the docgen /',
              'scenario tests, or the Zola build broke).',
              '',
              `Failing run: ${runUrl}`,
              '',
              'This usually means a code change drifted away from what the docs assert',
              '(a new/removed protocol API or config field, or a consensus change that',
              'breaks a generated failure-scenario invariant). Re-run locally with:',
              '',
              '```sh',
              'aspect run //crates/docgen:crabka-docgen__bin --bazel-flag=--config=ci -- all --out website/content/docs/reference',
              'aspect test //crates/docgen:all --bazel-flag=--config=ci',
              'aspect test //crates/raft:all --bazel-flag=--config=ci',
              '(cd website && zola build)',
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'docs-freshness: documentation no longer regenerates from current code',
                labels: [label],
                body,
              });
            }
