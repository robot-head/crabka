name: mutants

# Incremental mutation testing (https://mutants.rs). For each pull request,
# cargo-mutants generates mutants ONLY for the lines changed in the diff
# (`--in-diff`) and checks that the test suite kills them. Mutating the whole
# 30-crate workspace would take hours; scoping to the PR's own churn keeps it
# fast while still giving a stronger signal than line coverage — a surviving
# mutant means a changed line runs but nothing asserts on its behaviour.
#
# This is deliberately a standalone workflow, NOT wired into ci.yml's
# gatekeeper-ci aggregator. Like the advisory codecov patch check, a surviving
# mutant can be a false positive (e.g. logic exercised only by the Docker-gated,
# #[ignore]'d JVM / testcontainers suites that don't run here). It surfaces as
# its own check; promote it to a required check via branch protection if/when
# the signal proves reliable.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/mutants.toml'
      - '.github/workflows/mutants.yml'

permissions:
  contents: read

# Cancel superseded PR runs.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run nextest under the `ci` profile so the test-group serialization in
  # .config/nextest.toml applies (the fixed-port broker / schema-registry
  # binaries must not run concurrently within a mutant's test run).
  NEXTEST_PROFILE: ci

jobs:
  incremental-mutants:
    runs-on: ubuntu-latest
    # cargo-mutants rebuilds + reruns the mutated crate's nextest suite once per
    # candidate mutant; even scoped to a diff a large PR can take a while. Cap
    # well above the 45-min unit jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so we can diff the PR head against its base branch.
          fetch-depth: 0
      # Building every crate (prost/protobuf codegen) and running the broad
      # nextest suite per mutant fills the runner's ~14 GB free disk; reclaim the
      # unused preinstalled SDKs like the other heavy Linux jobs do.
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      # protoc is required to build the protocol / codegen crates.
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest
      - name: Compute PR diff
        # `base...HEAD` (three-dot) diffs from the merge base, so only the PR's
        # own changes feed `--in-diff`. fetch-depth: 0 above makes the base
        # branch's history available locally.
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" | tee git.diff
      - name: Mutants
        # --no-shuffle gives deterministic ordering (stable logs across reruns);
        # -vV surfaces per-mutant build/test output. test_tool=nextest plus the
        # timeouts and exclusions come from .cargo/mutants.toml.
        run: cargo mutants --no-shuffle -vV --in-diff git.diff
      - name: Archive mutants.out
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-incremental.out
          path: mutants.out
