name: sdk-ts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-ts-${{ github.ref }}
  cancel-in-progress: true

# Fetch git dependencies with the system `git` client, not the libgit2 client
# cargo links in. See the long note on this setting in `ci.yml`: libgit2 failed
# twice in 24 days inside the `datafusion` git pin's test-data submodules, with
# "the SSL certificate is invalid; class=Ssl (16)", and cargo's own diagnostic
# recommends this switch. The cargo jobs below all resolve the workspace, so
# any of them can hit that clone.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/ts/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23.x'
      - name: Generate SDK stubs
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.54.0 generate
          git diff --exit-code -- buf.gen.yaml sdks/ts/gen
      - name: Install dependencies
        run: npm ci
        working-directory: sdks/ts
      - name: Build SDK
        run: npm run build
        working-directory: sdks/ts
      - name: Type-check SDK
        run: npm run typecheck
        working-directory: sdks/ts
      - name: Test SDK
        run: npm test
        working-directory: sdks/ts
      - name: Run conformance vectors
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter sdks/ts/bin/conformance-adapter --vectors crates/sdk-conformance/vectors/v1
      - name: Run live-compatible conformance vectors
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter sdks/ts/bin/conformance-adapter --vectors crates/sdk-conformance/vectors/v1 --live-substrate --live-compatible-only
