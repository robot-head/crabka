name: sdk-ts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/ts/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - name: Generate SDK stubs
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.54.0 generate
          git diff --exit-code -- buf.gen.yaml sdks/ts/gen
      - name: Install dependencies
        run: npm ci
        working-directory: sdks/ts
      - name: Build SDK
        run: npm run build
        working-directory: sdks/ts
      - name: Type-check SDK
        run: npm run typecheck
        working-directory: sdks/ts
      - name: Test SDK
        run: npm test
        working-directory: sdks/ts
      - name: Run conformance vectors
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter sdks/ts/bin/conformance-adapter --vectors crates/sdk-conformance/vectors/v1
      - name: Run live-compatible conformance vectors
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter sdks/ts/bin/conformance-adapter --vectors crates/sdk-conformance/vectors/v1 --live-substrate --live-compatible-only
