name: release-plz
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - uses: MarcoIeni/release-plz-action@v0.5
        # Default command runs both `release-pr` (opens the version-bump PR)
        # and `release` (publish + tag/release). The first publish has landed
        # (all crates are on crates.io at 0.3.x), so the earlier `release`-only
        # workaround is no longer needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # crates.io publishing — release-plz.toml sets publish = true.
          # Assumes the repo secret is named CARGO_REGISTRY_TOKEN.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
