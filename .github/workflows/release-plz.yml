name: release-plz
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          # Publish + tag/release only. The release-pr step errors while no
          # crate is on crates.io yet but v0.1.x git tags already exist; once
          # the first publish lands this can revert to the default (both).
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # crates.io publishing — release-plz.toml sets publish = true.
          # Assumes the repo secret is named CARGO_REGISTRY_TOKEN.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
