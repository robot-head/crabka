name: docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/docgen/**"
      - "crates/operator/**"
      - "crates/broker/**"
      - "crates/protocol/**"
      - "charts/**"
      - ".github/workflows/docs.yml"
    tags:
      # Same anchor as publish-images: one Helm repo update per workspace release.
      - "crabka-broker-v*"
  pull_request:
    paths:
      - "website/**"
      - "crates/docgen/**"
      - "charts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Generate reference markdown
        run: cargo run -p crabka-docgen -- all --out website/content/reference
      - name: Build rustdoc
        run: cargo doc --no-deps --workspace
      - name: Stage rustdoc into site
        run: |
          mkdir -p website/static/api/rust
          cp -r target/doc/* website/static/api/rust/
      - name: Stage branding images
        run: |
          mkdir -p website/static/images
          cp docs/*.png website/static/images/ || true
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.1
      - name: Package Helm charts and generate repository index
        run: |
          mkdir -p website/static/charts
          for chart in charts/*/; do
            helm package "$chart" -d website/static/charts/
          done
          helm repo index website/static/charts/ \
            --url https://robot-head.github.io/crabka/charts/
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - name: Build site
        run: zola build
        working-directory: website
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/crabka-broker-v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/crabka-broker-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
