name: codegen-check
on:
  pull_request:
    paths:
      - 'crates/protocol/**'
      - 'crates/protocol-codegen/**'
      - 'deploy/crds/**'
      - 'tools/regenerate.sh'
      - 'tools/regen-crds.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codegen-check.yml'
  push:
    branches: [main]
    paths:
      - 'crates/protocol/**'
      - 'crates/protocol-codegen/**'
      - 'deploy/crds/**'
      - 'tools/regenerate.sh'
      - 'tools/regen-crds.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codegen-check.yml'

concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
      - run: aspect codegen --task:name=codegen-drift
