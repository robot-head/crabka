name: codegen-check
on:
  pull_request:
    paths:
      - 'crates/protocol/**'
      - 'crates/protocol-codegen/**'
      - 'deploy/crds/**'
      - 'tools/regenerate.sh'
      - 'tools/regen-crds.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codegen-check.yml'
  push:
    branches: [main]
    paths:
      - 'crates/protocol/**'
      - 'crates/protocol-codegen/**'
      - 'deploy/crds/**'
      - 'tools/regenerate.sh'
      - 'tools/regen-crds.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codegen-check.yml'

concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: codegen-check
      - run: ./tools/regenerate.sh
      - run: ./tools/regen-crds.sh
      - name: Fail on drift
        run: |
          if ! git diff --quiet crates/protocol/generated deploy/crds; then
            echo "::error::Generated files are out of sync. Run tools/regenerate.sh and tools/regen-crds.sh and commit."
            git --no-pager diff crates/protocol/generated deploy/crds
            exit 1
          fi
