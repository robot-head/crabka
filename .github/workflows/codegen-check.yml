name: codegen-check
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'crates/protocol/**'
      - 'crates/protocol-codegen/**'
      - 'deploy/crds/**'
      - 'tools/regenerate.sh'
      - 'tools/regen-crds.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codegen-check.yml'

concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: true
          disk-cache: codegen
      - run: aspect codegen --task:name=codegen-drift
