name: codegen-check
on:
  workflow_call:
    inputs:
      affected_cache:
        description: Restore the root CI dependency warmer cache read-only.
        required: false
        type: boolean
        default: false

concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AFFECTED_ARTIFACT_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  AFFECTED_ARTIFACT_BRANCH: ${{ github.head_ref || github.ref_name }}
  AFFECTED_ARTIFACT_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  NODE_OPTIONS: --disable-warning=DEP0005 --disable-warning=DEP0040

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: ${{ !inputs.affected_cache }}
          disk-cache: ${{ inputs.affected_cache && 'affected' || 'codegen' }}
      - run: aspect codegen --task:name=codegen-drift
