name: CodSpeed

on:
  push:
    branches:
      - "main"
    paths:
      - 'crates/protocol/**'
      - 'crates/log/**'
      - 'crates/compression/**'
      - 'crates/security/**'
      - 'crates/metadata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'crates/protocol/**'
      - 'crates/log/**'
      - 'crates/compression/**'
      - 'crates/security/**'
      - 'crates/metadata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: codspeed

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - name: Build the benchmark target(s)
        run: |
          cargo codspeed build \
            --package crabka-protocol \
            --package crabka-log \
            --package crabka-compression \
            --package crabka-security \
            --package crabka-metadata

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run
