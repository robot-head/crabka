name: CodSpeed

on:
  push:
    branches:
      - "main"
    paths:
      - 'crates/protocol/**'
      - 'crates/log/**'
      - 'crates/compression/**'
      - 'crates/security/**'
      - 'crates/metadata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  pull_request:
    paths:
      - 'crates/protocol/**'
      - 'crates/log/**'
      - 'crates/compression/**'
      - 'crates/security/**'
      - 'crates/metadata/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - //crates/protocol:bench_codec
          - //crates/protocol:bench_records
          - //crates/log:bench_log
          - //crates/compression:bench_codec
          - //crates/security:bench_scram
          - //crates/metadata:bench_image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: aspect run '${{ matrix.target }}' --bazel-flag=--config=ci --bazel-flag=--config=codspeed
