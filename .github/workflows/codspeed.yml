name: CodSpeed

on:
  workflow_call:
    inputs:
      affected_cache:
        description: Restore the root CI dependency warmer cache read-only.
        required: false
        type: boolean
        default: false
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AFFECTED_ARTIFACT_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  AFFECTED_ARTIFACT_BRANCH: ${{ github.head_ref || github.ref_name }}
  AFFECTED_ARTIFACT_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  NODE_OPTIONS: --disable-warning=DEP0005 --disable-warning=DEP0040

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          cache-save: ${{ !inputs.affected_cache }}
          disk-cache: ${{ inputs.affected_cache && 'affected' || 'codspeed' }}
      - name: Build benchmarks
        run: >-
          aspect build
          //crates/protocol:bench_codec
          //crates/protocol:bench_records
          //crates/log:bench_log
          //crates/compression:bench_codec
          //crates/security:bench_scram
          //crates/metadata:bench_image
          --bazel-flag=--config=ci
          --bazel-flag=--config=codspeed
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: |
            bazel-bin/crates/protocol/bench_codec
            bazel-bin/crates/protocol/bench_records
            bazel-bin/crates/log/bench_log
            bazel-bin/crates/compression/bench_codec
            bazel-bin/crates/security/bench_scram
            bazel-bin/crates/metadata/bench_image
