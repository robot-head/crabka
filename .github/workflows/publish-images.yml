name: publish-images

# Publishes the multi-arch Crabka container images and their supply-chain
# attestations.
#
# Images are built for linux/amd64 (x86_64) and linux/arm64 (aarch64). Each
# arch's APK packages are compiled natively on a matching runner (no QEMU), then
# apko assembles a single multi-arch OCI image index per service.
#
# For every published image we generate, keylessly sign (Sigstore/Fulcio), and
# publish two attestations against the image index digest:
#   * SLSA build provenance (actions/attest-build-provenance)
#   * SPDX SBOM produced by apko    (actions/attest-sbom)
# Attestations are stored in GitHub's attestation API *and* pushed to GHCR as
# OCI referrers. Verify with:
#   gh attestation verify oci://ghcr.io/robot-head/crabka-broker:<tag> \
#     --repo robot-head/crabka
# The same command works for the Docker Hub mirror (robothead/<image>) because
# verification resolves the digest from the registry and looks the attestation
# up in GitHub's store by digest.

on:
  push:
    tags:
      # release-plz tags every crate per release at the shared workspace
      # version (e.g. crabka-broker-v0.3.5) — there is no bare `v0.3.5` tag.
      # Anchor on the broker tag so the image set publishes exactly once per
      # release rather than once per crate tag.
      - "crabka-broker-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: git tag or 'edge')"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the image tag once so the build/publish matrices agree on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Determine image tag
        id: tags
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_NAME}" == crabka-broker-v* ]]; then
            VERSION="${GITHUB_REF_NAME#crabka-broker-v}"
          else
            VERSION="edge"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Compile the APK packages once per architecture, natively on a matching
  # runner. Each leg signs its repo with its own ephemeral key and uploads only
  # the public half — the private signing key never leaves the build runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install melange
        run: |
          go install chainguard.dev/melange@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Cache melange/cargo build artifacts
        uses: actions/cache@v6
        with:
          path: .melange-cache
          key: melange-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            melange-${{ matrix.arch }}-

      - name: Set melange package version from the workspace
        run: |
          set -euo pipefail
          # Derive the APK package version from the workspace manifest so it
          # tracks the crate release automatically — no hand-edited version in
          # packaging/melange/crabka.yaml.
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          sed -i -E "s/^(  version:).*/\1 ${ver}/" packaging/melange/crabka.yaml
          echo "melange package version set to ${ver}"

      - name: Build APK packages (single compile for all images)
        run: |
          mkdir -p packages .melange-cache
          # Each arch's repo is signed with its own key. apk references signing
          # keys by basename, so the keys must have arch-unique names — otherwise
          # the two `melange.rsa.pub` files collide in apko's keyring and one
          # arch's APKINDEX fails verification at publish time.
          melange keygen "melange-${{ matrix.arch }}.rsa"
          melange build packaging/melange/crabka.yaml \
            --source-dir . \
            --signing-key "melange-${{ matrix.arch }}.rsa" \
            --arch ${{ matrix.arch }} \
            --runner docker \
            --cache-dir "$PWD/.melange-cache" \
            --out-dir packages/

      - name: Upload APK repository + keyring
        uses: actions/upload-artifact@v7
        with:
          name: apk-repository-${{ matrix.arch }}
          path: |
            packages/
            melange-${{ matrix.arch }}.rsa.pub
          retention-days: 1
          if-no-files-found: error

  # One leg per image: assemble the multi-arch index with apko, then attest the
  # index digest.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push images + attestation referrers to GHCR
      id-token: write # request the Sigstore OIDC token (keyless signing)
      attestations: write # write to GitHub's attestation store
    strategy:
      fail-fast: false
      matrix:
        image:
          - crabka-broker
          - crabka-gateway
          - crabka-operator
          - crabka-schema-registry
          - bench-driver
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install apko
        run: |
          go install chainguard.dev/apko@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Download x86_64 APK repository
        uses: actions/download-artifact@v8
        with:
          name: apk-repository-x86_64
          path: dist/x86_64

      - name: Download aarch64 APK repository
        uses: actions/download-artifact@v8
        with:
          name: apk-repository-aarch64
          path: dist/aarch64

      - name: Assemble multi-arch APK repository
        run: |
          set -euo pipefail
          # Each arch lands under packages/<arch>/; merge both into one local
          # repo so apko can resolve every arch the image config requests.
          mkdir -p packages
          cp -r dist/x86_64/packages/. packages/
          cp -r dist/aarch64/packages/. packages/

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image + capture digest
        id: publish
        run: |
          set -euo pipefail
          IMAGE='${{ matrix.image }}'
          DOCKERHUB_IMAGE="robothead/${IMAGE}"
          GHCR_IMAGE="ghcr.io/robot-head/${IMAGE}"

          TAGS=(
            "${DOCKERHUB_IMAGE}:${VERSION}"
            "${GHCR_IMAGE}:${VERSION}"
          )
          # Also tag as latest on proper release tags (not edge builds).
          if [[ "${VERSION}" != "edge" ]]; then
            TAGS+=(
              "${DOCKERHUB_IMAGE}:latest"
              "${GHCR_IMAGE}:latest"
            )
          fi

          mkdir -p sbom
          # apko prints the published image reference (with @sha256: digest) to
          # stdout; build logs go to stderr. The arch set comes from each apko
          # config; both per-arch keyrings are trusted so every APKINDEX
          # verifies. The digest is content-addressed and identical across every
          # tag/registry it was pushed to.
          REF="$(apko publish "packaging/apko/${IMAGE}.yaml" \
            "${TAGS[@]}" \
            --sbom-path sbom \
            --repository-append "${PWD}/packages" \
            --keyring-append "${PWD}/dist/x86_64/melange-x86_64.rsa.pub" \
            --keyring-append "${PWD}/dist/aarch64/melange-aarch64.rsa.pub")"
          echo "apko published: ${REF}"

          DIGEST="$(printf '%s\n' "${REF}" | grep -oE 'sha256:[0-9a-f]{64}' | head -n1)"
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::could not parse image digest from apko output" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          # Prefer the SBOM describing the published index (covers all arches).
          SBOM="$(ls sbom/*index*.spdx.json 2>/dev/null | head -n1 || true)"
          [[ -z "${SBOM}" ]] && SBOM="$(ls sbom/*.spdx.json 2>/dev/null | head -n1 || true)"
          if [[ -z "${SBOM}" ]]; then
            echo "::error::no SBOM produced by apko in ./sbom" >&2
            exit 1
          fi
          echo "sbom=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/robot-head/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/robot-head/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ steps.publish.outputs.sbom }}
          push-to-registry: true
