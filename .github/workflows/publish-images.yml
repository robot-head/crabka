name: publish-images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: git tag or 'edge')"
        required: false
        type: string

permissions:
  contents: read
  packages: write  # for GHCR

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [crabka-broker, crabka-operator, crabka-schema-registry]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install melange + apko
        run: |
          go install chainguard.dev/melange@latest
          go install chainguard.dev/apko@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Determine image tags
        id: tags
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="edge"
          fi
          DOCKERHUB_IMAGE="robothead/${{ matrix.image }}"
          GHCR_IMAGE="ghcr.io/robot-head/${{ matrix.image }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APK packages
        run: |
          mkdir -p packages
          melange keygen
          melange build "packaging/melange/${{ matrix.image }}.yaml" \
            --source-dir . \
            --signing-key melange.rsa \
            --arch x86_64 \
            --runner docker \
            --out-dir packages/

      - name: Publish image
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          DOCKERHUB_IMAGE: ${{ steps.tags.outputs.dockerhub_image }}
          GHCR_IMAGE: ${{ steps.tags.outputs.ghcr_image }}
        run: |
          TAGS=(
            "${DOCKERHUB_IMAGE}:${VERSION}"
            "${GHCR_IMAGE}:${VERSION}"
          )
          # Also tag as latest on proper release tags (not edge builds)
          if [[ "${VERSION}" != "edge" ]]; then
            TAGS+=(
              "${DOCKERHUB_IMAGE}:latest"
              "${GHCR_IMAGE}:latest"
            )
          fi
          apko publish "packaging/apko/${{ matrix.image }}.yaml" \
            "${TAGS[@]}" \
            --arch x86_64 \
            --repository-append "$PWD/packages" \
            --keyring-append "$PWD/melange.rsa.pub"
