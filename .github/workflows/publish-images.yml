name: publish-images

on:
  push:
    tags:
      - "crabka-broker-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: git tag or 'edge')"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Determine image tag
        id: tags
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            version="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_NAME}" == crabka-broker-v* ]]; then
            version="${GITHUB_REF_NAME#crabka-broker-v}"
          else
            version=edge
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: crabka-broker
            target: broker_image
          - image: crabka-operator
            target: operator_image
          - image: crabka-schema-registry
            target: schema_registry_image
          - image: crabka-gres
            target: gres_image
          - image: crabka-gres-activator
            target: gres_activator_image
          - image: bench-driver
            target: bench_driver_image
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Bazel OCI index
        run: |
          tags=(--tag "${VERSION}")
          if [[ "${VERSION}" != edge ]]; then
            tags+=(--tag latest)
          fi
          aspect run "//packaging:${{ matrix.target }}_push" --bazel-flag=--config=ci -- \
            --repository "ghcr.io/robot-head/${{ matrix.image }}" "${tags[@]}"
          aspect run "//packaging:${{ matrix.target }}_push" --bazel-flag=--config=ci -- \
            --repository "index.docker.io/robothead/${{ matrix.image }}" "${tags[@]}"

      - name: Capture published digest
        id: publish
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/robot-head/${{ matrix.image }}:${VERSION}" \
            --format '{{.Manifest.Digest}}')"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/robot-head/${{ matrix.image }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/robot-head/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/robot-head/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
