name: sdk-rust

on:
  push:
    paths:
      - "crates/app-sdk/**"
      - "crates/sdk-conformance/**"
      - "crates/grpc-gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-plz.toml"
      - "tools/check-publish-allowlist.sh"
      - ".github/workflows/sdk-rust.yml"
  pull_request:
    paths:
      - "crates/app-sdk/**"
      - "crates/sdk-conformance/**"
      - "crates/grpc-gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "release-plz.toml"
      - "tools/check-publish-allowlist.sh"
      - ".github/workflows/sdk-rust.yml"

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.ref }}
  cancel-in-progress: true

# Fetch git dependencies with the system `git` client, not the libgit2 client
# cargo links in. See the long note on this setting in `ci.yml`: libgit2 failed
# twice in 24 days inside the `datafusion` git pin's test-data submodules, with
# "the SSL certificate is invalid; class=Ssl (16)", and cargo's own diagnostic
# recommends this switch. The cargo jobs below all resolve the workspace, so
# any of them can hit that clone.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  app-sdk-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          # Pinned, not `@latest`: see the note in `ci.yml`. A moving test
          # runner is a silent change to how the suite is selected and retried.
          tool: cargo-nextest@0.9.143
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Verify Rust SDK crates
        run: |
          cargo +nightly fmt --all -- --check
          cargo clippy -p crabka-sdk-conformance -p crabka-app-sdk --all-targets --features crabka-app-sdk/conformance-adapter -- -D warnings
          cargo nextest run -p crabka-sdk-conformance -p crabka-app-sdk --features crabka-app-sdk/conformance-adapter
          ./tools/check-publish-allowlist.sh
      - name: Build Rust conformance adapter
        run: cargo build -p crabka-app-sdk --bin conformance_adapter --features conformance-adapter
      - name: Run Rust SDK conformance
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter target/debug/conformance_adapter --vectors crates/sdk-conformance/vectors/v1
      - name: Run live-compatible Rust SDK conformance
        run: cargo run -p crabka-sdk-conformance --bin conformance -- --adapter target/debug/conformance_adapter --vectors crates/sdk-conformance/vectors/v1 --live-substrate --live-compatible-only
