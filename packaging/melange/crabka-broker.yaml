package:
  name: crabka-broker
  version: 0.1.1
  epoch: 0
  description: Single-node Apache Kafka-compatible broker (MVP) plus the crabka operator CLI
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - ca-certificates-bundle
      - build-base
      - busybox
      - git
      - rustup

pipeline:
  - name: Install pinned Rust toolchain
    runs: |
      rustup-init -y --default-toolchain none --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"
      rustup toolchain install 1.95.0 --component cargo --profile minimal
      rustup default 1.95.0
  - name: Build crabka-broker
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --release --bin crabka-broker -p crabka-broker
      install -D -m 0755 target/release/crabka-broker "${{targets.contextdir}}/usr/bin/crabka-broker"
  - name: Build crabka CLI
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --release --bin crabka -p crabka-cli
      install -D -m 0755 target/release/crabka "${{targets.contextdir}}/usr/bin/crabka"
