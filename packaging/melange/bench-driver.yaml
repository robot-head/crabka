package:
  name: crabka-bench-driver
  version: 0.1.1
  epoch: 0
  description: Load driver + report aggregator for the Crabka vs Strimzi benchmark harness
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - ca-certificates-bundle
      - build-base
      - busybox
      - git
      - rustup

pipeline:
  - name: Install pinned Rust toolchain
    runs: |
      rustup-init -y --default-toolchain none --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"
      rustup toolchain install 1.95.0 --component cargo --profile minimal
      rustup default 1.95.0
  - name: Build crabka-bench-driver
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --release --bin crabka-bench-driver -p crabka-bench-driver
      install -D -m 0755 target/release/crabka-bench-driver "${{targets.contextdir}}/usr/bin/crabka-bench-driver"
  - name: Build crabka-bench-report
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --release --bin crabka-bench-report -p crabka-bench-driver
      install -D -m 0755 target/release/crabka-bench-report "${{targets.contextdir}}/usr/bin/crabka-bench-report"
  - name: Bundle scenario YAMLs into the image
    runs: |
      mkdir -p "${{targets.contextdir}}/etc/crabka-bench/scenarios"
      cp -r bench/scenarios/. "${{targets.contextdir}}/etc/crabka-bench/scenarios/"
