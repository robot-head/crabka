package:
  name: crabka
  version: 0.1.1
  epoch: 0
  description: Crabka server binaries (broker, CLI, operator, schema-registry, bench driver)
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - ca-certificates-bundle
      - build-base
      - busybox
      - git
      - rustup

# A single cargo build compiles the shared dependency graph (protocol, log,
# compression, security, metadata, raft, ...) exactly once and emits every
# server binary. Each image's contents are carved out into a subpackage below,
# so `melange build` produces the same set of APKs that the four old per-binary
# recipes did — without recompiling the workspace once per image.
pipeline:
  - name: Install pinned Rust toolchain
    runs: |
      rustup-init -y --default-toolchain none --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"
      rustup toolchain install 1.97.0 --component cargo --profile minimal
      rustup default 1.97.0
  - name: Build all crabka binaries
    runs: |
      export PATH="$HOME/.cargo/bin:$PATH"
      # When `melange build --cache-dir` is supplied, the host cache directory
      # is mounted read-write at /var/cache/melange. Point CARGO_HOME and the
      # target dir there so the crate registry and compiled artifacts survive
      # across CI runs. When no cache dir is mounted (e.g. a plain local
      # `melange build`), fall back to the in-tree target dir — the build still
      # works, it just isn't cached. Either way the binaries are staged into
      # ./dist so the subpackage pipelines below have a stable path to install
      # from (subpackage `runs` blocks don't inherit this step's env).
      cache=/var/cache/melange
      if mkdir -p "$cache/cargo" 2>/dev/null && [ -w "$cache" ]; then
        export CARGO_HOME="$cache/cargo"
        export CARGO_TARGET_DIR="$cache/target"
        target="$cache/target"
      else
        target="target"
      fi
      cargo build --release \
        -p crabka-broker -p crabka-cli -p crabka-operator \
        -p crabka-schema-registry -p crabka-bench-driver \
        -p crabka-gres -p crabka-gres-activator \
        --bin crabka-broker --bin crabka --bin crabka-operator \
        --bin crabka-schema-registry --bin crabka-bench-driver --bin crabka-bench-report \
        --bin crabka-gres --bin crabka-gres-activator
      mkdir -p dist
      for bin in crabka-broker crabka crabka-operator crabka-schema-registry \
                 crabka-bench-driver crabka-bench-report crabka-gres crabka-gres-activator; do
        install -m 0755 "$target/release/$bin" "dist/$bin"
      done

subpackages:
  - name: crabka-broker
    description: Single-node Apache Kafka-compatible broker (MVP) plus the crabka operator CLI
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-broker "${{targets.subpkgdir}}/usr/bin/crabka-broker"
          install -D -m 0755 dist/crabka "${{targets.subpkgdir}}/usr/bin/crabka"

  - name: crabka-operator
    description: Kubernetes operator for Crabka clusters
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-operator "${{targets.subpkgdir}}/usr/bin/crabka-operator"

  - name: crabka-schema-registry
    description: Confluent Schema Registry-compatible service for Crabka
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-schema-registry "${{targets.subpkgdir}}/usr/bin/crabka-schema-registry"

  - name: crabka-gres
    description: Gres PostgreSQL-compatible tenant compute
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-gres "${{targets.subpkgdir}}/usr/bin/crabka-gres"

  - name: crabka-gres-activator
    description: Gres scale-to-zero connection activator
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-gres-activator "${{targets.subpkgdir}}/usr/bin/crabka-gres-activator"

  - name: crabka-bench-driver
    description: Load driver + report aggregator for the Crabka vs Strimzi benchmark harness
    pipeline:
      - runs: |
          install -D -m 0755 dist/crabka-bench-driver "${{targets.subpkgdir}}/usr/bin/crabka-bench-driver"
          install -D -m 0755 dist/crabka-bench-report "${{targets.subpkgdir}}/usr/bin/crabka-bench-report"
          mkdir -p "${{targets.subpkgdir}}/etc/crabka-bench/scenarios"
          cp -r bench/scenarios/. "${{targets.subpkgdir}}/etc/crabka-bench/scenarios/"
