# Scale a KIP-932 share-group worker deployment from Crabka's fleet-complete
# backlog gauge. Point serverAddress at the Prometheus instance scraping every
# broker; sum() is required because the active group-coordinator broker can move.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-worker
spec:
  scaleTargetRef:
    name: order-worker
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 50
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: crabka_share_group_backlog
        # Keep the query defined while the coordinator is moving or before the
        # first labeled series exists. Crabka removes stale per-broker series.
        query: sum(crabka_broker_share_group_backlog{group_id="order-workers"}) or on() vector(0)
        threshold: "100"
        # KEDA activates when the value is greater than this threshold, so 0
        # wakes the deployment as soon as one committed record is available.
        activationThreshold: "0"

# Crabka computes backlog from each partition's committed high watermark, emits
# an explicit zero after every initialized partition is drained, and never
# exposes an uninitialized start offset as -1. Conventional consumer groups can
# use KEDA's stock kafka scaler instead; this metric is specifically for KIP-932
# share groups. Older KEDA releases may require metricName to be unique per
# ScaledObject.
