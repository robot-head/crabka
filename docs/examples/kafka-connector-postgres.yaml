apiVersion: v1
kind: Secret
metadata:
  name: orders-postgres
  namespace: streaming
type: Opaque
stringData:
  # Replace this example value; do not commit production credentials.
  url: postgresql://crabka_connect:change-me@postgres.streaming.svc:5432/orders
---
apiVersion: crabka.io/v1alpha1
kind: KafkaConnector
metadata:
  name: orders-cdc
  namespace: streaming
  labels:
    crabka.io/cluster: production
spec:
  type: postgresSource
  paused: false
  databaseUrl:
    name: orders-postgres
    key: url
  slot: orders_crabka
  publication: crabka_connect
  schema: public
  tables:
    - orders
    - customers
  topicPrefix: db
  runtime:
    maxBatch: 500
    commitIntervalMs: 5000
    pollBackoffMs: 100
