# cargo-mutants configuration — https://mutants.rs
#
# Checked in so `cargo mutants` runs out of the box (locally and in CI) with the
# same runner and exclusions the project uses everywhere else.

# Crabka tests run under nextest in every other job (CI, .config/nextest.toml),
# so point cargo-mutants at the same runner. nextest fails fast by default,
# which is exactly what we want when killing mutants. NEXTEST_PROFILE=ci (set in
# the CI workflow) then picks up the test-group serialization in
# .config/nextest.toml so the fixed-port broker/schema-registry binaries don't
# race for ports inside a single mutant's test run.
test_tool = "nextest"
profile = "mutants"

# A surviving mutant deep in the broker / log / raft paths is often only caught
# by the (slower) in-process integration suites under each crate's tests/ dir.
# Give every mutant run a generous timeout relative to the unmutated baseline so
# a legitimately-slower-but-correct run isn't misreported as a "timeout"
# survivor, with a high floor for those heavier suites.
timeout_multiplier = 5.0
minimum_test_timeout = 120

# Don't generate mutants in files that carry no unit-testable signal. The first
# four mirror the codecov `ignore` list in codecov.yml: machine-emitted protocol
# codecs (encode/decode/populate per record type) and pure entrypoint/serve-loop
# glue. The last three keep mutation focused on the system under test rather than
# the test/bench harnesses themselves — `bench-driver` is the GKE load/measurement
# harness whose `run`/`run_consumer` loops drive real brokers, producers, and
# Prometheus end-to-end (not unit-testable), so it is a bench harness in the same
# sense as `benches/**` even though it lives in its own crate.
exclude_globs = [
    "crates/protocol/generated/**",
    "crates/grpc-gateway/src/bin/**",
    "crates/schema-registry/src/bin/**",
    # `crabka-broker`'s `main` is pure entrypoint glue: parse CLI args, derive the
    # controller listener + self single-voter set, build `BrokerConfig`, hand it to
    # `Broker::start`, then wait for a termination signal and controlled-shutdown.
    # No unit-testable signal (no test constructs the live broker from CLI args);
    # it is exercised end-to-end by `tests/cli_smoke.rs` (boots the real binary)
    # and every in-process broker/integration test. Same rationale as the
    # grpc-gateway / schema-registry `src/bin/**` globs above. NB: a file glob is
    # used rather than an `exclude_re` on the mutant name because name-regex
    # exclusions do not reliably match struct-field-deletion mutants here.
    "crates/broker/src/bin/**",
    # crabka-audit's `verify` CLI: clap arg-parse + VerifyReport→ExitCode glue.
    # The verification logic lives in verify.rs and IS mutation-tested. Same
    # rationale as the grpc-gateway / schema-registry / broker `src/bin/**` globs.
    "crates/audit/src/bin/**",
    "crates/operator/src/run.rs",
    # `TokioPgCatalog` is the live-PostgreSQL adapter behind connect-postgres'
    # `PgCatalog` seam: every method runs one query and extracts opaque
    # `tokio_postgres::Row` fields (a `Row` cannot be constructed in a test),
    # delegating every decision back to the unit-tested pure helpers in
    # source.rs. No offline signal — same rationale as the serve-loop entrypoints
    # above; the logic it feeds is mutation-tested via `source::catalog_tests`.
    "crates/connect-postgres/src/catalog.rs",
    # KIP-939 idle-transaction reaper background task: a `tokio::interval` run
    # loop + `current_image`/leader-refresh orchestration. Pure serve-loop glue
    # (same rationale as `operator/src/run.rs`); its decision core lives in
    # `txn/two_pc.rs` and is mutation-tested + model-checked there.
    "crates/broker/src/txn/expiration.rs",
    # The observability demo app is a runnable producer/consumer demo — order
    # generation, produce/consume serve loops, and self-telemetry (traces +
    # metrics) emission — exercised by running the `demo/observability` stack,
    # not the unit suite. Same "demonstration/bench harness, no unit-testable
    # production signal" rationale as `bench-driver` below; mirrors its
    # codecov.yml `ignore` entry.
    "crates/observability-demo-app/**",
    # The observability-service binaries (traces / metrics / profiles / logs) are
    # `main` + `run` / `run_block_builder` entrypoint + serve-loop glue: parse
    # args, build config, run the ingest/compact loop until shutdown. No
    # unit-testable signal — each service's decision core lives in its lib and is
    # mutation-tested there. Same rationale as the grpc-gateway / schema-registry
    # / broker / audit `src/bin/**` globs above.
    "crates/traces/src/bin/**",
    "crates/metrics/src/bin/**",
    "crates/profiles/src/bin/**",
    "crates/observability/src/bin/**",
    "crates/*/tests/**",
    # In-source unit-test modules and test-only helpers are part of the test
    # harness, not the production system under test. Large refactors that split
    # `src/foo.rs` into `src/foo/tests.rs` otherwise make cargo-mutants spend CI
    # time mutating assertions/fixtures and report survivors that do not reflect
    # production-code coverage.
    "crates/*/src/**/tests.rs",
    "crates/*/src/**/test_*.rs",
    "crates/*/benches/**",
    "crates/bench-driver/**",
    # The gres load/chaos harness drives real broker + crabka-gres child
    # processes behind chaos proxies end-to-end — same "test/bench harness, not
    # the system under test" rationale as `bench-driver` above. Most of its
    # surface (cluster orchestration, fault execution, process sampling) is only
    # reachable with built binaries via its `#[ignore]`d live test, which
    # mutant runs cannot execute.
    "crates/gres-loadtest/**",
    # Chapter Gres vendored crates (crabgresql@93f3d17): imported wholesale in
    # the G-1 vendoring PR; mutating ~68k imported lines under --in-diff would
    # swamp the shard budget. Re-evaluate per-crate once gres development is
    # incremental.
    "crates/pgtypes/**",
    "crates/pgparser/**",
    "crates/pgwire/**",
    "crates/pgkv/**",
    "crates/pgmvcc/**",
    "crates/pgcatalog/**",
    "crates/pgexec/**",
    "crates/gres/**",
    "crates/gres-fdw/**",
    "crates/gres-conformance/**",
]

# Skip mutants whose display name matches these regexes. Used for spurious
# mutants in code that the default feature set compiles out: cargo-mutants
# mutates from the source AST without evaluating `#[cfg(...)]`, so a function
# under `#[cfg(not(feature = ...))]` gets mutated even though the active build
# never compiles it — the mutation is a no-op that always "survives".
exclude_re = [
    # Equivalent mutant: `if bytes > 0 { counter.inc_by(bytes) }` vs `>= 0`. The
    # two differ only at the value 0, where the mutant runs `inc_by(0)` — a no-op
    # on a prometheus counter — so the observable metric state is identical and no
    # test can distinguish them. (`> with <` / `> with ==` ARE caught.)
    "profiles/src/metrics\\.rs.*replace > with >= in ServiceMetrics::record_ingest",
    # `BatchedTsoClient` flusher-liveness mutants: never spawning a flusher
    # (`delete !` flips the single-flusher test-and-set) or spawning a no-op one
    # makes every timestamp grant await a reply that can never arrive. The
    # dedicated unit tests bound their grants and fail within seconds — the
    # mutants ARE detected — but the tenant-level integration suites in the same
    # package (jepsen, cross-range 2PC) issue grants through unbounded SQL
    # paths and hang the remainder of the run past any mutant budget, so the
    # outcome is always recorded as a timeout rather than a kill. Excluded as
    # detected-but-unreportable; the flusher's drain loop, clean-exit flag
    # handshake, reset guard, and error fan-out all remain mutation-tested.
    "gres-ranges/src/tso/client\\.rs.*delete ! in BatchedTsoClient<R>::grant",
    "gres-ranges/src/tso/client\\.rs.*replace BatchedTsoClient<R>::spawn_flush with \\(\\)",
    # ListPartitionReassignments `removing_replicas` echo: only populated for a
    # partition with an *in-flight* removal, which the controller cannot hold from a
    # directly-seeded `PartitionRecord` — apply auto-completes the removal (verified:
    # seeding replicas=[1,2,3] + removing=[3] applies as replicas=[1,2] + removing=[]).
    # A genuine pending removal exists only mid-flight in the live
    # AlterPartitionReassignments state machine (integration suite). The sibling
    # `adding_replicas` field is pinned by `filtered_success_response_...`.
    "(crates/)?broker/src/handlers/list_partition_reassignments\\.rs.*delete field removing_replicas from struct OngoingPartitionReassignment",
    # crabka-compression's feature-disabled codec stubs (`#[cfg(not(feature =
    # "gzip"))] fn gzip_compress -> Err(FeatureDisabled(..))`, etc.). They are
    # only reachable — and only killable — with the codec feature turned off.
    # The public `compress`/`decompress` dispatchers have no codec prefix, so
    # they are not matched and stay under test.
    "compression/src/lib\\.rs.* replace (gzip|snappy|lz4|zstd)_(compress|decompress) ->",
    # crabka-kraft-core's `sim` module is `#[cfg(feature = "sim")]` and that
    # feature is OFF in the crate's default build. cargo-mutants tests a mutant
    # in crabka-kraft-core against the crate's own default features, so the whole
    # module is compiled out and every mutation in it is a no-op that always
    # "survives" — the same default-feature-compiles-it-out case as the
    # compression stubs above. The simulator's logic IS exercised: its unit tests
    # run in the feature-enabled workspace test job (codecov covers the lines),
    # the curated scenarios are driven by crabka-docgen, and the equivalent
    # `crabka_playground::Playground::*` wrappers are mutation-tested (and caught)
    # because that crate always enables `sim`.
    "kraft-core/src/sim\\.rs",
    # crabka-security's SSPI provider is behind the optional `sspi-keytab`
    # feature and is compiled out in the crate's default package run, so default
    # cargo-mutants sees no behavioural difference. The provider's real contract
    # test requires a live MIT KDC fixture and is intentionally ignored unless
    # that fixture is running.
    "security/src/gssapi/provider\\.rs",
    # Equivalent mutant: Reader::at_end returning false at exact EOF still falls
    # into the next size-read's Truncated => break EOF path. (Jwks::empty ==
    # Default::default() is now skipped in-source via `#[mutants::skip]`.)
    "security/src/gssapi/keytab\\.rs.*replace Reader<'a>::at_end -> bool with false",
    # Mutating keytab entry-size reads to zero makes the parser loop on an
    # endless stream of zero-length records, so cargo-mutants can only classify
    # it as a timeout rather than a useful assertion gap.
    "security/src/gssapi/keytab\\.rs.*replace Reader<'a>::i32 -> Result<i32, KeytabError> with Ok\\(0\\)",
    # client-producer builder: `init_producer_id` is the live Client RPC retry
    # loop; its request shape, retry classifier, deadline, and backoff boundaries
    # are tested in pure helpers, while observing the match guard requires a
    # broker/client. (`build_init_producer_id_request` — the protocol-default
    # InitProducerId shape for idempotent-only producers, so `-> Default` is
    # equivalent — is now skipped in-source via `#[cfg_attr(test, mutants::skip)]`.)
    "(crates/)?client-producer/src/builder\\.rs.*replace match guard !is_retriable_coordinator_code\\(resp.error_code\\) with (true|false) in init_producer_id",
    "(crates/)?client-producer/src/builder\\.rs.*delete ! in init_producer_id",
    # crabka-metadata feature-registry equivalent mutants: today, the default
    # min floor for non-metadata.version features is genuinely 0, plain features
    # declare no dependencies, and share/streams default to 0 and support (0, 1).
    # (`validate_feature_dependencies` — a no-op for the real dependency-free
    # registry — is now skipped in-source via `#[mutants::skip]`; synthetic
    # dependency behavior is unit-tested via check_deps.)
    "metadata/src/feature\\.rs.*replace Feature::min_required_floor -> i16 with 0",
    "metadata/src/feature\\.rs.*replace Feature::dependencies -> &'static\\[\\(&'static str, i16\\)\\] with Vec::leak\\(Vec::new\\(\\)\\)",
    "metadata/src/feature\\.rs.*replace <impl Feature for (GroupVersionFeature|ShareVersionFeature|StreamsVersionFeature)>::supported_range -> \\(i16, i16\\) with \\(0, 1\\)",
    "metadata/src/feature\\.rs.*replace <impl Feature for (ShareVersionFeature|StreamsVersionFeature)>::default_level -> i16 with 0",
    # Metadata image dir-assignment: resizing an already-full directories vec to
    # the same length is a Vec no-op, so `<` -> `<=` is equivalent.
    "(crates/)?metadata/src/image\\.rs.*replace < with <= in MetadataImage::apply",
    # KRaft translation default-field equivalents: ConfigRecord.value defaults
    # to None for tombstones; the synthetic broker endpoint's name defaults to
    # empty string and security_protocol defaults to PLAINTEXT.
    "crates/metadata/src/kraft_translate\\.rs:.*delete field value from struct ConfigRecord expression",
    "crates/metadata/src/kraft_translate\\.rs:.*delete field name from struct KBrokerEndpoint expression",
    "crates/metadata/src/kraft_translate\\.rs:.*delete field security_protocol from struct KBrokerEndpoint expression",
    # crabka-schema-serde's format modules are gated behind optional features
    # (`avro`, `json`, `protobuf`) and the crate's default feature set enables
    # none of them. cargo-mutants' default package run mutates these source
    # files even though they are compiled out, so those mutations are no-op
    # survivors under the default build. Feature-enabled test jobs exercise the
    # modules themselves.
    "schema-serde/src/format/(avro|json|protobuf)\\.rs",
    "schema-serde/src/format/mod\\.rs.*Binding::register",

    # crabka-admin-ui's broker-backed seam adapter performs live AdminClient RPC
    # translation. Unit tests exercise request validation and injected seams; the
    # concrete adapter is covered by broker/client integration tests and cannot be
    # mutation-killed without a live broker.
    "admin-ui/src/server_fns\\.rs.*(ensure_topic_config_resource|acl_filter_from_request|parse_resource_type|parse_acl_operation|parse_permission_type)",
    # Redaction-only Debug impls deliberately collapse to constant text; returning
    # Ok(()) leaves the same absence-of-secret observable to callers.
    "admin-ui/src/session\\.rs.*<impl fmt::Debug for (SessionId|SessionCredentials|SessionStore)>",
    # render_document currently escapes only RoutePage::title(), whose route titles are
    # static ASCII strings without HTML metacharacters; dynamic page body escaping is
    # asserted through Dioxus SSR view tests.
    "admin-ui/src/views/page\\.rs.*push_escaped",
    # Live broker/client SCRAM wire-shape fields are integration-level signal; the
    # branch's new admin UI unit tests cover the DTO/seam behaviour without a
    # running broker.
    "broker/src/handlers/(alter_user_scram_credentials|describe_user_scram_credentials)\\.rs.*delete field (throttle_time_ms|error_message|credential_infos)",
    "client-admin/src/users\\.rs.*(describe_user_scram_credentials|delete field (users|name))",
    # --- traces signal (crabka-traceql / crabka-blockstore) equivalent mutants ---
    # lexer `prev` is only ever read as `prev == Prev::Dot` (lexer.rs:127), so
    # mapping a `Token::Ident` to `Prev::Ident` rather than the `_ => Prev::Other`
    # fallthrough is indistinguishable downstream. Every other op-token arm IS
    # mutation-tested.
    "traceql/src/lexer\\.rs.*delete match arm Token::Ident\\(_\\) in lex",
    # `scan_number_or_duration` consumes a `.` only when the NEXT char is a digit
    # (`chars.nth(1).is_some_and(is_digit)`), and that digit is then consumed on
    # the following iteration, overwriting `end`. So `end = idx + 1` vs `idx * 1`
    # (= idx) at the dot is never observable — the trailing digit always resets
    # `end`. The `&&` guards on those same lines ARE mutation-tested.
    "traceql/src/lexer\\.rs.*replace \\+ with \\* in scan_number_or_duration",
    # `usize_from_integer_f64` rejects non-finite/negative/fractional inputs; the
    # `||` -> `&&` rewrites of that validation guard still yield `Err` for every
    # differing input (the subsequent `to_string().parse()` fails on it), so the
    # observable `Result` is unchanged. The `<` boundary checks ARE mutation-tested.
    "traceql/src/engine\\.rs.*replace \\|\\| with && in usize_from_integer_f64",
    # `metric_label_value`'s Utf8 type guard: a non-string dictionary that skips
    # the guard still `Err`s downstream (`string_array_value` recurses into the
    # dictionary's non-Utf8 values and returns None -> Err), identical to the
    # guarded path that falls straight through to `Err`.
    "traceql/src/engine\\.rs.*replace match guard .* in metric_label_value",
    # `assign_nested_set` self-parent guard (`parent_idx != i`): a self-parented
    # span pushed into its own children list is inert — it is marked visited
    # before its children are walked, and the unreached-node sweep re-seeds every
    # span regardless, so the nested-set output is identical with the guard true.
    "blockstore/src/nested_set\\.rs.*replace match guard parent_idx != i with true in assign_nested_set",
    # `new_str_list` / `new_str_list_list` only choose a builder *constructor*
    # (`new` vs `from`, default capacity); the produced column's schema and values
    # are identical regardless, so the difference is unobservable. The promoted
    # column CONTENTS are mutation-tested via the append/promote tests.
    "blockstore/src/span_block\\.rs.*replace new_str_list(_list)? ->",
    # NB: `crates/broker/src/bin/**` (the broker entrypoint, incl. its
    # `BrokerConfig` field wiring and `wait_for_termination_signal`) is excluded
    # via `exclude_globs` above — name-regex exclusions don't reliably match the
    # struct-field-deletion mutants the entrypoint generates.
    # The parsed LSN high half is shifted left by 32 bits and the low half is
    # bounded to 32 bits, so OR and XOR produce identical values here.
    "connect-postgres/src/offset\\.rs.*replace \\| with \\^ in <impl FromStr for PgLsn>::from_str",
    # In PostgresWalSource::poll this mutation requeues a non-transactional row
    # forever (`transaction.is_some() || row.commit_lsn.is_none()`), so
    # cargo-mutants reports a timeout instead of an assertion gap.
    "connect-postgres/src/source\\.rs.*replace && with \\|\\| in <impl Source<Bytes, Bytes> for PostgresWalSource>::poll",
    # (client-core's `FetchTransport`/pool/`Client`/`Connection` live-IO seams
    # are skipped in-source via `#[cfg_attr(test, mutants::skip)]`: the adapter
    # `<impl FetchTransport for Connection>::fetch`, the thin `fetch_partition`
    # wrappers, `BrokerPool::close_all` (equivalent: consume-self drop), and the
    # `Client`/`Connection` facade/wire helpers — all need a live broker socket
    # and are exercised by the `mock`-feature tests in `tests/unit.rs`. Their
    # socket-free cores (`fetch_partition_on`, pool eviction/bootstrap) stay
    # mutation-tested.)
    # MockBroker is itself the feature-gated test harness used by the client-core
    # unit target; mutating its stop/connection loop has no signal in the
    # default-feature package run, which does not build that test target.
    "(crates/)?client-core/src/mock\\.rs.*(MockBroker::stop|handle_connection)",
    # The GSSAPI outbound client is behind the optional `sspi-keytab` feature.
    # The default client-core package run compiles the feature-disabled stub, so
    # cargo-mutants cannot observe the feature-enabled Kerberos state machine.
    # The provider contract is covered by the feature/KDC fixture path.
    "(crates/)?client-core/src/sasl\\.rs.*run_gssapi_client",
    # `put_uvarint` mutants: changing the loop predicate's bit test can create
    # non-terminating encoders for multi-byte values, and OR vs XOR is
    # equivalent because `(v & 0x7F)` never overlaps the continuation bit 0x80.
    "(crates/)?client-core/src/transport\\.rs.*replace != with == in put_uvarint",
    "(crates/)?client-core/src/transport\\.rs.*replace & with (\\||\\^) in put_uvarint",
    "(crates/)?client-core/src/transport\\.rs.*replace \\| with \\^ in put_uvarint",
    # `read_all`'s consecutive-empty-poll drain bound (`consecutive_empty >=
    # MAX_EMPTY`): breaking after 1 vs N consecutive empty polls both fully drain
    # an already-populated topic (records arrive in non-empty batches first), so
    # the boundary has no deterministic unit signal — a behavioural test of "how
    # many empty polls before giving up" is inherently timing-flaky. The drain
    # *result* (every record returned, in order) is covered by
    # `ensure_produce_read_roundtrip` and every integration suite that reads a
    # topic back.
    "replicator/src/admin_util\\.rs.*replace >= with < in read_all",
    # (replicator's `FlowWorker::start` retry loop and the background-task
    # graceful-shutdown teardowns — FlowSupervisor/FlowWorker/HeartbeatTask/
    # CheckpointTask `shutdown` — are skipped in-source via `#[cfg_attr(test,
    # mutants::skip)]`: start needs a persistently-unreachable cluster and the
    # shutdowns differ only in task-await timing. The pure `next_backoff` helper
    # and each task's work stay mutation-tested.)
    # Two infinite-loop mutants that HANG rather than yield a wrong result, so
    # cargo-mutants reports a TIMEOUT, not an assertion gap (same category as the
    # connect-postgres `poll` requeue exclusion above):
    # - `Consumer::poll -> Ok(vec![])`: an always-empty poll makes every
    #   poll-until-data loop (the drain helpers, the connect runtime driver) spin
    #   forever — no assertion can observe a hang. The real poll's fetch/decode/
    #   seek/commit logic is unit- and integration-tested.
    "client-consumer/src/poll\\.rs.*replace Consumer::poll .* with Ok\\(vec!\\[\\]\\)",
    # poll.rs live async wrappers and malformed fetch/list-offset requests can
    # only be observed through broker-backed polling. Their request construction
    # and pure routing/offset math helpers are mutation-tested in poll.rs.
    "(crates/)?client-consumer/src/poll\\.rs.*replace Consumer::(resolve_latest_sentinels|apply_truncation|handle_truncation_in_poll) ->",
    "(crates/)?client-consumer/src/poll\\.rs.*replace == with != in Consumer::resolve_latest_sentinels",
    "(crates/)?client-consumer/src/poll\\.rs.*delete field (topic_id|partitions|topics) from struct (FetchTopic|FetchRequest) expression",
    "(crates/)?client-consumer/src/poll\\.rs.*replace < with (==|<=) in Consumer::poll",
    "(crates/)?client-consumer/src/poll\\.rs.*delete ! in Consumer::poll",
    "(crates/)?client-consumer/src/poll\\.rs.*replace >= with < in Consumer::poll",
    # (client-consumer `Consumer::commit_sync` / `commit_async` are live
    # coordinator RPC wrappers, skipped in-source via `#[cfg_attr(test,
    # mutants::skip)]`; their socket-free request/snapshot/error-mapping helpers
    # in commit.rs stay mutation-tested.)
    # client-consumer coordinator edge cases:
    # - `find_coordinator` is the live Client RPC/metadata-refresh wrapper; its
    #   request construction and response projection are mutation-tested in pure
    #   helpers, but canned return-value mutants need a broker coordinator to
    #   observe.
    # - forcing retry deadline/backoff helpers to "never elapsed" or zero
    #   backoff creates non-terminating retry loops, reported as TIMEOUT rather
    #   than a useful assertion gap; the helpers' boundaries are unit-tested.
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace find_coordinator -> Result<i32, ConsumerError> with Ok\\((-)?[0-9]+\\)",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace match guard !is_retriable_coordinator_code\\(code\\(&r\\)\\) with true in with_coordinator_refind",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace (rejoin|prime_offsets) -> Result<\\(\\), ConsumerError> with Ok\\(\\(\\)\\)",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace join_and_sync -> Result<\\(Vec<\\(String, i32\\)>, i32, String\\), ConsumerError> with Ok\\(",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace (==|!=) with (==|!=) in join_and_sync",
    "(crates/)?client-consumer/src/coordinator\\.rs.*delete ! in join_and_sync",
    "(crates/)?client-consumer/src/coordinator\\.rs.*delete ! in rejoin",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace retry_deadline_elapsed -> bool with false",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace next_backoff -> Duration with Default::default\\(\\)",
    "(crates/)?client-consumer/src/coordinator\\.rs.*replace \\* with / in next_backoff",
    # In `classify`, changing the safe-offset clamp from `< 0` to `<= 0` is
    # equivalent: for `leader_end_offset == 0`, both branches return `0`.
    "crates/client-consumer/src/position\\.rs:57:47: replace < with <= in classify",
    # (client-consumer `Consumer::refresh_leader_epochs` / `validate_positions`
    # — live metadata/leader-epoch RPC wrappers — and the share coordinator's
    # background heartbeat `run` serve-loop are skipped in-source via
    # `#[cfg_attr(test, mutants::skip)]`; their socket-free decision helpers in
    # validate.rs / share helpers stay mutation-tested.)
    # Share poll/ack live entrypoints send protocol requests over a Client. The
    # request builders, error predicates, topic-id resolution, range math, and
    # ack grouping are mutation-tested in socket-free helpers in share/poll.rs;
    # these wrappers need a broker-side share fetch/ack endpoint to observe.
    "(crates/)?client-consumer/src/share/poll\\.rs.*replace ShareConsumer::(poll|renew|commit|flush_pending_acks) -> Result<",
    "(crates/)?client-consumer/src/share/poll\\.rs.*replace ShareConsumer::acknowledge -> Result<\\(\\), ConsumerError> with Ok\\(\\(\\)\\)",
    # - `read_all`'s `consecutive_empty += 1` -> `*= 1` pins the empty-poll
    #   counter at 0 so the drain loop never terminates (companion to the `>=`
    #   drain-bound exclusion above).
    "replicator/src/admin_util\\.rs.*replace \\+= with \\*= in read_all",
    # Changing the COORDINATOR_LOAD_IN_PROGRESS retry guard from `==` to `!=`
    # makes a successful StreamsMembership join retry forever, so cargo-mutants
    # can only classify it as a timeout rather than an assertion gap.
    "(crates/)?client-streams/src/membership/client\\.rs.*replace == with != in StreamsMembership::start",
