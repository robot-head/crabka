    "(crates/)?verified/src/log_index\\.rs.*replace / with % in offset_index_lookup",
    "(crates/)?verified/src/log_index\\.rs.*replace \\+ with - in offset_index_lookup",
    # `run_produce_append_batch` dispatches the blocking group append by runtime
    # flavor: the `MultiThread` arm uses `block_in_place`, the `_` fallback uses
    # `spawn_blocking`. They differ only in scheduling — same append result, same
    # panic→storage-failure mapping — so deleting the `MultiThread` arm falls
    # through to a behaviourally equivalent path: a performance optimization
    # (covered by the produce benches) with no signal a correctness test can
    # assert. (The `run_produce_append` prefix also matches the `_batch` suffix.)
    "broker/src/partition_writer\\.rs.*delete match arm RuntimeFlavor::MultiThread in run_produce_append",
    # The group-commit batch-drain caps one append batch at MAX_PRODUCE_GROUP
    # jobs (`jobs.len() < MAX_PRODUCE_GROUP`). The cap is a memory/latency bound,
    # not a correctness boundary: `<` vs `<=` changes the max batch size by one
    # (1024 vs 1025) but both drain every queued job across loop iterations with
