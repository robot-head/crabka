    # test can assert — the same equivalent-mutant category as the metadata image
    # `< -> <=` exclusion above. The non-equivalent `< -> ==` / `< -> >`
    # mutations on the same line are still generated and caught.
    "broker/src/partition_writer\\.rs.*replace < with <= in run$",
