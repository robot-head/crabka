    # cargo-mutants can only classify them as TIMEOUT rather than a useful
    # assertion gap. Vote-count increments in candidate_has_majority stay
    # mutation-tested by the focused HWM behavior tests below.
    "(crates/)?verified/src/consensus\\.rs:238:.*replace \\+= with \\*= in candidate_has_majority",
    "(crates/)?verified/src/consensus\\.rs:296:.*replace \\+= with \\*= in recompute_high_watermark",
