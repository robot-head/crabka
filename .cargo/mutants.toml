    "audit/src/verify\\.rs.*replace \\+ with (-|\\*) in verify_partition_dir",
    # `scan_from_floor_windowed` computes `last_read` (the last offset in the
    # window just read) as `last.base_offset + last.last_offset_delta`, then sets
    # `cursor = last_read + 1` to advance. Mutating this `+` makes `last_read`
    # regress below `cursor`, so the cursor never advances and the windowed scan
    # loops forever — cargo-mutants reports a TIMEOUT rather than an assertion
    # gap. (Line-anchored so the sibling `+` on line 437 — the *returned* match
    # offset — stays mutation-tested; it is killed by
    # `scan_returns_absolute_offset_of_matching_record`.)
    "log/src/segment\\.rs:445:.*replace \\+ with (-|\\*) in Segment::scan_from_floor_windowed",
    # `Segment::read`'s `batch_last = base_offset + last_offset_delta` gates which
    # batches pass the `batch_last >= offset` include filter. The `+ with *`
    # mutation zeroes `batch_last` for single-record batches (`base * 0`), so the
    # batch covering `offset` is dropped and `read` returns empty; the windowed
    # scan caller then grows its window and retries the same cursor forever —
    # cargo-mutants reports a TIMEOUT, not an assertion gap. (`+ with -` on the
    # same line IS caught, so this excludes only the `*` variant.)
    "log/src/segment\\.rs.*replace \\+ with \\* in Segment::read$",
