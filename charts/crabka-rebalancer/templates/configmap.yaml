{{- if and .Values.brokerCapacities (not .Values.brokerCapacityFile) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rebalancer.fullname" . }}-capacity
  labels:
    {{- include "rebalancer.labels" . | nindent 4 }}
data:
  capacity.yaml: |
    version: 1
    brokers:
      {{- range $broker, $caps := .Values.brokerCapacities }}
      "{{ $broker }}":
        {{- toYaml $caps | nindent 8 }}
      {{- end }}
{{- end }}
