# Default values for crabka-rebalancer.

image:
  repository: ghcr.io/robot-head/crabka-rebalancer
  tag: ""  # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# REQUIRED: comma-separated host:port list of Crabka bootstrap brokers.
bootstrapServers: ""

listenAddr: "0.0.0.0:9300"
scrapeIntervalSecs: 10
imbalanceThresholdPct: 10
minTopicLeadersPerBroker: 0

# Per-broker capacity table for the five capacity goals (slice 43d).
# Empty map = no capacity limits → all five capacity goals are no-ops.
brokerCapacities: {}
#   Example:
#   brokerCapacities:
#     1:
#       max_replicas: 4096
#       disk_bytes: 1099511627776
#       network_in_bytes_per_sec: 125000000
#       network_out_bytes_per_sec: 125000000
#       cpu_cores: 8.0

# Override path for the capacity file. When non-empty, takes
# precedence over `brokerCapacities` — the chart sets
# CRABKA_BROKER_CAPACITY_FILE to this path and does NOT render the
# ConfigMap (operator is responsible for providing the file).
brokerCapacityFile: ""

maxMovementsPerProposal: 256
proposalRingBufferSize: 20

throttle:
  defaultBytesPerSec: 50000000

executeDeadlineSecs: 1800
reassignmentPollIntervalSecs: 5
reassignmentBatchSize: 200

persistence:
  size: 1Gi
  storageClass: ""  # uses default storage class when empty

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 9300
