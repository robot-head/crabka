apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crabka-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "crabka-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "crabka-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "crabka-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "crabka-operator.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --default-broker-image={{ .Values.brokerImage.repository }}:{{ .Values.brokerImage.tag | default .Chart.AppVersion }}
            - --default-gateway-image={{ .Values.gatewayImage.repository }}:{{ .Values.gatewayImage.tag | default .Chart.AppVersion }}
            - --default-gres-image={{ .Values.gresImage.repository }}:{{ .Values.gresImage.tag | default .Chart.AppVersion }}
            - --default-gres-activator-image={{ .Values.gresActivatorImage.repository }}:{{ .Values.gresActivatorImage.tag | default .Chart.AppVersion }}
            - --default-pgdog-image={{ .Values.pgdogImage.repository }}:{{ .Values.pgdogImage.tag }}
            {{- if .Values.gresCheckpoint.store }}
            - --gres-checkpoint-store={{ .Values.gresCheckpoint.store }}
            - --gres-checkpoint-bucket={{ .Values.gresCheckpoint.bucket }}
            {{- if .Values.gresCheckpoint.region }}
            - --gres-checkpoint-region={{ .Values.gresCheckpoint.region }}
            {{- end }}
            {{- if .Values.gresCheckpoint.endpoint }}
            - --gres-checkpoint-endpoint={{ .Values.gresCheckpoint.endpoint }}
            {{- end }}
            {{- if .Values.gresCheckpoint.allowHttp }}
            - --gres-checkpoint-allow-http
            {{- end }}
            {{- if .Values.gresCheckpoint.accessKeyId }}
            - --gres-checkpoint-access-key-id={{ .Values.gresCheckpoint.accessKeyId }}
            - --gres-checkpoint-secret-access-key={{ .Values.gresCheckpoint.secretAccessKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.watchNamespaces }}
            - --watch-namespaces={{ join "," .Values.watchNamespaces }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.logFilter | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
