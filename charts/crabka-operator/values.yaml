image:
  repository: ghcr.io/robot-head/crabka-operator
  tag: ""  # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# Default broker image used when a Kafka CR doesn't override it.
brokerImage:
  repository: ghcr.io/robot-head/crabka-broker
  tag: ""  # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# Default gateway image used when a KafkaGrpcGateway CR doesn't override it.
gatewayImage:
  repository: ghcr.io/robot-head/crabka-grpc-gateway
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

watchNamespaces: []  # empty = cluster-scoped

# Resources for the operator pod (not the brokers it manages).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""  # default: chart fullname

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

logFilter: "info,kube=warn"

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

caRenewal:
  enabled: true
  schedule: "0 2 * * *"
  startingDeadlineSeconds: 600
  logFilter: "info,kube_client::client::builder=warn"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
