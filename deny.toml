[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RSA "Marvin" timing side-channel. Pulled in transitively by `picky`
    # (a hard dependency of the vendored `sspi` Kerberos stack). Our GSSAPI
    # path is auth-only over AES keytab keys and performs no RSA private-key
    # operations (no PKINIT), so the network-observable timing leak does not
    # apply. The advisory has no fixed release available.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    # webpki-roots ships the Mozilla NSS CA bundle (data, not code) under
    # CDLA-Permissive-2.0. Pulled in transitively via reqwest + rustls.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # portpicker is public-domain-equivalent (The Unlicense, OSI-approved and
    # FSF Free/Libre). Pulled in transitively via the vendored `sspi` crate's
    # `network_client` feature, which we need for KDC communication.
    { allow = ["Unlicense"], crate = "portpicker" },
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Our sspi fork (SASL/GSSAPI Kerberos work) until it lands upstream;
# see Devolutions/sspi-rs#681 and `[patch.crates-io]` in Cargo.toml.
allow-git = ["https://github.com/robot-head/sspi-rs"]

[[licenses.clarify]]
name = "cfg_block"
version = "0.1.1"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0x0fb72a18 }
]
