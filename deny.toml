[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # quick-xml DoS advisories (quadratic duplicate-attribute check and
    # unbounded namespace-declaration allocation). Patched only in
    # quick-xml >= 0.41, which our dependents (polars-io and the S3 XML
    # paths) do not accept yet; Crabka never feeds attacker-controlled XML
    # into these parsers (S3/object-store responses are from configured
    # endpoints). Drop these once upstreams take quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RSA "Marvin" timing side-channel. Pulled in transitively by `picky`
    # (a hard dependency of the vendored `sspi` Kerberos stack). Our GSSAPI
    # path is auth-only over AES keytab keys and performs no RSA private-key
    # operations (no PKINIT), so the network-observable timing leak does not
    # apply. The advisory has no fixed release available.
    "RUSTSEC-2023-0071",
    # bincode is unmaintained (the team ceased development; v2.0.1 is considered
    # feature-complete and "no safe upgrade is available"). This is an
    # unmaintained notice, not a vulnerability. Pulled in transitively via
    # `polars-utils` (the `polars` columnar-streams feature).
    "RUSTSEC-2025-0141",
    # paste is unmaintained. Pulled in transitively by the pinned DataFusion
    # dependency used by the new internal profiles crates; no fixed release is
    # available through that DataFusion revision.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    # webpki-roots ships the Mozilla NSS CA bundle (data, not code) under
    # CDLA-Permissive-2.0. Pulled in transitively via reqwest + rustls.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # portpicker is public-domain-equivalent (The Unlicense, OSI-approved and
    # FSF Free/Libre). Pulled in transitively via the vendored `sspi` crate's
    # `network_client` feature, which we need for KDC communication.
    { allow = ["Unlicense"], crate = "portpicker" },
    # xxhash-rust is BSL-1.0 (Boost, OSI-approved and FSF Free/Libre — a
    # permissive, non-copyleft license). Pulled in transitively via polars
    # (the `polars` columnar-streams feature).
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    # varint-rs uses the OSI-approved zero-clause BSD license. It enters
    # transitively through fjall/lsm-tree, so keep the allowance crate-scoped.
    { allow = ["0BSD"], crate = "varint-rs" },
    # Creusot's specification attributes/proc macros are LGPL-2.1-or-later.
    # They enter the graph only through the newly added verified kernels
    # (`crabka-verified`) and throttle arithmetic contracts; ordinary cargo
    # builds use Creusot's dummy macro implementation, so keep this allowance
    # crate-scoped rather than allowing LGPL globally.
    { allow = ["LGPL-2.1-or-later"], crate = "creusot-std" },
    { allow = ["LGPL-2.1-or-later"], crate = "creusot-std-proc" },
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Temporary DataFusion pin for profile query support.
    "https://github.com/apache/datafusion",
    # Temporary compatibility pin until testcontainers-modules publishes a
    # release that depends on testcontainers 0.28.
    "https://github.com/testcontainers/testcontainers-rs-modules-community",
]

[[licenses.clarify]]
name = "cfg_block"
version = "0.1.1"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0x0fb72a18 }
]
