[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # backoff via kube-runtime (kube 0.97). Unmaintained upstream; upstream
    # recommends `backon` as the replacement. Re-evaluate when kube migrates.
    "RUSTSEC-2025-0012",
    # instant via kube-runtime → backoff (kube 0.97). Unmaintained upstream
    # with no safe upgrade path. Falls away when [RUSTSEC-2025-0012] is
    # resolved upstream (instant is backoff's only consumer here).
    "RUSTSEC-2024-0384",
    # rustls-pemfile via kube-client (kube 0.97). Crate is archived; the
    # functionality lives in rustls-pki-types which Crabka already uses
    # directly, but kube-client still pulls it transitively. Re-evaluate when
    # kube upgrades.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
]
exceptions = []
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
