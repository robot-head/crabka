[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
rust-version = "1.96.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
jsonpath-rust = "1.0"
proptest = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
arbitrary = { version = "1", features = ["derive"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
hex = "0.4"
toml = "1.1"
once_cell = "1"
# `object_store` 0.13 is the Apache-stewarded multi-backend object-store
# client used across the Rust data ecosystem (DataFusion, Polars, Delta-rs).
# Crabka's S3-compatible RemoteStorageManager (KIP-405) is built on it.
object_store = { version = "0.13", features = ["aws"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }
zstd = "0.13"
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
crc32fast = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tokio-metrics = { version = "0.5", default-features = false }
dashmap = "6"
tracing = "0.1"
# KIP-848: client-supplied `subscribed_topic_regex` matched against the
# metadata image. Uses RE2-compatible syntax (same regex engine family as
# the JVM's `java.util.regex` for the cases KIP-848 expects to portably
# support); diverges on lookahead/lookbehind which aren't in the KIP-848
# operator-readable subset.
regex = "1"
memmap2 = "0.9"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
async-stream = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Slice 42: OTLP distributed tracing. opentelemetry-otlp 0.32 lines up with
# the tonic 0.14 / prost 0.14 / reqwest 0.13 stack already in the dep graph.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
# Slice KIP-714: prost-generated OTLP MetricsData / ExportMetricsServiceRequest
# message types (aligned with the opentelemetry 0.32 stack). gen-tonic-messages
# pulls the prost structs without a tonic client; metrics gates the metrics module.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "metrics"] }
bon = "3"
# strum: derive enum<->&'static str (IntoStaticStr) and &str->enum (EnumString)
# to retire hand-written match-arm conversions. Its whole proc-macro tree
# (syn/quote/proc-macro2/heck/rustversion) is already compiled in the graph,
# so the marginal build cost is one small proc-macro crate.
strum = { version = "0.28", features = ["derive"] }
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Pinned to 0.4: serde-wincode 0.1.0 depends on wincode ^0.4, so a 0.5
# pin would silently duplicate wincode in the dep graph and fail trait
# resolution on `SerdeCompat`.
wincode = "=0.4"
serde-wincode = "0.1"
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.14", features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
x509-parser = "0.18"
rustls-webpki = "0.103"
arc-swap = "1"
pbkdf2 = { version = "=0.13.0-rc.10", default-features = false, features = ["kdf", "hmac"] }
hmac = "0.13"
sha2 = "0.11"
ring = "0.17"
subtle = "2"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
crabka-security = { path = "crates/security", version = "0.3.2" }
kube = { version = "3.1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.27", default-features = false, features = ["v1_31"] }
schemars = "1.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
connectrpc-axum = "0.1"
connectrpc-axum-build = "0.1"
prost = "0.14"
pbjson = "0.9"
prometheus-client = "0.24"
tower = "0.5"
futures = "0.3"
anyhow = "1"
parking_lot = "0.12"
# Slice 53: bounded decision cache for the OPA authorizer. `lru` provides
# an O(1) LRU with a non-zero capacity invariant; pair it with our own
# TTL field on the value (no built-in expiry).
lru = "0.18"
# Schema Registry (crabka-schema-registry) — schema parsing + canonical form.
apache-avro = "0.21"
prost-reflect = "0.16"
jsonschema = { version = "0.30", default-features = false }

# Fork of sspi 0.21.0 carrying our SASL/GSSAPI Kerberos work (keytab client
# credentials, integrity-only Wrap tokens, multi-SPN acceptor keys). Branched
# off the sspi-v0.21.0 tag; upstreaming tracked at
# https://github.com/Devolutions/sspi-rs/pull/681.
[patch.crates-io]
sspi = { git = "https://github.com/robot-head/sspi-rs.git", branch = "crabka/sasl-gssapi" }


