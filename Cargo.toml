[workspace]
resolver = "2"
members = ["crates/*"]
# Keep the Rust-skills documentation example harness independent so tooling can
# update its lockfile via its own manifest.
exclude = [".agents/skills/rust-skills/checks"]

[workspace.package]
version = "0.3.9"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
# Columnar / dataframe support for the streams client (opt-in via crate
# features). `polars` and `polars-arrow` MUST share the same version.
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "ipc", "dtype-full", "parquet", "strings", "json"] }
polars-arrow = { version = "=0.55.2", default-features = false }
arrow = { version = "59", default-features = false, features = ["ipc"] }
# Observability block store (crabka-blockstore): DataFusion query engine over
# Parquet blocks on object storage. Pinned to apache/datafusion `main` because
# that revision tracks arrow 59 / parquet 59 / object_store 0.13.2, matching the
# workspace pins. The latest released datafusion line is on an older arrow major.
datafusion = { git = "https://github.com/apache/datafusion", rev = "ad1a26002b8bac436a8f20761f42713e23dc70b2", version = "54" }
parquet = { version = "59", default-features = false, features = ["arrow", "async", "object_store"] }
url = "2"
# PromQL parser only; Crabka supplies the PromQL-to-DataFusion planner.
promql-parser = { version = "0.10", features = ["ser"] }
columnar = "0.13"
bytes = "1"
shlex = "1.3"
num-traits = "0.2.19"
uom = { version = "0.38", default-features = false, features = ["autoconvert", "f64", "si", "std", "use_serde"] }
thiserror = "2"
# Derive boilerplate for domain newtypes (Display/From/Into/Deref/AsRef/
# Constructor/FromStr and numeric ops) so wrappers over wire/domain primitives
# stay one-liners. See docs/style_guides/code_style_guide.md#newtypes-for-domain-values.
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
refined_type = "0.6"
jsonpath-rust = "1.0"
# XML tokenizer behind the `xml` type (crabka-pgtypes). Chosen because it is
# pure safe Rust (`#![forbid(unsafe_code)]`, so it can live under this
# workspace's `unsafe_code = "forbid"`) and because it performs no I/O and
# resolves no entities: a reference is surfaced as an event for the caller to
# resolve, so there is no code path from a SQL string to a file handle and XXE
# is structurally impossible rather than switched off. Pinned to >= 0.41, the
# first release carrying the fixes for RUSTSEC-2026-0194/0195 — unlike the
# transitive 0.39 copy under `object_store`, this one parses attacker-supplied
# documents straight off the wire.
quick-xml = { version = "0.41", default-features = false }
jfrs = "0.2.5"
proptest = "1"
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
# Thread-safe clock abstraction (rs-clock). Production code reads time through
# its `Clock`/`NanoClock`/`Sleeper` traits so tests can drive time deterministically
# with `MockClock`/`MockTime` instead of `thread::sleep`/`tokio::time::sleep`.
# Enable the `tokio` feature per-crate where async `AsyncSleeper` is needed.
# 0.9+ replaced this API with wall/monotonic clocks and timers; keep the
# compatible release line until consumers are migrated to that new API.
qubit-clock = "~0.8.1"
# Stable data-driven test harness. Use for file-backed corpora so nextest can
# schedule each fixture as its own test process.
datatest-stable = "0.3.3"
# Jepsen-style exhaustive concurrency-correctness model checking (KRaft
# consensus). Dev-dependency only — never linked into a shipped binary.
# Pinned: pre-1.0, minor bumps can be breaking.
stateright = "=0.31.0"
# mockall: generate test mocks for trait seams so engine-IO decision logic is
# unit-testable (and mutation-killable) without a live broker/quorum/database.
# Dev-dependency only — `#[cfg_attr(test, mockall::automock)]` keeps it out of
# shipped builds.
mockall = "0.15"
# mutants: `#[cfg_attr(test, mutants::skip)]` attribute for cargo-mutants. Used
# only where `exclude_re` cannot reliably suppress a mutant (struct-field-deletion
# mutants on a live-IO adapter). Dev-dependency only; expands to nothing.
mutants = "0.0.4"
arbitrary = { version = "1", features = ["derive"] }
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# WASM consensus playground bindings (crates/playground). The matching
# wasm-bindgen-cli version is derived from Cargo.lock at build time.
wasm-bindgen = "0.2"
tempfile = "3"
hex = "0.4"
toml = "1.1"
once_cell = "1"
# `object_store` is the Apache-stewarded multi-backend object-store client used
# across the Rust data ecosystem (DataFusion, Polars, Delta-rs). Crabka's
# S3-compatible and native-GCS RemoteStorageManagers (KIP-405) are built on it.
#
# Pinned to 0.13 in lock-step with the datafusion git rev and `parquet 59`: both
# depend on `object_store ^0.13` and pass its `ObjectStore`/`Path` types across
# the `ParquetObjectReader` / `register_object_store` boundary in crabka-blockstore.
# Bumping object_store alone to 0.14 splits the dependency graph (blockstore on
# 0.14, parquet/datafusion on 0.13) and fails to compile — exactly what the
# auto-merged renovate bump #644 did to main. Move it only together with the
# datafusion rev; the renovate rule below holds it to enforce that.
object_store = { version = "0.13", features = ["aws", "gcp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
pglz = "=0.1.1"
multer = "3"
snap = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["frame"] }
zstd = "0.13"
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
crc32fast = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tokio-metrics = { version = "0.5", default-features = false }
dashmap = "6"
tracing = "0.1"
# KIP-848: client-supplied `subscribed_topic_regex` matched against the
# metadata image. Uses RE2-compatible syntax (same regex engine family as
# the JVM's `java.util.regex` for the cases KIP-848 expects to portably
# support); diverges on lookahead/lookbehind which aren't in the KIP-848
# operator-readable subset.
regex = "1"
rust-stemmers = "1"
memmap2 = "0.9"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
async-stream = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Slice 42: OTLP distributed tracing. opentelemetry-otlp 0.32 lines up with
# the tonic 0.14 / prost 0.14 / reqwest 0.13 stack already in the dep graph.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
# Bridges `tracing` events → OTLP log records so services emit logs over OTLP
# (alloy:4317 → logs-distributor) rather than relying on container-stdout tailing
# (which doesn't stream on Docker Desktop). Version tracks the opentelemetry 0.32 stack.
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
# Slice KIP-714: prost-generated OTLP MetricsData / MetricsService types
# (opentelemetry 0.32 stack). `gen-tonic` exposes the OTLP gRPC service traits the
# metrics distributor implements; `gen-tonic-messages` + `trace` serve the traces
# signal; `tonic-prost` carries the prost codec for tonic 0.14.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "gen-tonic-messages", "metrics", "trace"] }
bon = "3"
# strum: derive enum<->&'static str (IntoStaticStr) and &str->enum (EnumString)
# to retire hand-written match-arm conversions. Its whole proc-macro tree
# (syn/quote/proc-macro2/heck/rustversion) is already compiled in the graph,
# so the marginal build cost is one small proc-macro crate.
strum = { version = "0.28", features = ["derive"] }
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Keep these paired so `SerdeCompat` implements this wincode's traits.
wincode = "=0.6"
serde-wincode = "=0.1.2"
async-trait = "0.1"
addr2line = "0.27"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.15", features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# Linux kTLS: offload TLS record encryption to the kernel so `sendfile(2)`
# works THROUGH TLS (zero-copy fetch over encrypted connections). v6 tracks
# rustls ^0.23.12 + tokio-rustls ^0.26.0 (the workspace pins above). Safe
# wrapper — no raw `setsockopt` FFI — so it satisfies `unsafe_code = "forbid"`.
# Consumed Linux-only; gated under `[target.'cfg(target_os="linux")']` in the
# broker so non-Linux builds never pull it.
ktls = "6"
x509-parser = "0.18"
rustls-webpki = "0.103"
arc-swap = "1"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["kdf", "hmac"] }
hmac = "0.13"
sha2 = "0.11"
# PostgreSQL's `md5()` SQL function. Kept in lock-step with `sha2` so both
# hashes come from the same RustCrypto `digest` generation.
md-5 = "0.11"
ring = "0.17"
subtle = "2"
base64 = "0.23"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
# SASL/GSSAPI (Kerberos). `network_client` lets the initiator reach the KDC;
# `ring` keeps crypto provider choice aligned with rustls/rcgen in this workspace.
sspi = { version = "=0.21.3", default-features = false, features = ["network_client", "ring"] }
crabka-audit = { path = "crates/audit", version = "0.3.8" }
crabka-security = { path = "crates/security", version = "0.3.9" }
crabka-units = { path = "crates/units", version = "0.3.9" }
kube = { version = "4.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
schemars = "1.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
connectrpc-axum = "0.2"
connectrpc-axum-build = "0.2"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
# Pure-Rust protobuf compiler — lets crates that drive `prost-build` directly
# generate code without a `protoc` binary. The Connect crates still need a
# binary (connectrpc-axum-build always shells out to protoc), so they use the
# vendored one below.
protox = "0.9"
protoc-bin-vendored = "3.2"
pbjson = "0.9"
prometheus-client = "0.25"
tower = "0.5"
tokio-tungstenite = "0.30"
futures = "0.3"
postgres-types = "0.2"
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5.3"
anyhow = "1"
parking_lot = "0.12"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
trybuild = "1"
# Slice 53: bounded decision cache for the OPA authorizer. `lru` provides
# an O(1) LRU with a non-zero capacity invariant; pair it with our own
# TTL field on the value (no built-in expiry).
lru = "0.18"
# Schema Registry (crabka-schema-registry) — schema parsing + canonical form.
apache-avro = "0.21"
prost-reflect = "0.16"
jsonschema = { version = "0.49", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Chapter Gres — vendored crabgresql engine (crabgresql@93f3d17).
bigdecimal = "0.4"
dashu-float = "0.5"
fjall = "3.1.8"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
num-bigint = "0.5"
# pg_query wraps libpg_query (C): dev/oracle-only, optional, never default —
# the shipped gres tree stays pure Rust.
pg_query = "6"
rand = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
# PostgreSQL's `normalize(text, form)` / `is_normalized(text, form)` need the
# Unicode NFC/NFD/NFKC/NFKD algorithms; this is the ecosystem's UAX #15 crate.
unicode-normalization = "0.1"
encoding_rs = "0.8"
