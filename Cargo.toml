[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
hex = "0.4"
toml = "1.0"
once_cell = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }
zstd = "0.13"
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
dashmap = "6"
tracing = "0.1"
testcontainers = "0.22"
testcontainers-modules = { version = "0.10", features = ["kafka"] }
