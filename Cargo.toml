[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
hex = "0.4"
toml = "1.0"
once_cell = "1"
openraft = { version = "0.9", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }
zstd = "0.13"
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
dashmap = "6"
tracing = "0.1"
memmap2 = "0.9"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
futures-util = { version = "0.3", features = ["sink"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bon = "3"
# wincode + serde-wincode replace bincode for serde-derived wire shapes.
# Pinned to 0.4: serde-wincode 0.1.0 depends on wincode ^0.4, so a 0.5
# pin would silently duplicate wincode in the dep graph and fail trait
# resolution on `SerdeCompat`.
wincode = "=0.4"
serde-wincode = "0.1"
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# rustls-pemfile retired upstream (RUSTSEC-2025-0134, archived 2025-08).
# Use the PEM parsers in `rustls-pki-types` (same code; pull explicitly).
rustls-pki-types = { version = "1.10", features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["kdf", "hmac"] }
hmac = "0.13"
sha2 = "0.11"
ring = "0.17"
subtle = "2"
base64 = "0.22"
crabka-security = { path = "crates/security", version = "0.1.0" }
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.27", default-features = false, features = ["v1_30"] }
schemars = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
prometheus-client = "0.24"
tower = "0.5"
futures = "0.3"
anyhow = "1"
