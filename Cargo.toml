[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Crabka Authors"]
rust-version = "1.95.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
hex = "0.4"
toml = "1.0"
once_cell = "1"
openraft = { version = "0.9", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }
zstd = "0.13"
zerocopy = { version = "0.8", features = ["derive"] }
crc32c = "0.6"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
dashmap = "6"
tracing = "0.1"
memmap2 = "0.9"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
futures-util = { version = "0.3", features = ["sink"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bon = "3"
# Pinned to 2.x: bincode 3.0 dropped the in-crate `serde` feature in favor
# of a separate `bincode_serde` crate, breaking our `bincode::serde::*`
# call sites. RUSTSEC-2025-0141 (bincode v2 unmaintained) is ignored in
# `deny.toml` until a future slice migrates to the new API.
bincode = { version = "2", features = ["serde"] }
async-trait = "0.1"
